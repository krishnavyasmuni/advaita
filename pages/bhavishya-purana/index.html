<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bhaviṣya Purāṇa — uploaded parva and chapter library.">
<title>Bhaviṣya Purāṇa — Chapter Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--outer:#2b261f;--paper:#f4f4f4;--ink:#3c362e;--muted:#756e67;--teal:#00787a;--purple:#65516f;--rule:#d8d3cd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--outer);color:var(--ink);font-family:Merriweather,Georgia,serif}.topbar{width:1080px;max-width:100%;height:58px;margin:0 auto;padding:0 42px;display:flex;align-items:center;background:var(--paper);border-bottom:1px solid rgba(119,119,119,.12)}.topbar a{color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:20px;text-decoration:none}.page{width:1080px;max-width:100%;min-height:100vh;margin:0 auto;padding:62px 54px 100px;background:var(--paper)}.hero{width:700px;max-width:100%;margin:0 auto 62px;text-align:center}.eyebrow{margin:0 0 10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:0;color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:50px;font-weight:400;line-height:1.08}.subtitle{margin:17px auto 0;max-width:650px;color:#665f58;font-size:16px;font-style:italic;line-height:1.6}.hero:after{content:"";display:block;width:326px;max-width:50%;height:1px;margin:30px auto 0;background:var(--rule)}.reader{display:grid;grid-template-columns:210px minmax(0,700px);gap:46px;justify-content:center;align-items:start}.side{position:sticky;top:28px;padding-right:24px;border-right:1px solid var(--rule)}.side h2{margin:0 0 20px;color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:28px;font-weight:400}.side a{display:block;margin:0 0 9px;color:#5d554e;font-size:13px;line-height:1.35;text-decoration:none}.side a:hover{color:var(--purple)}.main h2{margin:0 0 22px;color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:31px;font-weight:400}.canto{margin:0 0 42px}.canto h3{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule);color:#4a443e;font-family:Vollkorn,Georgia,serif;font-size:23px;font-weight:400}.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px}.chapter-grid a{display:block;padding:9px 0;border-bottom:1px solid #e2ddd7;color:#4a443e;font-size:13px;line-height:1.45;text-decoration:none}.chapter-grid a:hover{color:var(--purple)}@media(max-width:900px){body{background:var(--paper)}.page{padding:46px 24px 80px}.reader{display:block;width:700px;max-width:100%;margin:0 auto}.side{position:static;margin:0 0 34px;padding:0 0 18px;border:0;border-bottom:1px solid var(--rule)}.side h2{font-size:23px;margin-bottom:10px}.side a{display:inline-block;margin-right:14px}.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.topbar{height:50px;padding:0 18px}.topbar a{font-size:18px}.page{padding:34px 16px 64px}.hero h1{font-size:39px;line-height:1.1}.subtitle{font-size:15px}.main h2{font-size:27px}.chapter-grid{grid-template-columns:1fr}.chapter-grid a{padding:12px 0;font-size:14px;line-height:1.5}.canto{margin-bottom:38px}}
</style>
</head>
<body>
<header class="topbar"><a href="/vivekadrishti/">Viveka Dṛṣṭi</a></header>
<main class="page">
<header class="hero"><p class="eyebrow">Scripture Library</p><h1>Bhaviṣya Purāṇa</h1><p class="subtitle">Pratisargaparvan, Brāhmaparvan, Madhyamaparvan, and Uttaraparvan</p></header>
<div class="reader">
<aside class="side"><h2>Contents</h2><a href="#pratisarga">Pratisargaparvan</a><a href="#brahma">Brāhmaparvan</a><a href="#madhyama">Madhyamaparvan</a><a href="#uttara">Uttaraparvan</a><a href="/vivekadrishti/">← Home</a></aside>
<section class="main"><h2>Bhaviṣya Purāṇa</h2><div id="parva-list"></div></section>
</div>
</main>
<script>
(()=>{const root=document.getElementById('parva-list');if(!root)return;const base='/vivekadrishti/articles/';const sections=[{id:'pratisarga',name:'Pratisargaparvan',items:[...Array.from({length:7},(_,i)=>({label:`1.${i+1}`,url:`bhavishya-purana-pratisargaparvan-part-1-chapter-${i+1}/`})),...Array.from({length:35},(_,i)=>({label:`2.${i+1}`,url:`bhavishya-purana-pratisargaparvan-part-2-chapter-${i+1}/`})),...Array.from({length:32},(_,i)=>({label:`3.${i+1}`,url:`bhavishya-purana-pratisargaparvan-part-3-chapter-${i+1}/`})),...Array.from({length:9},(_,i)=>({label:`4.${i+1}`,url:`bhavishya-purana-pratisargaparvan-part-4-chapter-${i+1}/`}))]},{id:'brahma',name:'Brāhmaparvan',items:[...Array.from({length:55},(_,i)=>({label:String(i+1),url:`bhavishya-purana-brahmaparvan-chapter-${i+1}/`})),...Array.from({length:11},(_,i)=>({label:String(i+180),url:`bhavishya-purana-brahmaparvan-chapter-${i+180}/`}))]},{id:'madhyama',name:'Madhyamaparvan',items:[{label:'Open contents',url:'/vivekadrishti/pages/bhavishya-purana-madhyamaparvan/'}]},{id:'uttara',name:'Uttaraparvan',items:[{label:'Open contents',url:'/vivekadrishti/pages/bhavishya-purana-uttaraparvan/'}]}];sections.forEach(data=>{const section=document.createElement('section');section.className='canto';section.id=data.id;const heading=document.createElement('h3');heading.textContent=data.name;const grid=document.createElement('div');grid.className='chapter-grid';data.items.forEach(item=>{const link=document.createElement('a');link.href=item.url.startsWith('/')?item.url:base+item.url;link.textContent=item.label;grid.appendChild(link)});section.append(heading,grid);root.appendChild(section)})})();
</script>
</body>
</html>
