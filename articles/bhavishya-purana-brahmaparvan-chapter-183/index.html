const verses=[
{n:1,sa:`भास्कर उवाच ।\nकुर्यात्पञ्चमहायज्ञानधिकारो द्विजस्य सः ।\nभूतपित्रमरब्रह्ममनुष्याणां यथाविधि ॥ १ ॥`,iast:`bhāskara uvāca |\nkuryātpaṃcamahāyajñānadhikāro dvijasya saḥ |\nbhūtapitramarabrahmamanuṣyāṇāṃ yathāvidhi || 1 ||`,en:`Bhāskara said: “A twice-born householder who possesses the relevant qualification should perform the five great sacrifices in the prescribed manner for beings, ancestors, gods, Brahman or sacred learning, and human guests.”`,wfw:`bhāskaraḥ uvāca — Bhāskara said; pañca-mahā-yajñān kuryāt — should perform the five great sacrifices; adhikāraḥ dvijasya — the qualification of a twice-born; bhūta-pitṛ-amara-brahma-manuṣyāṇām — for beings, ancestors, gods, Brahman, and humans; yathāvidhi — according to rule.`},
{n:2,sa:`सदा सदानकृत्यानां फलार्थमपरे स्थिताः ।\nनित्यानित्य मिति प्राहुरनुषङ्गात्फलं परे ॥ २ ॥`,iast:`sadā sadāna kṛtyānāṃ phalārthamapare sthitāḥ |\nnityānitya miti prāhuranuṣaṃgātphalaṃ pare || 2 ||`,en:`Some understand prescribed acts as being performed with a result in view; others distinguish them as obligatory and occasional, holding that any fruit follows only incidentally.`,wfw:`kṛtyānām — of prescribed acts; phalārtham — for the sake of a result; apare — some authorities; nitya-anityam iti prāhuḥ — call them obligatory and non-obligatory or occasional; anuṣaṅgāt phalam — fruit arising incidentally.`},
{n:3,sa:`अतिथेः परितोषाय परिचर्या विधीयते ।\nअदृष्टनियमादृष्टमारोग्यान्तं च वर्जनम् ॥ ३ ॥`,iast:`atitheḥ paritoṣāya paricaryā vidhīyate |\nadṛṣṭaniyamādṛṣṭamārogyāntaṃ ca varjanam || 3 ||`,en:`Service is enjoined for the satisfaction of a guest. The second half of the transmitted verse speaks elliptically of unseen religious consequence, regulation, health, and abstention.`,wfw:`atitheḥ paritoṣāya — for satisfying the guest; paricaryā vidhīyate — service is prescribed; adṛṣṭa-niyama — rule concerning unseen result; ārogya — health; varjanam — abstention or avoidance. The transmitted syntax is compressed.`},
{n:4,sa:`तिस्रोऽष्टकास्तु कर्तव्या मध्यावर्ती चतुर्थिका ।\nशाकपायसपूपैस्तु मांसेन तु चतुर्थिका ॥ ४ ॥`,iast:`tisroṣṭakāstu kartavyā madhyāvartī caturthikā |\nśākapāyasapūpaistu māṃsena tu caturthikā || 4 ||`,en:`Three Aṣṭakā observances are to be performed, with a fourth occurring between them. The offerings are described as vegetables, milk-rice and cakes, while meat is specified for the fourth.`,wfw:`tisraḥ aṣṭakāḥ — three Aṣṭakās; kartavyāḥ — are to be performed; madhyāvartī caturthikā — an intervening fourth; śāka-pāyasa-pūpaiḥ — with greens, milk-rice, and cakes; māṃsena — with meat.`},
{n:5,sa:`प्रतिपदि क्रियते यत्तु चतुष्पार्वणमुच्यते ।\nस्वगृह्योक्तविधानेन तत्तु पक्षादि कीर्त्यते ॥ ५ ॥`,iast:`pratipadi kriyate yattu catuṣpārvaṇamucyate |\nsvagṛhyoktavidhānena tattu pakṣādi kīrtyate || 5 ||`,en:`That which is performed on Pratipad is called the fourfold Pārvaṇa. When performed according to the procedure taught in one's own Gṛhya tradition, it is associated with the fortnight and related occasions.`,wfw:`pratipadi kriyate — performed on Pratipad; catuṣ-pārvaṇam ucyate — called fourfold Pārvaṇa; sva-gṛhya-ukta-vidhānena — by the procedure taught in one's Gṛhya text; pakṣādi — the fortnight and related occasions.`},
{n:6,sa:`नित्यं नैमित्तिकं काम्यं वृद्धिश्राद्धं सपिण्डनम् ।\nपार्वणं चेति विज्ञेयं गोष्ठशुद्ध्यर्थमुत्तमम् ।\nकर्माङ्गं नवमं प्रोक्तं वैदिकं दशमं स्मृतम् ॥ ६ ॥`,iast:`nityaṃ naimittikaṃ kāmyaṃ vṛddhiśrāddhaṃ sapiṃḍanam |\npārvaṇaṃ ceti vijñeyaṃ goṣṭhaśuddhyarthamuttamam |\nkarmāṃgaṃ navamaṃ proktaṃ vaidikaṃ daśamaṃ smṛtam || 6 ||`,en:`The text enumerates daily, occasional, desire-motivated, prosperity, Sapiṇḍana and Pārvaṇa śrāddhas, along with rites for the cowshed and for purification; a śrāddha forming part of another rite is called the ninth, and the Vedic type the tenth.`,wfw:`nityam — daily; naimittikam — occasion-based; kāmyam — desire-motivated; vṛddhi-śrāddham — prosperity śrāddha; sapiṇḍanam — Sapiṇḍana; pārvaṇam — Pārvaṇa; goṣṭha-śuddhyartham — for cowshed or purification; karmāṅgam — an ancillary rite; vaidikam — Vedic.`},
{n:7,sa:`अनूरुरुवाच ।\nयदेतद्भवता प्रोक्तं श्राद्धं द्वादशधा विभो ।\nतस्य सर्वस्य मा ब्रूहि लक्षणं वै पृथक्पृथक् ॥ ७ ॥`,iast:`anūruruvāca |\nyadetadbhavatā proktaṃ śrāddhaṃ dvādaśadhā vibho |\ntasya sarvasya mā brūhi lakṣaṇaṃ vai pṛthakpṛthak || 7 ||`,en:`Anūru said: “You have spoken of śrāddha as twelvefold, O Lord. Please tell me the defining mark of each of these separately.”`,wfw:`dvādaśadhā śrāddham — twelvefold śrāddha; bhavatā proktam — stated by you; tasya sarvasya lakṣaṇam — the definition of all of it; pṛthak pṛthak — separately.`},
{n:8,sa:`नित्यं किमुच्यते श्राद्धं किं वा नैमित्तिकं भवेत् ।\nकाम्यादि देवदेवेश एतेषां लक्षणं वद ॥ ८ ॥`,iast:`nityaṃ kimucyate śrāddhaṃ kiṃ vā naimittikaṃ bhavet |\nkāmyādi devadeveśa eteṣāṃ lakṣaṇaṃ vada || 8 ||`,en:`“What śrāddha is called daily, and what is occasional? Tell me also the characteristics of the kāmya and the remaining forms, O Lord of gods.”`,wfw:`nityam kim ucyate — what is called daily; naimittikam kim — what is occasional; kāmya-ādi — desire-based and the rest; eteṣām lakṣaṇam vada — state their characteristics.`},
{n:9,sa:`आदित्य उवाच ।\nअहन्यहनि यच्छ्राद्धं तन्नित्यं खग कीर्तितम् ।\nवैश्वदेवविहीनं तु अशक्तावुदकेन तु ॥ ९ ॥`,iast:`āditya uvāca |\nahanyahani yacchrāddhaṃ tannityaṃ khaga kīrtitam |\nvaiśvadevavihīnaṃ tu aśaktāvudakena tu || 9 ||`,en:`Āditya said: “The śrāddha performed day after day is called nitya, O bird. When one lacks the means, the text allows its minimal observance with water, without the full Vaiśvadeva procedure.”`,wfw:`ahani ahani — day after day; yat śrāddham — the śrāddha which; tat nityam — that is daily; aśaktau — when unable; udakena — with water; vaiśvadeva-vihīnam — without the full Vaiśvadeva offering.`},
{n:10,sa:`एकोद्दिष्टं तु यच्छ्राद्धं तन्नैमित्तिकमुच्यते ।\nतत्सदैव प्रकर्तव्यमयुग्मान्भोजयेद्द्विजान् ॥ १० ॥`,iast:`ekoddiṣṭaṃ tu yacchrāddhaṃ tannaimittikamucyate |\ntatsadaiva prakartavyamayugmānbhojayeddvijān || 10 ||`,en:`“The śrāddha directed to one particular deceased person is called naimittika. It should be duly performed, feeding an odd number of twice-born recipients.”`,wfw:`ekoddiṣṭam śrāddham — śrāddha directed to one; naimittikam — occasional; prakartavyam — to be performed; ayugmān dvijān bhojayet — should feed an odd number of twice-born men.`},
{n:11,sa:`कामयुक्तं हि तत्काम्यमभिप्रेतार्थसिद्धये ।\nपार्वणेन विधानेन तदप्युक्तं खगाधिप ॥ ११ ॥`,iast:`kāmayuktaṃ hi tatkāmyamabhipretārthasiddhaye |\npārvaṇena vidhānena tadapyuktaṃ khagādhipa || 11 ||`,en:`“That which is performed with a specific desire for the attainment of a wished-for object is kāmya. It too is said to follow the Pārvaṇa procedure, O lord of birds.”`,wfw:`kāma-yuktam — connected with desire; kāmyam — desire-motivated; abhipreta-artha-siddhaye — for attaining a wished-for aim; pārvaṇena vidhānena — by the Pārvaṇa procedure.`},
{n:12,sa:`वृद्धौ यत्क्रियते श्राद्धं वृद्धिश्राद्धं तदुच्यते ।\nसर्वं प्रदक्षिणं कार्यं पूर्वाह्णे तूपवीतिना ॥ १२ ॥`,iast:`vṛddhau yatkriyate śrāddhaṃ vṛddhiśrāddhaṃ taducyate |\nsarvaṃ pradakṣiṇaṃ kāryaṃ pūrvāhṇe tūpavītinā || 12 ||`,en:`“A śrāddha performed on an occasion of increase or prosperity is called Vṛddhi-śrāddha. Everything is to be done clockwise, in the forenoon, with the sacred thread in the regular position.”`,wfw:`vṛddhau — on an occasion of increase; vṛddhi-śrāddham — prosperity śrāddha; pradakṣiṇam — clockwise; pūrvāhṇe — in the forenoon; upavītinā — with sacred thread worn normally.`},
{n:13,sa:`गन्धोदकतिलैर्युक्तं कुर्यात्पात्रचतुष्टयम् ।\nअर्घार्थं पितृपात्रेषु प्रेतपात्रं प्रमोचयेत् ॥ १३ ॥`,iast:`gaṃdhodakatilairyuktaṃ kuryātpātracatuṣṭayam |\narghārthaṃ pitṛpātreṣu pretapātraṃ pramocayet || 13 ||`,en:`“Four vessels should be prepared with fragrant water and sesame. For the arghya, the vessel of the recently deceased is then joined or released into the vessels of the ancestors.”`,wfw:`pātra-catuṣṭayam kuryāt — prepare four vessels; gandha-udaka-tilaiḥ yuktam — with fragrance, water, and sesame; arghārtham — for the arghya; preta-pātram — the vessel for the deceased; pitṛ-pātreṣu pramocayet — merge or release it into the ancestor vessels.`},
{n:14,sa:`ये समाना इति द्वाभ्यामेतज्ज्ञेयं सपिण्डनम् ।\nनित्येन तुल्यं शेषं स्यादेकोद्दिष्टं स्त्रिया अपि ॥ १४ ॥`,iast:`ye samānā iti dvābhyāmetajjñeyaṃ sapiṃḍanam |\nnityena tulyaṃ śeṣaṃ syādekoddiṣṭaṃ striyā api || 14 ||`,en:`“The Sapiṇḍana is to be understood as being performed with the two formulas beginning ‘ye samānāḥ’. The remainder follows the daily rite; an Ekoddiṣṭa is performed for a woman as well.”`,wfw:`ye samānā iti dvābhyām — with the two formulas “ye samānāḥ”; etat sapiṇḍanam — this is Sapiṇḍana; śeṣam nityena tulyam — the rest is like the daily rite; striyā api — for a woman also.`},
{n:15,sa:`दर्शे वै क्रियते यत्तु तत्पार्वणमुदाहृतम् ।\nपर्वणि क्रियते यच्च तत्पार्वणमिति स्थितिः ।\nगोभ्यश्च क्रियते श्राद्धं तद्गोष्ठश्राद्धमुच्यते ॥ १५ ॥`,iast:`darśe vai kriyate yattu tatpārvaṇamudāhṛtam |\nparvaṇi kriyate yacca tatpārvaṇamiti sthitiḥ |\ngobhyaśca kriyate śrāddhaṃ tadgoṣṭhaśrāddhamucyate || 15 ||`,en:`“The rite performed at the new moon, or on a parvan, is called Pārvaṇa. A śrāddha performed for the cows is called Goṣṭha-śrāddha.”`,wfw:`darśe kriyate — performed at new moon; pārvaṇam — Pārvaṇa; parvaṇi kriyate — performed on a parvan; gobhyaḥ kriyate śrāddham — śrāddha performed for cows; goṣṭha-śrāddham — cowshed śrāddha.`},
{n:16,sa:`बहूनां विदुषां संपत्सुखार्थं पितृतृप्तये ।\nक्रियते शुद्धये यद्वै ब्राह्मणानां च भोजनम् ।\nशुद्ध्यर्थमिति तत्प्रोक्तं वैनतेय मनीषिभिः ॥ १६ ॥`,iast:`bahūnāṃ viduṣāṃ saṃpatsukhārthaṃ pitṛtṛptaye |\nkriyate śuddhaye yadvai brāhmaṇānāṃ ca bhojanam |\nśudyarthamiti tatproktaṃ vainateya manīṣibhiḥ || 16 ||`,en:`“When a meal for many learned Brahmins is arranged for prosperity, well-being, the satisfaction of the ancestors, and purification, the wise call that rite Śuddhyartha, O son of Vinatā.”`,wfw:`bahūnām viduṣām — of many learned men; sampat-sukhārtham — for prosperity and welfare; pitṛ-tṛptaye — for satisfaction of ancestors; brāhmaṇānām bhojanam — feeding Brahmins; śuddhyartham — for purification.`},
{n:17,sa:`निषेककाले सोमे च सीमन्तोन्नयने तथा ।\nज्ञेयं पुंसवनं श्राद्धं तच्च कर्माङ्गमेव च ॥ १७ ॥`,iast:`niṣekakāle some ca sīmatonnayane tathā |\njñeyaṃ puṃsavanaṃ śrāddhaṃ tacca karmāṃgameva ca || 17 ||`,en:`“Śrāddha performed in connection with conception, the Soma-related rite, Sīmantonnayana, or Puṃsavana is to be understood as an ancillary part of the principal ceremony.”`,wfw:`niṣeka-kāle — at conception; some — in the Soma-related rite; sīmantonnayane — at Sīmantonnayana; puṃsavane — at Puṃsavana; karma-aṅgam — an ancillary component of the rite.`},
{n:18,sa:`क्रियते देवमुद्दिश्य सप्तम्यादिषु यत्नतः ।\nगच्छेद्देशान्तरे यस्तु श्राद्धं कुर्यात्तु सर्पिषा ।\nतद्यत्नार्थमिति प्रोक्तं प्रदिशेच्च न संशयः ॥ १८ ॥`,iast:`kriyate devamuddiśya saptamyādiṣu yatnataḥ |\ngaccheddeśāṃtare yastu śrāddhaṃ kuryāttu sarpiṣā |\ntadyatnārthamiti proktaṃ pradiśecca na saṃśayaḥ || 18 ||`,en:`“A śrāddha performed carefully for a deity on Saptamī and similar observances, or by one setting out for a distant country and making the offering with ghee, is described here as a special-purpose observance.”`,wfw:`devam uddiśya — directed to a deity; saptamī-ādiṣu — on Saptamī and similar days; deśāntare gacchet — one goes to another country; sarpiṣā śrāddham kuryāt — performs śrāddha with ghee; yatnārtham — for a special undertaking.`},
{n:19,sa:`शरीरोपचये श्राद्धमश्ववृद्ध्यर्थमेव च ।\nपुष्ट्यर्थमेतद्विज्ञेयमौपचारिकमुच्यते ॥ १९ ॥`,iast:`śarīropacaye śrāddhamaśvavṛddhyarthameva ca |\npuṣṭyarthametadvijñeyamaupacārikamucyate || 19 ||`,en:`“A śrāddha performed for bodily increase, for the increase of horses, or generally for nourishment and flourishing is known as the auxiliary or aupacārika type.”`,wfw:`śarīra-upacaye — for bodily growth; aśva-vṛddhyartham — for increase of horses; puṣṭyartham — for nourishment; aupacārikam — auxiliary or conventional.`},
{n:20,sa:`सर्वेषामेव श्राद्धानां श्रेष्ठं सांवत्सरं मतम् ।\nक्रियते यत्खगश्रेष्ठ मृतेऽहनि बुधैः सह ॥ २० ॥`,iast:`sarveṣāmeva śrāddhānāṃ śreṣṭhaṃ sāṃvatsaraṃ matam |\nkiyate yatkhagaśreṣṭha mṛtehani budhaiḥ saha || 20 ||`,en:`“Of all śrāddhas, the annual rite is regarded as foremost. It is performed on the anniversary of the death, O best of birds, in accordance with learned practice.”`,wfw:`sarveṣām śrāddhānām śreṣṭham — best of all śrāddhas; sāṃvatsaram — the annual rite; mṛte ahani — on the day of death; kriyate — is performed.`},
{n:21,sa:`मृतेऽहनि पुनर्यस्तु न कुर्याच्छ्राद्धमादरात् ।\nमातुश्च खगशार्दूल वत्सरान्ते मृतेऽहनि ॥ २१ ॥`,iast:`mṛte'hani punaryastu na kuryācchrāddhamādarāt |\nmātuśca khagaśārdūla vatsarāṃte mṛte'hani || 21 ||`,en:`“One who fails respectfully to perform śrāddha on the annual death-day—likewise on the anniversary of his mother's death, O tiger among birds—incurs the consequence stated next.”`,wfw:`mṛte ahani — on the death-day; na kuryāt śrāddham — does not perform śrāddha; ādarāt — respectfully; mātuḥ — of the mother; vatsara-ante — at the completion of a year.`},
{n:22,sa:`नाहं तस्य खगश्रेष्ठ पूजां गृह्णामि नो हरिः ।\nन ब्रह्मा न च वै रुद्रो न चान्ये देवतागणाः ॥ २२ ॥`,iast:`nāhaṃ tasya khagaśreṣṭha pūjāṃ gṛhṇāmi no hariḥ |\nna brahmā na ca vai rudro na cānye devatāgaṇāḥ || 22 ||`,en:`“I do not accept his worship, O best of birds; nor does Hari, nor Brahmā, nor Rudra, nor the other hosts of deities.”`,wfw:`na aham pūjām gṛhṇāmi — I do not accept the worship; na hariḥ — nor Hari; na brahmā — nor Brahmā; na rudraḥ — nor Rudra; na anye devatā-gaṇāḥ — nor the other gods.`},
{n:23,sa:`तस्माद्यत्नेन कर्तव्यं वर्षेवर्षे मृतेऽहनि ।\nनरेण खगशार्दूल भोजकेन विशेषतः ॥ २३ ॥`,iast:`tasmādyatnena kartavyaṃ varṣevarṣe mṛte'hani |\nnareṇa khagaśārdūla bhojakena viśeṣataḥ || 23 ||`,en:`“Therefore a man should carefully perform it year after year on the death anniversary, especially one who is responsible for the ritual feeding, O tiger among birds.”`,wfw:`tasmāt — therefore; yatnena kartavyam — should be carefully performed; varṣe varṣe — every year; mṛte ahani — on the death-day; bhojakena viśeṣataḥ — especially by the one responsible for feeding.`},
{n:24,sa:`भोजको यस्तु वै श्राद्धं न करोति खगाधिप ।\nमातापितृभ्यां सततं वर्षेवर्षे मृतेऽहनि ॥ २४ ॥`,iast:`bhojako yastu vai śrāddhaṃ na karoti khagādhipa |\nmātāpitṛbhyāṃ satataṃ varṣevarṣe mṛte'hani || 24 ||`,en:`“If the responsible householder does not continually perform the annual śrāddha for his mother and father on their death-days, O lord of birds…”`,wfw:`bhojakaḥ yaḥ — the responsible feeder or householder who; śrāddham na karoti — does not perform śrāddha; mātā-pitṛbhyām — for mother and father; varṣe varṣe — every year; mṛte ahani — on the death-day. The printed source misnumbers this verse; it is sequentially verse 24.`},
{n:25,sa:`स याति नरकं घोरं तामिस्रं नाम नामतः ।\nततो भवति दुष्टात्मा नगरे सूकरः खग ॥ २५ ॥`,iast:`sa yāti narakaṃ ghoraṃ tāmisraṃ nāma nāmataḥ |\ntato bhavati duṣṭātmā nagare sūkaraḥ khaga || 25 ||`,en:`“…he is said to go to the terrible hell called Tāmisra and afterwards to be born as a pig in a town, O bird.”`,wfw:`ghoram narakam yāti — goes to terrible hell; tāmisram nāma — called Tāmisra; tataḥ — afterward; nagare sūkaraḥ bhavati — becomes a pig in a town.`},
{n:26,sa:`अनूरुरुवाच ।\nन जानाति दिनं यस्तु न मासं विबुधाधिप ।\nमृतौ यत्र महाप्राज्ञ पितरौ स कथं नरः ।\nश्राद्धं करोतु वै ताभ्यां विधिवद्वत्सरात्मकम् ॥ २६ ॥`,iast:`anūruruvāca |\nna jānāti dinaṃ yastu na māsaṃ vibudhādhipa |\nmṛtau yatra mahāprājña pitarau sa kathaṃ naraḥ |\nśrāddhaṃ karotu vai tābhyāṃ vidhivadvatsarātmakam || 26 ||`,en:`Anūru said: “If a man does not know the day or even the month in which his parents died, O lord of the gods, how should he properly perform their annual śrāddha?”`,wfw:`na jānāti dinam — does not know the day; na māsam — nor the month; pitarau mṛtau — when the parents died; katham śrāddham karotu — how should he perform śrāddha; vatsarātmakam — the annual rite.`},
{n:27,sa:`आदित्य उवाच ।\nन जानाति नरो यस्तु मृतानां विनतात्मज ।\nमासं दिनं मृतानां तु पितॄणां खगसत्तम ॥ २७ ॥`,iast:`āditya uvāca |\nna jānāti naro yastu mṛtānāṃ vinatātmaja |\nmāsaṃ dinaṃ mṛtānāṃ tu pitṝṇāṃ khagasattama || 27 ||`,en:`Āditya said: “For a man who does not know the month and day on which his ancestors died, O son of Vinatā, O best of birds…”`,wfw:`na jānāti — does not know; māsam dinam — the month and day; mṛtānām pitṝṇām — of the deceased ancestors; vinatātmaja — O son of Vinatā.`},
{n:28,sa:`यथा कुर्यात्खगश्रेष्ठ शृणु कृत्स्नं समासतः ।\nमृताहं यो न जानाति मानवो विनतात्मज ॥ २८ ॥`,iast:`yathā kuryātkhagaśreṣṭha śṛṇu kṛtsnaṃ samāsataḥ |\nmṛtāhaṃ yo na jānāti mānavo vinatātmaja || 28 ||`,en:`“…hear briefly and completely how he should act. This is for the man who does not know the death-day, O son of Vinatā.”`,wfw:`yathā kuryāt — how he should act; śṛṇu — hear; kṛtsnam samāsataḥ — the whole in brief; mṛta-aham na jānāti — does not know the death-day.`},
{n:29,sa:`तेन कार्यममायां च श्राद्धं सांवत्सरं खग ।\nमासे मार्गशिरे वीर माघे वा विधिवत्खग ॥ २९ ॥`,iast:`tena kāryamamāyāṃ ca śrāddhaṃ sāṃvatsaraṃ khaga |\nmāse mārgaśire vīra māghe vā vidhivatkhaga || 29 ||`,en:`“He should perform the annual śrāddha on an Amāvasyā, in the month of Mārgaśīrṣa or alternatively Māgha, according to rule, O bird.”`,wfw:`tena kāryam — it should be done by him; amāvāsyām — on new moon; sāṃvatsaram śrāddham — the annual śrāddha; mārgaśire māse — in Mārgaśīrṣa; māghe vā — or in Māgha; vidhivat — according to rule.`},
{n:30,sa:`विशेषतो भोजनेन यो मां पूज्यते सदा ।\nप्रीतये मम वै तेन संपूज्याः पितरः सदा ॥ ३० ॥`,iast:`viśeṣato bhojanena yo māṃ pūjyate sadā |\nprītaye mama vai tena saṃpūjyāḥ pitaraḥ sadā || 30 ||`,en:`“One who regularly worships me especially through ritual feeding should likewise always honor the ancestors for the sake of my pleasure.”`,wfw:`bhojanena viśeṣataḥ — especially through feeding; yaḥ mām pūjayate — whoever worships me; mama prītaye — for my pleasure; pitaraḥ sampūjyāḥ — the ancestors should be honored.`},
{n:31,sa:`ममेष्टाः पितरो नित्यं गावो विप्राश्च सुव्रत ।\nतस्माच्च ते सदा पूज्या मद्भक्तेन विशेषतः ॥ ३१ ॥`,iast:`mameṣṭāḥ pitaro nityaṃ gāvo viprāśca suvrata |\ntasmācca te sadā pūjyā madbhaktena viśeṣataḥ || 31 ||`,en:`“The ancestors, cows, and Brahmins are always dear to me, O observer of good vows. Therefore they should especially be honored at all times by my devotee.”`,wfw:`mama iṣṭāḥ — dear to me; pitaraḥ — the ancestors; gāvaḥ — cows; viprāḥ — Brahmins; tasmāt — therefore; mad-bhaktena — by my devotee; sadā pūjyāḥ — always to be honored.`}
];renderBhavishyaChapter({chapter:183,subtitle:"Śrāddha-vidhi-kathā-varṇanam — Types and Procedures of Ancestral Rites",colophon:"End of Bhaviṣya Purāṇa, Brāhmaparvan 1.183."},verses);</script></body></html>
