<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 186: Sanskrit, close English translation, word-for-word glosses, and transliteration."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 186 — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/advaita/assets/css/site.css?v=20260915-2"><link rel="stylesheet" href="/advaita/assets/css/bhavishya-reader.css?v=20260915"></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 186</h1><p class="article-date">15 September 2026</p><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-185/">← Chapter 185</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-187/">Chapter 187 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-reader.js?v=20260915-4"></script><script>
const verses=[
{n:1,sa:`भास्कर उवाच ।\nश्रावण्यां तु बलिः कार्यः सर्पाणां मंत्रपूर्वकः ।\nशयनारोहणे चैव कार्ये सुखमभीप्सता ॥ १ ॥`,iast:`bhāskara uvāca |\nśrāvaṇyāṃ tu baliḥ kāryaḥ sarpāṇāṃ maṃtrapūrvakaḥ |\nśayanārohaṇe caiva kārye sukhamabhīpsatā || 1 ||`,en:`Bhāskara said: “In Śrāvaṇa a bali offering to the serpents is to be made with mantras; the rite of ascending the bed is likewise to be performed by one who desires well-being.”`,wfw:`bhāskaraḥ uvāca — Bhāskara said; śrāvaṇyām — in Śrāvaṇa; tu — indeed; baliḥ — bali offering; kāryaḥ — to be performed; sarpāṇām — for the serpents; mantra-pūrvakaḥ — preceded/accompanied by mantras; śayana-ārohaṇe — at the ascending of the bed; ca eva — and likewise; kārye — to be done; sukham abhīpsatā — by one desiring happiness/well-being.`},
{n:2,sa:`कार्यः प्रत्यवरोहस्तु मार्गशीर्ष्यां न संशयः ।\nफलं विना त्वनुष्ठानं नित्यानामिष्यते स्फुटम् ॥ २ ॥`,iast:`kāryaḥ pratyavarohastu mārgaśīrṣyāṃ na saṃśayaḥ |\nphalaṃ vinā tvanuṣṭhānaṃ nityānāmiṣyate sphuṭam || 2 ||`,en:`The corresponding descent is to be performed in Mārgaśīrṣa, without doubt. The performance of obligatory rites is plainly prescribed without desire for a fruit.`,wfw:`kāryaḥ — to be performed; pratyavarohaḥ — corresponding descent; tu — indeed; mārgaśīrṣyām — in Mārgaśīrṣa; na saṃśayaḥ — no doubt; phalam vinā — without [seeking] fruit; anuṣṭhānam — performance; nityānām — of obligatory rites; iṣyate — is prescribed/accepted; sphuṭam — clearly.`},
{n:3,sa:`काम्यानां सफलार्थं तु दोषप्राप्त्यर्थमेव च ।\nनैमित्तिकानां करणं त्रिविधं कर्मणां फलम् ॥ ३ ॥`,iast:`kāmyānāṃ saphalārthaṃ tu doṣaprāptyarthameva ca |\nnaimittikānāṃ karaṇaṃ trividhaṃ karmaṇāṃ phalam || 3 ||`,en:`Desire-motivated rites are performed for the attainment of their fruit, while occasional rites are performed in relation to the arising of a fault or occasion; thus the result of ritual actions is treated in three ways.`,wfw:`kāmyānām — of desire-motivated rites; sa-phala-artham — for the sake of obtaining their fruit; tu — indeed; doṣa-prāpti-artham — in relation to the arising/accrual of a fault; eva ca — likewise; naimittikānām — of occasional rites; karaṇam — performance; tri-vidham — threefold; karmaṇām phalam — the fruit/result of actions.`},
{n:4,sa:`फलं केचिदुपात्तस्य दुरितस्य प्रचक्षते ।\nअनुत्पत्तिं तथा चान्ये प्रत्येत्याभ्युपमंत्र्य च ॥ ४ ॥`,iast:`phalaṃ kecidupāttasya duritasya pracakṣate |\nanutpattiṃ tathā cānye pratyetyābhyupamaṃtrya ca || 4 ||`,en:`Some teachers describe the fruit as the removal of already-acquired evil; others describe it as the non-arising of [future evil], after considering and accepting the matter.`,wfw:`phalam — fruit/result; kecit — some; upāttasya — already acquired/undertaken; duritasya — of sin/evil; pracakṣate — declare; anutpattim — non-arising; tathā ca anye — likewise others; pratyetya — having considered/understood; abhyupamantrya ca — having accepted/assented, as transmitted.`},
{n:5,sa:`नित्यक्रियं तथा चान्ये अनुषंगात्फलं श्रुतिः ।\nअग्न्याधेयं तथा दर्शं पौर्णमासं द्वितीयकम् ॥ ५ ॥`,iast:`nityakriyaṃ tathā cānye anuṣaṃgātphalaṃ śrutiḥ |\nagnyādheyaṃ tathā darśaṃ paurṇamāsaṃ dvitīyakam || 5 ||`,en:`Others hold that the fruit of obligatory action follows only incidentally, as taught in revelation. Agnyādheya, Darśa, and Paurṇamāsa are then named among the rites.`,wfw:`nitya-kriyam — obligatory action; tathā ca anye — and likewise others; anuṣaṅgāt — incidentally/as a concomitant; phalam — fruit; śrutiḥ — revelation/the Veda; agnyādheyam — establishment of the sacred fires; tathā — likewise; darśam — new-moon sacrifice; paurṇamāsam — full-moon sacrifice; dvitīyakam — the second/paired counterpart.`},
{n:6,sa:`चातुर्मास्यमग्निहोत्रं पशुबंधो निरूढकाः ।\nसौत्रामणी संस्थाः स्युर्हविषः श्रुतिनोदिताः ॥ ६ ॥`,iast:`cāturmāsyamagnihotraṃ paśubaṃdho nirūḍhakāḥ |\nsautrāmaṇī saṃsthāḥ syurhaviṣaḥ śrutinoditāḥ || 6 ||`,en:`Cāturmāsya, Agnihotra, the animal offering, the Nirūḍha rite, and Sautrāmaṇī are sacrificial institutions with oblations enjoined by Śruti.`,wfw:`cāturmāsyam — Cāturmāsya; agnihotram — Agnihotra; paśu-bandhaḥ — animal offering; nirūḍhakāḥ — Nirūḍha rites; sautrāmaṇī — Sautrāmaṇī; saṃsthāḥ — sacrificial institutions/forms; syuḥ — are; haviṣaḥ — with oblations/havis; śruti-noditāḥ — enjoined by Śruti.`},
{n:7,sa:`अग्निष्टोमोऽत्यग्निष्टोम उक्थ्यः संषोडशी तथा ।\nवाजपेयातिरात्रश्च आप्योर्यामः श्रुतौ श्रुतः ॥ ७ ॥`,iast:`agniṣṭomo'tyagniṣṭoma ukthyaḥ saṃṣoḍaśī tathā |\nvājapeyātirātraśca āpyoryāmaḥ śrutau śrutaḥ || 7 ||`,en:`Agniṣṭoma, Atyagniṣṭoma, Ukthya, Ṣoḍaśin, Vājapeya, Atirātra, and Āptoryāma are heard of in Śruti.`,wfw:`agniṣṭomaḥ — Agniṣṭoma; atyagniṣṭomaḥ — Atyagniṣṭoma; ukthyaḥ — Ukthya; saṃṣoḍaśī — Ṣoḍaśin; tathā — likewise; vājapeya — Vājapeya; atirātraḥ — Atirātra; ca — and; āptoryāmaḥ — Āptoryāma (transmitted āpyoryāma); śrutau — in Śruti; śrutaḥ — heard/taught.`},
{n:8,sa:`दया स्यात्सर्वभूतेषु अनसूयाथ मंगलम् ।\nक्षांतिर्दया त्वनायासः शौचमस्पृहता व्रतम् ॥ ८ ॥`,iast:`dayā syātsarvabhūteṣu anasūyātha maṃgalam |\nkṣāṃtirdayā tvanāyāsaḥ śaucamaspṛhatā vratam || 8 ||`,en:`Compassion toward all beings, freedom from envy, auspicious conduct, patience, compassion, absence of strain/cruel exertion, purity, and freedom from covetousness are declared vows.`,wfw:`dayā — compassion; syāt — should be; sarva-bhūteṣu — toward all beings; anasūyā — absence of envy; atha — and; maṅgalam — auspiciousness; kṣāntiḥ — patience/forbearance; dayā — compassion; tu — indeed; anāyāsaḥ — absence of strain/harsh effort; śaucam — purity; aspṛhatā — non-covetousness; vratam — vow/observance.`},
{n:9,sa:`सम्यगुक्तास्तु संस्कारा ब्रह्मप्राप्तिनिमित्तकाः ।\nअनंतरं प्रवक्ष्यामि विप्राणां वृत्तयः शुभाः ॥ ९ ॥`,iast:`samyaguktāstu saṃskārā brahmaprāptinimittakāḥ |\nanaṃtaraṃ pravakṣyāmi viprāṇāṃ vṛttayaḥ śubhāḥ || 9 ||`,en:`The saṃskāras, which are means toward attainment of Brahman, have now been properly stated. Next I shall explain the approved livelihoods of Brahmins.`,wfw:`samyak-uktāḥ — properly stated; tu — indeed; saṃskārāḥ — saṃskāras; brahma-prāpti-nimittakāḥ — means/causes for attaining Brahman; anantaram — next; pravakṣyāmi — I shall explain; viprāṇām — of Brahmins; vṛttayaḥ — livelihoods/modes of subsistence; śubhāḥ — good/approved.`},
{n:10,sa:`ऋतामृते च विप्राणामृतं प्रमृतमेव च ।\nप्रतिग्रहवणिज्यादि श्रेयसी नोत्तरोत्तरा ॥ १० ॥`,iast:`ṛtāmṛte ca viprāṇāmṛtaṃ pramṛtameva ca |\npratigrahavaṇijyādi śreyasī nottarottarā || 10 ||`,en:`For Brahmins the traditional livelihoods called ṛta, amṛta, mṛta, and pramṛta are named; acceptance of gifts, trade, and the like are not successively more excellent.`,wfw:`ṛta-amṛte — ṛta and amṛta; ca — and; viprāṇām — for Brahmins; mṛtam — mṛta; pramṛtam — pramṛta; eva ca — and likewise; pratigraha — acceptance of gifts; vaṇijya-ādi — trade and the like; śreyasī — superior/better; na — not; uttarottarā — successively later/higher.`},
{n:11,sa:`आजीविकावृत्तयस्तु इत्याद्याः संप्रवर्तिताः ।\nतासां कयापि जीवेत्तु अनुतिष्ठेद्यथाविधि ॥ ११ ॥`,iast:`ājīvikāvṛttayastu ityādyāḥ saṃpravartitāḥ |\ntāsāṃ kayāpi jīvettu anutiṣṭhedyathāvidhi || 11 ||`,en:`These and other modes of livelihood have been laid down. One may live by any authorised one of them while continuing to perform [one’s duties] according to rule.`,wfw:`ājīvikā-vṛttayaḥ — modes of livelihood; tu — indeed; iti-ādyāḥ — these and others; saṃpravartitāḥ — instituted/laid down; tāsām kayā api — by any one of them; jīvet — one may live; tu — indeed; anutiṣṭhet — should continue to perform; yathāvidhi — according to rule.`},
{n:12,sa:`नित्यं शुचिः सुगंधश्च स्नानशीलः प्रियंवदः ।\nपूज्यश्च पूजयेद्देवान्कार्याणि स्वयमाचरेत् ॥ १२ ॥`,iast:`nityaṃ śuciḥ sugaṃdhaśca snānaśīlaḥ priyaṃvadaḥ |\npūjyaśca pūjayeddevānkāryāṇi svayamācaret || 12 ||`,en:`One should always be clean, pleasantly scented, accustomed to bathing, and gentle in speech; one should honour those worthy of honour, worship the gods, and personally perform one’s duties.`,wfw:`nityam — always; śuciḥ — clean/pure; sugandhaḥ — pleasantly scented; ca — and; snāna-śīlaḥ — accustomed to bathing; priyaṃ-vadaḥ — speaking pleasantly; pūjyaḥ ca — and [honouring] the honourable; pūjayet devān — should worship the gods; kāryāṇi — duties/tasks; svayam ācaret — should personally perform.`},
{n:13,sa:`नेक्षेतार्कं न नग्नां स्त्रीं न च संस्पृष्ट मैथुनम् ।\nनाप्सु मूत्रं पुरीषं वा नाशुची रात्रितारकाः ॥ १३ ॥`,iast:`nekṣetārkaṃ na nagnāṃ strīṃ na ca saṃspṛṣṭa maithunam |\nnāpsu mūtraṃ purīṣaṃ vā nāśucī rātritārakāḥ || 13 ||`,en:`One should not gaze directly at the Sun, at a naked woman, or at sexual intercourse; one should not urinate or defecate in water, nor gaze at the stars at night while impure.`,wfw:`na īkṣeta arkam — should not gaze at the Sun; na nagnām strīm — not at a naked woman; na ca — nor; saṃspṛṣṭa-maithunam — sexual intercourse / those joined in intercourse; na apsu — not in water; mūtram — urine; purīṣam vā — or feces; na aśuciḥ — not while impure; rātri-tārakāḥ — the stars at night [should be gazed upon].`,note:`The syntax of the final prohibition is compressed; the conventional sense is that one should not look at the stars while impure.`},
{n:14,sa:`शास्त्रोक्ता यंत्रणा या तु नानुक्तानि व्रतानि च ।\nस्वर्गार्थं साधयेत्तैश्च शक्तिमान्मनसा तथा ॥ १४ ॥`,iast:`śāstroktā yaṃtraṇā yā tu nānuktāni vratāni ca |\nsvargārthaṃ sādhayettaiśca śaktimānmanasā tathā || 14 ||`,en:`A capable person should undertake, for the sake of heaven, the restraints taught in śāstra and the authorised vows, with corresponding resolve of mind.`,wfw:`śāstra-uktā — taught in scripture; yantraṇā — restraint/discipline; yā tu — whatever; na anuktāni — not unprescribed / those not left unstated (difficult negative); vratāni ca — and vows; svarga-artham — for the sake of heaven; sādhayet — should accomplish/practise; taiḥ ca — by them; śaktimān — one who is capable; manasā — with the mind; tathā — likewise.`,note:`The negative in nānuktāni is awkward; the practical sense is observance of scripturally authorised restraints and vows.`},
{n:15,sa:`नित्यानि केचिदिच्छंति काम्यानि च तथापरे ।\nकाम्याप्रवृत्तौ संगे च प्रायश्चित्तं विधीयते ॥ १५ ॥`,iast:`nityāni kecidicchaṃti kāmyāni ca tathāpare |\nkāmyāpravṛttau saṃge ca prāyaścittaṃ vidhīyate || 15 ||`,en:`Some regard these observances as obligatory, others as desire-motivated. In improper non-performance or attachment in relation to a kāmya rite, expiation is prescribed.`,wfw:`nityāni — obligatory; kecit icchanti — some hold; kāmyāni — desire-motivated; ca — and; tathā apare — likewise others; kāmya-apravṛttau — in non-performance of a kāmya rite; saṅge ca — and in attachment/involvement; prāyaścittam — expiation; vidhīyate — is prescribed.`},
{n:16,sa:`व्रतानि मनसा त्विष्टसंकल्प इति मानसः ।\nअंतरानुफलं यत्तदृषिवादाः प्रकीर्तिताः ॥ १६ ॥`,iast:`vratāni manasā tviṣṭasaṃkalpa iti mānasaḥ |\naṃtarānuphalaṃ yattadṛṣivādāḥ prakīrtitāḥ || 16 ||`,en:`A vow begins with the desired resolve of the mind; the mental component is thus intention. The ancillary or intermediate fruits are proclaimed in the sayings of the sages.`,wfw:`vratāni — vows; manasā — by/with the mind; tu — indeed; iṣṭa-saṃkalpaḥ — desired resolve; iti — thus; mānasaḥ — mental; antara-anu-phalam — intermediate/secondary fruit; yat tat — whatever that is; ṛṣi-vādāḥ — sayings of the sages; prakīrtitāḥ — proclaimed.`},
{n:17,sa:`अनध्यायं स्वयं सम्यग्वर्जयेत्फलसाधनम् ।\nआत्मा शुद्धस्तथा देशो ह्यसुहारः प्रजापदः ॥ १७ ॥`,iast:`anadhyāyaṃ svayaṃ samyagvarjayetphalasādhanam |\nātmā śuddhastathā deśo hyasuhāraḥ prajāpadaḥ || 17 ||`,en:`One should carefully observe the periods of anadhyāya, suspension of Vedic study, as part of securing the proper fruit; the verse then lists purity of self and place together with further conditions in a textually difficult expression.`,wfw:`anadhyāyam — anadhyāya, period of suspended study; svayam — oneself; samyak — properly; varjayet — should avoid [study]; phala-sādhanam — as a means to the result; ātmā śuddhaḥ — the self/person pure; tathā deśaḥ — likewise the place; hi — indeed; asuhāraḥ prajāpadaḥ — transmitted difficult words.`,note:`The second hemistich is corrupt or highly compressed; the secure sense is that conditions of personal and spatial purity belong to valid study.`},
{n:18,sa:`अशुभानि निमित्तानि उत्पातो विकृतं तथा ।\nपर्वाणि मनसोऽशुद्धिरनध्याय इति स्मृतः ॥ १८ ॥`,iast:`aśubhāni nimittāni utpāto vikṛtaṃ tathā |\nparvāṇi manaso'śuddhiranadhyāya iti smṛtaḥ || 18 ||`,en:`Inauspicious signs, portents, abnormal events, sacred junction-days, and impurity of mind are remembered as causes for anadhyāya.`,wfw:`aśubhāni nimittāni — inauspicious omens; utpātaḥ — portent/calamity; vikṛtam — abnormal occurrence; tathā — likewise; parvāṇi — sacred junction-days; manasaḥ aśuddhiḥ — impurity of mind; anadhyāyaḥ — suspension of study; iti smṛtaḥ — is so remembered.`},
{n:19,sa:`अनध्यायाश्च दृष्टार्था अदृष्टार्थास्तथापरे ।\nवेदाध्ययनमेवेति त्रिधा मद्ध्यानदर्शनम् ॥ १९ ॥`,iast:`anadhyāyāśca dṛṣṭārthā adṛṣṭārthāstathāpare |\nvedādhyayanameveti tridhā maddhyānadarśanam || 19 ||`,en:`Some anadhyāya rules serve visible ends and others unseen ends; the text presents a threefold perspective on Vedic study, though the final compound is transmitted imperfectly.`,wfw:`anadhyāyāḥ ca — suspensions of study; dṛṣṭa-arthāḥ — serving visible ends; adṛṣṭa-arthāḥ — serving unseen ends; tathā apare — likewise others; veda-adhyayanam — Vedic study; eva iti — indeed thus; tridhā — threefold; maddhyāna-darśanam — transmitted reading, uncertain.`},
{n:20,sa:`अभक्ष्यं सर्ववर्णानां शावाशौचं खगाधिप ।\nद्रव्यशुद्धिस्तथैव स्यादन्यथा त्वसमंजसम् ॥ २० ॥`,iast:`abhakṣyaṃ sarvavarṇānāṃ śāvāśaucaṃ khagādhipa |\ndravyaśuddhistathaiva syādanyathā tvasamaṃjasam || 20 ||`,en:`Rules of inedible food apply to all varṇas; corpse-impurity and purification of substances are likewise to be understood, O lord of birds—otherwise the system would be incoherent.`,wfw:`abhakṣyam — inedible food; sarva-varṇānām — for all varṇas; śāva-aśaucam — impurity connected with a corpse; khagādhipa — O lord of birds; dravya-śuddhiḥ — purification of substances; tathā eva — likewise; syāt — should be; anyathā — otherwise; tu — indeed; asamañjasam — incoherent/inconsistent.`},
{n:21,sa:`जातिदुष्टं क्रियादुष्टं कालदुष्टं विभूषितम् ।\nसंसर्गाश्रयदुष्टं च सहृल्लेखं स्वभावतः ॥ २१ ॥`,iast:`jātiduṣṭaṃ kriyāduṣṭaṃ kāladuṣṭaṃ vibhūṣitam |\nsaṃsargāśrayaduṣṭaṃ ca sahṛllekhaṃ svabhāvataḥ || 21 ||`,en:`The text classifies food/substance defects as arising from kind (jāti), preparation/action, time, contact, source/support, inner aversion, and inherent nature; one transmitted item in the first line is uncertain.`,wfw:`jāti-duṣṭam — defective by kind/species; kriyā-duṣṭam — defective by preparation/action; kāla-duṣṭam — defective by time; vibhūṣitam — transmitted term, uncertain in this list; saṃsarga-duṣṭam — defective by contact; āśraya-duṣṭam — defective by source/support; sa-hṛllekham — accompanied by inner aversion/disgust; svabhāvataḥ — by inherent nature.`},
{n:22,sa:`लशुनं गृंजनं चैव पलांडुं कवकानि च ।\nवार्ताकं नालिकेरं तु मूलकं जातिदुष्टकम् ॥ २२ ॥`,iast:`laśunaṃ gṛṃjanaṃ caiva palāṃḍuṃ kavakāni ca |\nvārtākaṃ nālikeraṃ tu mūlakaṃ jātiduṣṭakam || 22 ||`,en:`Garlic, gṛñjana, onion, mushrooms, eggplant, coconut, and radish are classified here as defective by kind (jāti) under this dietary code.`,wfw:`laśunam — garlic; gṛñjanam — gṛñjana, a pungent bulb/plant; ca eva — and; palāṇḍum — onion; kavakāni — mushrooms/fungi; ca — and; vārtākam — eggplant; nālikeram — coconut; tu — indeed; mūlakam — radish; jāti-duṣṭakam — defective by kind/species.`},
{n:23,sa:`नो भुञ्जीत क्रियादुष्टं दुष्टं च पतितैः पृथक् ।\nकालदुष्टं तु विज्ञेयं हानिदं चिरसंस्थितम् ॥ २३ ॥`,iast:`no bhuñjīta kriyāduṣṭaṃ duṣṭaṃ ca patitaiḥ pṛthak |\nkāladuṣṭaṃ tu vijñeyaṃ hānidaṃ cirasaṃsthitam || 23 ||`,en:`One should not eat food defective through its preparation or separately polluted by fallen persons. Food kept too long and causing harm is to be known as time-defective.`,wfw:`na bhuñjīta — one should not eat; kriyā-duṣṭam — defective by preparation/action; duṣṭam ca — and polluted; patitaiḥ — by fallen persons; pṛthak — separately; kāla-duṣṭam — defective by time; tu — indeed; vijñeyam — to be known; hāni-dam — causing harm; cira-saṃsthitam — kept for a long time.`},
{n:24,sa:`दधिभक्ष्यविकाराश्च मधुवर्ज्यास्तदिष्यते ॥ २४ ॥`,iast:`dadhibhakṣyavikārāśca madhuvarjyāstadiṣyate || 24 ||`,en:`Transformations/preparations of curd and edible preparations are then mentioned; honey is treated as an exception in the transmitted rule.`,wfw:`dadhi — curd; bhakṣya-vikārāḥ — transformed edible preparations; ca — and; madhu — honey; varjyāḥ / varjyam — excepted/to be excluded, as transmitted; tat iṣyate — so it is prescribed/accepted.`,note:`The one-line verse is compressed and its exact scope is uncertain; the words dadhi, bhakṣya-vikāra and madhu are secure.`},
{n:25,sa:`सुरालशुनसंस्पृष्टं पेयूषादिसमन्वितम् ।\nसंसर्गदुष्टमेतद्धि शुनोच्छिष्टं खगेश्वर ॥ २५ ॥`,iast:`surālaśunasaṃspṛṣṭaṃ peyūṣādisamanvitam |\nsaṃsargaduṣṭametaddhi śunocchiṣṭaṃ khageśvara || 25 ||`,en:`Food touched by liquor or garlic, associated with colostrum-like substances and the like, and a dog’s leftovers are examples of food defective by contact, O lord of birds.`,wfw:`surā-laśuna-saṃspṛṣṭam — touched by liquor or garlic; peyūṣa-ādi-samanvitam — associated with colostrum/peyūṣa and the like; saṃsarga-duṣṭam — defective by contact; etat hi — this indeed; śunaḥ ucchiṣṭam — a dog’s leftovers; khageśvara — O lord of birds.`},
{n:26,sa:`शूद्रसक्तं खंडसक्तं ज्ञेयमाश्रयदूषितम् ।\nविचिकित्सा तु हृदये भक्ष्ये यस्मिन्त्सुजायते ॥ २६ ॥`,iast:`śūdrasaktaṃ khaṃḍasaktaṃ jñeyamāśrayadūṣitam |\nvicikitsā tu hṛdaye bhakṣye yasmintsujāyate || 26 ||`,en:`Food attached to a disapproved source—including what the transmitted text calls śūdrasakta and khaṇḍasakta—is to be known as source-defective. Where strong doubt arises in the heart about something edible, that doubt itself becomes relevant.`,wfw:`śūdra-saktam — connected/attached to a Śūdra; khaṇḍa-saktam — transmitted term, connected with a fragment/source; jñeyam — to be known; āśraya-dūṣitam — polluted by its source/support; vicikitsā — doubt/hesitation; tu — indeed; hṛdaye — in the heart; bhakṣye — concerning food; yasmin — about which; su-jāyate — strongly arises.`,note:`khaṇḍasakta is obscure in this context and is retained rather than conjecturally emended.`},
{n:27,sa:`सहृल्लेखं तु तज्ज्ञेयं पुरीषं तु स्वभावतः ।\nरसदुष्टे विकारोऽपि रसस्येति प्रदर्शितः ॥ २७ ॥`,iast:`sahṛllekhaṃ tu tajjñeyaṃ purīṣaṃ tu svabhāvataḥ |\nrasaduṣṭe vikāro'pi rasasyeti pradarśitaḥ || 27 ||`,en:`That which provokes an aversive sensation in the heart is to be recognised as such; excrement is impure by its very nature. Alteration or corruption of taste is likewise shown as a defect of rasa.`,wfw:`sa-hṛllekham — accompanied by heart-scratching/inner aversion; tu — indeed; tat jñeyam — that is to be known; purīṣam — excrement; tu — however; svabhāvataḥ — by nature; rasa-duṣṭe — when taste/juice is spoiled; vikāraḥ api — alteration also; rasasya — of the taste; iti pradarśitaḥ — thus demonstrated.`},
{n:28,sa:`पायसं क्षीरपाकादि तस्मिन्नेव दिने तथा ।\nयथाशास्त्रं खगश्रेष्ठ भक्ष्याभक्ष्ये निरूपयेत् ॥ २८ ॥`,iast:`pāyasaṃ kṣīrapākādi tasminneva dine tathā |\nyathāśāstraṃ khagaśreṣṭha bhakṣyābhakṣye nirūpayet || 28 ||`,en:`Milk-rice, milk preparations, and the like are to be judged within that very day. What is edible and inedible should be determined according to śāstra, O best of birds.`,wfw:`pāyasam — milk-rice; kṣīra-pāka-ādi — milk preparations and the like; tasmin eva dine — on that very day; tathā — likewise; yathā-śāstram — according to scripture; khaga-śreṣṭha — O best of birds; bhakṣya-abhakṣye — edible and inedible; nirūpayet — should determine.`},
{n:29,sa:`प्राणात्यये प्रोक्षितं च श्राद्धे च द्विजकाम्यया ।\nपितॄन्देवांश्चार्पयित्वा भुंजन्मांसं न दोषभाक् ॥ २९ ॥`,iast:`prāṇātyaye prokṣitaṃ ca śrāddhe ca dvijakāmyayā |\npitṝndevāṃścārpayitvā bhuṃjanmāṃsaṃ na doṣabhāk || 29 ||`,en:`In danger to life, when ritually sprinkled, or in the context of śrāddha and the prescribed desire of a twice-born ritualist, one who first offers meat to the ancestors and gods and then eats it is said not to incur fault.`,wfw:`prāṇa-atyaye — in danger to life; prokṣitam — ritually sprinkled; ca — and; śrāddhe — at śrāddha; ca — and; dvija-kāmyayā — by/for the prescribed desire of a twice-born; pitṝn — ancestors; devān ca — and gods; arpayitvā — having offered to; bhuñjan — eating; māṃsam — meat; na doṣa-bhāk — not sharing in fault.`},
{n:30,sa:`प्रेताशुद्धिः सपिंडानां तस्मिन्नेव मृते सति ।\nदशाहं द्वादशाहं वा पक्षं मासं त्वशुद्धता ॥ ३० ॥`,iast:`pretāśuddhiḥ sapiṃḍānāṃ tasminneva mṛte sati |\ndaśāhaṃ dvādaśāhaṃ vā pakṣaṃ māsaṃ tvaśuddhatā || 30 ||`,en:`When a death occurs, corpse-impurity for sapiṇḍas is prescribed for ten days, twelve days, a fortnight, or a month according to the applicable rule.`,wfw:`preta-aśuddhiḥ — impurity arising from death; sapiṇḍānām — of sapiṇḍa relatives; tasmin eva mṛte sati — when that person has died; daśāham — ten days; dvādaśāham vā — or twelve days; pakṣam — a fortnight; māsam — a month; tu — indeed; aśuddhatā — impurity.`},
{n:31,sa:`दशाहादित्रिके भागे वर्णशो न भवंति हि ।\nदशाहेन तु भोज्याः स्युः सूतकाशौचयोस्तथा ॥ ३१ ॥`,iast:`daśāhāditrike bhāge varṇaśo na bhavaṃti hi |\ndaśāhena tu bhojyāḥ syuḥ sūtakāśaucayostathā || 31 ||`,en:`The transmitted verse further differentiates the periods according to varṇa and circumstance, and states a ten-day rule in connection with food after birth- and death-impurity.`,wfw:`daśāha-ādi-trike bhāge — in the group/division beginning with ten days; varṇaśaḥ — according to varṇa; na bhavanti hi — they are not the same, as transmitted; daśāhena — after ten days; tu — indeed; bhojyāḥ syuḥ — may become fit for eating/feeding; sūtaka-aśaucayoḥ — in birth- and death-impurity; tathā — likewise.`,note:`The first hemistich is compressed; verse 39 later gives an explicit varṇa-based sequence.`},
{n:32,sa:`ऊर्ध्वं दशाहादेकाहश्रवणे सति जायते ।\nसंवत्सरे व्यतीते तु स्नानादेव विशुध्यति ॥ ३२ ॥`,iast:`ūrdhvaṃ daśāhādekāhaśravaṇe sati jāyate |\nsaṃvatsare vyatīte tu snānādeva viśudhyati || 32 ||`,en:`If news of the death is heard after the ten-day period, a one-day impurity arises; if a year has passed, purification is obtained by bathing alone.`,wfw:`ūrdhvam daśāhāt — after/beyond ten days; eka-aha — one day; śravaṇe sati — when the news is heard; jāyate — arises; saṃvatsare vyatīte — when a year has passed; tu — however; snānāt eva — by bathing alone; viśudhyati — one is purified.`},
{n:33,sa:`समानोदकता प्रोक्ता जन्मनाम्नोरपर्यये ।\nसपिंडाः सप्तपुरुषाः श्रुतावेतन्निदर्शनम् ॥ ३३ ॥`,iast:`samānodakatā proktā janmanāmnoraparyaye |\nsapiṃḍāḥ saptapuruṣāḥ śrutāvetannidarśanam || 33 ||`,en:`Samānodaka relationship is said to extend so long as birth/lineage and name are remembered; sapiṇḍa relationship is exemplified as extending through seven generations.`,wfw:`samānodakatā — samānodaka relationship; proktā — stated; janma-nāmnoḥ — of birth/lineage and name; aparyaye — until non-recollection/cessation (transmitted sense); sapiṇḍāḥ — sapiṇḍas; sapta-puruṣāḥ — seven persons/generations; śrutau — in transmitted teaching; etat nidarśanam — this is the example.`},
{n:34,sa:`आ दंतजन्मनः सद्य आचूडान्नैष्ठिकी स्मृता ।\nत्रिरात्रमाव्रतादेशात्सपिंडेषु मृतेषु च ॥ ३४ ॥`,iast:`ā daṃtajanmanaḥ sadya ācūḍānnaiṣṭhikī smṛtā |\ntrirātramāvratādeśātsapiṃḍeṣu mṛteṣu ca || 34 ||`,en:`The period of impurity is differentiated according to the child’s stage of development and saṃskāra-status: immediate purification is stated up to the appearance of teeth, with later stages extending toward the cūḍā and vow-initiation, and three nights in the stated sapiṇḍa case.`,wfw:`ā danta-janmanaḥ — up to the appearance of teeth; sadyaḥ — immediately; ā-cūḍāt — up to the cūḍā rite; naiṣṭhikī — transmitted term, here marking a further fixed stage; smṛtā — remembered; tri-rātram — three nights; ā-vrata-ādeśāt — up to initiation into a vow; sapiṇḍeṣu mṛteṣu — when sapiṇḍas have died; ca — and.`,note:`The age/saṃskāra sequence is compressed and naiṣṭhikī is difficult in this context; the verse clearly grades impurity by developmental/ritual stage.`},
{n:35,sa:`तेषामपि तदेकं स्याद्वयोवस्थाप्यपेक्ष्यते ।\nसमानोदकात्त्रिरात्रेण शुध्येद्वै मृत्युजन्मनोः ॥ ३५ ॥`,iast:`teṣāmapi tadekaṃ syādvayovasthāpyapekṣyate |\nsamānodakāttrirātreṇa śudhyedvai mṛtyujanmanoḥ || 35 ||`,en:`For these cases the exact period is to be determined with regard to age and condition. In the case of samānodaka relations, purification from death or birth occurs after three nights.`,wfw:`teṣām api — for those also; tat ekam syāt — that may be one/single [period], as appropriate; vayaḥ-avasthā — age and condition; api apekṣyate — is also to be considered; samānodakāt — in relation to a samānodaka; tri-rātreṇa — after three nights; śudhyet — one is purified; vai — indeed; mṛtyu-janmanoḥ — from death and birth.`},
{n:36,sa:`गर्भस्रावे त्रिरात्रेण उदक्या शुध्यते तथा ।\nअनंतजन्म मरणे तच्छेषेण विशुध्यति ॥ ३६ ॥`,iast:`garbhasrāve trirātreṇa udakyā śudhyate tathā |\nanaṃtajanma maraṇe taccheṣeṇa viśudhyati || 36 ||`,en:`After miscarriage, purification occurs after three nights; a menstruating woman is purified according to the corresponding period. When birth- or death-impurity overlaps another, purification occurs after the remainder of the existing period.`,wfw:`garbha-srāve — in miscarriage; tri-rātreṇa — after three nights; udakyā — menstruating woman; śudhyate — is purified; tathā — likewise; ananta-janma-maraṇe — in overlapping/consecutive birth or death (transmitted ananta); tat-śeṣeṇa — by the remainder of that [period]; viśudhyati — one is purified.`,note:`ananta in the second line is likely a compressed or corrupt expression for overlapping/consecutive impurity; the rule of completing the remainder is clear.`},
{n:37,sa:`द्विजानां त्वेवमेव स्यात्पित्रर्थं मातुरेव वा ।\nअग्निहोत्रार्थं विज्ञेयं सद्यः शौचमिति स्थितिः ॥ ३७ ॥`,iast:`dvijānāṃ tvevameva syātpitrarthaṃ mātureva vā |\nagnihotrārthaṃ vijñeyaṃ sadyaḥ śaucamiti sthitiḥ || 37 ||`,en:`The same principle applies among the twice-born in relation to father or mother. For the sake of maintaining Agnihotra, immediate ritual purification is recognised as the settled rule.`,wfw:`dvijānām — among the twice-born; tu evaṃ eva — just so; syāt — should be; pitṛ-artham — in relation to the father; mātuḥ eva vā — or the mother; agnihotra-artham — for the sake of Agnihotra; vijñeyam — to be understood; sadyaḥ śaucam — immediate purification; iti sthitiḥ — this is the settled rule.`},
{n:38,sa:`असपिंडे तु निर्हारात्त्रिरात्रमपि मानवः ।\nतस्यैवानुगतौ ज्ञेयं सद्यः शौचं खगाधिप ॥ ३८ ॥`,iast:`asapiṃḍe tu nirhārāttrirātramapi mānavaḥ |\ntasyaivānugatau jñeyaṃ sadyaḥ śaucaṃ khagādhipa || 38 ||`,en:`A person who carries out the corpse of one who is not a sapiṇḍa incurs three nights; if he merely accompanies that person’s funeral procession, immediate purification is recognised, O lord of birds.`,wfw:`asapiṇḍe — for a non-sapiṇḍa; tu — indeed; nirhārāt — from carrying out/removing the corpse; tri-rātram — three nights; api — even; mānavaḥ — a person; tasya eva — of that very person; anugatau — in accompanying/following; jñeyam — to be understood; sadyaḥ śaucam — immediate purification; khagādhipa — O lord of birds.`},
{n:39,sa:`शुध्येद्द्विजो दशाहेन जन्महानौ द्वियोनिषु ।\nषङ्भिस्त्रिभिरहै केन क्षत्रविट्शूद्रयोनिषु ॥ ३९ ॥`,iast:`śudhyeddvijo daśāhena janmahānau dviyoniṣu |\nṣaṅbhistribhirahai kena kṣatraviṭśūdrayoniṣu || 39 ||`,en:`The verse gives a varṇa-based sequence of impurity periods: the Brahmin is purified in ten days, while the Kṣatriya, Vaiśya, and Śūdra are assigned the shorter periods expressed in the second line.`,wfw:`śudhyet — is purified; dvijaḥ — the twice-born/Brahmin in context; daśāhena — in ten days; janma-hānau — in birth/death loss, as transmitted; dvi-yoniṣu — transmitted expression; ṣaḍbhiḥ — by six [days]; tribhiḥ ahaiḥ — by three days; ekena — by one; kṣatra-viṭ-śūdra-yoniṣu — in the Kṣatriya, Vaiśya, and Śūdra categories.`,note:`The transmitted numbers here differ from more familiar Dharmaśāstra schemes and the first line is textually awkward. The verse should be reported as transmitted, not harmonised silently.`},
{n:40,sa:`उक्तशौचं यथान्यायं शारीरं तत्त्वदर्शिभिः ।\nद्रव्यशुद्धिविधानं तु यथावदभिधीयते ॥ ४० ॥`,iast:`uktaśaucaṃ yathānyāyaṃ śārīraṃ tattvadarśibhiḥ |\ndravyaśuddhividhānaṃ tu yathāvadabhidhīyate || 40 ||`,en:`The rules of bodily purification have been stated according to proper principle by those who see the truth; the procedure for purifying substances will now be explained correctly.`,wfw:`ukta-śaucam — purification already stated; yathā-nyāyam — according to proper principle; śārīram — bodily; tattva-darśibhiḥ — by seers of truth; dravya-śuddhi-vidhānam — procedure for purification of substances; tu — now; yathāvat — properly; abhidhīyate — is explained.`},
{n:41,sa:`तैजसी मार्तिकी वीर वारिशुद्धिः स्मृता तथा ।\nनिर्लेपक्षालनेनैव स्पर्शे तु प्रोक्षणेन वै ॥ ४१ ॥`,iast:`taijasī mārtikī vīra vāriśuddhiḥ smṛtā tathā |\nnirlepakṣālanenaiva sparśe tu prokṣaṇena vai || 41 ||`,en:`Purification is prescribed for metallic, earthen, and water-related objects, O hero. Non-greasy objects are cleansed by washing, while in cases of contact purification is by sprinkling.`,wfw:`taijasī — of metallic objects; mārtikī — of earthen objects; vīra — O hero; vāri-śuddhiḥ — purification with/by water; smṛtā — remembered; tathā — likewise; nirlepa — non-greasy/uncoated; kṣālanena eva — by washing alone; sparśe — upon contact; tu — however; prokṣaṇena — by sprinkling; vai — indeed.`},
{n:42,sa:`अशुद्धं नैव किंचिद्धि द्रव्यमस्तीति खेचर ।\nवचनाच्छुद्ध्यशुद्धी तु द्रव्याणामिह खेचर ॥ ४२ ॥`,iast:`aśuddhaṃ naiva kiṃciddhi dravyamastīti khecara |\nvacanācchuddhyaśuddhī tu dravyāṇāmiha khecara || 42 ||`,en:`No substance is absolutely impure in itself, O bird; the purity and impurity of substances in this system depend upon authoritative prescription.`,wfw:`aśuddham — impure; na eva kiṃcit — nothing whatsoever; hi — indeed; dravyam asti — substance exists [as inherently such]; iti — thus; khecara — O bird; vacanāt — from authoritative statement/prescription; śuddhi-aśuddhī — purity and impurity; tu — indeed; dravyāṇām — of substances; iha — here; khecara — O bird.`},
{n:43,sa:`स्नानं शौचं च कर्तव्यं द्रव्यशौचादनंतरम् ।\nप्रातःस्नानं तु नित्यं स्याद्ग्रहणे काम्यमेव च ॥ ४३ ॥`,iast:`snānaṃ śaucaṃ ca kartavyaṃ dravyaśaucādanaṃtaram |\nprātaḥsnānaṃ tu nityaṃ syādgrahaṇe kāmyameva ca || 43 ||`,en:`After purification of substances, bathing and bodily purification are to be performed. Morning bathing is obligatory, while bathing at an eclipse is treated as a desired/occasion-specific act.`,wfw:`snānam — bathing; śaucam ca — and purification; kartavyam — to be done; dravya-śaucāt anantaram — after purification of substances; prātaḥ-snānam — morning bath; tu — indeed; nityam syāt — is obligatory; grahaṇe — at an eclipse; kāmyam — desire-motivated; eva ca — likewise.`},
{n:44,sa:`नैमित्तिकं क्षुराशौचं तेन पापाद्विशुध्यति ।\nउक्तं तु शौचं विज्ञेयं दोषक्षयकरं खग ॥ ४४ ॥`,iast:`naimittikaṃ kṣurāśaucaṃ tena pāpādviśudhyati |\nuktaṃ tu śaucaṃ vijñeyaṃ doṣakṣayakaraṃ khaga || 44 ||`,en:`Purification after shaving and similar occasions is naimittika; through it one is purified from the corresponding fault. The forms of śauca stated here are to be understood as destroying defects, O bird.`,wfw:`naimittikam — occasion-specific; kṣura-aśaucam — impurity/purification connected with shaving; tena — by that; pāpāt — from sin/fault; viśudhyati — one is purified; uktam — stated; tu — indeed; śaucam — purification; vijñeyam — to be understood; doṣa-kṣaya-karam — causing destruction of fault; khaga — O bird.`},
{n:45,sa:`कर्मांगं चेति विज्ञेयं षट्प्रकारा समासतः ।\nएवमाचमनं विद्याद्विशिष्टं तु द्विजन्मनाम् ॥ ४५ ॥`,iast:`karmāṃgaṃ ceti vijñeyaṃ ṣaṭprakārā samāsataḥ |\nevamācamanaṃ vidyādviśiṣṭaṃ tu dvijanmanām || 45 ||`,en:`Purification is also to be understood as an ancillary part of ritual; in summary the text recognises six types. Ācamana is likewise to be understood, with a special form for the twice-born.`,wfw:`karma-aṅgam — an ancillary part of ritual; ca iti — and thus; vijñeyam — to be understood; ṣaṭ-prakārāḥ — six kinds; samāsataḥ — in summary; evam — thus; ācamanaṃ — ritual sipping; vidyāt — one should understand; viśiṣṭam — special/distinct; tu — indeed; dvijanmanām — for the twice-born.`},
{n:46,sa:`तदा मृतानां तद्वत्स्यादन्येषां तु यथासुखम् ।\nकन्यानिवृत्तिं पुत्रैस्तु यथान्यायं समाचरेत् ॥ ४६ ॥`,iast:`tadā mṛtānāṃ tadvatsyādanyeṣāṃ tu yathāsukham |\nkanyānivṛttiṃ putraistu yathānyāyaṃ samācaret || 46 ||`,en:`The verse gives further family rules for the dead and for others according to circumstance, and directs that matters concerning daughters and sons be handled according to proper rule.`,wfw:`tadā — then; mṛtānām — of the dead; tadvat syāt — it should be likewise; anyeṣām — of others; tu — however; yathā-sukham — according to circumstance/convenience; kanyā-nivṛttim — arrangement/withdrawal concerning daughters; putraiḥ tu — with/by sons; yathā-nyāyam — according to proper rule; samācaret — should carry out.`,note:`The precise legal situation presupposed by kanyānivṛtti is not explicit in the transmitted verse.`},
{n:47,sa:`कलाशिल्पानिसर्वाणि गृह्रीयात्परितुष्टये ॥ ४७ ॥`,iast:`kalāśilpānisarvāṇi gṛhrīyātparituṣṭaye || 47 ||`,en:`One may learn all arts and crafts for proper accomplishment and satisfaction.`,wfw:`kalā-śilpāni — arts and crafts; sarvāṇi — all; gṛhṇīyāt — should learn/take up (transmitted gṛhrīyāt); parituṣṭaye — for satisfaction/fulfilment.`},
{n:48,sa:`शुश्रूषेत पतिं भार्या परितोषं यथा व्रजेत् ।\nगुरूणां परितोषश्च धर्मः स्त्रीणां सनातनः ॥ ४८ ॥`,iast:`śuśrūṣeta patiṃ bhāryā paritoṣaṃ yathā vrajet |\ngurūṇāṃ paritoṣaśca dharmaḥ strīṇāṃ sanātanaḥ || 48 ||`,en:`The wife is instructed to attend upon her husband so that mutual satisfaction is attained; satisfying and honouring elders is likewise called an enduring duty of women.`,wfw:`śuśrūṣeta — should attend upon/serve; patim — husband; bhāryā — wife; paritoṣam — satisfaction; yathā vrajet — so that it may be reached; gurūṇām — of elders; paritoṣaḥ — satisfaction/honouring; ca — and; dharmaḥ — duty; strīṇām — of women; sanātanaḥ — enduring/traditional.`},
{n:49,sa:`वृद्धाऽपुत्रा यदि मृता तदभावे नृपस्य तु ।\nमृतापत्याप्यगर्भा च वृद्धापत्या पतिव्रता ॥ ४९ ॥`,iast:`vṛddhā'putrā yadi mṛtā tadabhāve nṛpasya tu |\nmṛtāpatyāpyagarbhā ca vṛddhāpatyā pativratā || 49 ||`,en:`The transmitted verse lists special household cases involving an elderly childless woman, absence of heirs, dead offspring, absence of pregnancy, aged offspring, and a devoted wife; the syntax is fragmentary and continues into the following rule.`,wfw:`vṛddhā — elderly woman; aputrā — without a son; yadi mṛtā — if deceased; tad-abhāve — in their absence; nṛpasya tu — of the king, as transmitted; mṛta-apatyā — one whose offspring has died; api agarbhā — also not pregnant; ca — and; vṛddha-apatyā — having aged offspring; pativratā — devoted wife.`,note:`This verse is a compressed list without a fully expressed governing verb; it should be read with verses 50–52 rather than translated as a complete independent sentence.`},
{n:50,sa:`कुर्यादनिर्वृतं भर्तुर्गते सन्निहितेपि वा ।\nएतां धर्म समां निष्ठां भर्तृलोकमवाप्नुयात् ॥ ५० ॥`,iast:`kuryādanirvṛtaṃ bharturgate sannihitepi vā |\netāṃ dharma samāṃ niṣṭhāṃ bhartṛlokamavāpnuyāt || 50 ||`,en:`Whether the husband is away or present, the wife is instructed to maintain the prescribed discipline toward him; by maintaining this dharmic steadfastness she is said to attain her husband’s world.`,wfw:`kuryāt — should perform/maintain; anirvṛtam — transmitted term, unceasing/without turning away; bhartuḥ — toward/of the husband; gate — when gone away; sannihite api vā — or even when nearby; etām — this; dharma-samām niṣṭhām — steadfastness equal/conformable to dharma; bhartṛ-lokam — husband’s world; avāpnuyāt — may attain.`,note:`anirvṛtam is awkward here; the surrounding sense is sustained marital discipline whether the husband is absent or present.`},
{n:51,sa:`स्त्री धर्मचारिणी साध्वी मृता दाह्या तथाग्निभिः ।\nविपरीताददाह्या तु पुनर्दारक्रिया तथा ॥ ५१ ॥`,iast:`strī dharmacāriṇī sādhvī mṛtā dāhyā tathāgnibhiḥ |\nviparītādadāhyā tu punardārakriyā tathā || 51 ||`,en:`A virtuous woman who has lived according to dharma is, upon death, to receive the prescribed cremation with fire. The text distinguishes a contrary case and then mentions the procedure for taking another wife.`,wfw:`strī — woman; dharma-cāriṇī — one who lives according to dharma; sādhvī — virtuous; mṛtā — deceased; dāhyā — to be cremated; tathā agnibhiḥ — with the prescribed fires; viparītāt — in the contrary case; adāhyā — not to be cremated in the same way; tu — however; punar-dāra-kriyā — procedure for another marriage/wife; tathā — likewise.`,note:`The precise identity of the “contrary” case is not restated in the verse and depends on the preceding family-law discussion.`},
{n:52,sa:`स्त्रीणां नियोगो विहितो मरणाद्ब्रह्मचारकम् ।\nप्राप्तव्यश्च यथाधर्मो दृष्टादृष्टफलप्रदः ॥ ५२ ॥`,iast:`strīṇāṃ niyogo vihito maraṇādbrahmacārakam |\nprāptavyaśca yathādharmo dṛṣṭādṛṣṭaphalapradaḥ || 52 ||`,en:`The text refers to niyoga and continence in relation to widowhood/death, and says that the applicable course should be followed according to dharma, yielding both visible and unseen results.`,wfw:`strīṇām — for women; niyogaḥ — niyoga arrangement; vihitaḥ — prescribed; maraṇāt — after death; brahmacārakam — celibate conduct/continence; prāptavyaḥ ca — and to be undertaken/attained; yathā-dharmaḥ — according to dharma; dṛṣṭa-adṛṣṭa-phala-pradaḥ — giving visible and unseen fruits.`,note:`The first hemistich is compressed and appears to juxtapose alternative widowhood-related disciplines rather than spell out their conditions.`},
{n:53,sa:`तस्माद्धर्मं सदा कुर्यात्कुर्वती स्वर्गमाप्नुयात् ॥ ५३ ॥`,iast:`tasmāddharmaṃ sadā kuryātkurvatī svargamāpnuyāt || 53 ||`,en:`Therefore one should always practise dharma; a woman practising it is said to attain heaven.`,wfw:`tasmāt — therefore; dharmam — dharma; sadā — always; kuryāt — should practise; kurvatī — a woman practising [it]; svargam — heaven; āpnuyāt — may attain.`}
];
