</script><script>const A=[
'Bhāskara prescribes a mantra-accompanied offering to the serpents in Śrāvaṇa and the rite connected with ascending the bed for one seeking happiness.',
'The corresponding descent is prescribed in Mārgaśīrṣa; obligatory rites are explicitly to be performed without desire for a particular fruit.',
'Desire-motivated rites are performed for their stated results, while occasional rites address faults or occasions; the fruits of action are thus treated in three ways.',
'Some authorities describe the fruit as removal of already-acquired sin, while others speak of preventing its future arising.',
'Other teachers understand the result of obligatory action as incidental; Agnyādheya, Darśa and Paurṇamāsa are named among the regular rites.',
'Cāturmāsya, Agnihotra, the animal offering and Sautrāmaṇī are listed among the sacrificial institutions taught by revelation.',
'Agniṣṭoma, Atyagniṣṭoma, Ukthya, Ṣoḍaśin, Vājapeya, Atirātra and Āptoryāma are enumerated as Soma sacrifices known from Śruti.',
'Compassion toward all beings, freedom from envy, auspiciousness, patience, ease, purity and non-covetousness are declared vows.',
'The saṃskāras have been properly stated as means toward attainment of Brahman; the text now describes the good livelihoods of Brahmins.',
'It lists traditional modes of Brahmin livelihood, from ṛta and amṛta onward, and says that later, more commercial modes are not successively superior.',
'The recognised means of livelihood are laid down; one may live by an authorised one while continuing to perform the prescribed duties.',
'One should remain clean and pleasantly scented, be accustomed to bathing and gentle speech, honour the honourable, worship the gods and personally perform one’s duties.',
'One should not stare at the Sun, a naked woman or sexual intercourse, nor urinate or defecate in water, nor gaze at the stars while impure.',
'One who is capable should observe the restraints taught by śāstra and other authorised vows for the attainment of heaven.',
'Some regard these observances as obligatory and others as desire-motivated; expiation is prescribed for improper omission or involvement.',
'Vows begin with a resolve of the mind; intermediate or secondary fruits are described in the sayings of the ṛṣis.',
'One should carefully avoid periods of anadhyāya; purity of self and place and the other conditions of study are to be maintained.',
'Inauspicious signs, portents, abnormal events, sacred junctions and impurity of mind are counted among causes for suspension of study.',
'Suspension of study may serve visible or unseen ends; the text distinguishes the regulations concerning Vedic study in several ways.',
'Forbidden foods apply to all varṇas; rules of corpse-impurity and purification of substances are also to be understood.',
'Defects in food or substances are classified as arising from kind, preparation, time, contact, source, inner revulsion and natural condition.',
'Garlic, gṛñjana, onion, mushrooms, eggplant, coconut and radish are listed here among items defective by kind according to this dietary code.',
'One should not eat food defective through improper preparation or polluted by fallen persons; food spoiled by time is also to be rejected.',
'The text briefly discusses transformations such as curd-based foods and exceptional treatment of substances such as honey.',
'Food touched by liquor or garlic, colostrum-like products, and a dog’s leftovers are examples of impurity arising through contact.',
'Food associated with a Śūdra or otherwise resting in a disapproved source is classed as source-defective; serious doubt arising in the heart is also a ground for avoidance.',
'Inner disgust is itself recognised as a defect, while excrement is impure by its very nature; corruption of taste is another stated category.',
'Milk-rice and similar preparations are to be judged within the day, and what is edible or inedible should ultimately be determined according to śāstra.',
'In danger to life, after ritual sprinkling, or in the context of śrāddha and offerings to ancestors and gods, the text permits meat without assigning fault in the stated circumstances.',
'Corpse-impurity among sapiṇḍas is described as lasting ten or twelve days, a fortnight, or a month according to the applicable rule.',
'The periods are further differentiated in relation to varṇa and circumstance, while the text also states the ten-day rule for food after birth- and death-impurity.',
'If news of a death is heard after ten days, a one-day observance applies; after a year, purification is by bathing.',
'Samānodaka relationship is traced by remembered name and birth, while sapiṇḍa relationship is said to extend through seven generations.',
'The period of impurity varies with the age and saṃskāra-status of the deceased, from immediate purification in early infancy to three nights after later stages.',
'Comparable rules are stated for those related as samānodakas, with three nights mentioned for birth or death in the stated case.',
'After miscarriage a three-night period is given, and a menstruating woman is likewise purified according to the stated interval; overlapping birth and death impurities are handled by the remaining period.',
'The same principles apply among twice-born relatives in connection with father or mother; for maintaining Agnihotra an immediate purification rule is recognised.',
'For carrying an unrelated corpse the text gives a three-night period, with immediate purification in the specified case of merely accompanying the procession.',
'The chapter explicitly differentiates purification periods by birth-category, assigning ten days to the Brahmin and shorter periods to Kṣatriya, Vaiśya and Śūdra in the transmitted rule.',
'Having stated bodily impurity according to the traditional rule, the text now explains purification of material objects.',
'Metal, earthen and water-related purifications are described; non-greasy objects are washed, while contact may be treated by ritual sprinkling.',
'No substance is absolutely impure in itself, the text says; purity and impurity of objects operate according to authoritative prescription.',
'After cleansing objects, bodily bathing and purification are required; morning bathing is obligatory, while bathing at an eclipse is treated as occasion-specific or desired.',
'Purification after shaving and other occasional impurities removes the corresponding fault; the various forms of śauca are thus said to destroy defects.',
'Ācamana is likewise treated as an ancillary rite with several forms, with particular rules for the twice-born.',
'Rules for relatives and daughters are to be applied according to circumstance and proper order.',
'All arts and crafts may be learned for wholesome satisfaction and competence.',
'A wife is instructed to serve her husband so as to secure mutual contentment; honouring elders is also presented here as an enduring duty of women.',
'The chapter discusses cases of elderly or childless women and the household obligations that arise when death occurs in different family situations.',
'A woman who maintains the stated discipline toward her husband, whether he is away or nearby, is promised attainment of his world.',
'A virtuous woman who follows dharma is to receive the prescribed funeral rites; the text gives different rules for one who acts contrary to that discipline and for remarriage.',
'The chapter refers to traditional arrangements concerning widowhood, continence and niyoga, to be governed according to dharma and their visible and unseen consequences.',
'It concludes that dharma should therefore always be practised; a woman who practises it is said to attain heaven.'
