<script>
const verses=[
{n:1,sa:`प्रख्याते प्रत्ययेनैव प्रश्नपूर्वं प्रतिग्रहः ।\nयजनेऽध्यापने वादे षड्विधो वेदविक्रयः ॥ १ ॥`,iast:`prakhyāte pratyayenaiva praśnapūrvaṃ pratigrahaḥ |\nyajane'dhyāpane vāde ṣaḍvidho vedavikrayaḥ || 1 ||`,en:`Public proclamation, acceptance on an undertaking, acceptance preceded by solicitation, officiating, teaching, and disputation are described as the six forms of selling the Veda.`,wfw:`prakhyāte — in public proclamation; pratyayena — on an undertaking or assurance; praśnapūrvam pratigrahaḥ — acceptance preceded by solicitation; yajane — in officiating at sacrifice; adhyāpane — in teaching; vāde — in disputation; ṣaḍvidhaḥ vedavikrayaḥ — the sixfold selling of the Veda.`},
{n:2,sa:`वेदविक्रयनिर्दिष्टं स्त्रिया चावर्जितं धनम् ।\nन देयं पितृदेवेभ्यो यच्च क्लीबात्खगाधिप ॥ २ ॥`,iast:`vedavikrayanirdiṣṭaṃ striyā cāvarjitaṃ dhanam |\nna deyaṃ pitṛdevebhyo yacca klībātkhagādhipa || 2 ||`,en:`Wealth identified as arising from the sale of the Veda, wealth acquired through a woman, and that obtained from a eunuch should not be offered to the ancestors or the gods, O lord of birds.`,wfw:`vedavikraya-nirdiṣṭam dhanam — wealth connected with selling the Veda; striyā āvarjitam — acquired through a woman; klībāt — from a eunuch; na deyam pitṛ-devebhyaḥ — not to be given to ancestors or gods.`},
{n:3,sa:`अनुयोगेन यो दद्याद्ब्राह्मणाय प्रतिग्रहम् ।\nस पूर्वं नरकं याति ब्राह्मणास्तदनन्तरम् ॥ ३ ॥`,iast:`anuyogena yo dadyādbrāhmaṇāya pratigraham |\nsa pūrvaṃ narakaṃ yāti brāhmaṇāstadanaṃtaram || 3 ||`,en:`One who gives a gift to a Brahmin only after being pressed or solicited goes first to hell; the Brahmin follows thereafter.`,wfw:`anuyogena — after solicitation or pressure; yaḥ dadyāt — whoever gives; brāhmaṇāya pratigraham — a gift for a Brahmin to accept; saḥ pūrvam narakam yāti — he goes first to hell; brāhmaṇaḥ tadanantaram — the Brahmin afterwards.`},
{n:4,sa:`वेदाक्षराणि यावन्ति नियुज्यन्तेऽर्थकारणात् ।\nतावत्यो भ्रूणहत्याः वै वेदविक्रयमाप्नुयात् ॥ ४ ॥`,iast:`vedākṣarāṇi yāvaṃti niyujyanterthakāraṇāt |\ntāvatyo bhrūṇahatyā vai vedavikrayamāpnuyāt || 4 ||`,en:`For as many syllables of the Veda as are employed for the sake of money, the act of selling the Veda is said to incur that many offences comparable to the killing of an embryo.`,wfw:`vedākṣarāṇi yāvanti — as many Vedic syllables as; artha-kāraṇāt niyujyante — are employed for money; tāvatyaḥ bhrūṇahatyāḥ — that many offences of embryo-killing; vedavikrayam āpnuyāt — one incurs through selling the Veda.`},
{n:5,sa:`वैश्वदेवेन यो हीन आदित्यस्य च कर्मणः ।\nसर्वे ते वृषला ज्ञेयाः प्राप्तवेदाश्च ब्राह्मणाः ॥ ५ ॥`,iast:`vaiśvadevena yo hīna ādityasya ca karmaṇaḥ |\nsarve te vṛṣalā jñeyāḥ prāptavedāśca brāhmaṇāḥ || 5 ||`,en:`Those who are devoid of the Vaiśvadeva rite and of the rite of Āditya are to be regarded as vṛṣalas, even if they are Brahmins who have mastered the Veda.`,wfw:`vaiśvadevena hīnaḥ — devoid of the Vaiśvadeva rite; ādityasya karmaṇaḥ — of the rite of Āditya; sarve te vṛṣalāḥ jñeyāḥ — all are to be known as vṛṣalas; prāptavedāḥ brāhmaṇāḥ ca — even Brahmins who have attained Vedic learning.`},
{n:6,sa:`येषामध्ययनं नास्ति ये च केचिदनग्नयः ।\nकुलं वाऽश्रोत्रियं येषां सर्वे ते शूद्रधर्मिणः ॥ ६ ॥`,iast:`yeṣāmadhyayanaṃ nāsti ye ca kecidanagnayaḥ |\nkulaṃ vā'śrotriyaṃ yeṣāṃ sarve te śūdradharmiṇaḥ || 6 ||`,en:`Those who have no Vedic study, those who maintain no sacred fires, and those whose family is not learned in revelation are all described here as following the conduct of Śūdras.`,wfw:`yeṣām adhyayanam nāsti — those without study; anagnayaḥ — without sacred fires; aśrotriyam kulam — a family lacking śrotriya learning; sarve te śūdra-dharmiṇaḥ — all are of Śūdra-like conduct.`},
{n:7,sa:`अकृत्वा वैश्वदेवं तु यो भुङ्क्ते सोऽबुधः खग ।\nवृथा तेनान्नपाकेन यमयोनिं व्रजेत्तु सः ॥ ७ ॥`,iast:`akṛtvā vaiśvadevaṃ tu yo bhuṅkte so'budhaḥ khaga |\nvṛthā tenānnapākena yamayoniṃ vrajettu saḥ || 7 ||`,en:`The foolish man who eats without first performing Vaiśvadeva cooks his food in vain; he is said to go to the realm of Yama, O bird.`,wfw:`akṛtvā vaiśvadevam — without performing Vaiśvadeva; yaḥ bhuṅkte — who eats; saḥ abudhaḥ — that foolish man; vṛthā annapākena — by a fruitless cooking of food; yamayonim vrajet — goes to Yama's realm.`},
{n:8,sa:`प्रियो वा यदि वा द्वेष्यो मूर्खः पण्डित एव च ।\nवैश्वदेवे तु संप्राप्ते सोऽतिथिः स्वर्गसंक्रमः ॥ ८ ॥`,iast:`priyo vā yadi vā dveṣyo mūrkhaḥ paṃḍita eva ca |\nvaiśvadeve tu saṃprāpte so'tithiḥ svargasaṃkramaḥ || 8 ||`,en:`Whether dear or disliked, foolish or learned, one who arrives at the time of Vaiśvadeva is an atithi; honoring such a guest is a passage toward heaven.`,wfw:`priyaḥ vā dveṣyaḥ vā — whether dear or disliked; mūrkhaḥ paṇḍitaḥ vā — foolish or learned; vaiśvadeve saṃprāpte — arriving at Vaiśvadeva time; saḥ atithiḥ — he is a guest; svarga-saṃkramaḥ — a passage to heaven.`},
{n:9,sa:`नैकग्रामीणमतिथिं विप्रसाङ्गतिकं तथा ।\nअचिन्त्योऽभ्यागतो यस्मात्तस्मादतिथिरुच्यते ॥ ९ ॥`,iast:`naikagrāmīṇamatithiṃ viprasāṃgatikaṃ tathā |\naciṃtyobhyāgato yasmāttasmādatithirucyate || 9 ||`,en:`A resident of the same village, or one who habitually accompanies the Brahmin, is not regarded as an atithi. Because the true guest arrives unexpectedly, he is called atithi.`,wfw:`na eka-grāmīṇam atithim — not a same-village resident as a guest; vipra-sāṅgatikam — nor a regular associate; acintyaḥ abhyāgataḥ — one who arrives unexpectedly; tasmāt atithiḥ ucyate — therefore he is called atithi.`},
{n:10,sa:`अचिन्त्यः स तु वै नाम्ना वैश्वदेव उपागतः ।\nअतिथिं तं विजानीयान्न पुनः पूर्वमागतः ॥ १० ॥`,iast:`aciṃtyaḥ sa tu vai nāmnā vaiśvadeva upāgataḥ |\natithiṃ taṃ vijānīyānna punaḥ pūrvamāgataḥ || 10 ||`,en:`He who unexpectedly arrives at the Vaiśvadeva offering is properly known as an atithi; one who has already come before is not so regarded merely on that account.`,wfw:`acintyaḥ — unexpected; vaiśvadeve upāgataḥ — arrived at Vaiśvadeva; atithim tam vijānīyāt — know him as the guest; na punaḥ pūrvam āgataḥ — not merely one who had come before.`},
{n:11,sa:`यावच्च प्राप्नुयादन्नं कृताशीः स्नातको द्विजः ।\nतस्यान्नस्य चतुर्भागं हन्तकारं विदुः खग ॥ ११ ॥`,iast:`yāvacca prāpnuyādannaṃ kṛtāśīḥ snātako dvijaḥ |\ntasyānnasya caturbhāgaṃ haṃtakāraṃ viduḥ khaga || 11 ||`,en:`Whatever quantity of food a duly bathed twice-born man receives after offering his blessing, one quarter of that food is known as the hantakāra portion, O bird.`,wfw:`yāvat annam prāpnuyāt — whatever food he obtains; kṛtāśīḥ snātakaḥ dvijaḥ — the bathed twice-born who has given a blessing; tasya annasya caturbhāgam — one fourth of that food; hantakāram viduḥ — they call the hantakāra.`},
{n:12,sa:`ग्रासमात्रा भवेद्भिक्षा चतुष्कालं चतुर्गुणम् ।\nपुष्कलानि च चत्वारि हन्तकारो विधीयते ॥ १२ ॥`,iast:`grāsamātrā bhavedbhikṣā catuṣkālaṃ caturguṇam |\npuṣkalāni ca catvāri haṃtakāro vidhīyate || 12 ||`,en:`A bhikṣā is reckoned as a single mouthful; the next measure is fourfold, and four puṣkala measures are prescribed as a hantakāra.`,wfw:`grāsa-mātrā bhikṣā — a bhikṣā is one mouthful; caturguṇam — fourfold; catvāri puṣkalāni — four puṣkalas; hantakāraḥ vidhīyate — constitute the hantakāra measure.`},
{n:13,sa:`आरूढो नैष्ठिकं धर्मं यस्तु प्रच्यवते पुनः ।\nचान्द्रायणं चरेन्मासमिति विद्धि खगाधिप ॥ १३ ॥`,iast:`ārūḍho naiṣṭhikaṃ dharmaṃ yastu pracyavate punaḥ |\ncāṃdrāyaṇaṃ carenmāsamiti viddhi khagādhipa || 13 ||`,en:`One who has undertaken the naiṣṭhika discipline and then falls away from it should perform the Cāndrāyaṇa observance for one month; know this, O lord of birds.`,wfw:`ārūḍhaḥ naiṣṭhikam dharmam — having undertaken the lifelong discipline; pracyavate — falls away; cāndrāyaṇam caret — should perform Cāndrāyaṇa; māsam — for a month.`},
{n:14,sa:`आरूढपतितापत्या ब्राह्मणो वृषलेन च ।\nद्वावेतौ विद्धि चाण्डालौ वेदित्राद्यश्च जायते ॥ १४ ॥`,iast:`ārūḍhapatitāpatyā brāhmaṇo vṛṣalena ca |\ndvāvetau viddhi cāṃḍālau veditrādyaśca jāyate || 14 ||`,en:`The transmitted verse classifies two kinds of offspring as cāṇḍālas: the child of one who has fallen after undertaking a vowed state, and the offspring connected with a Brahmin and a vṛṣala. The final words of the verse are textually obscure in this recension.`,wfw:`ārūḍha-patita-apatyam — offspring of one fallen after undertaking a vowed state; brāhmaṇaḥ vṛṣalena ca — a Brahmin in connection with a vṛṣala; dvau etau cāṇḍālau — these two are called cāṇḍālas; final pāda — uncertain in the transmitted text.`},
{n:15,sa:`ब्राह्मणी कुलटा नित्यं स्वकं त्यक्त्वा पतिं खग ।\nअन्यस्य विशते गेहे ब्राह्मणस्य खगाधिप ॥ १५ ॥`,iast:`brāhmaṇī kulaṭā nityaṃ svakaṃ tyaktvā patiṃ khaga |\nanyasya viśate gehe brāhmaṇasya khagādhipa || 15 ||`,en:`A Brahmin woman who becomes adulterous, abandons her own husband, and enters the house of another Brahmin is described here, O lord of birds.`,wfw:`brāhmaṇī kulaṭā — an adulterous Brahmin woman; svakam patim tyaktvā — abandoning her own husband; anyasya brāhmaṇasya gehe viśate — enters another Brahmin's house.`},
{n:16,sa:`उत्पद्यते तु यस्तस्या ब्राह्मणेन महामते ।\nस चाण्डालो महान्प्रोक्तो महाचाण्डाल इत्युत ॥ १६ ॥`,iast:`utpadyate tu yastasyā brāhmaṇena mahāmate |\nsa cāṃḍālo mahānprokto mahācāṃḍāla ityuta || 16 ||`,en:`The son born from her by that Brahmin, O wise one, is declared in this text to be a great cāṇḍāla, called a mahācāṇḍāla.`,wfw:`yaḥ tasyāḥ utpadyate — the one born from her; brāhmaṇena — by a Brahmin; saḥ mahān cāṇḍālaḥ proktaḥ — he is called a great cāṇḍāla; mahācāṇḍālaḥ iti — termed mahācāṇḍāla.`},
{n:17,sa:`यस्तु प्रव्रजितो भूत्वा पुनः सेवति मैथुनम् ।\nषष्टिवर्षसहस्राणि विष्ठायां जायते कृमिः ।\nपञ्चगव्येन शुद्धिः स्यादित्याह मम देहकृत् ॥ १७ ॥`,iast:`yastu pravrajito bhūtvā punaḥ sevati maithunam |\nṣaṣṭivarṣasahasrāṇi viṣṭhāyāṃ jāyate krimiḥ |\npaṃcagavyena śuddhiḥ syādityāha mama dehakṛt || 17 ||`,en:`One who has renounced and then again engages in sexual intercourse is said to be born as a worm in excrement for sixty thousand years. Purification is prescribed through pañcagavya; so, the text says, taught my creator.`,wfw:`pravrajitaḥ bhūtvā — having become a renunciant; punaḥ maithunam sevati — again engages in intercourse; ṣaṣṭi-varṣa-sahasrāṇi — sixty thousand years; viṣṭhāyām krimiḥ — a worm in excrement; pañcagavyena śuddhiḥ — purification by pañcagavya.`},
{n:18,sa:`अभोज्यं ब्राह्मणस्यान्नं वृषलेन निमन्त्रितम् ।\nतथैव वृषलस्यान्नं ब्राह्मणेन निमन्त्रितम् ॥ १८ ॥`,iast:`abhojyaṃ brāhmaṇasyānnaṃ vṛṣalena nimaṃtritam |\ntathaiva vṛṣalasyānnaṃ brāhmaṇena nimaṃtritam || 18 ||`,en:`Food belonging to a Brahmin when the invitation comes from a vṛṣala is declared unfit to eat; likewise the food of a vṛṣala when the invitation is issued by a Brahmin.`,wfw:`abhojyam — not to be eaten; brāhmaṇasya annam — a Brahmin's food; vṛṣalena nimantritam — invited by a vṛṣala; tathā eva — likewise; vṛṣalasya annam — a vṛṣala's food; brāhmaṇena nimantritam — invited by a Brahmin.`},
{n:19,sa:`ब्राह्मणान्नं ददच्छूद्रः शूद्रान्नं ब्राह्मणो ददत् ।\nउभावेतावभोज्यान्नौ भुक्त्वा चान्द्रायणं चरेत् ॥ १९ ॥`,iast:`brāhmaṇānnaṃ dadacchūdraḥ śūdrānnaṃ brāhmaṇo dadat |\nubhāvetāvabhojyānnau bhuktvā cāṃdrāyaṇaṃ caret || 19 ||`,en:`A Śūdra serving a Brahmin's food and a Brahmin serving a Śūdra's food are both said to produce food unfit for eating; after eating it one should perform Cāndrāyaṇa.`,wfw:`śūdraḥ brāhmaṇānnam dadat — a Śūdra giving Brahmin food; brāhmaṇaḥ śūdrānnam dadat — a Brahmin giving Śūdra food; ubhau abhojyānnau — both are cases of food not to be eaten; bhuktvā cāndrāyaṇam caret — after eating, perform Cāndrāyaṇa.`},
{n:20,sa:`उपनिक्षेपधर्मेण शूद्रान्नं च पचेद्द्विजः ।\nअभोज्यं तद्भवेदन्नं स च विप्रः पुरोहितः ॥ २० ॥`,iast:`upanikṣepadharmeṇa śūdrānnaṃ ca paceddvijaḥ |\nabhojyaṃ tadbhavedannaṃ sa ca vipraḥ purohitaḥ || 20 ||`,en:`If a twice-born man cooks a Śūdra's food under an arrangement of deposit or commission, that food becomes unfit to eat; the verse then characterizes that Brahmin as acting as a hired priest.`,wfw:`upanikṣepa-dharmeṇa — under an arrangement or commission; śūdrānnam pacet dvijaḥ — a twice-born cooks a Śūdra's food; tat annam abhojyam bhavet — that food becomes unfit to eat; sa vipraḥ purohitaḥ — that Brahmin is [as] a purohita.`},
{n:21,sa:`शूद्रान्नं शूद्रसंपर्कं शूद्रेण सह वासनम् ।\nशूद्राज्ज्ञानागमः कश्चिज्ज्वलन्तमपि पातयेत् ॥ २१ ॥`,iast:`śūdrānnaṃ śūdrasaṃparkaṃ śūdreṇa saha vāsanam |\nśūdrājjñānāgamaḥ kaścijvalaṃtamapi pātayet || 21 ||`,en:`The text declares that Śūdra-food, close association with a Śūdra, dwelling together with a Śūdra, and certain instruction received from a Śūdra may cause even one who is spiritually radiant to fall.`,wfw:`śūdrānnam — Śūdra-food; śūdra-saṃparkam — contact with a Śūdra; śūdreṇa saha vāsanam — living with a Śūdra; śūdrāt jñānāgamaḥ — acquisition of knowledge from a Śūdra; jvalantam api pātayet — may cause even a blazing one to fall.`},
{n:22,sa:`शूद्रान्नोपहता विप्रा विह्वला रतिलालसाः ।\nकुपिताः किं करिष्यन्ति निर्विषा इव पन्नगाः ॥ २२ ॥`,iast:`śūdrānnopahatā viprā vihvalā ratilālasāḥ |\nkupitāḥ kiṃ kariṣyaṃti nirviṣā iva pannagāḥ || 22 ||`,en:`Brahmins impaired by Śūdra-food, bewildered and craving sensual pleasure—what can they accomplish even when angered? They are likened to snakes whose venom is gone.`,wfw:`śūdrānna-upahatāḥ viprāḥ — Brahmins impaired by Śūdra-food; vihvalāḥ rati-lālasāḥ — bewildered and eager for pleasure; kupitāḥ kim kariṣyanti — what can they do when angry; nirviṣāḥ pannagāḥ iva — like venomless snakes.`},
{n:23,sa:`हस्तदत्तास्तु ये स्नेहाल्लवणव्यञ्जनादयः ।\nदातारं नाधितिष्ठन्ति भोक्ता भुङ्क्ते तु किल्बिषम् ॥ २३ ॥`,iast:`hastadattāstu ye snehāllavaṇavyaṃjanādayaḥ |\ndātāraṃ nādhitiṣṭhaṃti bhoktā bhuṃkte tu kilbiṣam || 23 ||`,en:`Oil, salt, condiments and the like when handed directly do not, according to this rule, attach fault to the giver; the eater, however, consumes the fault.`,wfw:`hasta-dattāḥ — given directly by hand; sneha-lavaṇa-vyañjana-ādayaḥ — oils, salt, condiments and the like; dātāram na adhitiṣṭhanti — do not attach to the giver; bhoktā kilbiṣam bhuṅkte — the eater consumes the sin.`},
{n:24,sa:`आयसेन तु पात्रेण यदन्नमुपदीयते ।\nभोक्ता विष्ठाशनं भुङ्क्ते दाता तु नरकं व्रजेत् ॥ २४ ॥`,iast:`āyasena tu pātreṇa yadannamupadīyate |\nbhoktā viṣṭhāśanaṃ bhuṅkte dātā tu narakaṃ vrajet || 24 ||`,en:`Food served in an iron vessel is condemned here: the eater is figuratively said to eat excrement, while the giver goes to hell.`,wfw:`āyasena pātreṇa — in an iron vessel; yat annam upadīyate — food that is served; bhoktā viṣṭhāśanam bhuṅkte — the eater is said to eat excrement; dātā narakam vrajet — the giver goes to hell.`},
{n:25,sa:`अङ्गुल्या दन्तकाष्ठं यत्प्रत्यक्षलवणं च यत् ।\nमृत्तिकाभक्षणं चैव तुल्यं गोमांसभक्षणैः ॥ २५ ॥`,iast:`aṃgulyā daṃtakāṣṭhaṃ yatpratyakṣalavaṇaṃ ca yat |\nmṛttikābhakṣaṇaṃ caiva tulyaṃ gomāṃsabhakṣaṇaiḥ || 25 ||`,en:`Using the finger in place of a tooth-cleaning stick, taking salt directly, and eating clay are here declared comparable to eating beef.`,wfw:`aṅgulyā dantakāṣṭham — using a finger for tooth-cleaning; pratyakṣa-lavaṇam — salt taken directly; mṛttikā-bhakṣaṇam — eating clay; tulyaṃ gomāṃsa-bhakṣaṇaiḥ — equated with beef-eating.`},
{n:26,sa:`मुखे पर्युषिते नित्यं भवत्यप्रयतो द्विजः ।\nतस्माच्छुष्कमथार्द्रं वा भक्षयेद्दन्तधावनम् ॥ २६ ॥`,iast:`mukhe paryuṣite nityaṃ bhavatyaprayato dvijaḥ |\ntasmācchuṣkamathārdraṃ vā bhakṣayeddaṃtadhāvanam || 26 ||`,en:`A twice-born man is regarded as impure while his mouth remains stale from the night; therefore he should use a dry or moist tooth-cleaning stick.`,wfw:`mukhe paryuṣite — when the mouth is stale; aprayataḥ bhavati — he is impure; tasmāt — therefore; śuṣkam atha ārdram vā — dry or moist; danta-dhāvanam — a tooth-cleaning stick.`},
{n:27,sa:`पुष्पालङ्कारवस्त्राणि गन्धमाल्यानुलेपनम् ।\nउपवासे न दुष्यन्ति दन्तधावनमञ्जनम् ॥ २७ ॥`,iast:`puṣpālaṃkāravastrāṇi gaṃdha mālyānulepanam |\nupavāse na duṣyaṃti daṃtadhāvanamaṃjanam || 27 ||`,en:`Flowers, ornaments, garments, fragrance, garlands and unguents do not invalidate a fast; nor do tooth-cleaning and collyrium.`,wfw:`puṣpa-alaṅkāra-vastrāṇi — flowers, ornaments and garments; gandha-mālya-anulepanam — fragrance, garlands and ointment; upavāse na duṣyanti — do not spoil a fast; danta-dhāvanam añjanam — tooth-cleaning and collyrium.`},
{n:28,sa:`गृहान्ते वसते मूर्खो दूरे चास्य गुणान्वितः ।\nगुणान्विते च दातव्यं नास्ति मूर्खव्यतिक्रमः ॥ २८ ॥`,iast:`gṛhāṃte vasate mūrkho dūre cāsya guṇānvitaḥ |\nguṇanvite ca dātavyaṃ nāsti mūrkhavya tikramaḥ || 28 ||`,en:`If a fool lives nearby while a person endowed with qualities lives farther away, the gift should be made to the qualified man; passing over the fool is said not to constitute a fault.`,wfw:`gṛhānte vasate mūrkhaḥ — a fool lives close by; dūre guṇānvitaḥ — the qualified one is far away; guṇānvite dātavyam — one should give to the qualified; mūrkha-vyatikramaḥ nāsti — passing over the fool is no transgression.`},
{n:29,sa:`ब्राह्मणातिक्रमो नास्ति विप्रे वेदविवर्जिते ।\nज्वलन्तमग्निमुत्सृज्य न हि भस्मनि हूयते ॥ २९ ॥`,iast:`brāhmaṇātikramo nāsti vipre vedavivarjite |\njvalaṃtamagnimutsṛjya na hi bhasmani hūyate || 29 ||`,en:`There is no offence in passing over a Brahmin who is devoid of Vedic learning; one does not abandon a blazing fire in order to make an offering into ashes.`,wfw:`vipre veda-vivarjite — when a Brahmin lacks the Veda; brāhmaṇa-atikramaḥ nāsti — passing him over is no offence; jvalantam agnim utsṛjya — abandoning a blazing fire; na bhasmani hūyate — one does not offer into ashes.`},
{n:30,sa:`सन्निकृष्टमधीयानं ब्राह्मणं यो व्यतिक्रमेत् ।\nभोजनेनैव दानेन दहत्यासप्तमं कुलम् ॥ ३० ॥`,iast:`sannikṛṣṭamadhīyānaṃ brāhmaṇaṃ yo vyatikramet |\nbhojanenaiva dānena dahatyāsaptamaṃ kulam || 30 ||`,en:`But one who passes over a nearby Brahmin who is studying the Veda when giving food or a gift is said to burn his lineage down to the seventh generation.`,wfw:`sannikṛṣṭam adhīyānam brāhmaṇam — a nearby studying Brahmin; yaḥ vyatikramet — whoever passes him over; bhojanena dānena — in food or gift; ā-saptamam kulam dahati — burns the lineage to the seventh.`},
{n:31,sa:`अनूरुरुवाच ।\nएवमेव जगन्नाथ देवदेव जगत्पते ।\nकिं तु यत्ते पुरा देव श्रुतं वाक्यं महात्मनः ॥ ३१ ॥`,iast:`anūruruvāca |\nevameva jagannātha devadeva jagatpate |\nkiṃ tu yatte purā deva śrutaṃ vākyaṃ mahātmanaḥ || 31 ||`,en:`Anūru said: “So indeed it is, O Lord of the world, God of gods, ruler of the universe. Yet, O god, there is an earlier statement of a great soul which you once heard.”`,wfw:`anūruḥ uvāca — Anūru said; evam eva — just so; jagannātha devadeva — Lord of the world, God of gods; yat te purā śrutam vākyam — the statement previously heard by you; mahātmanaḥ — of a great soul.`},
{n:32,sa:`गदतो नारदस्यैव शृणु त्वं विबुधाधिप ।\nगदतो मे सुरश्रेष्ठ धर्म्यमर्थं सुखावहम् ॥ ३२ ॥`,iast:`gadato nāradasyaiva śṛṇu tvaṃ vibudhādhipa |\ngadato me suraśreṣṭha dharmyamarthaṃ sukhāvaham || 32 ||`,en:`“It was spoken by Nārada. Hear from me, O lord of the gods, that righteous teaching which brings welfare and happiness, O best of the gods.”`,wfw:`nāradasya gadato — spoken by Nārada; śṛṇu tvam — hear it; vibudhādhipa — lord of the gods; dharmyam artham — a righteous teaching; sukhāvaham — bringing happiness.`},
{n:33,sa:`सत्यनिष्ठं द्विजं यस्तु शुक्लजातिं प्रियंवदम् ।\nमूर्खं पाखण्डिनं वापि वृत्तिहीनमथापि वा ॥ ३३ ॥`,iast:`satyaniṣṭhaṃ dvijaṃ yastu śuklajātiṃ priyaṃvadam |\nmūrkhaṃ pākhaṃḍinaṃ vāpi vṛttihīnamathāpi vā || 33 ||`,en:`“A twice-born man may be devoted to truth, of pure lineage and pleasant speech—or he may even be foolish, heterodox, or without a proper livelihood; the rule about passing him over is then stated in the following verse.”`,wfw:`satyaniṣṭham dvijam — a truth-abiding twice-born; śukla-jātim — of pure lineage; priyaṃvadam — pleasant-speaking; mūrkham — foolish; pākhaṇḍinam — heterodox; vṛtti-hīnam — without livelihood.`},
{n:34,sa:`अतिक्रम्य नरो घोरं नरकं पातयेत्खग ।\nसप्त परान्सप्त पूर्वान्पुरुषानात्मना सह ॥ ३४ ॥`,iast:`atikramya naro ghoraṃ narakaṃ pātayetkhaga |\nsapta parānsapta pūrvānpuruṣānātmanā saha || 34 ||`,en:`“By passing such a man over, a person is said to cast himself and seven descendants and seven ancestors into a terrible hell, O bird.”`,wfw:`atikramya — having passed over; ghoraṃ narakam pātayet — causes a fall into terrible hell; sapta parān — seven later generations; sapta pūrvān — seven earlier generations; ātmanā saha — together with himself.`},
{n:35,sa:`तस्मान्नातिक्रमेद्राजा ब्राह्मणं प्रातिवेशिकम् ।\nसंबन्धतस्तथासन्नं दौहित्रं विद्यते तथा ॥ ३५ ॥`,iast:`tasmānnātikramedrājā brāhmaṇaṃ prātiveśikam |\nsaṃbandhatastathāsannaṃ dauhitraṃ vidyate tathā || 35 ||`,en:`“Therefore one should not pass over a neighboring Brahmin; likewise one who is near through kinship, including a daughter's son.”`,wfw:`tasmāt na atikramet — therefore one should not pass over; brāhmaṇam prātiveśikam — a neighboring Brahmin; sambandhataḥ āsannam — one close by relation; dauhitram — a daughter's son.`},
{n:36,sa:`भागिनेयं विशेषेण तथा बन्धुं ग्रहाधिप ।\nनातिक्रमेन्नरस्त्वेतान्सुमूर्खानपि गोपते ।\nअतिक्रम्य महद्रौद्रं रौरवं नरकं व्रजेत् ॥ ३६ ॥`,iast:`bhāgineyaṃ viśeṣeṇa tathā baṃdhuṃ grahādhipa |\nnātikramennarastvetānsumūrkhānapi gopate |\natikramya mahadraudraṃ rauravaṃ narakaṃ vrajet || 36 ||`,en:`“Especially a sister's son and other close relatives should not be passed over, O lord of the heavenly bodies, even if they are very foolish. Passing them over, one is said to go to the terrible Raurava hell.”`,wfw:`bhāgineyam — a sister's son; bandhum — a relative; na atikramet — one should not pass over; su-mūrkhān api — even if very foolish; rauravam narakam vrajet — goes to Raurava hell.`},
{n:37,sa:`आदित्य उवाच ।\nएवमेतन्न सन्देहो यथा वदसि खेचर ।\nममाप्यवगतं वीर ब्राह्मणं न परीक्षयेत् ॥ ३७ ॥`,iast:`āditya uvāca |\nevametanna saṃdeho yathā vadasi khecara |\nmamāpyavagataṃ vīra brāhmaṇaṃ na parīkṣayet || 37 ||`,en:`Āditya said: “It is indeed as you say, O sky-goer; there is no doubt. I too understand, O hero, that one should not subject a Brahmin to an examination of his qualifications.”`,wfw:`ādityaḥ uvāca — Āditya said; evam etat na saṃdehaḥ — so it is, without doubt; mamāpi avagatam — I too understand; brāhmaṇam na parīkṣayet — one should not test a Brahmin.`},
{n:38,sa:`सर्वदेवमयं विप्रं सर्वलोकमयं तथा ।\nतस्मात्संपूजयेदेनं न गुणांस्तस्य चिन्तयेत् ॥ ३८ ॥`,iast:`sarvadevamayaṃ vipraṃ sarvalokamayaṃ tathā |\ntasmātsaṃpūjayedenaṃ na guṇāṃstasya ciṃtayet || 38 ||`,en:`“The Brahmin is here described as embodying all the gods and all the worlds. Therefore one should honor him and should not make his personal qualities the basis of that honor.”`,wfw:`sarva-deva-mayam vipram — the Brahmin as embodying all gods; sarva-loka-mayam — embodying all worlds; tasmāt sampūjayet enam — therefore one should honor him; na guṇān tasya cintayet — one should not scrutinize his qualities.`},
{n:39,sa:`केवलं चिन्तयेज्जातिं न गुणान्विनतात्मज ।\nतस्मादामन्त्रयेत्पूर्वमासन्नं ब्राह्मणं बुधः ॥ ३९ ॥`,iast:`kevalaṃ ciṃtayejjātiṃ na guṇānvinatātmaja |\ntasmādāmaṃtrayetpūrvamāsannaṃ brāhmaṇaṃ budhaḥ || 39 ||`,en:`“One should consider the jāti alone, not the personal qualities, O son of Vinatā. Therefore a wise man should first invite the Brahmin who is nearby.”`,wfw:`kevalam cintayet jātim — one should consider the jāti alone; na guṇān — not the qualities; vinatātmaja — O son of Vinatā; tasmāt — therefore; āsannam brāhmaṇam pūrvam āmantrayet — first invite the nearby Brahmin.`},
{n:40,sa:`यस्त्वासन्नमतिक्रम्य ब्राह्मणं पतितादृते ।\nदूरस्थान्पूजयेन्मूढो गुणाढ्यान्नरकं व्रजेत् ॥ ४० ॥`,iast:`yastvāsannamatikramya brāhmaṇaṃ patitādṛte |\ndūrasthānpūjayenmūḍho guṇāḍhyānnarakaṃ vrajet || 40 ||`,en:`“Except in the case of one who is fallen, a fool who passes over a nearby Brahmin and instead honors distant Brahmins because they are rich in qualities is said to go to hell.”`,wfw:`āsannam brāhmaṇam atikramya — passing over a nearby Brahmin; patitāt ṛte — except one who is fallen; dūrasthān guṇāḍhyān pūjayet — honors distant men rich in qualities; narakam vrajet — goes to hell.`},
{n:41,sa:`देवकर्मविनाशेन ब्रह्मस्वहरणेन च ।\nदेवद्रव्यं द्विजान्नं च ब्रह्मस्वं ब्राह्मणार्जितम् ।\nवियोन्यां क्षिपते यस्तु वियोनिमधिगच्छति ॥ ४१ ॥`,iast:`devakarmavināśena brahmasvaharaṇena ca |\ndevadravyaṃ dvijānnaṃ ca brahmasvaṃ brāhmaṇārjitam |\nviyonyāṃ kṣipate yastu viyonimadhigacchati || 41 ||`,en:`One who ruins divine rites, seizes property dedicated to Brahmins, or diverts divine property, a twice-born man's food, or property earned by a Brahmin to an improper destination is said to obtain an improper birth.`,wfw:`deva-karma-vināśena — by destroying divine rites; brahmasva-haraṇena — by taking Brahminical property; deva-dravyam — property of a deity; dvijānnam — food of a twice-born; viyonyām kṣipate — casts into an improper destination; viyonim adhigacchati — obtains an improper birth.`},
{n:42,sa:`मा ददस्वेति यो ब्रूयाद्गवाग्निब्राह्मणेषु वै ।\nतिर्यग्योनिशतं गत्वा चाण्डालेष्वभिजायते ॥ ४२ ॥`,iast:`mā dadasveti yo brūyādgavāgnibrāhmaṇeṣu vai |\ntiryagyoniśataṃ gatvā cāṃḍāleṣvabhijāyate || 42 ||`,en:`One who says “Do not give” when the intended recipients are cows, sacred fire, or Brahmins is said to pass through a hundred animal births and thereafter to be born among cāṇḍālas.`,wfw:`mā dadasva iti — “do not give”; gavā-agni-brāhmaṇeṣu — concerning cows, fire and Brahmins; tiryak-yoni-śatam gatvā — after a hundred animal births; cāṇḍāleṣu abhijāyate — is born among cāṇḍālas.`},
{n:43,sa:`यत्तु वाचा प्रतिज्ञातं कर्मणा नोपपादितम् ।\nतदृणं धर्मसंयुक्तमिह लोके परत्र च ॥ ४३ ॥`,iast:`yattu vācā pratijñātaṃ karmaṇā nopapāditam |\ntadṛṇaṃ dharmasaṃyuktamiha loke paratra ca || 43 ||`,en:`Whatever has been promised in speech but not fulfilled in deed remains a debt bound up with dharma, both in this world and in the next.`,wfw:`vācā pratijñātam — promised by speech; karmaṇā na upapāditam — not fulfilled by action; tat ṛṇam — that is a debt; iha loke paratra ca — here and hereafter.`},
{n:44,sa:`वेदविद्याव्रतस्नाते श्रोत्रिये गृहमागते ।\nक्रीडन्त्योषधयः सर्वा यास्यामः परमां गतिम् ॥ ४४ ॥`,iast:`vedavidyāvratasnāte śrotriye gṛhamāgate |\nkrīḍaṃtyoṣadhayaḥ sarvā yāsyāmaḥ paramāṃ gatim || 44 ||`,en:`When a śrotriya, accomplished in Vedic learning and his vow, enters the house, all the herbs are poetically said to rejoice: “We shall attain the highest destination.”`,wfw:`veda-vidyā-vrata-snāte śrotriye — a śrotriya completed in Vedic learning and vow; gṛham āgate — having come to the house; oṣadhayaḥ sarvāḥ krīḍanti — all herbs rejoice; paramām gatim yāsyāmaḥ — “we shall attain the highest state.”`},
{n:45,sa:`मधु मांसं सुरां सोमं लाक्षाद्यं लवणं तथा ।\nविक्रीयान्यतमं तेषां द्विजश्चान्द्रायणं चरेत् ॥ ४५ ॥`,iast:`madhu māṃsaṃ surāṃ somaṃ lākṣādyaṃ lavaṇaṃ tathā |\nvikrīyānyatamaṃ teṣāṃ dvijaścāṃdrāyaṇaṃ caret || 45 ||`,en:`If a twice-born man sells any one among honey, meat, liquor, Soma, lac and related substances, or salt, he should perform the Cāndrāyaṇa penance.`,wfw:`madhu — honey; māṃsam — meat; surām — liquor; somam — Soma; lākṣādyam — lac and related goods; lavaṇam — salt; vikrīya — having sold; cāndrāyaṇam caret — should perform Cāndrāyaṇa.`},
{n:46,sa:`गुडं तिलं तथा नीलं केशान्गोधूमकान्यवान् ।\nविक्रीय ब्राह्मणो गां च कृच्छ्रं सान्तपनं चरेत् ॥ ४६ ॥`,iast:`guḍaṃ tilaṃ tathā nīlaṃ keśāngodhūmakānyavān |\nvikrīya brāhmaṇo gāṃ ca kṛcchraṃ sāṃtapanaṃ caret || 46 ||`,en:`A Brahmin who sells jaggery, sesame, indigo, hair, wheat, barley, or a cow should perform the Sāntapana Kṛcchra.`,wfw:`guḍam — jaggery; tilam — sesame; nīlam — indigo; keśān — hair; godhūmakān — wheat; yavān — barley; gām ca — and a cow; vikrīya — having sold; sāntapanam kṛcchram caret — should perform the Sāntapana Kṛcchra.`},
{n:47,sa:`औष्ट्रमाविकदुग्धं च अन्नं मृतकसूतके ।\nचौरस्यान्नं मृतश्राद्धे भुक्त्वा चान्द्रायणं चरेत् ॥ ४७ ॥`,iast:`auṣṭramāvikadugdhaṃ ca annaṃ mṛtakasūtake |\ncaurasyānnaṃ mṛtaśrāddhe bhuktvā cāṃdrāyaṇaṃ caret || 47 ||`,en:`After consuming camel's milk, sheep's milk, food prepared during death-impurity, a thief's food, or food at a funeral śrāddha, the text prescribes Cāndrāyaṇa.`,wfw:`auṣṭram dugdham — camel's milk; āvikam dugdham — sheep's milk; mṛtaka-sūtake annam — food during death impurity; caurasya annam — a thief's food; mṛta-śrāddhe — at a funeral śrāddha; bhuktvā cāndrāyaṇam caret — after eating, perform Cāndrāyaṇa.`},
{n:48,sa:`गवां शृङ्गोदके स्नातो महानद्याश्च सङ्गमे ।\nसमुद्रदर्शनाद्वापि शुना दष्टः शुचिर्भवेत् ॥ ४८ ॥`,iast:`gavāṃ śṛṃgodake snāto mahānadyāśca saṃgame |\nsamudradarśanādvāpi śunā daṣṭaḥ śucirbhavet || 48 ||`,en:`A person bitten by a dog is said to become pure by bathing with water from a cow's horn, by bathing at the confluence of a great river, or even by beholding the ocean.`,wfw:`śunā daṣṭaḥ — bitten by a dog; gavām śṛṅga-udake snātaḥ — bathed with water from a cow's horn; mahā-nadyāḥ saṅgame — at a great river confluence; samudra-darśanāt — by seeing the ocean; śuciḥ bhavet — becomes pure.`},
{n:49,sa:`वेदविद्याव्रतस्नातः शुना दष्टो द्विजः खग ।\nहिरण्योदकमिश्रं तु घृतं प्राश्य विशुद्ध्यति ॥ ४९ ॥`,iast:`vedavidyāvratasnātaḥ śunā daṣṭo dvijaḥ khaga |\nhiraṇyodakamiśraṃ tu ghṛtaṃ prāśya viśuddhyati || 49 ||`,en:`A twice-born man accomplished in Vedic learning and vows, if bitten by a dog, is purified by drinking ghee mixed with water sanctified by gold, O bird.`,wfw:`veda-vidyā-vrata-snātaḥ dvijaḥ — a twice-born completed in Vedic learning and vow; śunā daṣṭaḥ — bitten by a dog; hiraṇya-udaka-miśram ghṛtam — ghee mixed with gold-water; prāśya viśuddhyati — drinking it, he is purified.`},
{n:50,sa:`तिष्ठन्वाप्यथ वा गच्छञ्छुना दष्टो द्विजः खग ।\nवज्रं प्राश्य शुचिः स्याद्वै यथाह भगवान्मनुः ॥ ५० ॥`,iast:`tiṣṭhanvāpyatha vā gacchañchunā daṣṭo dvijaḥ khaga |\nvajraṃ prāśya śuciḥ syādvai yathāha bhagavānmanuḥ || 50 ||`,en:`Whether standing or walking, a twice-born man bitten by a dog is said to become pure after consuming the substance called vajra, as the text attributes the rule to Manu.`,wfw:`tiṣṭhan vā gacchan vā — whether standing or walking; śunā daṣṭaḥ dvijaḥ — a twice-born bitten by a dog; vajram prāśya — having consumed “vajra”; śuciḥ syāt — becomes pure; yathā āha manuḥ — as Manu is said to have taught.`},
{n:51,sa:`व्रतिनश्चापि दष्टस्य त्रिरात्रं क्षपणं स्मृतम् ।\nसघृतं च ततो भुक्त्वा व्रतशेषं समाचरेत् ॥ ५१ ॥`,iast:`vratinaścāpi daṣṭasya trirātraṃ kṣapaṇaṃ smṛtam |\nsaghṛtaṃ ca tato bhuktvā vrataśeṣaṃ samācaret || 51 ||`,en:`For a person under a vow who has been bitten, a three-night fast is prescribed. Thereafter, having eaten with ghee, he should complete the remainder of his vow.`,wfw:`vratinaḥ daṣṭasya — for a vowed person who has been bitten; tri-rātram kṣapaṇam — fasting for three nights; tataḥ sa-ghṛtam bhuktvā — then eating with ghee; vrata-śeṣam samācaret — should complete the rest of the vow.`},
{n:52,sa:`ब्राह्मणी तु शुना दष्टा सोमे दृष्टं समाचरेत् ।\nयदा न दृश्यते सोमः प्रायश्चित्तं कथं भवेत् ॥ ५२ ॥`,iast:`brāhmaṇī tu śunā daṣṭā some dṛṣṭaṃ samācaret |\nyadā na dṛśyate somaḥ prāyaścittaṃ kathaṃ bhavet || 52 ||`,en:`A Brahmin woman bitten by a dog should perform the rite prescribed upon seeing Soma. The text then asks: when the Moon is not visible, how is the expiation to be performed?`,wfw:`brāhmaṇī śunā daṣṭā — a Brahmin woman bitten by a dog; some dṛṣṭam samācaret — should do the rite associated with seeing Soma; yadā somaḥ na dṛśyate — when the Moon is not seen; prāyaścittam katham — how is the expiation done?`},
{n:53,sa:`यां दिशं व्रजते सोमस्तां दिशं चावलोकयेत् ।\nसोममार्गेण सा पूर्वा पञ्चपूतेन शुध्यति ॥ ५३ ॥`,iast:`yāṃ diśaṃ vrajate somastāṃ diśaṃ cāvalokayet |\nsomamārgeṇa sā pūrvā pañcapūtena śudhyati || 53 ||`,en:`She should look toward the direction in which Soma travels. By orienting herself to Soma's path and by the prescribed fivefold purification, she is purified.`,wfw:`yām diśam vrajate somaḥ — the direction in which Soma goes; tām diśam avalokayet — she should look toward that direction; soma-mārgeṇa — by Soma's path; pañca-pūtena — by the fivefold purifier; śudhyati — she is purified.`},
{n:54,sa:`ब्राह्मणस्य ब्रह्मद्वारे पूयशोणितसंभवे ।\nक्रिमिभिर्दश्यते यश्च निष्कृतिं तस्य वच्मि ते ॥ ५४ ॥`,iast:`brāhmaṇasya brahmadvāre pūya śoṇitasaṃbhave |\nkrimibhirdaśyate yaśca niṣkṛtiṃ tasya vacmi te || 54 ||`,en:`If a Brahmin develops pus and blood at the brahma-dvāra and is afflicted by worms, I shall tell you the expiation for him.`,wfw:`brāhmaṇasya brahma-dvāre — at the Brahmin's brahma-dvāra; pūya-śoṇita-saṃbhave — when pus and blood arise; krimibhiḥ daśyate — when afflicted or bitten by worms; niṣkṛtim vacmi — I state the expiation.`},
{n:55,sa:`गवां तत्र पुरीषेण त्रिकालं स्नानमाचरेत् ।\nदधि क्षीरं घृतं पीत्वा कृमिदष्टो विशुध्यति ॥ ५५ ॥`,iast:`gavāṃ tatra purīṣeṇa trikālaṃ snānamācaret |\ndadhi kṣīraṃ ghṛtaṃ pītvā kṛmidaṣṭo viśudhyati || 55 ||`,en:`The text prescribes bathing the affected place three times with cow-dung preparation; after drinking curd, milk, and ghee, the person afflicted by worms is said to become purified.`,wfw:`gavām purīṣeṇa — with cow dung; trikālam snānam ācaret — should bathe three times; dadhi kṣīram ghṛtam pītvā — drinking curd, milk, and ghee; krimi-daṣṭaḥ viśudhyati — one afflicted by worms is purified.`},
{n:56,sa:`अथ नाभ्याः प्रदष्टस्य आपादाद्विनतात्मज ।\nएतद्विनिर्दिशेत्प्राज्ञः प्रायश्चित्तं खगाधिप ॥ ५६ ॥`,iast:`atha nābhyāḥ pradaṣṭasya āpādādvinatātmaja |\netadvinirdiśetprājñaḥ prāyaścittaṃ khagādhipa || 56 ||`,en:`For one afflicted from the navel downward to the feet, O son of Vinatā, the wise prescribe the following expiation, O lord of birds.`,wfw:`nābhyāḥ ā-pādāt — from the navel down to the feet; pradaṣṭasya — of one afflicted or bitten; prājñaḥ — the wise man; etat prāyaścittam vinirdiśet — should prescribe this expiation.`},
{n:57,sa:`नाभिकण्ठान्तरे वीर यदा चोत्पद्यते कृमिः ।\nषड्रात्रं तु तदा प्रोक्तं प्रायश्चित्तं मनीषिभिः ॥ ५७ ॥`,iast:`nābhikaṇṭhāṃtare vīra yadā cotpadyate kṛmiḥ |\nṣaḍrātraṃ tu tadā proktaṃ prāyaścittaṃ manīṣibhiḥ || 57 ||`,en:`When worms arise in the region between the navel and throat, O hero, the learned prescribe an expiation lasting six nights.`,wfw:`nābhi-kaṇṭha-antare — between navel and throat; yadā utpadyate kṛmiḥ — when a worm infestation arises; ṣaḍ-rātram — six nights; prāyaścittam proktam — the expiation is prescribed.`},
{n:58,sa:`यदा दशन्ति शिरसि कृमयो विनतात्मज ।\nकृच्छ्रं तदा चरेत्प्राज्ञः शुद्धये कश्यपात्मज ॥ ५८ ॥`,iast:`yadā daśaṃti śirasi kṛmayo vinatātmaja |\nkṛcchraṃ tadā caretprājñaḥ śuddhaye kaśyapātmaja || 58 ||`,en:`When worms afflict the head, O son of Vinatā, the wise man should perform a Kṛcchra penance for purification, O son of Kaśyapa.`,wfw:`yadā krimayaḥ śirasi daśanti — when worms afflict the head; kṛcchram caret — should perform a Kṛcchra; śuddhaye — for purification.`},
{n:59,sa:`मृतान्नं मधु मांसं च यस्तु भुञ्जीत ब्राह्मणः ।\nस त्रीण्यहान्युपवसेदेकाहं चोदके वसेत् ॥ ५९ ॥`,iast:`mṛtānnaṃ madhu māṃsaṃ ca yastu bhuñjīta brāhmaṇaḥ |\nsa trīṇyahānyupavasedekāhaṃ codake vaset || 59 ||`,en:`A Brahmin who eats food connected with a death, honey, or meat should fast for three days and spend one day in water.`,wfw:`mṛtānnam — food connected with a death; madhu — honey; māṃsam — meat; yaḥ bhuñjīta brāhmaṇaḥ — a Brahmin who eats; trīṇi ahāni upavaset — should fast three days; ekāham udake vaset — should remain one day in water.`}
];
