<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 188: Sanskrit, close English translation, word-for-word glosses, and transliteration."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 188 — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/advaita/assets/css/site.css?v=20260915-2"><link rel="stylesheet" href="/advaita/assets/css/bhavishya-reader.css?v=20260915"></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 188</h1><p class="article-date">15 September 2026</p><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-187/">← Chapter 187</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-189/">Chapter 189 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20260915-3"></script><script>
const T={
1:{iast:`saptāśva uvāca |\nsūryāya sarvapākānnaṃ nivedyāgnau ca homayet |\nhutvāgnau prakṣipedvīra baliṃ dikṣu samaṃtataḥ || 1 ||`,en:`Saptāśva said: Having offered all cooked food to the Sun, one should make an oblation in the fire; after offering in the fire, O hero, one should cast the bali offering in all directions.`,wfw:`saptāśvaḥ uvāca — Saptāśva said; sūryāya — to the Sun; sarva-pāka-annam — all cooked food; nivedya — having presented/offered; agnau — in the fire; ca — and; homayet — one should offer as an oblation; hutvā — having offered; agnau — in the fire; prakṣipet — one should cast/place; vīra — O hero; balim — the bali offering; dikṣu — in the directions; samantataḥ — on every side.`},
2:{iast:`sūryāgniguruviprāṇāṃ sarvapākānnamanvaham |\nyo'nivedyātmanā bhuṃkte sa bhuṃkte kilbiṣaṃ naraḥ || 2 ||`,en:`The man who, day after day, eats cooked food himself without first offering it to the Sun, fire, guru, and Brahmins eats sin.`,wfw:`sūrya-agni-guru-viprāṇām — to/for the Sun, fire, guru, and Brahmins; sarva-pāka-annam — all cooked food; anvaham — day after day; yaḥ — who; anivedya — without first offering; ātmanā bhuṅkte — eats himself; saḥ naraḥ — that man; bhuṅkte — eats; kilbiṣam — sin/fault.`},
3:{iast:`kṛṣipālye ca vāṇijye krodhasatyakṣayādibhiḥ |\npuṃsāṃ pāpāni vardhaṃte sūnādoṣaiśca paṃcabhiḥ || 3 ||`,en:`In agriculture, animal husbandry, and trade, the sins of men increase through the faults beginning with the transmitted expression krodhasatyakṣaya and through the five faults of the household “slaughter-places.”`,wfw:`kṛṣi-pālye — in agriculture and tending/keeping livestock; ca — and; vāṇijye — in trade; krodha-satya-kṣaya-ādibhiḥ — by faults beginning with the transmitted compound krodhasatyakṣaya; puṃsām — of men; pāpāni — sins; vardhante — increase; sūnā-doṣaiḥ — by the faults of the slaughter-places; ca — and; pañcabhiḥ — five.`,note:`The compound krodhasatyakṣayādibhiḥ is textually difficult as transmitted. It is left visible rather than silently emended.`},
4:{iast:`kaṃḍanī peṣaṇī cullī udakuṃbhaḥ pramārjanī |\npaṃca sūnā gṛhasthasya tena svargaṃ na gacchati || 4 ||`,en:`The pounding implement, grinding stone, hearth, water-pot, and broom are the five slaughter-places of a householder; because of them he does not go to heaven.`,wfw:`kaṇḍanī — the pounding implement/mortar; peṣaṇī — the grinding stone; cullī — the hearth; udakumbhaḥ — the water-pot; pramārjanī — the broom; pañca sūnāḥ — the five slaughter-places; gṛhasthasya — of the householder; tena — because of that/by them; svargam — to heaven; na gacchati — he does not go.`},
5:{iast:`sūryāgnigurupūjābhiḥ pāpairetairna lipyate |\nanyaiśca pātakaighoraistasmātsaṃpūjayetsadā || 5 ||`,en:`Through worship of the Sun, fire, and guru, one is not stained by these sins or by other terrible offences; therefore one should always worship them fully.`,wfw:`sūrya-agni-guru-pūjābhiḥ — by acts of worship of the Sun, fire, and guru; pāpaiḥ etaiḥ — by these sins; na lipyate — one is not stained; anyaiḥ ca — and by other; pātakaiḥ ghoraiḥ — terrible offences; tasmāt — therefore; sampūjayet — one should worship fully; sadā — always.`},
6:{iast:`sūryāgnigurunaivedyaṃ yāvatsyādannasaṃkhyayā |\ntāvadvarṣasahasrāṇi dātā sūryapure vaset || 6 ||`,en:`For as many units of food as constitute the offering to the Sun, fire, and guru, for that many thousands of years the giver is said to dwell in the city of the Sun.`,wfw:`sūrya-agni-guru-naivedyam — the food-offering to the Sun, fire, and guru; yāvat — as much/as many as; syāt — there may be; anna-saṃkhyayā — according to the number/measure of food; tāvat — so many; varṣa-sahasrāṇi — thousands of years; dātā — the giver; sūrya-pure — in the city of the Sun; vaset — may dwell.`},
7:{iast:`ghṛtapūpayutaiḥ siktaiḥ puṇyaṃ daśaguṇottaram |\navadaṃśaguṇairyuktaṃ puṇyaṃ śataguṇaṃ khaga || 7 ||`,en:`When accompanied by ghee-cakes and moist preparations, the merit is tenfold greater; when furnished with the qualities of side-dishes or accompaniments, the merit is a hundredfold, O bird.`,wfw:`ghṛta-pūpa-yutaiḥ — accompanied by ghee-cakes; siktaiḥ — moistened/prepared with liquid; puṇyam — merit; daśa-guṇa-uttaram — greater by tenfold; avadaṃśa-guṇaiḥ — by the qualities/accompaniments of avadaṃśa (side-dishes); yuktam — furnished; puṇyam — merit; śata-guṇam — hundredfold; khaga — O bird.`},
8:{iast:`ṣaṣṭikaudananaivedyaṃ sahasraguṇitaṃ phalam |\nsugaṃdhaśālinaivedyaṃ vijñeyamayutottaram || 8 ||`,en:`An offering of cooked ṣaṣṭika rice has a thousandfold fruit; an offering of fragrant śāli rice is to be known as exceeding that by ten-thousandfold measure.`,wfw:`ṣaṣṭika-odana-naivedyam — an offering of cooked ṣaṣṭika rice; sahasra-guṇitam — multiplied a thousandfold; phalam — fruit; sugandha-śāli-naivedyam — an offering of fragrant śāli rice; vijñeyam — is to be known; ayuta-uttaram — exceeding by ten thousand / of ten-thousandfold excellence.`},
9:{iast:`bhakṣyānnapānadānāni tatphalāni tathātathā |\nyadvā tadvā sadā deyaṃ sūryāgnigurusādhuṣu |\nbhakṣyaṃ nivedya pūrvoktamakṣayaṃ labhate phalam || 9 ||`,en:`Gifts of eatables, food, and drink yield their respective fruits. Whatever it may be should always be given to the Sun, fire, guru, and holy persons; by first offering the food as stated above, one obtains an imperishable fruit.`,wfw:`bhakṣya-anna-pāna-dānāni — gifts of eatables, food, and drink; tat-phalāni — having their corresponding fruits; tathā tathā — respectively/in each case; yat vā tat vā — whatever it may be; sadā — always; deyam — should be given; sūrya-agni-guru-sādhuṣu — to the Sun, fire, guru, and holy persons; bhakṣyam — food/eatables; nivedya — having offered; pūrva-uktam — as stated before; akṣayam — imperishable; labhate — one obtains; phalam — fruit.`},
10:{iast:`evaṃ yaḥ kurute bhaktiṃ deva deve divākare |\nsa pitṝnsarvapāpebhyaḥ samuddhṛtya divaṃ nayet || 10 ||`,en:`Whoever thus practises devotion toward Divākara, the god of gods, raises his ancestors out of all sins and leads them to heaven.`,wfw:`evam — thus; yaḥ — whoever; kurute — performs/practises; bhaktim — devotion; deva-deve — toward the god of gods; divākare — toward Divākara, the Sun; saḥ — he; pitṝn — the ancestors; sarva-pāpebhyaḥ — from all sins; samuddhṛtya — having raised completely out; divam — to heaven; nayet — may lead.`},
11:{iast:`gaṃgāsnānamidaṃ puṇyaṃ darśanātprāpnuyādraveḥ |\nsarvatīrthābhiṣekaṃ ca praṇāmādviṃdate khaga || 11 ||`,en:`By seeing Ravi one obtains the merit of bathing in the Gaṅgā; by bowing, O bird, one obtains the merit of ablution at all sacred tīrthas.`,wfw:`gaṅgā-snānam — bathing in the Gaṅgā; idam puṇyam — this merit; darśanāt — from seeing; raveḥ — Ravi/the Sun; prāpnuyāt — one may obtain; sarva-tīrtha-abhiṣekam — ablution at all sacred fords; ca — and; praṇāmāt — from bowing; vindate — one obtains; khaga — O bird.`},
12:{iast:`mucyate sarvapāpebhyaḥ praṇamya śirasā ravim |\nśuśrūṣeta ca saṃdhyāyāṃ sūryaloke mahīyate || 12 ||`,en:`Having bowed with the head to Ravi, one is released from all sins; one should attend upon him at twilight, and is honoured in the world of the Sun.`,wfw:`mucyate — one is released; sarva-pāpebhyaḥ — from all sins; praṇamya — having bowed; śirasā — with the head; ravim — to Ravi; śuśrūṣeta — one should attend upon/serve; ca — and; sandhyāyām — at twilight; sūrya-loke — in the world of the Sun; mahīyate — one is honoured/exalted.`},
13:{iast:`yugapatpūjitāstena brahmaviṣṇu maheśvarāḥ |\npitaraḥ sarvadevāśca bhaveyuḥ pūjitā ravau || 13 ||`,en:`By him Brahmā, Viṣṇu, Maheśvara, the ancestors, and all the gods are worshipped simultaneously when Ravi is worshipped.`,wfw:`yugapat — simultaneously; pūjitāḥ — worshipped; tena — by him; brahma-viṣṇu-maheśvarāḥ — Brahmā, Viṣṇu, and Maheśvara; pitaraḥ — the ancestors; sarva-devāḥ ca — and all the gods; bhaveyuḥ pūjitāḥ — would become worshipped; ravau — in/when Ravi is worshipped.`},
14:{iast:`tuṣyaṃti pitarastasya sukṛṣṭeneva karṣukāḥ |\nyaḥ śrāddhe bhojayedbhaktyā brāhmaṇaṃ japajīvinam || 14 ||`,en:`The ancestors of the man who at a śrāddha devoutly feeds a Brahmin who lives by japa are satisfied, like farmers by well-ploughed land.`,wfw:`tuṣyanti — are satisfied; pitaraḥ — the ancestors; tasya — of him; su-kṛṣṭena iva — as by well-ploughed [land]; karṣukāḥ — farmers/ploughmen; yaḥ — who; śrāddhe — at a śrāddha; bhojayet — should feed/causes to eat; bhaktyā — with devotion; brāhmaṇam — a Brahmin; japa-jīvinam — one who lives by japa.`},
15:{iast:`api naḥ sa kule kaṃciduddharetkiṃ khageśvara |\nyaḥ saṃpūjya raviṃ śrāddhe bhojayejjapajīvinam || 15 ||`,en:`“Will he perhaps raise someone among us in the family?”—so is the sense, O lord of birds, concerning one who, after fully worshipping Ravi, feeds a practitioner who lives by japa at the śrāddha.`,wfw:`api — perhaps; naḥ — of us; saḥ — he; kule — in the family; kañcit — someone; uddharet — might raise/deliver; kim — indeed?; khageśvara — O lord of birds; yaḥ — who; sampūjya — having fully worshipped; ravim — Ravi; śrāddhe — at the śrāddha; bhojayet — feeds; japa-jīvinam — one who lives by japa.`},
16:{iast:`tṛpyaṃti pitarastasya gāyaṃti ca pitāmahāḥ |\nadya naḥ sa kule prājño vācakaṃ bhojayiṣyati || 16 ||`,en:`His ancestors are satisfied, and the forefathers sing: “Today that wise man in our family will feed a reciter/expounder.”`,wfw:`tṛpyanti — are satisfied; pitaraḥ — his ancestors; tasya — of him; gāyanti — sing; ca — and; pitāmahāḥ — the forefathers/grandfathers; adya — today; naḥ — for us/of us; saḥ — that man; kule — in the family; prājñaḥ — wise; vācakam — a reciter/expounder; bhojayiṣyati — will feed.`},
17:{iast:`purāṇavidamāyāṃtaṃ dṛṣṭvaiva saha saṃsthitāḥ |\nkrīḍaṃtyoṣadhayaḥ sarvā yāsyāmaḥ svargamakṣayam || 17 ||`,en:`Seeing a knower of the Purāṇa approaching, all the plants standing together are poetically said to rejoice: “We shall go to imperishable heaven.”`,wfw:`purāṇa-vidam — a knower of the Purāṇa; āyāntam — coming/approaching; dṛṣṭvā eva — having seen indeed; saha saṃsthitāḥ — standing together; krīḍanti — rejoice/sport; oṣadhayaḥ — the plants/herbs; sarvāḥ — all; yāsyāmaḥ — we shall go; svargam — to heaven; akṣayam — imperishable.`},
18:{iast:`anugrahāya lokānāṃ śraddhāyāśca parīkṣaṇe |\ncaraṃtyatithirūpeṇa pitaro devatāstathā || 18 ||`,en:`For the benefit of the worlds and for the testing of faith, the ancestors and the deities wander in the form of guests.`,wfw:`anugrahāya — for favour/benefit; lokānām — of the worlds/people; śraddhāyāḥ — of faith; ca — and; parīkṣaṇe — for testing; caranti — they wander; atithi-rūpeṇa — in the form of a guest; pitaraḥ — the ancestors; devatāḥ — the deities; tathā — likewise.`},
19:{iast:`tasmādatithimāyāṃtamagre gacchetkṛtāṃjaliḥ |\nsvāgatāsanapādyārghyasnānānnaśayanādibhiḥ || 19 ||`,en:`Therefore, with joined palms one should go forward to meet an arriving guest and honour him with welcome, a seat, water for the feet, arghya, bathing, food, lodging, and the like.`,wfw:`tasmāt — therefore; atithim — the guest; āyāntam — arriving; agre gacchet — one should go forward/to meet; kṛta-añjaliḥ — with joined palms; svāgata — welcome; āsana — seat; pādya — foot-water; arghya — respectful offering; snāna — bath; anna — food; śayana — lodging/bed; ādibhiḥ — and the like.`},
20:{iast:`rūpānvitaṃ virūpaṃ vā malinaṃ malināṃbaram |\nvelāyāmatithiṃ prāptaṃ paṃḍito na vicārayet || 20 ||`,en:`A learned man should not scrutinise a guest who arrives at the proper time, whether handsome or deformed, dirty, or wearing dirty clothes.`,wfw:`rūpa-anvitam — endowed with beauty/form; virūpam vā — or deformed/ugly; malinam — dirty; malina-ambaram — wearing dirty clothing; velāyām — at the proper time; atithim — a guest; prāptam — arrived; paṇḍitaḥ — a learned man; na vicārayet — should not examine/discriminate.`},
21:{iast:`bhojakānāṃ śarīreṣu nityaṃ sannihito raviḥ |\nye bhojakāstyajaṃtyanye sarvapāpeṣvavasthitāḥ |\nadhomukhorddhvapādāste pataṃti narakāgniṣu || 21 ||`,en:`Ravi is ever present in the bodies of the Bhojakas. Those others who abandon the Bhojakas, being established in all sins, fall head-down and feet-up into the fires of hell.`,wfw:`bhojakānām śarīreṣu — in the bodies of the Bhojakas; nityam — always; sannihitaḥ — present; raviḥ — Ravi; ye — those who; bhojakān — the Bhojakas; tyajanti — abandon; anye — others; sarva-pāpeṣu avasthitāḥ — established in all sins; adho-mukha-ūrdhva-pādāḥ — head downward, feet upward; te — they; patanti — fall; naraka-agniṣu — into the fires of hell.`},
22:{iast:`kṛmibhirbhinnavadanāstapyamānāśca vahninā |\npīḍyaṃte cāyudhai rghoṃrairyāvadiṃdrāścaturdaśa || 22 ||`,en:`Their faces torn by worms and themselves scorched by fire, they are tormented by terrible weapons for the period expressed as “until fourteen Indras.”`,wfw:`kṛmibhiḥ — by worms; bhinna-vadanāḥ — their faces split/torn; tapyamānāḥ — being scorched; ca — and; vahninā — by fire; pīḍyante — they are tormented; ca — and; āyudhaiḥ — by weapons; ghoraiḥ — terrible; yāvat — for as long as; indrāḥ caturdaśa — fourteen Indras.`,note:`Wisdomlib prints the sandhi sequence as āyudhair ghoṃrair; the intended adjective is transparently ghoraiḥ, “terrible.”`},
23:{iast:`ye cāpavādaṃ śṛṇvaṃti vimūḍhā brāhmaṇeṣu vai |\nte viśeṣeṇa pacyaṃte narakeṣu madicchayā || 23 ||`,en:`Those deluded people who listen to slander concerning Brahmins are especially cooked in the hells, by my will.`,wfw:`ye — those who; ca — and; apavādam — slander/reproach; śṛṇvanti — hear/listen to; vimūḍhāḥ — deluded; brāhmaṇeṣu — concerning/against Brahmins; vai — indeed; te — they; viśeṣeṇa — especially; pacyante — are cooked/tormented; narakeṣu — in the hells; mat-icchayā — by my will.`},
24:{iast:`sarveṣāmeva pātrāṇāṃ satpātraṃ jāpakaḥ paraḥ |\ntasmātsarvaprayatnena pūjayetsusamāhitaḥ || 24 ||`,en:`Of all recipients, the practitioner of japa is the supreme worthy recipient. Therefore, being thoroughly collected, one should honour him with every effort.`,wfw:`sarveṣām eva — of all indeed; pātrāṇām — recipients/eligible donees; sat-pātram — the worthy/proper recipient; jāpakaḥ — one who performs japa, a reciter; paraḥ — supreme; tasmāt — therefore; sarva-prayatnena — with every effort; pūjayet — one should honour/worship; su-samāhitaḥ — thoroughly composed/concentrated.`}
