</script><script>const A=[
'Saptāśva says that all cooked food should first be offered to the Sun and an oblation made in the fire; afterward bali offerings are placed in every direction.',
'One who eats cooked food day after day without first offering it to the Sun, fire, guru and Brahmins is said to consume sin.',
'In agriculture, animal keeping and trade, human sins increase through anger, falsehood, loss and the faults connected with the household’s daily violence.',
'The mortar or pounding tool, grinding stone, hearth, water-pot and broom are called the five “slaughter-places” of the householder.',
'By worship of the Sun, fire and guru one avoids being stained by these and other grave sins; therefore such worship should be performed continually.',
'For as many portions of food as are offered to the Sun, fire and guru, the donor is poetically promised thousands of years in the city of the Sun.',
'Offerings enriched with ghee and cakes are said to yield tenfold merit, and those furnished with accompaniments a hundredfold merit.',
'An offering of ṣaṣṭika rice is assigned a thousandfold fruit, while fragrant śāli rice is praised with an even greater reward.',
'Food, drink and edible preparations should always be given to the Sun, fire, guru and holy persons; food first offered in this way yields an imperishable fruit.',
'One who practises such devotion to Divākara, god of gods, is said to lift his ancestors from all sins and lead them to heaven.',
'Seeing Ravi is praised as equal in merit to bathing in the Gaṅgā, and bowing to him as comparable to bathing at all sacred tīrthas.',
'One who bows his head to Ravi is released from sins; serving him at the twilight worship brings honour in the solar world.',
'By worshipping Ravi, the worshipper is said simultaneously to honour Brahmā, Viṣṇu, Maheśvara, the ancestors and all the gods.',
'The ancestors are delighted, like farmers by well-ploughed land, when a Brahmin who lives by japa is fed with devotion at a śrāddha.',
'The verse asks what ancestor could fail to be raised when a person worships Ravi and then feeds a practitioner who lives by japa at the śrāddha.',
'His ancestors are said to become satisfied and to rejoice: “Today a wise descendant in our family will feed a reciter or teacher.”',
'On seeing a knower of the Purāṇas approaching, the plants themselves are poetically said to rejoice at the prospect of reaching imperishable heaven.',
'For the benefit of the worlds and to test people’s faith, the ancestors and deities are said to wander in the form of guests.',
'Therefore one should go forward with joined palms to receive an arriving guest and honour him with welcome, seat, foot-water, arghya, bath, food, lodging and the like.',
'Whether handsome or deformed, clean or dirty and wearing soiled clothes, a learned person should not scrutinise a guest who arrives at the proper time.',
'Ravi is said to be continually present in the bodies of the Bhojakas; those who abandon or mistreat them are threatened with a fall into hell.',
'The text describes such offenders as tormented in hell by worms, fire and terrible weapons for an immense period.',
'Those who listen approvingly to slander directed against Brahmins are likewise threatened with especially severe punishment.',
'Among all recipients, the practitioner of japa is declared the supreme worthy recipient; therefore one should honour such a person with the greatest care and concentration.'
];const T=Object.fromEntries(A.map((en,i)=>[i+1,en]));renderBhavishyaLiveChapter({chapter:188,verseCount:24,subtitle:'Honouring Bhojakas, guests and practitioners of japa',colophon:'Bhaviṣya Purāṇa, Brāhmaparvan 1.188.'},T);</script></body></html>
