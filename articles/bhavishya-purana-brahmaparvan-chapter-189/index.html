</script><script>const A=[
'As the contents of an unbaked vessel perish when the vessel is destroyed, so a gift made while japa is neglected is said to perish together with an unworthy recipient.',
'Just as an oblation cast into ashes is fruitless for the sacrificer, so a gift to a Brahmin devoid of japa is declared useless.',
'As an impotent man is fruitless with women and a barren cow among cattle, so the birth of a Brahmin devoid of japa is said to be fruitless.',
'Like one trying to cross water in an iron boat, both giver and receiver fall into darkness when the gift and recipient are wrongly matched.',
'A gift made from compassion for all beings and with faith is said to be an excellent gift capable of fulfilling every desire.',
'What is given to the poor, blind, destitute, children, the aged and the sick is said to bear limitless fruit.',
'Good people do not accept gifts merely for their own benefit; the act of receiving is understood as an opportunity to assist the donor.',
'The petitioner who says “give to me” also acts for the donor’s welfare, because the donor rises upward while the receiver remains below.',
'By asking, the needy person effectively teaches the wealthy person the consequence of failing to give.',
'Poor people who say “give” are described less as beggars than as reminders of the condition produced by non-giving.',
'Who would fail to honour a petitioner who comes to the house, and why should one who asks daily be considered unworthy of respect?',
'Those who are compelled day after day by need make visible to donors the continuing opportunity and obligation of generosity.',
'The difference between donor and petitioner is symbolised by their hands: one stands above in giving, the other below in receiving.',
'One who ignores a petitioner already present in order to search elsewhere for an ideal recipient is said not to be a giver in the highest sense.',
'If there were no petitioners, how could the dharma of giving operate? Therefore the arrival of a petitioner should be welcomed gladly.',
'Welcome, water for the feet and accompanying the guest are compared to successive steps on a stairway to heaven; worldly anxieties and possessions inevitably pass away.',
'Even half of one’s own mouthful should regularly be shared with petitioners; a gift stripped of kindness is declared spiritually lost.',
'Therefore one who desires endless fruit should give after showing respect; even a gentle refusal is better than harshness.',
'A gift stained by contempt or cruel speech is not truly a gift; it is better not to give than to give while inwardly enraged.',
'Wealth, affection, dharma, gifts, vows, sacrifice, meditation, oblation and austerity—even when performed with effort—are rendered fruitless by anger.',
'One who gives with faith and honour, and one who receives with proper honour, are both said to reach heaven; the reverse conduct leads to hell.',
'Generosity, welcome, friendliness and compassion are named among the dispositions that give great fruit when a gift is made to a worthy teacher or recipient.',
'Vārāṇasī, Kurukṣetra, Prayāga, Puṣkara and other sacred places are named as especially meritorious locations for giving.',
'Mūlasthāna, Puṇḍīrasvāmin, Kālapriya, Kṣīrikāvāsa and other sacred solar places are likewise praised.',
'These and other places frequented by gods, siddhas, cows and sages, together with sacred rivers and mountains, are said to magnify the merit of giving.',
'Even a small offering made in a temple or sacred seat of the Sun is said to yield immeasurable fruit through the power of the place.',
'Lunar and solar eclipses, Uttarāyaṇa, the equinox and other special astronomical conjunctions are praised as auspicious times for gifts.',
'Saṅkrānti and other sacred temporal junctions are likewise named as times that increase human merit.',
'Devotion, deep affection, orientation toward dharma and firm assent are presented as closely related forms or synonyms of śraddhā.',
'An excellent gift is one properly transferred to a worthy recipient with faith; therefore one seeking imperishable fruit should give while established in faith.',
'Even a gift of modest size, when given properly and with faith to a worthy recipient, is said to have boundless fruit.',
'One who gives even a little with faith to the distressed, the poor and those endowed with good qualities is said to obtain desired worlds; the knowledgeable therefore call faith itself the essence of giving.',
'Faith is called the supreme gift and the supreme austerity; sacrifice and fasting are likewise said to depend fundamentally upon faith.',
'Non-violence, patience, truthfulness, modesty, faith, control of the senses, giving, sacrifice, austerity and meditation are listed as ten means of dharma.',
'By practising these solar dharmas individually or together, one is said to attain the single path leading to the solar realm.',
'As the earth supports all beings, tranquillity is praised as especially great; one seeking the world of the Sun should therefore cultivate great merit.',
'One who covets another’s wife or property, abandons a suffering or helpless guru or companion, or deserts one overwhelmed by enemies is called a sinner.',
'Disrespect toward the wife, friends or sons of such a person is said to be a grave offence comparable here to insulting the guru.',
'Killing a Brahmin, drinking liquor, theft, violation of the guru’s bed and association with one guilty of these are listed as the five great sins.',
'One who, from anger, hatred, fear or greed, brings a Brahmin into mortal danger by words or accusation is here described as a brahma-killer.',
'One who summons a poor Brahmin seeking help and then falsely claims to possess nothing is condemned in the strongest social language of the text.',
'One who takes land previously given to gods, Brahmins or cows—even after long lapse—is said to incur a sin comparable to brahma-hatya.',
'One who studies the solar knowledge and then abandons it through dullness is said to incur a sin comparable to drinking liquor.',
'Abandoning Agnihotra and the five great sacrifices, abandoning mother and father, false testimony and killing a friend are condemned.',
'Hostility toward devotees of the Sun, eating forbidden foods, and killing innocent living beings are likewise included among grave sins.',
'Such people are said to lack lordship in the divine city; the Lord of the world grants only the destination appropriate to their own condition.',
'Some people, devoted to the yoga of knowledge, are liberated here itself; others, attached to enjoyment, return again into saṃsāra.',
'One seeking liberation should therefore abandon attachment to enjoyment; dispassionate and peaceful, one attains the solar world.',
'Those who recite the teaching with detached hearts receive results in accordance with their own level of understanding and spiritual capacity.',
'Those who do not worship Bhānu even once and remain impure are said to receive corresponding experiences in the realm of Piśācas.',
'Those who worship Bhānu twice while remaining cruel and angry are assigned a better but still limited result in the realm of Rākṣasas.',
'Those who worship Bhānu three times while still attached to liquor and meat are said to receive divine enjoyments in a realm of ṛṣis.',
'Those who perform dance and song before the Sun three or four times are said to reach the realm of the Gandharvas.',
'People who worship the protector of cattle while seeking worldly fame are said to receive their desires in Indra’s abode.',
'One who worships Ravi six times with a mind still attached to desire receives enjoyments in the Prajāpati realm.',
'One who worships Citrabhānu nine times reaches proximity to Viṣṇu and rejoices together with him.',
'Beyond that is described an even higher, beautiful station filled with immeasurable divine qualities and wish-fulfilling celestial vehicles.',
'That realm is portrayed as radiant like millions of Suns and filled with countless objects and splendid dwellings.',
'Those who worship the twice-born are said to reach and enjoy that realm; beyond it lies the luminous solar station.',
'Thus, through the power of the Sun, people obtain destinations even from comparatively limited acts, in accordance with the degree of their faith.'
