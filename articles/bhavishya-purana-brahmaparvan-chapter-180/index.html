<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 180: Sanskrit, fresh English translation, literal glosses, and transliteration."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 180 — Viveka Dṛṣṭi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/vivekadrishti/assets/css/site.css?v=20260915-2"><link rel="stylesheet" href="/vivekadrishti/assets/css/bhavishya-reader.css?v=20260915"></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/vivekadrishti/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/vivekadrishti/">Home</a><a href="/vivekadrishti/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/vivekadrishti/indology/">Indology</a><a href="/vivekadrishti/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 180</h1><p class="article-date">15 September 2026</p><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/vivekadrishti/pages/bhavishya-purana-brahmaparvan/">← Chapter index</a><a href="/vivekadrishti/articles/bhavishya-purana-brahmaparvan-chapter-181/">Chapter 181 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/vivekadrishti/assets/js/site.js?v=20260915-2"></script><script src="/vivekadrishti/assets/js/bhavishya-live-reader.js?v=20260915"></script><script>const T={1:'The sacred rivers Gaṅgā, Yamunā, Narmadā, Gautamī, Kāverī, Varuṇā and Devikā are invoked.',2:'May those rivers, absorbed in the reality of the Sun and worshipping the Lord of the worlds, continually bring you peace.',3:'The Nirañjanā, the great river Śoṇa, Mandākinī and the auspicious Sannihitā are also invoked.',4:'May these and the many other rivers of earth, heaven and the mid-region, devoted to solar worship, bring you peace.',5:'The great Vaiśravaṇa, king of the Yakṣas, is praised as surrounded by countless hosts of Yakṣas.',6:'Endowed with great splendour, devoted to worship at the feet of the Sun and intent on meditation upon him, he is filled with solar devotion.',7:'May that gracious lotus-eyed one bring you peace; likewise the great Yakṣa Maṇibhadra, adorned with jewels.',8:'Surrounded by Yakṣiṇīs and Yakṣa maidens and adorned with a beautiful necklace, Maṇibhadra, absorbed in worship of the Sun, is asked to grant peace.',9:'Sucira, lord among Yakṣas, is described as jeweled and radiant with a golden ornament upon his forehead.',10:'Surrounded by many Yakṣas and honoured by them, devoted to worship of the Sun, may Sucira bring you peace.',11:'Pāñcika, lord of Yakṣas, is described as adorned at the neck and accompanied by a wondrous, jewel-decked emblem.',12:'Surrounded by hosts and millions of Yakṣas, the prosperous worshipper of the Sun is asked to bring you peace.',13:'The mighty Dhṛtarāṣṭra, lord of many Yakṣas, is described with divine diadem, white parasol, jewels and gold.',14:'Devoted to the Sun, delighting in the Sun and intent upon his worship, enriched by the Sun’s grace, may he bring you peace.',15:'Virūpākṣa, lord of Yakṣas, clad in white and radiant, is adorned with many golden garlands.',16:'That lotus-eyed devotee, intent on solar worship and shining like Āditya, is asked to bring you peace.',17:'Yakṣas dwelling in the mid-region and those who go to heaven, of many forms and firm vows, are invoked as devotees of the Sun.',18:'Joyful, peaceful and wholly devoted to peace, their minds fixed upon the Sun and eager for his worship, may they bring you peace.',19:'Yakṣiṇīs of many forms, young Yakṣas and highly blessed Yakṣa maidens, intent upon worship of the Sun, are invoked.',20:'May they continually bestow peace, well-being, security, strength, supreme auspiciousness and swift success.',21:'May all mountains everywhere and all mighty trees, ever devoted to the Sun, continually bring you peace.',22:'May all oceans, dwellings and forests, devoted to the worship of the Sun, bring you peace.',23:'All the fierce and powerful Rākṣasas everywhere—those on earth and those moving in the mid-region—are invoked.',24:'May all the Rākṣasas in the netherworld who are continually devoted to solar worship, ever blazing with energy, bring you peace.',25:'All hosts of Pretas, facing every direction, including the blazing and blood-consuming Pretas, are invoked.',26:'Pretas in the mid-region, heaven, the netherworld and upon earth, capable of assuming forms at will, are invoked.',27:'By the splendour of that god whose chariot has one wheel and who is linked here with the divine standard, may they continually bring you peace.',28:'All powerful Piśācas, mighty, vigorous and of many forms, are invoked.',29:'The Piśācas in the mid-region, in heaven, in the netherworld and on earth, many-formed and swift as thought, are invoked.',30:'By the splendour of that god of whom the speaker is charioteer, may those beings swiftly bring you peace.',31:'All seizure-spirits connected with epilepsy and fever, whether in heaven or upon earth, are invoked.',32:'The grahas in the netherworld and those moving everywhere are invoked; Hari is said to abide in the Sun’s right-hand ray.',33:'Hara is said to stand at his left and the lotus-born Brahmā at his forehead; by the splendour of that god may they always bring you peace.',34:'Thus may all the gods and other beings who perform the solar rite bring peace to the world and always protect devotees of the Sun.',35:'Victory to the divine Sun, destroyer of darkness, Vivasvat, giver of victory; repeated homage to Bhāskara.',36:'Victory and homage are offered to the Sun in his radiant and beneficent forms as the hymn of pacification continues.',37:'Victory to the one who establishes radiance and brings peace, the destroyer of darkness, the unconquered one; repeated homage to him.',38:'The hymn continues with salutations to the Sun under his sacred names and powers, seeking protection and peace.',39:'Repeated homage is offered to the Sun as the embodied form of Gāyatrī, beloved of Sāvitrī, supporter of the earth and Mārtāṇḍa.',40:'Sumantu says that Aruṇa performed this pacification for the welfare of the great Garuḍa, son of Vinatā.',41:'Through that rite and the grace of the Sun, Garuḍa’s affliction is described as being removed.',42:'O king, by the grace of the great Bhāskara, god of gods, he again became complete in all his limbs as before.',43:'Other human beings who are ill likewise become free of disease when this fire-rite is performed; therefore it should be carefully performed according to rule.',44:'O king, persons afflicted by disease should also perform it; when this fire-rite is carried out they become free from illness.',45:'The rite, accompanied by a hundred-thousand oblations, is prescribed in times of planetary affliction, famine, portents and failure of rain.'};renderBhavishyaLiveChapter({chapter:180,verseCount:45,subtitle:'Śāntika — a solar pacification hymn invoking rivers, Yakṣas and other beings',colophon:'Bhaviṣya Purāṇa, Brāhmaparvan 1.180.'},T);</script></body></html>
