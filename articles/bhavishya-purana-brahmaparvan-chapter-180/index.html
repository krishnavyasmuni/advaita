sets/js/site.js?v=20260915-2"></script><script src="/vivekadrishti/assets/js/bhavishya-live-reader.js?v=20260915"></script><script>const A=[
'The sacred rivers Gaṅgā, Yamunā, Narmadā, Gautamī, Kāverī, Varuṇā and Devikā are invoked.',
'Those rivers, devoted in mind to the Sun and worshipping the lord and leader of the worlds, are asked continually to bring peace and protection.',
'The rivers Nirañjanā, Śoṇa, Mandākinī and the auspicious Sannihitā are also named.',
'These and the many other rivers of earth, heaven and the intermediate region, devoted to solar worship, are asked to grant peace.',
'The great Vaiśravaṇa, king of the Yakṣas, is invoked together with his countless hosts.',
'Rich in splendour, devoted to worship at the feet of the Sun and absorbed in solar meditation, he is described as filled with the presence of the Sun.',
'May that gracious, lotus-eyed lord grant peace; the great Yakṣa Maṇibhadra is then invoked, adorned with jewels and gems.',
'Radiant with a beautiful necklace and surrounded by Yakṣiṇīs and Yakṣa maidens, Maṇibhadra is asked, as a devotee of the Sun, to grant peace.',
'The Yakṣa-lord Sucira is invoked, adorned with jeweled earrings and a golden ornament upon his forehead.',
'Surrounded and honoured by many Yakṣas, and devoted to worship of the Sun, he is asked to grant peace.',
'The Yakṣa-lord Pāñcika is invoked, ornamented at the neck and accompanied by the striking emblem described in the verse, rich with jewels.',
'Surrounded by assemblies and millions of Yakṣas, the glorious worshipper of the Sun is asked to grant peace.',
'The greatly radiant Dhṛtarāṣṭra, lord over many Yakṣas, is invoked, splendid with divine cloth, a white parasol, jewels and gold.',
'Devoted to the Sun, delighting in the Sun and blessed by the Sun’s favour, Dhṛtarāṣṭra is asked to bring peace.',
'The Yakṣa-lord Virūpākṣa is invoked, dressed in white and brilliant, his neck adorned with many golden garlands.',
'Lotus-eyed and lotus-like, devoted to solar worship and radiant like Āditya, he is asked to grant peace.',
'All Yakṣas dwelling in the intermediate region or travelling to heaven, whatever forms they bear, are invoked as firm devotees of the Sun.',
'Joyful, peaceful and intent upon the Sun, they are asked to establish peace for the worshipper.',
'Yakṣiṇīs of many forms, Yakṣa youths and fortunate Yakṣa maidens devoted to the worship of the Sun are also invoked.',
'May they bestow peace, auspiciousness, security, strength, supreme welfare and swift success, remaining ever concentrated in worship.',
'All mountains and mighty trees everywhere, described as devotees of the Sun, are asked continually to grant peace.',
'All oceans, dwellings and forests, wholly devoted to the worship of the Sun, are asked to establish peace.',
'All powerful and fearsome Rākṣasas, whether dwelling on earth or moving through the intermediate region, are invoked.',
'Those Rākṣasas who dwell in Pātāla and continually worship the Sun are asked, radiant with power, to grant peace.',
'All classes of Pretas are invoked, including those of terrifying appearance and those said to subsist upon blood.',
'Pretas in the intermediate region, heaven, Pātāla and earth, including those able to assume forms at will, are invoked.',
'By the splendour of the deity whose chariot is described as one-wheeled and whose banner bears the bull, may these beings continually grant peace.',
'Powerful Piśācas of many forms, mighty and endowed with their characteristic qualities, are next invoked.',
'Piśācas in the intermediate region, heaven, Pātāla and earth, manifold in form and swift as thought, are included in the invocation.',
'By the splendour of the deity whose charioteer is Aruṇa, may they swiftly establish peace.',
'All seizure-spirits associated with epilepsy and fever, whether in heaven or on earth, are invoked.',
'The planetary beings in Pātāla and elsewhere are invoked in the presence of the Sun, in whose southern ray Hari is said to abide.',
'Hara is said to stand at the Sun’s left and the lotus-born Brahmā at his forehead; by the splendour of that deity may peace arise continually.',
'Thus all gods and other beings who perform the solar sacrifice are asked always to bring peace to the world and to devotees of the Sun.',
'Victory to Sūrya, the god Vivasvat who destroys darkness; homage to Bhāskara, the Sun who bestows victory.',
'Victory to the supreme planet and beneficent deity, the opener of the lotus; homage to the radiant and intelligent form of the Sun.',
'Victory to the ordainer of radiance and to the giver of peace; repeated homage to the unconquered destroyer of darkness.',
'Victory to Arka, lord of blazing light, brilliant with a thousand rays; homage to the unconquered one by whom the worlds are fashioned.',
'Homage to the Sun whose body is Gāyatrī, beloved of Sāvitrī, supporter of the earth and known as Mārtāṇḍa.',
'Sumantu says that Aruṇa performed this rite of pacification, O king, for the welfare of the great Garuḍa, son of Vinatā.',
'At that very time Suparṇa obtained his wings and became radiant like Budha and equal to Hari in strength.',
'His body and limbs were restored to completeness as before through the grace of the great god Bhāskara.',
'Likewise, other human beings afflicted by disease are said to become free of illness when this prescribed fire rite is performed; it should therefore be undertaken carefully.',
'The text repeats that people suffering from disease should perform the rite according to rule and thereby obtain relief from illness.',
'In planetary affliction, famine, extraordinary calamities and failure of rain, the rite is prescribed together with a hundred-thousand oblations.',
'After worship and concentrated meditation, the knowledgeable practitioner should perform the homa with the appropriate hymns, including Varuṇa hymns.',
'With a serene mind he should offer ghee and honey, together with sesame, barley and milk-rice mixed with honey.',
'This pacificatory rite and the bali offering should be performed carefully; the gods are then said to shower prosperity and fulfil human wishes.',
'One who reads or hears this chapter of pacification according to rule while meditating upon the Sun receives the benefits described next.',
'He is said to conquer enemies in battle, obtain great honour and enjoy enduring prosperity without his authority being slighted.',
'Unafflicted by disease and established through sons and grandsons, he becomes, in splendour and radiance, like Āditya.',
'Those for whom a reciter reads this chapter are said not to be afflicted by disorders traditionally classified as arising from wind, bile or phlegm.',
'Untimely death, snakebite and the spread of poison are warded off; paralysis, blindness and muteness are likewise said not to arise.',
'Fear from portents and hostile rites is removed, and diseases, great calamities and venomous serpents are said to be pacified by hearing the chapter.',
'The merit of hearing and reciting it is praised as many millions of times the merit of all sacred bathing places, especially the Gaṅgā.',
'The text compares its merit with that of many royal sacrifices and promises a life exceeding a hundred years, free from disease.',
'Even a killer of cows, an ungrateful person, a Brahmin-killer, one guilty of violating the guru’s bed, or one who betrays refugees, the poor, the distressed, friends or those who trust him is addressed.',
'The wicked, those given to sinful conduct, and even those guilty of killing father or mother are said to be freed from sins through hearing this sacred account.',
'This holy history and supreme fire rite is not to be given, the text says, to a foolish or morally corrupt person.',
'It should always be transmitted to a devotee of the Sun; the teaching is said to have been spoken by Sūrya to Aruṇa and by Aruṇa to Garuḍa.',
'Garuḍa in turn is said to have taught it to the great Bhojakas such as Sūryaśarman in Śākadvīpa.',
'Those teachers transmitted the sacred teaching to the wise Vyāsa, who in turn taught this meritorious account that removes the fear of sin.'
