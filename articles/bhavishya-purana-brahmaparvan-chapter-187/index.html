'Aruṇa asks what meritorious deeds enable human beings born in this world to reach the heavenly world.',
'He names five great sacrifices: sacrifice through action, sacrifice through austerity, self-study, meditation, and sacrifice through knowledge.',
'He asks which of these sacrifices is highest and what fruits and destinations arise from them.',
'He asks how many divisions of dharma and adharma are taught, what their means are, and what destinations they produce.',
'He asks what marks remain on sinners who return to earth from hell after the residual force of their deeds has been exhausted.',
'He asks how embodied beings can escape the terrible ocean of becoming, filled with dharma and adharma and with the suffering that begins in the womb.',
'Sumantu says that the glorious Sun, hearing all these questions, replied both concisely and in detail.',
'Āditya says: hear the pure dharma that removes sin, gives heaven and liberation, and carries one across the ocean of hell.',
'Dharma is always preceded, sustained and completed by śraddhā; faith is said to be its foundation and abiding support.',
'The subtle meanings of revelation, mantra, rasa, primordial nature, person and Lord are grasped through faith and not merely by the physical eye.',
'The subtle dharma is not attained merely through bodily hardship or heaps of wealth when faith is absent, even among the gods.',
'Faith is called the supreme subtle dharma; faith is sacrifice, oblation and austerity, and is connected here with heaven and liberation.',
'One who gives even life or all possessions without faith obtains no fruit; therefore one should be devoted to faith.',
'All the speaker’s dharmas are said to be permeated by faith; worship and meditation should likewise be performed with faith.',
'The text introduces a sacred solar utterance taught for the attainment of eligibility and for liberation.',
'That divine statement is praised as profound, delightful, certain in meaning and capable of producing many accomplishments.',
'The wise know the two-syllabled expression associated with the speaker’s own mind-ocean as Khaṣolka, joined to the auspicious solar sphere.',
'The Lord beyond the three guṇas, omniscient and all-knowing, is said to abide in the one syllable Oṃ.',
'Just as the beginningless ocean of saṃsāra continues, so this beginningless solar formula is described as a purifier from that ocean.',
'As medicine counteracts disease, the formula becomes a cause of liberation for seekers of release and a means of accomplishing aims.',
'This mantra is identified with the speaker’s own name and meaning; name and named reality are treated as united in its accomplishment.',
'The text links Vedic knowledge with the six-syllabled mantra and also speaks of the five-syllabled form when the one sacred syllable is treated separately.',
'What need is there of numerous mantras or vast śāstras for one in whose heart the mantra “Oṃ namaḥ Khaṣolkāya” is firmly established?',
'One who has assimilated that six-syllabled saying is said thereby to have studied, heard and performed what is essential.',
'The speaker insists that this teaching is an injunction, not mere praise, and invites further questioning about its complete meaning.',
'Sumantu says that, after hearing the Sun, powerful Vainateya bowed with devotion to Saptāśvatilaka.',
'Aruṇa asks the lord to explain the nature and meaning of the utterance just proclaimed by Bhānu.',
'Saptāśvatilaka says that a statement composed by the omniscient Lord free from all defects is authoritative without doubt.',
'Because the Sun is called Mārtāṇḍa by the wise, one who acts with faith obtains the proper merit, while faithlessness causes downfall.',
'One should honour the teacher who expounds solar doctrine as one honours the Sun, for such a teacher lifts people submerged in the ocean of saṃsāra.',
'Who would fail to honour the teacher who extinguishes the fire of ignorance with the nectar of knowledge and the water of solar dharma?',
'Freedom from ignorance, which brings happiness in the next world, is not obtained merely through a great kingdom or piles of wealth.',
'A beautiful statement spoken by the God of gods for attaining heaven and liberation should be recognised as truly good speech.',
'Speech driven by attachment, hatred, intolerance, anger, lust and craving is called bad speech because it leads toward hell.',
'What value is elegant and gentle speech if it delights in ignorance and becomes a cause of the sufferings of saṃsāra?',
'Even speech that sounds harsh or unattractive should be recognised as excellent if hearing it produces merit and destroys attachment and similar faults.',
'The Smṛtis, Bhārata, Vedas and great śāstras are vast; life can be spent merely in their study without reaching the essential aim.',
'For confused people absorbed in sons, wives and worldly existence, scripture issued from the beginningless source teaches the way through saṃsāra.',
'Even one who lived for a thousand years could not reach the end of all scripture while trying to know everything that is said to be superior.',
'Recognising the limitation of life, one should extract the essential meaning and direct oneself toward the welfare of the next world.',
'What use is mere learning or ability if a person cannot carry the burden of merit that benefits beings beyond this life?',
'Even a learned person is effectively foolish and even the capable are incapable if they cannot articulate the greatness of solar knowledge.',
'Therefore the truly learned, capable, ascetic and self-controlled person is the one who strives to contemplate the reality of solar knowledge.',
'Even a king who gave the whole earth, wealth and gold should not receive the teaching from a guru if he approaches unjustly or without the proper disposition.',
'One who hears and rightly speaks the dharma of the Sun goes to a good destination; the opposite conduct leads downward.',
'The verse praises worship of Ravi through the six-syllabled ordinance and connects it with the spiritual elevation of human beings.',
'The text recalls the churning of the milk ocean, from which five cows arose as mothers of the whole world.',
'Those five cows are named Nandā, Subhadrā, Surabhī, Sumanā and Śobhanāvatī, radiant like the Sun.',
'The cows are said to remain under the Sun’s protection for the welfare of the world, the satisfaction of the gods and the bathing of Bhāskara.',
'Their bodily products are treated as sacred and as connected with the six tastes and with many forms of ritual accomplishment.',
'Cow dung, rocanā, urine, milk, curd and ghee are called six purifying products capable of bestowing success.',
'The sacred bilva tree, beloved of the Sun, is mythically said to have arisen from cow dung, with Śrī dwelling there.',
'Lotuses and blue lotuses are likewise connected mythically with cow dung, while gorocanā is praised as auspicious, purifying and wish-fulfilling.',
'Guggulu is said to arise from cow urine and is praised as fragrant and especially dear as an offering to Bhāskara.',
'The seeds or nourishing essences of the world are connected with milk, while auspicious preparations for success are said to arise from curd.',
'Amṛta is said to arise from ghee and to be dear to the immortals; the text therefore prescribes bathing Ravi with ghee, milk and curd.',
'After that bathing, warm water and astringent preparations are used, followed by cool water and anointing Bhānu with rocanā.',
'He should be worshipped with bilva leaves, lotuses and blue lotuses, and then offered arghya together with fragrant guggulu.',
'Milk-rice, curd-rice, sweets with honey and various other foods are to be offered with sincere devotion.',
'After circumambulation one should bow and ask forgiveness; by this six-limbed procedure the Lord of the day is worshipped.',
'One who worships in this manner is said to obtain desired aims in this world and the next.',
'One who worships the Sun with the sixfold procedure is said to lead twenty-one generations heavenward and then reach the solar realm.',
'Bhojakas appointed to divine service are described as accompanying their Lord to the supreme splendour of the glorious Sun.',
'After enjoying abundant celestial pleasures, a Bhojaka is said eventually to return to earth and become a sovereign ruler.',
'Flowers, leaves, fruit and water offered in worship of Bhāskara, and cows dedicated to the solar rite, are said to reach the world of the Sun.',
'One who drinks the milk of a cow dedicated to Bhāskara without first offering it to him is threatened with a terrible hell for neglecting the Sun’s due.',
'The text prescribes using the milk of the Sun’s cows at the stated time for bathing the deity.',
'Milk obtained at dawn from cows dedicated to Bhāskara should be used in its entirety to bathe Bhānu.',
'One who consumes all such produce without offering it to the deity is threatened with suffering in hell for as many thousands of years as there are hairs on the cow.',
'One who hears of the Sun being worshipped and joyfully approves is said to obtain the fruit of sacrifice.',
'Seeing Bhāskara being worshipped frees a person from sins; bowing joyfully to him leads to honour in his world.',
'A person who sees Ravi being worshipped with devotion is likewise promised the full fruit of sacrifice.',
'One who hears of and approves the worship of the day-maker obtains the corresponding fruit through Bhāskara’s grace.',
'A gift made with devotion to persons lacking japa-sacrifice is said to bear fruit for one birth, whereas giving to those who live by japa is praised as enduring through many births.',
'Even a very small gift made to a reciter or teacher is said to provide enjoyment for the donor until the great dissolution.',
'For those who understand, no gift is truly small when joined with proper place, time, procedure, faith and a worthy recipient; such giving is imperishable.',
'What is given, offered in fire or otherwise performed at the right place and time, by the proper method and with faith, bears an immeasurable fruit.',
'Even half a sesame seed given with faith and devotion to a truly worthy recipient according to rule is said to become capable of fulfilling every desire.',
'The recipient who is “bathed in the waters of knowledge” and cleansed by the “ashes of good character” is proclaimed the highest among all recipients.',
'Japa, restraint and discipline protect human beings from the ocean of saṃsāra; a person embodying these is remembered as a supreme recipient for those blinded by ignorance and sin.',
'Scriptural knowledge joined to the raft of wisdom can carry the ignorant across the great ocean of sin; a mere stone cannot carry another stone.',
'The fruit associated with providing for Veda-knowing twice-born persons is said to be obtained through an appropriately made gift to one who lives by japa.',
'When such a person comes to one’s house and is respectfully fed, he is said to lift the donor’s family from the ocean of hell.',
'The entire fruit attributed to sacrifices, Agnihotra and pilgrimages is said to be obtained by giving food to practitioners of japa.',
'By giving food once with faith to a tranquil Bhojaka devoted to contemplation, one is said to become free from all sins.',
'Feeding with devotion practitioners of japa who are peaceful and whose minds are offered to Āditya is said to fulfil every desire.',
'One who continually feeds such practitioners while meditating on the hymn of Ravi is said to make the food effectively an offering directly to the deity.',
'One who feeds a Bhojaka at śrāddha with the ancestors in mind is said to attain the solar station without doubt.'
];const T=Object.fromEntries(A.map((en,i)=>[i+1,en]));renderBhavishyaLiveChapter({chapter:187,verseCount:88,subtitle:'Faith, solar dharma, sacred cows, giving and the qualities of worthy recipients',colophon:'Bhaviṣya Purāṇa, Brāhmaparvan 1.187.'},T);</script></body></html>
