<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 181: Sanskrit, close English translation, word-for-word glosses, and transliteration."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 181 — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/advaita/assets/css/site.css?v=20260915-2"><link rel="stylesheet" href="/advaita/assets/css/bhavishya-reader.css?v=20260915"></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 181</h1><p class="article-date">15 September 2026</p><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-180/">← Chapter 180</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-182/">Chapter 182 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-reader.js?v=20260915-4"></script><script>
const verses=[
{n:1,sa:`शतानीक उवाच ।\nपंचप्रकारं धर्मं मे वद स्मार्तं यथाक्रमम् ।\nकौतुकं पृच्छ ते ब्रह्मन्समासव्यासयोगतः ॥ १ ॥`,iast:`śatānīka uvāca |\npaṃcaprakāraṃ dharmaṃ me vada smārtaṃ yathākramam |\nkautukaṃ pṛccha te brahmansamāsavyāsayogataḥ || 1 ||`,en:`Śatānīka said: “Tell me, in due order, the fivefold Smārta dharma. Out of curiosity I ask you, O Brahman, both concisely and at length.”`,wfw:`śatānīkaḥ uvāca — Śatānīka said; pañca-prakāram — of five kinds; dharmam — dharma; me vada — tell me; smārtam — belonging to Smṛti / Smārta; yathākramam — in proper order; kautukam — curiosity, inquisitiveness; pṛccha te — I ask you (transmitted form); brahman — O Brahman; samāsa-vyāsa-yogataḥ — by the combination of summary and expansion.`},
{n:2,sa:`सुमन्तुरुवाच ।\nपंचधा वर्णितं धर्मं शृणु राजन्समासतः ।\nयथोक्तं भास्करेणेह अरुणस्य महात्मनः ॥ २ ॥`,iast:`sumanturuvāca |\npaṃcadhā varṇitaṃ dharmaṃ śṛṇu rājansamāsataḥ |\nyathoktaṃ bhāskareṇeha aruṇasya mahātmanaḥ || 2 ||`,en:`Sumantu said: “Hear in brief, O king, the dharma described as fivefold, just as Bhāskara taught it here to the great Aruṇa.”`,wfw:`sumantuḥ uvāca — Sumantu said; pañcadhā — fivefold; varṇitam — described; dharmam — dharma; śṛṇu — hear; rājan — O king; samāsataḥ — in brief; yathā-uktam — as stated; bhāskareṇa — by Bhāskara; iha — here; aruṇasya mahātmanaḥ — to/of the great Aruṇa.`},
{n:3,sa:`सहस्रकिरणं भानुमुदयस्थं दिवाकरम् ।\nप्रणम्य शिरसा देवमुवाच गरुडाग्रजः ॥ ३ ॥`,iast:`sahasrakiraṇaṃ bhānumudayasthaṃ divākaram |\npraṇamya śirasā devamuvāca garuḍāgrajaḥ || 3 ||`,en:`Having bowed his head to the god Bhānu, the thousand-rayed maker of the day standing at sunrise, Garuḍa’s elder brother spoke.`,wfw:`sahasra-kiraṇam — thousand-rayed; bhānum — Bhānu, the Sun; udaya-stham — standing at the rising; divākaram — the maker of day; praṇamya — having bowed; śirasā — with the head; devam — to the god; uvāca — spoke; garuḍa-agrajaḥ — Garuḍa’s elder brother, Aruṇa.`},
{n:4,sa:`भगवन्देवदेवेश सहस्रकिरणोज्ज्वल ।\nस्मृतिधर्मान्यथातत्त्वं वक्तुमर्हसि पृच्छतः ॥ ४ ॥`,iast:`bhagavandevadeveśa sahasrakiraṇojjvala |\nsmṛtidharmānyathātattvaṃ vaktumarhasi pṛcchataḥ || 4 ||`,en:`“O Blessed One, Lord of the gods, blazing with a thousand rays, please explain to me, as I ask, the Smṛti-dharmas according to their true nature.”`,wfw:`bhagavan — O Blessed One; deva-deva-īśa — Lord of the gods; sahasra-kiraṇa-ujjvala — blazing with a thousand rays; smṛti-dharmān — the dharmas of Smṛti; yathā-tattvam — according to their true reality/nature; vaktum arhasi — you ought to explain; pṛcchataḥ — to me who am asking.`},
{n:5,sa:`एवं पृष्टस्तु भगवानरुणेन खगाधिपः ।\nउवाच परया प्रीत्या पूजयित्वा महीपते ॥ ५ ॥`,iast:`evaṃ pṛṣṭastu bhagavānaruṇena khagādhipaḥ |\nuvāca parayā prītyā pūjayitvā mahīpate || 5 ||`,en:`Thus questioned by Aruṇa, the Blessed Lord replied with the highest affection after honouring him, O king.`,wfw:`evam — thus; pṛṣṭaḥ — questioned; tu — indeed; bhagavān — the Blessed Lord; aruṇena — by Aruṇa; khagādhipaḥ — lord of birds (as transmitted); uvāca — spoke; parayā prītyā — with supreme affection; pūjayitvā — having honoured; mahīpate — O king.`},
{n:6,sa:`भास्कर उवाच ।\nस्मृतिधर्मं वेदमूलं शृणु त्वं गरुडाग्रज ।\nपूर्वानुभूतं यद्ध्यानमथ तत्स्मरणं स्मृतिः ॥ ६ ॥`,iast:`bhāskara uvāca |\nsmṛtidharmaṃ vedamūlaṃ śṛṇu tvaṃ garuḍāgraja |\npūrvānubhūtaṃ yaddhyānamatha tatsmaraṇaṃ smṛtiḥ || 6 ||`,en:`Bhāskara said: “Hear, O elder brother of Garuḍa, the Smṛti-dharma whose root is the Veda. That cognition which recalls what was previously experienced is ‘memory’ (smṛti).”`,wfw:`bhāskaraḥ uvāca — Bhāskara said; smṛti-dharmam — Smṛti-dharma; veda-mūlam — rooted in the Veda; śṛṇu tvam — hear; garuḍa-agraja — O elder brother of Garuḍa; pūrva-anubhūtam — previously experienced; yat dhyānam — that cognition/contemplation which; atha — then; tat-smaraṇam — recollection of that; smṛtiḥ — is memory/Smṛti.`},
{n:7,sa:`धर्मः क्रियात्मा निर्दिष्टः श्रेयोभ्युदयलक्षणः ।\nस च पञ्चविधः प्रोक्तो वेदमूलः सनातनः ॥ ७ ॥`,iast:`dharmaḥ kriyātmā nirdiṣṭaḥ śreyobhyudayalakṣaṇaḥ |\nsa ca pañcavidhaḥ prokto vedamūlaḥ sanātanaḥ || 7 ||`,en:`Dharma is defined as having action as its nature and as characterised by highest good and prosperity. It is declared fivefold, eternal, and rooted in the Veda.`,wfw:`dharmaḥ — dharma; kriyā-ātmā — having action as its nature; nirdiṣṭaḥ — defined; śreyas-abhyudaya-lakṣaṇaḥ — characterised by highest good and worldly flourishing; saḥ ca — and it; pañca-vidhaḥ — fivefold; proktaḥ — declared; veda-mūlaḥ — rooted in the Veda; sanātanaḥ — eternal.`},
{n:8,sa:`अस्य शब्दस्यानुष्ठानात्स्वर्गो मोक्षश्च जायते ।\nइह लोके सुखैश्वर्यमलं यच्च खगाधिप ॥ ८ ॥`,iast:`asya śabdasyānuṣṭhānātsvargo mokṣaśca jāyate |\niha loke sukhaiśvaryamalaṃ yacca khagādhipa || 8 ||`,en:`From practising what is expressed by this teaching arise heaven and liberation; in this world there also arise abundant happiness and prosperity, O lord of birds.`,wfw:`asya śabdasya — of this word/teaching; anuṣṭhānāt — from practice/observance; svargaḥ — heaven; mokṣaḥ ca — and liberation; jāyate — arises; iha loke — in this world; sukha-aiśvaryam — happiness and prosperity/lordship; alam — abundantly; yat ca — and that which; khagādhipa — O lord of birds.`},
{n:9,sa:`अनूरुरुवाच ।\nकथं पंचविधो ह्येष प्रोक्तो धर्मः सनातनः ।\nकस्य भेदास्तु ते पंच ब्रूहि मे देवसत्तम ॥ ९ ॥`,iast:`anūruruvāca |\nkathaṃ paṃcavidho hyeṣa prokto dharmaḥ sanātanaḥ |\nkasya bhedāstu te paṃca brūhi me devasattama || 9 ||`,en:`Anūru said: “How is this eternal dharma said to be fivefold? What are those five divisions? Tell me, O best of gods.”`,wfw:`anūruḥ uvāca — Anūru said; katham — how; pañca-vidhaḥ — fivefold; hi eṣaḥ — indeed this; proktaḥ — said; dharmaḥ sanātanaḥ — eternal dharma; kasya bhedāḥ — whose/what divisions; tu — then; te pañca — those five; brūhi me — tell me; deva-sattama — O best of gods.`},
{n:10,sa:`भास्कर उवाच ।\nवेदधर्मः स्मृतस्त्वेक आश्रमाणां स तत्परः ।\nवर्णाश्रमस्तृतीयस्तु गुणनैमित्तिको यथा ॥ १० ॥`,iast:`bhāskara uvāca |\nvedadharmaḥ smṛtastveka āśramāṇāṃ sa tatparaḥ |\nvarṇāśramastṛtīyastu guṇanaimittiko yathā || 10 ||`,en:`Bhāskara said: “One is remembered as Veda-dharma; another pertains to the āśramas; the third is varṇāśrama-dharma, and likewise there are guṇa-dharma and naimittika-dharma.”`,wfw:`veda-dharmaḥ — Veda-dharma; smṛtaḥ — remembered/recognised; tu ekaḥ — as one; āśramāṇām — of the āśramas; sa tat-paraḥ — that pertaining to them; varṇāśramaḥ — varṇāśrama[-dharma]; tṛtīyaḥ tu — the third; guṇa — [guṇa-dharma]; naimittikaḥ — naimittika-dharma; yathā — likewise/as follows.`,note:`The transmitted syntax is compressed and the ordinal sequence is not fully explicit, but verses 11–15 clarify the intended fivefold classification.`},
{n:11,sa:`वर्णत्वमेकमाश्रित्य अधिकारे प्रवर्तते ।\nसवर्णाश्रमदंडस्तु भिक्षा दंडादिको यथा ॥ ११ ॥`,iast:`varṇatvamekamāśritya adhikāre pravartate |\nsavarṇāśramadaṃḍastu bhikṣā daṃḍādiko yathā || 11 ||`,en:`That which operates in a sphere of eligibility by relying upon varṇa-status alone is [varṇa-dharma]; the second hemistich gives staff, begging, and related observances as examples in a compressed formulation.`,wfw:`varṇatvam — varṇa-status; ekam — alone; āśritya — relying upon; adhikāre — in eligibility/competence; pravartate — operates; sa-varṇa-āśrama-daṇḍaḥ — the transmitted compound, apparently concerning varṇa/āśrama and the staff; tu — indeed; bhikṣā — begging; daṇḍa-ādikaḥ — staff and the like; yathā — for example.`,note:`The second pāda is textually compressed and the compound savarṇāśramadaṇḍa is not syntactically transparent. The translation therefore preserves the evident contrast without silently emending the text.`},
{n:12,sa:`वर्णाश्रमाश्रमत्वं च योधिकृत्य प्रवर्तते ।\nस वर्णाश्रमधर्मस्तु दंडाद्या मेखला यथा ॥ १२ ॥`,iast:`varṇāśramāśramatvaṃ ca yodhikṛtya pravartate |\nsa varṇāśramadharmastu daṃḍādyā mekhalā yathā || 12 ||`,en:`That which operates with reference to varṇa-and-āśrama status is varṇāśrama-dharma; the staff, girdle, and similar observances are given as examples.`,wfw:`varṇa-āśrama-āśramatvam — varṇa/āśrama status (as transmitted); ca — and; yat adhikṛtya — with reference to which; pravartate — operates; saḥ — that; varṇāśrama-dharmaḥ — varṇāśrama-dharma; tu — indeed; daṇḍa-ādyāḥ — staff and the like; mekhalā — girdle; yathā — for example.`,note:`The first compound is irregular as transmitted; the intended sense is clarified by the explicit label varṇāśramadharma in the second half.`},
{n:13,sa:`यो गुणेन प्रवर्तेत स गुणो धर्म उच्यते ।\nयथा मूर्धाभिषिक्तस्य प्रजानां पालनं परम् ॥ १३ ॥`,iast:`yo guṇena pravarteta sa guṇo dharma ucyate |\nyathā mūrdhābhiṣiktasya prajānāṃ pālanaṃ param || 13 ||`,en:`That dharma which operates on account of a quality is called guṇa-dharma; for example, the supreme protection of subjects by one consecrated as ruler.`,wfw:`yaḥ — which; guṇena — by/on account of a quality; pravarteta — operates; saḥ — that; guṇaḥ dharmaḥ — guṇa-dharma; ucyate — is called; yathā — for example; mūrdha-abhiṣiktasya — of one anointed on the head, a consecrated ruler; prajānām — of subjects; pālanam — protection; param — supreme/principal.`},
{n:14,sa:`निमित्तमेकमाश्रित्य यो धर्मः संप्रवर्तते ।\nनैमित्तिकः स विज्ञेयो जातिद्रव्यगुणाश्रयः ॥ १४ ॥`,iast:`nimittamekamāśritya yo dharmaḥ saṃpravartate |\nnaimittikaḥ sa vijñeyo jātidravyaguṇāśrayaḥ || 14 ||`,en:`That dharma which operates by relying upon a particular occasion or cause is to be known as naimittika; it may rest upon jāti, substance, or quality.`,wfw:`nimittam ekam — a particular occasion/cause; āśritya — relying upon; yaḥ dharmaḥ — which dharma; saṃpravartate — comes into operation; naimittikaḥ — occasion-conditioned; saḥ vijñeyaḥ — that is to be known; jāti-dravya-guṇa-āśrayaḥ — resting on jāti, substance, or quality.`},
{n:15,sa:`एष तु द्विविधः प्रोक्तः समासादविशेषतः ।\nनैमित्तिकः स विज्ञेयः प्रायश्चित्तविधिर्यथा ॥ १५ ॥`,iast:`eṣa tu dvividhaḥ proktaḥ samāsādaviśeṣataḥ |\nnaimittikaḥ sa vijñeyaḥ prāyaścittavidhiryathā || 15 ||`,en:`This is said to be twofold, in a compressed and non-differentiated statement; such naimittika dharma is to be understood, for example, in the rules of expiation.`,wfw:`eṣaḥ tu — this, however; dvi-vidhaḥ — twofold; proktaḥ — said; samāsāt — in summary; aviśeṣataḥ — without further differentiation; naimittikaḥ — naimittika; saḥ vijñeyaḥ — that is to be understood; prāyaścitta-vidhiḥ — a rule of expiation; yathā — for example.`,note:`The relation of dvividhaḥ to the rest of the verse is terse and the two subdivisions are not named here.`},
{n:16,sa:`स चतुर्धा निरूप्यस्तु स्वरूपफलसाधनैः ।\nप्रमाणतस्तु प्रत्येकसमस्तैश्च यथाक्रमम् ॥ १६ ॥`,iast:`sa caturdhā nirūpyastu svarūpaphalasādhanaiḥ |\npramāṇatastu pratyekasamastaiśca yathākramam || 16 ||`,en:`It is to be analysed fourfold—by its nature, fruit, means, and authority—each separately and all together, in due order.`,wfw:`saḥ — it; caturdhā — fourfold; nirūpyaḥ — to be analysed/determined; tu — indeed; svarūpa — nature; phala — fruit; sādhana — means; [pramāṇa] — authority/source of knowledge; pramāṇataḥ — by authority; pratyeka — individually; samastaiḥ ca — and collectively; yathākramam — in due order.`},
{n:17,sa:`श्रुत्या सह विरोधे तु बाध्यते विषयं विना ।\nव्यवस्थया विरोधेन कार्यो यत्नः परीक्ष्यते ॥ १७ ॥`,iast:`śrutyā saha virodhe tu bādhyate viṣayaṃ vinā |\nvyavasthayā virodhena kāryo yatnaḥ parīkṣyate || 17 ||`,en:`When there is conflict with Śruti, [the contrary rule] is overridden unless a distinct subject-matter can be established; effort should be made to examine the conflict by arranging the respective scopes.`,wfw:`śrutyā saha — with Śruti; virodhe — in conflict; tu — however; bādhyate — is overridden; viṣayam vinā — unless/without a distinct subject-matter; vyavasthayā — by delimitation/arrangement of scopes; virodhena — regarding the conflict; kāryaḥ yatnaḥ — effort should be made; parīkṣyate — it is examined.`},
{n:18,sa:`स्मृत्या सह विरोधेन चार्थशास्त्रस्य साधनम् ।\nपरस्परविरोधे तु अर्थशास्त्रस्य साधनम् ॥ १८ ॥`,iast:`smṛtyā saha virodhena cārthaśāstrasya sādhanam |\nparasparavirodhe tu arthaśāstrasya sādhanam || 18 ||`,en:`The text next speaks of establishing the force of Arthaśāstra where it conflicts with Smṛti and of resolving their mutual conflict according to the relevant grounds.`,wfw:`smṛtyā saha — with Smṛti; virodhena — through/in conflict; ca — and; artha-śāstrasya — of Arthaśāstra; sādhanam — establishment/justification; paraspara-virodhe — in mutual conflict; tu — however; artha-śāstrasya — of Arthaśāstra; sādhanam — establishment/grounding.`,note:`The verse repeats arthaśāstrasya sādhanam and is syntactically incomplete as transmitted; no conjectural correction has been inserted.`},
{n:19,sa:`अदृष्टार्थे विकल्पस्तु व्यवस्थासंभवे सति ।\nस्मृतिशास्त्रविकल्पस्तु आकांक्षापूरणे सति ॥ १९ ॥`,iast:`adṛṣṭārthe vikalpastu vyavasthāsaṃbhave sati |\nsmṛtiśāstravikalpastu ākāṃkṣāpūraṇe sati || 19 ||`,en:`In a matter concerning an unseen result, alternative performance (vikalpa) applies when a fixed delimitation cannot be established; alternative Smṛti rules likewise operate where the required expectancy is fulfilled.`,wfw:`adṛṣṭa-arthe — in a matter whose result is unseen; vikalpaḥ — option/alternative; tu — indeed; vyavasthā-asambhave — when fixed delimitation is impossible; sati — being so; smṛti-śāstra-vikalpaḥ — alternative among Smṛti rules; tu — then; ākāṅkṣā-pūraṇe — when syntactic/ritual expectancy is fulfilled; sati — when present.`},
{n:20,sa:`वेदमूले स्थितं त्वेतदनुष्ठानं क्रिया सती ।\nएवं शक्यविधानं तु न्यायो ह्येवं व्यवस्थितः ॥ २० ॥`,iast:`vedamūle sthitaṃ tvetadanuṣṭhānaṃ kriyā satī |\nevaṃ śakyavidhānaṃ tu nyāyo hyevaṃ vyavasthitaḥ || 20 ||`,en:`This performance, this valid action, stands upon a Vedic foundation. Thus an injunction is to be applied where possible; such is the settled reasoning.`,wfw:`veda-mūle — on a Vedic root/foundation; sthitam — established; tu etat — this indeed; anuṣṭhānam — performance/observance; kriyā satī — a valid/real action; evam — thus; śakya-vidhānam — an injunction capable of performance; tu — indeed; nyāyaḥ — reasoning/principle; hi — for; evam vyavasthitaḥ — thus settled.`},
{n:21,sa:`निषेधविधिरूपं तु द्विधा शास्त्रं खगाधिप ।\nएकरूपं वदंत्यन्ये बहुरूपमथा परे ॥ २१ ॥`,iast:`niṣedhavidhirūpaṃ tu dvidhā śāstraṃ khagādhipa |\nekarūpaṃ vadaṃtyanye bahurūpamathā pare || 21 ||`,en:`Scripture is twofold in the form of prohibition and injunction, O lord of birds. Some say it is of one form, while others say it is manifold.`,wfw:`niṣedha-vidhi-rūpam — having the forms of prohibition and injunction; tu — indeed; dvidhā — twofold; śāstram — scripture; khagādhipa — O lord of birds; eka-rūpam — of one form; vadanti — say; anye — some; bahu-rūpam — manifold; atha apare — while others.`},
{n:22,sa:`पंचप्रकाराः स्मृतय एवं शिष्यव्यवस्थिताः ।\nत्रिधा चतुर्धा द्वेधा वा एकधा बहुधा खग ॥ २२ ॥`,iast:`paṃcaprakārāḥ smṛtaya evaṃ śiṣyavyavasthitāḥ |\ntridhā caturdhā dvedhā vā ekadhā bahudhā khaga || 22 ||`,en:`Thus the Smṛtis are arranged for disciples in five kinds; from other standpoints they may be treated as threefold, fourfold, twofold, single, or manifold, O bird.`,wfw:`pañca-prakārāḥ — of five kinds; smṛtayaḥ — the Smṛtis; evam — thus; śiṣya-vyavasthitāḥ — arranged for disciples; tridhā — threefold; caturdhā — fourfold; dvedhā vā — or twofold; ekadhā — single; bahudhā — manifold; khaga — O bird.`},
{n:23,sa:`दृष्टार्था तु स्मृतिः काचिददृष्टार्था तथापरा ।\nअनुवादस्मृतिस्त्वन्या दृष्टादृष्टा तु पंचमी ।\nसर्वा एता वेदमूलाः स्मृता वै ऋषिभिः स्वयम् ॥ २३ ॥`,iast:`dṛṣṭārthā tu smṛtiḥ kācidadṛṣṭārthā tathāparā |\nanuvādasmṛtistvanyā dṛṣṭādṛṣṭā tu paṃcamī |\nsarvā etā vedamūlāḥ smṛtā vai ṛṣibhiḥ svayam || 23 ||`,en:`Some Smṛti concerns visible ends, another unseen ends; another is reiterative Smṛti, and a fifth concerns both visible and unseen ends. All these are remembered by the sages themselves as rooted in the Veda.`,wfw:`dṛṣṭa-arthā — having a visible/empirically seen purpose; tu — indeed; smṛtiḥ kācit — a certain Smṛti; adṛṣṭa-arthā — having an unseen purpose; tathā aparā — likewise another; anuvāda-smṛtiḥ — reiterative/restating Smṛti; tu anyā — another; dṛṣṭa-adṛṣṭā — concerning both visible and unseen ends; tu pañcamī — the fifth; sarvāḥ etāḥ — all these; veda-mūlāḥ — rooted in the Veda; smṛtāḥ — remembered/recognised; vai — indeed; ṛṣibhiḥ svayam — by the sages themselves.`,note:`The verse calls dṛṣṭādṛṣṭā “the fifth” but only four categories are overtly named here. Verse 25 supplies an additional category, nyāyamūlā, suggesting a loss or compression in the transmitted enumeration.`},
{n:24,sa:`अरुण उवाच ।\nया एता भवता प्रोक्ताः स्मृतयः पर्वगोपने ।\nएतासां लक्षणं ब्रूहि समासादेव सत्तम ॥ २४ ॥`,iast:`aruṇa uvāca |\nyā etā bhavatā proktāḥ smṛtayaḥ parvagopane |\netāsāṃ lakṣaṇaṃ brūhi samāsādeva sattama || 24 ||`,en:`Aruṇa said: “Please state briefly, O excellent one, the defining marks of these Smṛtis that you have taught.”`,wfw:`aruṇaḥ uvāca — Aruṇa said; yāḥ etāḥ — these which; bhavatā proktāḥ — have been stated by you; smṛtayaḥ — Smṛtis; parva-gopane — transmitted phrase, literally ‘in the guarding of the parvan’; etāsām — of these; lakṣaṇam — defining characteristic; brūhi — tell; samāsāt eva — briefly indeed; sattama — O excellent one.`,note:`parvagopane is obscure in this context; it is retained rather than normalised away.`},
{n:25,sa:`दृष्टार्था का मता देव अदृष्टार्था च का भवेत् ।\nदृष्टादृष्टस्वरूपा का न्यायमूला च का भवेत् ।\nअनुवादस्मृतिः का स्यादृष्टादृष्टा तु का भवेत् ॥ २५ ॥`,iast:`dṛṣṭārthā kā matā deva adṛṣṭārthā ca kā bhavet |\ndṛṣṭādṛṣṭasvarūpā kā nyāyamūlā ca kā bhavet |\nanuvādasmṛtiḥ kā syādṛṣṭādṛṣṭā tu kā bhavet || 25 ||`,en:`“Which is regarded as concerning visible ends, O god, and which concerns unseen ends? Which has the nature of both visible and unseen ends, which is rooted in reasoning, and which is reiterative Smṛti?”`,wfw:`dṛṣṭa-arthā — concerning visible ends; kā matā — which is regarded; deva — O god; adṛṣṭa-arthā — concerning unseen ends; ca kā bhavet — and which is; dṛṣṭa-adṛṣṭa-svarūpā — of both visible-and-unseen character; kā — which; nyāya-mūlā — rooted in reasoning/nyāya; ca — and; kā bhavet — which is; anuvāda-smṛtiḥ — reiterative Smṛti; kā syāt — which might be; dṛṣṭa-adṛṣṭā — visible-and-unseen; tu — then; kā bhavet — which is.`,note:`The transmitted verse appears to repeat dṛṣṭādṛṣṭa while also naming nyāyamūlā; this supports the enumeration problem already visible in verse 23.`},
{n:26,sa:`एवमुक्तो महातेजा भास्करो वारितस्करः ।\nउवाच तं खगं वीरं प्रणतं विनयान्वितम् ॥ २६ ॥`,iast:`evamukto mahātejā bhāskaro vāritaskaraḥ |\nuvāca taṃ khagaṃ vīraṃ praṇataṃ vinayānvitam || 26 ||`,en:`Thus addressed, the greatly radiant Bhāskara, called here vāritaskara, spoke to that heroic bird who had bowed with humility.`,wfw:`evam uktaḥ — thus addressed; mahā-tejāḥ — greatly radiant; bhāskaraḥ — Bhāskara; vāri-taskaraḥ — transmitted epithet, literally ‘water-thief’; uvāca — spoke; tam khagam — to that bird; vīram — heroic; praṇatam — bowed; vinaya-anvitam — endowed with humility.`,note:`vāritaskara is a solar epithet in the transmitted text, literally “stealer of waters,” presumably alluding to evaporation.`},
{n:27,sa:`आदित्य उवाच ।\nषड्गुणस्य स्वरूपं तु प्रयोगात् कार्यगौरवात् ।\nसमयानामुपायानां योगो व्याससमासतः ॥ २७ ॥`,iast:`āditya uvāca |\nṣaḍguṇasya svarūpaṃ tu prayogāt kāryagauravāt |\nsamayānāmupāyānāṃ yogo vyāsasamāsataḥ || 27 ||`,en:`Āditya said: “The nature of the six measures, their application, the weight of the task, conventions, and the conjunction of expedients are treated both in detail and in summary.”`,wfw:`ādityaḥ uvāca — Āditya said; ṣaḍ-guṇasya — of the six measures/policies; svarūpam — nature; tu — indeed; prayogāt — from/in application; kārya-gauravāt — from the gravity/importance of the task; samayānām — of conventions/agreements; upāyānām — of expedients; yogaḥ — combination/application; vyāsa-samāsataḥ — in detail and in summary.`},
{n:28,sa:`अध्यक्षाणां च निक्षेपः करणानां निरूपणम् ।\nदृष्टार्थेयं स्मृतिः प्रोक्ता ऋषिभिर्गरुडाग्रज ॥ २८ ॥`,iast:`adhyakṣāṇāṃ ca nikṣepaḥ karaṇānāṃ nirūpaṇam |\ndṛṣṭārtheyaṃ smṛtiḥ proktā ṛṣibhirgaruḍāgraja || 28 ||`,en:`The appointment or placement of superintendents and the determination of instruments/procedures—this is called Smṛti directed to visible ends by the sages, O elder brother of Garuḍa.`,wfw:`adhyakṣāṇām — of superintendents/officials; ca — and; nikṣepaḥ — placement/appointment/deposit; karaṇānām — of instruments/procedures; nirūpaṇam — determination/analysis; dṛṣṭa-arthā — directed to visible ends; iyam smṛtiḥ — this Smṛti; proktā — said; ṛṣibhiḥ — by the sages; garuḍa-agraja — O elder brother of Garuḍa.`},
{n:29,sa:`संध्योपास्तिस्तथा कार्या शुनो मांसं न भक्षयेत् ।\nअदृष्टार्था स्मृतिः प्रोक्ता मनुना विनतात्मज ॥ २९ ॥`,iast:`saṃdhyopāstistathā kāryā śuno māṃsaṃ na bhakṣayet |\nadṛṣṭārthā smṛtiḥ proktā manunā vinatātmaja || 29 ||`,en:`“The twilight worship is to be performed; one should not eat the flesh of a dog.” Smṛti of this kind is said by Manu to concern unseen ends, O son of Vinatā.`,wfw:`sandhyā-upāstiḥ — twilight worship; tathā — likewise; kāryā — is to be performed; śunaḥ — of a dog; māṃsam — flesh; na bhakṣayet — one should not eat; adṛṣṭa-arthā — concerning an unseen result; smṛtiḥ — Smṛti; proktā — said; manunā — by Manu; vinatā-ātmaja — O son of Vinatā.`},
{n:30,sa:`पालाशं धारयेद्दंडमुभयार्था विदुर्बुधाः ।\nविरोधे तु विकल्पः स्याद्यागो होमस्ततो यथा ॥ ३० ॥`,iast:`pālāśaṃ dhārayeddaṃḍamubhayārthā vidurbudhāḥ |\nvirodhe tu vikalpaḥ syādyāgo homastato yathā || 30 ||`,en:`“One should carry a staff of palāśa wood”—the wise understand such a rule as serving both kinds of ends. Where rules conflict, there may be an option, as between a yāga and a homa.`,wfw:`pālāśam — made of palāśa wood; dhārayet — one should carry; daṇḍam — a staff; ubhaya-arthā — concerning both [visible and unseen] ends; viduḥ — understand; budhāḥ — the wise; virodhe — in conflict; tu — however; vikalpaḥ — optional alternative; syāt — may occur; yāgaḥ — sacrifice; homaḥ — oblation; tataḥ yathā — as, for example, in such a case.`},
{n:31,sa:`श्रुतौ दृष्टं यथा कार्यं स्मृतो तत्तादृशं यदि ।\nउक्तानुवादिनी सा तु पारिव्राज्यं तथा गृहात् ॥ ३१ ॥`,iast:`śrutau dṛṣṭaṃ yathā kāryaṃ smṛto tattādṛśaṃ yadi |\nuktānuvādinī sā tu pārivrājyaṃ tathā gṛhāt || 31 ||`,en:`When something enjoined in Śruti is remembered in Smṛti in the same form, that Smṛti is reiterative of what has already been stated; renunciation from the household is given as the example.`,wfw:`śrutau — in Śruti; dṛṣṭam — seen/found; yathā kāryam — as something to be done; smṛtau — in Smṛti (transmitted smṛto); tat tādṛśam — that same thing in like form; yadi — if; ukta-anuvādinī — reiterating what has been stated; sā tu — that indeed; pārivrājyam — renunciation/mendicancy; tathā — thus/likewise; gṛhāt — from the house.`},
{n:32,sa:`उक्तो धर्मश्च संक्षेपात्परिभाषा च तद्गता ।\nतत्साधनं च देशादि इत्थमित्यब्रवीद्रविः ॥ ३२ ॥`,iast:`ukto dharmaśca saṃkṣepātparibhāṣā ca tadgatā |\ntatsādhanaṃ ca deśādi itthamityabravīdraviḥ || 32 ||`,en:`Thus dharma has been stated in summary, together with the interpretive rule belonging to it and its means, beginning with the relevant region. So spoke Ravi.`,wfw:`uktaḥ — stated; dharmaḥ ca — and dharma; saṃkṣepāt — in summary; paribhāṣā — interpretive rule/definition; ca — and; tad-gatā — belonging to it; tat-sādhanam — its means; ca — and; deśa-ādi — region and so forth; ittham iti — thus; abravīt — said; raviḥ — Ravi/the Sun.`},
{n:33,sa:`ब्रह्मावर्तः परो देश ऋषिशस्तस्त्वनंतरः ।\nमध्यदेशस्ततोऽप्यन्य आर्यावर्तस्त्वनंतरः ॥ ३३ ॥`,iast:`brahmāvartaḥ paro deśa ṛṣiśastastvanaṃtaraḥ |\nmadhyadeśastato'pyanya āryāvartastvanaṃtaraḥ || 33 ||`,en:`Brahmāvarta is the foremost region; next is the region praised by the sages. Then comes another, Madhyadeśa, and after that Āryāvarta.`,wfw:`brahmāvartaḥ — Brahmāvarta; paraḥ deśaḥ — the foremost/supreme region; ṛṣi-śastaḥ — praised by the sages; tu anantaraḥ — next thereafter; madhyadeśaḥ — Madhyadeśa; tataḥ api anyaḥ — another after that; āryāvartaḥ — Āryāvarta; tu anantaraḥ — next thereafter.`},
{n:34,sa:`कृष्णसारस्तु विचरेन्मृगो यत्र स्वभावतः ।\nयज्ञियः स तु देशः स्यान्म्लेच्छदेशस्ततः परः ॥ ३४ ॥`,iast:`kṛṣṇasārastu vicarenmṛgo yatra svabhāvataḥ |\nyajñiyaḥ sa tu deśaḥ syānmlecchadeśastataḥ paraḥ || 34 ||`,en:`The region in which the black antelope naturally roams is fit for sacrifice; beyond that is called mleccha-country.`,wfw:`kṛṣṇasāraḥ — the black antelope; tu — indeed; vicaret — roams; mṛgaḥ — the deer; yatra — where; svabhāvataḥ — naturally; yajñiyaḥ — fit for sacrifice; saḥ tu deśaḥ — that region; syāt — is/should be; mleccha-deśaḥ — mleccha country; tataḥ paraḥ — beyond that.`},
{n:35,sa:`ब्रह्मादीनां च देवानां ब्राह्मणादेस्तथैव च ।\nभूतग्रामस्य कृत्स्नस्य त्रयं कृत्स्नस्य खेचर ॥ ३५ ॥`,iast:`brahmādīnāṃ ca devānāṃ brāhmaṇādestathaiva ca |\nbhūtagrāmasya kṛtsnasya trayaṃ kṛtsnasya khecara || 35 ||`,en:`The transmitted verse speaks of the gods beginning with Brahmā, of Brahmins and the rest, and of the entire aggregate of beings, and then refers to a “threefold” totality, O bird; the construction is incomplete without the following verse.`,wfw:`brahma-ādīnām — of those beginning with Brahmā; ca devānām — and of the gods; brāhmaṇa-ādeḥ — of Brahmins and the rest; tathā eva ca — likewise also; bhūta-grāmasya — of the aggregate of beings; kṛtsnasya — entire; trayam — a triad/threefold [set]; kṛtsnasya — of the whole; khecara — O bird.`,note:`The syntax is defective or highly compressed. Verse 36 appears to continue the thought, but the exact referent of trayam is not securely recoverable from the transmitted wording.`},
{n:36,sa:`साधनत्वं मनुः प्राह वेदमूलं सनातनम् ।\nप्रकाशयज्ञसंसिद्ध्यै यदशब्दस्य एव तु ॥ ३६ ॥`,iast:`sādhanatvaṃ manuḥ prāha vedamūlaṃ sanātanam |\nprakāśayajñasaṃsiddhyai yadaśabdasya eva tu || 36 ||`,en:`Manu declared its status as a means, eternal and rooted in the Veda, for the accomplishment of the manifest sacrifice; the final expression concerning “that which is non-verbal” is textually difficult.`,wfw:`sādhanatvam — the status/function of being a means; manuḥ prāha — Manu said; veda-mūlam — rooted in the Veda; sanātanam — eternal; prakāśa-yajña-saṃsiddhyai — for the accomplishment/perfection of the manifest sacrifice; yat — which/that; aśabdasya — of the non-verbal/unexpressed; eva tu — indeed.`,note:`The second hemistich is obscure as transmitted and is not normalised conjecturally.`},
{n:37,sa:`उपलभ्य यथातत्त्वं स च दर्शितवानृषिः ।\nसम्यक्संसाधनं धर्मः कर्तव्यस्त्वधिकारिणा ॥ ३७ ॥`,iast:`upalabhya yathātattvaṃ sa ca darśitavānṛṣiḥ |\nsamyaksaṃsādhanaṃ dharmaḥ kartavyastvadhikāriṇā || 37 ||`,en:`Having apprehended it according to its true nature, that sage set it forth. Dharma is to be properly accomplished by one who possesses the relevant eligibility.`,wfw:`upalabhya — having apprehended; yathā-tattvam — according to the true nature; saḥ ca — and he; darśitavān — set forth/showed; ṛṣiḥ — the sage; samyak-saṃsādhanam — proper/full accomplishment; dharmaḥ — dharma; kartavyaḥ — is to be done; tu — indeed; adhikāriṇā — by one possessing eligibility/adhikāra.`},
{n:38,sa:`निष्कामेन सदा वीर काम्यं रूपान्वितेन च ।\nआचारयुक्तः श्रद्धालुर्वेदज्ञोऽध्यात्मचिंतकः ।\nकर्मणां फलमाप्नोति न्यायार्जितधनश्च यः ॥ ३८ ॥`,iast:`niṣkāmena sadā vīra kāmyaṃ rūpānvitena ca |\nācārayuktaḥ śraddhālurvedajño'dhyātmaciṃtakaḥ |\nkarmaṇāṃ phalamāpnoti nyāyārjitadhanaśca yaḥ || 38 ||`,en:`O hero, [obligatory dharma is performed] without desire, while a desire-motivated rite is performed by one endowed with the corresponding aim. One who possesses proper conduct and faith, knows the Veda, reflects on the self, and has wealth acquired justly obtains the fruit of rites.`,wfw:`niṣkāmena — by one without desire for fruit; sadā — always; vīra — O hero; kāmyam — a desire-motivated rite; rūpa-anvitena — by one endowed with the relevant form/aim (transmitted expression); ca — and; ācāra-yuktaḥ — endowed with proper conduct; śraddhāluḥ — faithful; veda-jñaḥ — knower of the Veda; adhyātma-cintakaḥ — one who reflects on the self/spiritual reality; karmaṇām — of actions/rites; phalam — fruit; āpnoti — obtains; nyāya-arjita-dhanaḥ — possessing wealth acquired justly; ca yaḥ — and who.`,note:`The first pāda is elliptical: the contrast is evidently between niṣkāma performance and kāmya performance, but the noun governing niṣkāmena is understood rather than expressed.`},
{n:39,sa:`अरुण उवाच ।\nब्रह्मावर्तादिदेशानां समस्तानां विभावसो ।\nविभागं ब्रूहि देवेंद्र संमानय ग्रहाधिप ॥ ३९ ॥`,iast:`aruṇa uvāca |\nbrahmāvartādideśānāṃ samastānāṃ vibhāvaso |\nvibhāgaṃ brūhi deveṃdra saṃmānaya grahādhipa || 39 ||`,en:`Aruṇa said: “O radiant one, tell me the divisions of all the regions beginning with Brahmāvarta, O lord of gods, O lord of the planets.”`,wfw:`aruṇaḥ uvāca — Aruṇa said; brahmāvarta-ādi-deśānām — of the regions beginning with Brahmāvarta; samastānām — of all; vibhāvaso — O radiant one; vibhāgam — division/demarcation; brūhi — tell; deva-indra — O lord of gods; saṃmānaya — transmitted form, contextually vocative/imperative-like and uncertain; graha-adhipa — O lord of the planets.`,note:`saṃmānaya is difficult in the transmitted line and may conceal a textual corruption; it has not been forced into the translation.`},
{n:40,sa:`आदित्य उवाच ।\nसरस्वतीदृषद्वत्योर्देवनद्योर्यदंतरम् ।\nतं देवनिर्मितं देशं ब्रह्मावर्तं प्रचक्षते ॥ ४० ॥`,iast:`āditya uvāca |\nsarasvatīdṛṣadvatyordevanadyoryadaṃtaram |\ntaṃ devanirmitaṃ deśaṃ brahmāvartaṃ pracakṣate || 40 ||`,en:`Āditya said: “The land lying between the divine rivers Sarasvatī and Dṛṣadvatī, fashioned by the gods, is called Brahmāvarta.”`,wfw:`ādityaḥ uvāca — Āditya said; sarasvatī-dṛṣadvatyoḥ — of/between Sarasvatī and Dṛṣadvatī; deva-nadyoḥ — the two divine rivers; yat antaram — the interval/land between; tam — that; deva-nirmitam — fashioned by the gods; deśam — region; brahmāvartam — Brahmāvarta; pracakṣate — they call.`},
{n:41,sa:`हिमवद्विंध्यधरयोर्यदंतरमुदाहृतम् ।\nप्रत्यगेव प्रयागाच्च मध्यदेशः प्रकीर्तितः ।\nआसमुद्रात्तु वै पूर्वादासमुद्रात्तु पश्चिमात् ॥ ४१ ॥`,iast:`himavadviṃdhyadharayoryadaṃtaramudāhṛtam |\npratyageva prayāgācca madhyadeśaḥ prakīrtitaḥ |\nāsamudrāttu vai pūrvādāsamudrāttu paścimāt || 41 ||`,en:`The region stated to lie between the Himalaya and Vindhya and west of Prayāga is called Madhyadeśa; the verse then gives the eastern and western seas as further geographical limits leading into the next definition.`,wfw:`himavat-vindhya-dharayoḥ — between the Himalaya and Vindhya ranges; yat antaram — whatever lies between; udāhṛtam — stated; pratyak eva — westward indeed; prayāgāt ca — from Prayāga; madhyadeśaḥ — Madhyadeśa; prakīrtitaḥ — is proclaimed; ā-samudrāt — up to/from the sea; tu vai — indeed; pūrvāt — eastern; ā-samudrāt — up to/from the sea; tu paścimāt — western.`},
{n:42,sa:`तयोरेवांतरं गिर्योरार्यावर्तं विदुर्बुधाः ।\nएतान्विज्ञाय सद्देशान्त्संश्रयेत प्रयत्नतः ॥ ४२ ॥`,iast:`tayorevāṃtaraṃ giryorāryāvartaṃ vidurbudhāḥ |\netānvijñāya saddeśāntsaṃśrayeta prayatnataḥ || 42 ||`,en:`The wise know Āryāvarta as the region between those two mountain ranges. Having understood these good regions, one should make every effort to reside in them.`,wfw:`tayoḥ eva — of those very two; antaram — the region between; giryoḥ — mountains; āryāvartam — Āryāvarta; viduḥ — know; budhāḥ — the wise; etān — these; vijñāya — having understood; sat-deśān — good/proper regions; saṃśrayeta — one should resort to/reside in; prayatnataḥ — with effort.`},
{n:43,sa:`शूद्रस्तु यस्मिंस्तस्मिन्वा निवसेद्वृत्तिकर्शितः ।\nएषा धर्मस्य वै ज्योतिः समासात्कथिता तव ॥ ४३ ॥`,iast:`śūdrastu yasmiṃstasminvā nivasedvṛttikarśitaḥ |\neṣā dharmasya vai jyotiḥ samāsātkathitā tava || 43 ||`,en:`A Śūdra, however, when distressed for livelihood, may reside wherever necessary. Thus this illumination of dharma has been stated to you in summary.`,wfw:`śūdraḥ tu — a Śūdra, however; yasmin tasmin vā — in whichever place whatsoever; nivaset — may reside; vṛtti-karśitaḥ — afflicted/pressed by livelihood; eṣā — this; dharmasya — of dharma; vai — indeed; jyotiḥ — light/illumination; samāsāt — in summary; kathitā — stated; tava — to you.`}
];
