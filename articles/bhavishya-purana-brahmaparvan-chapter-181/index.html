</script><script>const A=[
'Shatānīka asks for an orderly account of the fivefold smārta dharma, both briefly and in detail.',
'Sumantu says that he will describe the fivefold dharma as Bhāskara formerly explained it to the great Aruṇa.',
'Aruṇa bows to the thousand-rayed rising Sun, the maker of the day.',
'He asks the Lord of gods, radiant with a thousand rays, to explain the true nature of the dharmas taught in Smṛti.',
'Bhagavān, questioned by Aruṇa, answers with great affection after honouring him.',
'Bhāskara says: hear the Smṛti-dharma, rooted in the Veda; remembrance is the recollection of what has previously been apprehended.',
'Dharma is described as consisting in action and marked by welfare and the highest good; it is fivefold, eternal and rooted in the Veda.',
'By practising this teaching one obtains heaven and liberation, as well as happiness and prosperity in this world.',
'Aruṇa asks how eternal dharma is fivefold and requests the names and distinctions of those five divisions.',
'Bhāskara enumerates Vedic dharma, āśrama-dharma, varṇa-āśrama dharma, guṇa-dharma and naimittika dharma.',
'A rule that operates by relying upon varṇa-status concerns the corresponding sphere of eligibility; the text gives varṇa-specific observances as examples.',
'A rule proceeding with reference jointly to varṇa and āśrama is called varṇāśrama-dharma; staffs, girdles and related observances are examples.',
'A rule that operates because of a quality is called guṇa-dharma; the protection of subjects by one consecrated as king is given as an example.',
'A dharma that arises from a particular occasion is naimittika; it may rest upon jāti, substance or quality.',
'Naimittika dharma is further described as having divisions, with expiation given as a standard example.',
'Each kind of dharma is to be analysed by its own nature, fruit, means and authority, singly and collectively.',
'Where Smṛti appears to conflict with Śruti, the conflict must be resolved by attention to scope and proper arrangement rather than casually setting Śruti aside.',
'The text likewise discusses how apparent conflicts among Smṛti and disciplines such as Arthaśāstra are to be weighed and reconciled.',
'Where a matter concerns unseen results and no fixed reconciliation is available, authorised alternatives taught in Smṛti may operate.',
'Right practice is to be grounded in the Veda and examined through sound reasoning and established usage.',
'Rules of injunction and prohibition are distinguished, and a single principle may appear in multiple practical forms.',
'Smṛti itself is classified in several ways, which may be grouped as threefold, fourfold, twofold, single or manifold according to standpoint.',
'Some rules concern visible purposes, others unseen results, some restate revelation, and some combine these functions; all remain Veda-rooted.',
'Aruṇa asks Bhāskara to define these categories more precisely.',
'He requests an explanation of their distinctive signs so that the divisions may be properly understood.',
'Bhāskara begins the requested explanation.',
'Rules serving directly observable purposes are described first, including practical procedures that secure order in worldly dealings.',
'Administrative and juridical procedures involving officers, deposits and transactions are examples of rules with visibly ascertainable purposes.',
'Rules such as the daily twilight worship and prohibitions concerning impure food are presented as connected especially with unseen religious results.',
'Some prescriptions combine visible and unseen purposes; when authorised alternatives conflict, the śāstric pattern of optionality is to be applied.',
'A Smṛti statement that restates a Vedic command is authoritative as a remembered expression of revelation; renunciatory teachings are cited as an example.',
'The chapter now summarises these forms of dharma and turns to the lands in which their observance is especially prescribed.',
'Brahmāvarta, the lands praised by ṛṣis, Madhyadeśa and Āryāvarta are named as exemplary sacred regions.',
'The land in which the black antelope naturally roams is called fit for sacrifice; regions beyond are described by the text as mleccha lands.',
'The verse connects the sacred social and cosmic order with Brahmā, the varṇas and living beings, in a compressed formulation.',
'Manu is cited concerning Veda-rooted means by which sacrificial and dharmic action is properly accomplished.',
'Dharma is to be properly accomplished by the person who possesses the relevant adhikāra or qualification.',
'One should act without selfish desire; the person endowed with proper conduct, faith, Vedic knowledge, spiritual reflection and lawfully acquired wealth obtains the fruit of rites.',
'Aruṇa asks for the precise boundaries of the sacred geographical regions just mentioned.',
'The land between the Sarasvatī and Dṛṣadvatī is identified as Brahmāvarta.',
'The region bounded by the Himalaya and Vindhya and extending between the eastern and western seas is described in relation to Madhyadeśa.',
'The wise know Āryāvarta as the country between the stated mountain boundaries, and one should make an effort to dwell in good lands.',
'A Śūdra pressed by the need for livelihood may dwell wherever necessary; with this the text concludes its concise account of this portion of dharma.'
];const T=Object.fromEntries(A.map((en,i)=>[i+1,en]));renderBhavishyaLiveChapter({chapter:181,verseCount:43,subtitle:'The fivefold structure of Smṛti-dharma and its Vedic foundation',colophon:'Bhaviṣya Purāṇa, Brāhmaparvan 1.181.'},T);</script></body></html>
