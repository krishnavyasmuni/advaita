/assets/js/bhavishya-live-reader.js?v=20260915"></script><script>const T={1:'The speaker says that there are countless celestial vehicles in the form of stars, and that one who bows obtains the corresponding fruit.',2:'These exalted destinations of followers of the solar dharma have been described; therefore one who seeks happiness should continually practise that dharma.',3:'The text now briefly sets out major accumulations of sin that lead to hell, committed through mind, speech and body.',4:'The acts listed here, including harmful actions involving roads, forests, fire, towns and villages, are declared comparable to the sin of drinking liquor.',5:'Stealing or seizing people, elephants, horses, cattle, land and medicinal plants in the forest is included among these grave offences.',6:'Theft of sandalwood, aloeswood, camphor, musk, fine cloth and entrusted valuables is declared comparable to stealing gold.',7:'Wrongfully taking marriageable maidens and illicit approaches to the wives of sons, friends or relatives are condemned.',8:'Violence toward a maiden, relations with an outcaste woman, and the prohibited intercourse described here are equated with violation of the guru’s bed.',9:'The text continues its catalogue of grave sexual and social transgressions and treats them as offences of the same serious class.',10:'Abandoning a good wife, worthy relatives or ascetics is counted among the serious secondary sins.',11:'Stealing cows, land, gold or clothing, and greatly afflicting those whose minds are dedicated to the Lord, are condemned.',12:'Even a small act of oppression against one dwelling in an āśrama, or against his dependants, cattle, grain or wealth, is treated as sinful.',13:'Stealing wells, grain or cattle, officiating for those unfit for sacrifice, and selling sacrificial grounds, gardens, tanks, wife or children are condemned.',14:'Those who wickedly appropriate resources intended for pilgrimage, fasting, vows, japa or the property of women incur sin.',15:'Failure to protect women, indulgence in drink and illicit women, withholding what is due to ṛṣis, and exploitative increase of grain are condemned.',16:'Slandering gods, sacred fire, good men and women, cows, Brahmins, or rulers—whether openly or secretly—is included in the list.',17:'Those who neglect ancestral and divine rites, abandon their proper duties, behave badly, deny sacred authority, or maintain nihilistic views are described as sinners.',18:'The text condemns sexual conduct driven by desire in prohibited conditions and places, including intercourse with a menstruating woman.',19:'Those who destroy the welfare of wife, son or friend, cut down gardens, speak hurtfully to people, or deliberately divide public opinion are condemned.',20:'One who breaks embankments, crossings or channels, or deliberately disrupts people seated in one row, is also included among these offenders.',21:'People guilty of the sins just enumerated are remembered as upapātakins—those who have committed secondary grave sins.'};renderBhavishyaLiveChapter({chapter:190,verseCount:21,subtitle:'Sauradharma — a catalogue of upapātakas and serious secondary sins',colophon:'Bhaviṣya Purāṇa, Brāhmaparvan 1.190.'},T);</script></body></html>
