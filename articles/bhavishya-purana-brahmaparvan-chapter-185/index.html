const verses=[
{n:1,sa:`आदित्य उवाच ।\nरात्रौ श्राद्धं न कुर्वीत राक्षसी कीर्तिता हि सा ।\nसन्ध्ययोरुभयोर्वीर सूर्ये चैव तिरोहिते ॥ १ ॥`,iast:`āditya uvāca |\nrātrau śrāddhaṃ na kurvīta rākṣasī kīrtitā hi sā |\nsandhyayorubhayorvīra sūrye caiva tirohite || 1 ||`,en:`Āditya said: “One should not perform śrāddha at night, for night is described here as belonging to the rākṣasas; nor at either twilight, O hero, when the Sun has disappeared.”`,wfw:`rātrau — at night; śrāddham na kurvīta — one should not perform śrāddha; rākṣasī kīrtitā — it is called rākṣasa-like; sandhyayoḥ ubhayoḥ — at both twilights; sūrye tirohite — when the Sun is hidden.`},
{n:2,sa:`अकृत्वा मातृयज्ञं तु यः श्राद्धं परिवेषयेत् ।\nतातस्य क्रोधसंयुक्तां हिंसामिच्छन्ति दारुणाम् ॥ २ ॥`,iast:`akṛtvā mātṛyajñaṃ tu yaḥ śrāddhaṃ pariveṣayet |\ntātasya krodhasaṃyuktāṃ hiṃsāmicchaṃti dāruṇām || 2 ||`,en:`“If one serves the śrāddha without first performing the rite for the Mothers, those Mothers are said, in anger, to wish terrible harm upon his father.”`,wfw:`akṛtvā mātṛ-yajñam — without performing the offering to the Mothers; yaḥ śrāddham pariveṣayet — who serves the śrāddha; krodha-saṃyuktāḥ — filled with anger; tātasya dāruṇām hiṃsām icchanti — they wish severe harm to his father.`},
{n:3,sa:`अनूरुरुवाच ।\nमातृश्राद्धं कथं कार्यं काश्च ता मातरः स्मृताः ।\nनान्दीमुखाश्च पितरः कथं पूजामवाप्नुयुः ॥ ३ ॥`,iast:`anūruruvāca |\nmātṛśrāddhaṃ kathaṃ kāryaṃ kāśca tā mātaraḥ smṛtāḥ |\nnāṃdīmukhāśca pitaraḥ kathaṃ pūjāmavāpnuyuḥ || 3 ||`,en:`Anūru said: “How is the śrāddha for the Mothers to be performed, and who are those Mothers? And how do the Nandīmukha ancestors receive their worship?”`,wfw:`mātṛ-śrāddham katham kāryam — how is the maternal śrāddha to be done; kāḥ tāḥ mātaraḥ — who are those Mothers; nāndīmukhāḥ pitaraḥ — Nandīmukha ancestors; katham pūjām avāpnuyuḥ — how do they receive worship?`},
{n:4,sa:`आदित्य उवाच ।\nहन्त ते सम्प्रवक्ष्यामि मातृश्राद्धविधिं खग ।\nशृणु त्वं खगशार्दूल गदतो मम कृत्स्नशः ॥ ४ ॥`,iast:`āditya uvāca |\nhanta te sampravakṣyāmi mātṛśrāddhavidhiṃ khaga |\nśṛṇu tvaṃ khagaśārdūla gadato mama kṛtsnaśaḥ || 4 ||`,en:`Āditya said: “Very well; I shall explain to you the procedure of the Mothers' śrāddha. Hear it fully from me, O tiger among birds.”`,wfw:`te sampravakṣyāmi — I shall explain to you; mātṛ-śrāddha-vidhim — the procedure of maternal śrāddha; śṛṇu — hear; kṛtsnaśaḥ — completely.`},
{n:5,sa:`पूर्वाह्णे भोजयेद्विप्रानष्टौ सर्वान्प्रदक्षिणान् ।\nतथान्यं नवमं विप्रं चतुरश्च खगाधिप ॥ ५ ॥`,iast:`pūrvāhṇe bhojayedviprānaṣṭau sarvānpradakṣiṇān |\ntathānyaṃ navamaṃ vipraṃ caturaśca khagādhipa || 5 ||`,en:`“In the forenoon one should feed eight Brahmins, arranging the rite clockwise; a ninth Brahmin is also specified, together with a further group of four, O lord of birds.”`,wfw:`pūrvāhṇe — in the forenoon; bhojayet viprān aṣṭau — should feed eight Brahmins; pradakṣiṇān — in clockwise order; navamam vipram — a ninth Brahmin; caturaḥ ca — and four more. The construction is technical and terse.`},
{n:6,sa:`ऋजून्वै कृतपान्दत्त्वा सत्येन विधिवत्खग ।\nकृत्वा यवैस्तिलार्थं तु दधिमिश्रं क्रमेण च ॥ ६ ॥`,iast:`ṛjūnvai kṛtapāndattvā satyena vidhivatkhaga |\nkṛtvā yavaistilārthaṃ tu dadhimiśraṃ krameṇa ca || 6 ||`,en:`“The prescribed recipients are to be seated and served according to rule; barley is used in the place prescribed for sesame and is mixed with curd in due sequence.”`,wfw:`ṛjūn — straight or properly arranged recipients; vidhivat — according to rule; yavaiḥ — with barley; tilārtham — in the place or function of sesame; dadhi-miśram — mixed with curd; krameṇa — in order. The first pāda is textually compressed.`},
{n:7,sa:`गन्धपुष्पादिकं सर्वं कुर्याद्विप्रप्रदक्षिणम् ।\nब्राह्मणेभ्यस्ततो दद्यान्मधुरं भोजनं खग ॥ ७ ॥`,iast:`gandhapuṣpādikaṃ sarvaṃ kuryādviprapradakṣiṇam |\nbrāhmaṇebhyastato dadyānmadhuraṃ bhojanaṃ khaga || 7 ||`,en:`“Fragrance, flowers, and the other offerings should all be presented to the Brahmins in clockwise order; then sweet food should be given to them, O bird.”`,wfw:`gandha-puṣpa-ādikam — fragrance, flowers, and so on; vipra-pradakṣiṇam — clockwise around the Brahmins; brāhmaṇebhyaḥ dadyāt — should give to the Brahmins; madhuram bhojanam — sweet food.`},
{n:8,sa:`गुडमिश्रं खगश्रेष्ठ सवस्त्रमोदनं परम् ।\nरसानां मोदकांश्चैव न च तान्कटुकांस्तथा ॥ ८ ॥`,iast:`guḍamiśraṃ khagaśreṣṭha savastramodanaṃ param |\nrasānāṃ modakāṃścaiva na ca tānkaṭukāṃstathā || 8 ||`,en:`“The food should include excellent rice mixed with jaggery, with the prescribed gifts of cloth, and sweet preparations such as modakas; pungent preparations are to be avoided.”`,wfw:`guḍa-miśram — mixed with jaggery; odanam param — excellent cooked rice; sa-vastram — with cloth or garment-gifts; modakān — sweet cakes; na kaṭukān — not pungent foods.`},
{n:9,sa:`एवं भुक्तेषु विप्रेषु दद्यात्पिण्डान्समाहितः ।\nदध्यक्षतविमिश्रांस्तु बदरैश्च खगाधिप ॥ ९ ॥`,iast:`evaṃ bhukteṣu vipreṣu dadyātpiṃḍā nsamāhitaḥ |\ndadhyakṣatavimiśrāṃstu badaraiśca khagādhipa || 9 ||`,en:`“After the Brahmins have eaten in this way, one should attentively offer the piṇḍas mixed with curd, unbroken rice, and jujube fruits, O lord of birds.”`,wfw:`bhukteṣu vipreṣu — after the Brahmins have eaten; piṇḍān dadyāt — should give piṇḍas; samāhitaḥ — attentively; dadhi-akṣata-vimiśrān — mixed with curd and unbroken rice; badaraiḥ — with jujube fruits.`},
{n:10,sa:`कृत्वा तु मण्डपं वीर चतुरस्रं प्रदक्षिणम् ।\nपूर्वाग्रांश्च कुशान्दत्त्वा पुष्पाणां प्रकरं तथा ॥ १० ॥`,iast:`kṛtvā tu maṃḍapaṃ vīra caturasraṃ pradakṣiṇam |\npūrvāgrāṃśca kuśāndattvā puṣpāṇāṃ prakaraṃ tathā || 10 ||`,en:`“A square ritual pavilion should be prepared, O hero, with the arrangement oriented clockwise. Kuśa grass with its tips to the east and a quantity of flowers should then be placed.”`,wfw:`maṇḍapam caturasram — a square pavilion; pradakṣiṇam — clockwise arrangement; pūrva-agrān kuśān — kuśa with tips eastward; puṣpāṇām prakaram — a spread or heap of flowers.`},
{n:11,sa:`सव्येन पाणिना वीर विधिवत्खगसत्तम ।\nमात्रे प्रमात्रे तन्मात्रे निर्वपेत्पूर्वतोमुखः ॥ ११ ॥`,iast:`savyena pāṇinā vīra vidhivatkhagasattama |\nmātre pramātre tanmātre nirvapetpūrvatomukhaḥ || 11 ||`,en:`“Facing east, one should make the offerings according to rule with the left hand to the mother, the mother's mother, and her mother, O best of birds.”`,wfw:`savyena pāṇinā — with the left hand; vidhivat — according to rule; mātre — to the mother; pramātre — to the grandmother; tanmātre — to her mother; pūrvataḥ-mukhaḥ — facing east.`},
{n:12,sa:`पितुर्मात्रे तु तन्मात्रे निर्वपेद्विधिवत्खग ।\nवृद्धायै प्रपितामह्यै तथान्यं निर्वपेद्बुधः ॥ १२ ॥`,iast:`piturmātre tu tanmātre nirvapedvidhiva tkhaga |\nvṛddhāyai prapitāmahyai tathānyaṃ nirvapedbudhaḥ || 12 ||`,en:`“Likewise the wise should offer according to rule to the father's mother, to her mother, and to the elder great-grandmother, O bird.”`,wfw:`pituḥ mātre — to the father's mother; tanmātre — to her mother; vṛddhāyai prapitāmahyai — to the elder great-grandmother; nirvapet — should offer.`},
{n:13,sa:`एवमुद्दिश्य वै मातॄः षट् पिण्डान्निर्वपेत्खग ।\nअष्टाशयेद्द्विजान्वीर मातृश्राद्धे खगाधिप ।\nनवमं सर्वदैवत्यं भोजयेद्विधिवत्खग ॥ १३ ॥`,iast:`evamuddiśya vai mātṝḥ ṣaṭ piṃḍānnirvapetkhaga |\naṣṭāśayeddvijānvīra mātṛśrāddhe khagā dhipa |\nnavamaṃ sarvadaivatyaṃ bhojayedvidhivatkhaga || 13 ||`,en:`“Thus, designating the Mothers, one should offer six piṇḍas. In the maternal śrāddha eight Brahmins should be fed, and a ninth representing all the deities should also be fed according to rule.”`,wfw:`mātṝḥ uddiśya — designating the Mothers; ṣaṭ piṇḍān nirvapet — offer six piṇḍas; aṣṭa dvijān āśayet — seat or feed eight Brahmins; navamam sarva-daivatyam — a ninth for all deities; bhojayet — should feed.`},
{n:14,sa:`नान्दीमुखांस्तानुद्दिश्य पितॄन्पञ्च द्विजोत्तमान् ।\nभोजयेद्विधिच्छ्राद्धे वृद्धिश्राद्धे प्रदक्षिणम् ॥ १४ ॥`,iast:`nāṃdīmukhāṃstānuddiśya pitṝnpaṃca dvijottamān |\nbhojayedvidhicchrāddhe vṛddhiśrāddhe pradakṣiṇam || 14 ||`,en:`“For the Nandīmukha ancestors one should designate them accordingly and feed five excellent Brahmins in the Vṛddhi-śrāddha, following the clockwise procedure.”`,wfw:`nāndīmukhān pitṝn uddiśya — designating the Nandīmukha ancestors; pañca dvijottamān — five excellent Brahmins; bhojayet — should feed; vṛddhi-śrāddhe — in the prosperity śrāddha; pradakṣiṇam — clockwise.`},
{n:15,sa:`इत्थं श्राद्धद्वयं कुर्याद्वृद्धौ कश्यपनन्दन ।\nतथान्यमपि ते वच्मि परं श्राद्धविधिं तव ॥ १५ ॥`,iast:`itthaṃ śrāddhadvayaṃ kuyādvṛddhau kaśyapanaṃdana |\ntathānyamapi te vacmi paraṃ śrāddhavidhiṃ tava || 15 ||`,en:`“In this way the two śrāddhas are to be performed on an occasion of increase, O son of Kaśyapa. I shall now tell you a further rule concerning śrāddha.”`,wfw:`ittham — thus; śrāddha-dvayam kuryāt — should perform the two śrāddhas; vṛddhau — on an occasion of prosperity; anyam param śrāddha-vidhim — another further procedure.`},
{n:16,sa:`अथैवं भोजयेच्छ्राद्धे तत्पूर्वं तु प्रवर्तयेत् ।\nअन्यथा तत्र लुम्पन्ति सदेवासुरमानुषाः ॥ १६ ॥`,iast:`athaivaṃ bhojayecchrāddhe tatpūrvaṃ tu pravartayet |\nanyathā tatra luṃpaṃti sadevāsuramānuṣāḥ || 16 ||`,en:`“The preliminary offering is to be set in motion before the feeding at śrāddha; otherwise the text says that gods, asuras, and humans may interfere with or appropriate the offering.”`,wfw:`tat-pūrvam pravartayet — should begin the preliminary rite first; śrāddhe bhojayet — then feed at śrāddha; anyathā — otherwise; sa-deva-asura-mānuṣāḥ lumpanti — gods, asuras, and humans may take or disrupt it.`},
{n:17,sa:`अग्न्यभावे तु विप्रस्य पाणावेवोपपादयेत् ।\nयो ह्यग्निः स द्विजो वीन्द्र मन्त्रदर्शिभिरुच्यते ॥ १७ ॥`,iast:`agnyabhāve tu viprasya pāṇāvevopapādayet |\nyo hyagniḥ sa dvijo vīnda maṃtradarśibhirucyate || 17 ||`,en:`“When fire is unavailable, the offering may be placed in the Brahmin's hand, for the seers of the mantras declare that the twice-born recipient himself functions as fire in this rite.”`,wfw:`agni-abhāve — in the absence of fire; viprasya pāṇau — in the Brahmin's hand; upapādayet — should place it; sa dvijaḥ agniḥ — that twice-born is the fire; mantra-darśibhiḥ ucyate — so the seers of mantras say.`},
{n:18,sa:`पूर्वपात्रे यदन्नं च यच्चान्नमुपकल्पितम् ।\nतेनैव सह भोक्तव्यं पृथग्भावो न विद्यते ॥ १८ ॥`,iast:`pūrva pātre yadannaṃ ca yaccānnamupakalpitam |\ntenaiva saha bhoktavyaṃ pṛthagbhāvo na vidyate || 18 ||`,en:`“The food placed in the first vessel and the food otherwise prepared for the rite are to be eaten together; they are not to be treated as separate.”`,wfw:`pūrva-pātre yat annam — food in the first vessel; yat annam upakalpitam — food that has been prepared; tena eva saha bhoktavyam — to be eaten together with it; pṛthak-bhāvaḥ na vidyate — there is no separation.`},
{n:19,sa:`द्वौ दैवेऽथर्वणौ विप्रौ प्राङ्मुखावुपवेशयेत् ।\nपित्र्ये त्रीनुदगास्यांश्च वृद्धौ चाध्वर्युसंगमान् ॥ १९ ॥`,iast:`dvau daive'tharvaṇau viprau prāṅmukhāvupaveśayet |\npitrye trīnudagāsyāṃśca vṛddhau cādhvaryusaṃgamān || 19 ||`,en:`“For the divine portion, two Atharvan Brahmins are to be seated facing east; for the ancestral portion three are seated facing north. The verse also associates the Vṛddhi rite with Adhvaryu-type officiants.”`,wfw:`dvau atharvaṇau viprau — two Atharvan Brahmins; prāṅmukhau — facing east; pitrye trīn — three for the ancestral part; udag-āsyān — facing north; vṛddhau — in the prosperity rite; adhvaryu-saṃgamān — associated with Adhvaryus.`},
{n:20,sa:`त्रीणि श्राद्धे पवित्राणि दौहित्रः कुतुपास्तिलाः ।\nत्रीणि चात्र प्रशंसन्ति शौचमक्रोधमत्वरम् ॥ २० ॥`,iast:`trīṇi śrāddhe pavitrāṇi dauhitraḥ kutupāstilāḥ |\ntrīṇi cātra praśaṃsaṃti śaucamakrodhamatvaram || 20 ||`,en:`“Three things are especially purifying in śrāddha: a daughter's son, the kutapa time or implement, and sesame. Three qualities are likewise praised: purity, freedom from anger, and absence of haste.”`,wfw:`trīṇi pavitrāṇi — three purifying things; dauhitraḥ — daughter's son; kutupaḥ — kutapa; tilāḥ — sesame; śaucam — purity; akrodham — absence of anger; atvaram — absence of haste.`},
{n:21,sa:`दौहित्रं खण्डमित्युक्तं ललाटाय प्रजापते ।\nतत्र शृङ्गस्य यत्पात्रं तद्दौहितमिति स्मृतम् ॥ २१ ॥`,iast:`dauhitraṃ khaṃḍamityuktaṃ lalāṭāya prajāpate |\ntatra śṛṃgasya yatpātraṃ taddauhitramiti smṛtam || 21 ||`,en:`This verse gives a technical explanation of the term dauhitra involving a “section,” the forehead of Prajāpati, and a horn-shaped vessel. The transmitted wording is obscure, so the translation preserves the technical sense without forcing a speculative identification.`,wfw:`dauhitraṃ khaṇḍam iti uktam — “dauhitra” is called a section; lalāṭāya prajāpateḥ — relating to the forehead of Prajāpati; śṛṅgasya yat pātram — the vessel belonging to the horn; tat dauhitram iti smṛtam — that is remembered as dauhitra. Textually difficult.`},
{n:22,sa:`सव्यादंसात्परिभ्रष्टं नाभिदेशे व्यवस्थितम् ।\nएकवस्त्रं तु तं विद्याद्दैवे पित्र्ये च वर्जयेत् ॥ २२ ॥`,iast:`savyādaṃsātparibhraṣṭaṃ nābhideśe vyavasthitam |\nekavastraṃ tu taṃ vidyāddaive pitrye ca varjayet || 22 ||`,en:`“A garment that has slipped from the left shoulder and rests around the navel is treated as a single garment only; such a state of dress should be avoided in both divine and ancestral rites.”`,wfw:`savyāt aṃsāt paribhraṣṭam — slipped from the left shoulder; nābhi-deśe vyavasthitam — resting at the navel; eka-vastram — treated as one garment; daive pitrye ca varjayet — avoid in divine and ancestral rites.`},
{n:23,sa:`पितृदेवमनुष्याणां पूजनं भोजनं तथा ।\nनोत्तरीयं विना कार्यं कृतं स्यान्निष्फलं यतः ॥ २३ ॥`,iast:`pitṛdevamanuṣyāṇāṃ pūjanaṃ bhojanaṃ tathā |\nnottarīyaṃ vinā kāryaṃ kṛtaṃ syānniṣphalaṃ yataḥ || 23 ||`,en:`“Worship and feeding directed to ancestors, gods, or human guests should not be done without an upper garment, because an act so performed is said to be fruitless.”`,wfw:`pitṛ-deva-manuṣyāṇām — of ancestors, gods, and humans; pūjanam bhojanam — worship and feeding; uttarīyam vinā na kāryam — not to be done without an upper garment; niṣphalam — fruitless.`},
{n:24,sa:`परिधानकृते स्कन्धे गृहस्थो योऽर्चयेत्पितॄन् ।\nन स तत्फलमाप्नोति यथा योगपटावृतः ॥ २४ ॥`,iast:`paridhānakṛte skaṃdhe gṛhastho yo'rcayetpitṝn |\nna sa tatphalamāpnoti yathā yogapaṭāvṛtaḥ || 24 ||`,en:`“A householder who worships the ancestors while his clothing is arranged over the shoulder in the prohibited manner does not obtain the fruit of the rite; the verse contrasts this with the authorized yogapaṭa usage.”`,wfw:`gṛhasthaḥ — a householder; paridhāna-kṛte skandhe — with clothing arranged on the shoulder; pitṝn arcayet — worships the ancestors; tat-phalam na āpnoti — does not obtain the fruit; yogapaṭa — ascetic support-cloth.`},
{n:25,sa:`वनस्थानां खगश्रेष्ठ यतीनां च महामते ।\nसिद्धये कर्मणां वीर योगपट्टकमुच्यते ॥ २५ ॥`,iast:`vanasthānāṃ khagaśreṣṭha yatīnāṃ ca mahāmate |\nsiddhaye karmaṇāṃ vīra yogapaṭṭakamucyate || 25 ||`,en:`“For forest-dwellers and renunciants, however, the yogapaṭṭa is prescribed for the proper accomplishment of their rites, O best of birds.”`,wfw:`vanasthānām — for forest-dwellers; yatīnām — for ascetics; karmaṇām siddhaye — for accomplishment of rites; yogapaṭṭakam ucyate — the yogapaṭṭa is prescribed.`},
{n:26,sa:`हस्तौ प्रक्षाल्य गण्डूषं यः पिबेदविचक्षणः ।\nस तु दैवं च पित्र्यं च आत्मानं चोपघातयेत् ॥ २६ ॥`,iast:`hastau prakṣālya gaṃḍūṣaṃ yaḥ pibedavicakṣaṇaḥ |\nsa tu daivaṃ ca pitryaṃ ca ātmānaṃ copaghā tayet || 26 ||`,en:`“An unwise man who, after washing his hands, swallows the water intended for rinsing the mouth is said to injure the divine rite, the ancestral rite, and himself.”`,wfw:`hastau prakṣālya — after washing the hands; gaṇḍūṣam pibet — drinks the mouth-rinse; avicakṣaṇaḥ — unwise; daivam pitryam ca — divine and ancestral rites; ātmānam ca upaghātayet — harms himself also.`},
{n:27,sa:`भोजनेष्वेव तिष्ठन्ति स्वस्ति कुर्वन्ति ये द्विजाः ।\nआसुरं तद्भवेच्छ्राद्धं पितॄणां नोपतिष्ठते ॥ २७ ॥`,iast:`bhojaneṣveva tiṣṭhaṃti svasti kurvaṃti ye dvijāḥ |\nāsuraṃ tadbhavecchrāddhaṃ pitṝṇāṃ nopatiṣṭhate || 27 ||`,en:`“If the Brahmins stand during the meal and pronounce the blessing in that state, the śrāddha is characterized here as āsuric and does not reach the ancestors.”`,wfw:`bhojaneṣu tiṣṭhanti — stand during the meal; svasti kurvanti — pronounce the blessing; ye dvijāḥ — those Brahmins; āsuram śrāddham — an āsuric śrāddha; pitṝṇām na upatiṣṭhate — does not reach the ancestors.`},
{n:28,sa:`दातारो नोऽभिवर्धन्तां वेदाः सन्ततिरेव च ।\nश्रद्धा च नो मा व्यगमद्बहुदेयं च नोऽस्त्विति ॥ २८ ॥`,iast:`dātāro nobhivardhaṃtā vedāḥ saṃta tireva ca |\nśraddhā ca no mā vyagamadbahudeyaṃ ca no'stviti || 28 ||`,en:`The concluding blessing is: “May our donors increase; may the Vedas and our lineage increase. May faith never depart from us, and may there always be much for us to give.”`,wfw:`dātāraḥ naḥ abhivardhantām — may our donors increase; vedāḥ — the Vedas; santatiḥ — progeny or lineage; śraddhā naḥ mā vyagamat — may faith not leave us; bahu-deyam naḥ astu — may we have much to give.`}
];renderBhavishyaChapter({chapter:185,subtitle:"Mātṛ-śrāddha-vidhi-varṇanam — Maternal and Nandīmukha Śrāddha Procedures",colophon:"End of Bhaviṣya Purāṇa, Brāhmaparvan 1.185."},verses);</script></body></html>
