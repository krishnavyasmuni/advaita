</script><script>const A=[
'Āditya says that the eternal form of dharma together with its qualifications has been explained; he will now describe the dharma of those in the āśramas.',
'Brahmacārin, householder, forest-dweller and mendicant are declared the four āśramas, one life-order in four forms.',
'Four kinds of brahmacārin are named: Gāyatra, Prājāpatya, Devavrata and Naiṣṭhika.',
'The four āśramas are said to share the Veda and dharma; the text now turns to saṃskāras that perfect religious life.',
'Garbhādhāna is prescribed at the proper season with mantras, and puṃsavana for the mother in the third month.',
'Sīmantonnayana is prescribed during pregnancy, while garbhādhāna and the related prenatal rites are classed as preparatory saṃskāras.',
'Jātakarma and the other saṃskāras belong to the child after birth; at birth the prescribed substances are administered with mantras.',
'This is called jātakarma; a private name is given then, while the public naming is to be performed on the eleventh day.',
'Annaprāśana is prescribed in the sixth month and cūḍākarman in the first or third year.',
'Upanayana for a Brahmin is prescribed in the eighth or tenth year; the text then distinguishes the ages of other jātis.',
'For Kṣatriyas and Vaiśyas it is prescribed in the eleventh or twelfth year; upanayana is identified as the saṃskāra connected with Vedic study.',
'The text names Sāvitra, Vaidika, Mahānāmnī and Mahāvrata observances among the disciplines connected with study.',
'Upaniṣadic study, annual vows and godāna are also listed as observances undertaken for receiving and mastering the Veda.',
'The Gṛhya texts elaborate partial Vedic study, while service to the teacher is said to secure both visible and unseen ends.',
'The duties owed to the teacher are to be performed according to rule and revelation; meditation or attention toward the teacher is described as threefold.',
'Mutual satisfaction and proper conduct summarize the discipline; one following his own dharma should seek mastery of the entire Veda.',
'Having learned the Veda and its textual meanings, the brahmacārin completes his course; after the prescribed gift and the teacher’s permission he may become a householder.',
'Departure from the teacher’s house and the concluding bath are to be performed properly according to the applicable form of brahmacarya.',
'Thereafter the qualified man, whose brahmacarya has remained unbroken, should marry a wife of the same varṇa and possessing the prescribed marks.',
'Some authorities allow greater freedom, but the text specifies restrictions of kinship on both the paternal and maternal sides.',
'A twice-born man should marry a woman not belonging to the same ṛṣi-gotra; the text discusses how gotra restrictions operate in different marriage rules.',
'Because the traditions of the ṛṣis vary, some matters are treated as alternatives; eight forms of marriage are recognised for the varṇas as saṃskāras.',
'A father who gives a daughter while concealing a defect is liable to the stated royal fine.',
'The text gives a traditional warning concerning a daughter who menstruates while still unmarried in her father’s house.',
'A Brahmin who knowingly marries such a woman is described in strongly condemnatory ritual language and may be excluded from certain rites.',
'Defects of either woman or man should be disclosed before the marriage alliance is concluded.',
'The text classifies girls by traditional age and developmental categories, ranking Gaurī first and a menstruating girl last.',
'Aruṇa asks what is meant by the terms Gaurī, Rohiṇī, rajasvalā, nagnikā and devakanyā.',
'Bhāskara answers: Gaurī is pre-menstrual, Rohiṇī has reached menstruation, and nagnikā is described by the absence of the stated physical signs.',
'The text attaches conventional ages to Gaurī and nagnikā and says that after the stated age menstruation becomes the defining condition.',
'A traditional cosmological explanation is given for the stages of female development, associating Soma, Gandharvas and Agni with them.',
'The verse warns, in the idiom of the tradition, of harms believed to follow if marriage is delayed through the developmental stages just described.',
'The father is therefore instructed, according to this traditional scheme, to give his daughter before the conditions the passage considers disqualifying arise.',
'Food from one who violates these rules is condemned, and expiation is prescribed for knowingly eating such food.',
'The text prescribes prāṇāyāma and ghee as expiation, and then discusses the serious fault of marriage within the same gotra or pravara.',
'Marriage with close prohibited kin likewise requires a severe expiation; a lunar penance is mentioned for the twice-born offender.',
'For twice-born marriage the approved woman is one who is not a sapiṇḍa of the mother and not of the father’s gotra.',
'Aruṇa asks what the phrase dārakarma means in the preceding rule concerning marriage and intercourse.',
'Āditya explains that Vedic acts such as Agnihotra performed by the couple together are called dārakarma because they depend upon the marital union.',
'The text lists physical conditions and traits that, according to its traditional marriage rules, are to be avoided in selecting a bride.',
'It also discourages certain names associated with animals, trees, rivers, mountains, Yakṣas, serpents or servile status.',
'A wise man is told to avoid a woman whose brother or father is unknown, out of concern for the traditional putrikā rule.',
'The preferred bride is described by traditional ideals of voice, complexion and eyes; such a woman is recommended to the man seeking household life.',
'If a younger brother marries while the elder remains unmarried, the younger is called parivettā and the elder parivitti.',
'The text extends blame to those involved in that irregular marriage, including the woman, giver and officiant.',
'Exceptions are allowed if the elder brother is impotent, absent abroad, fallen, renounced or fully engaged in yogic discipline.',
'Further exceptions are listed for severe bodily or sensory disabilities.',
'The verse links proper ritual and marriage suitability to family and character, saying that neither mantras nor mere formal selection can cure a defective alliance.',
'A married girl whose marriage has not been consummated and who returns to a husband may still be treated as a maiden for the stated purpose.',
'A father may reassign an unconsummated daughter to a man of good family and character; the text says no fault arises in that case.',
'Aruṇa asks for the defining marks of the eight forms of marriage that have just been mentioned.',
'Āditya defines Brāhma marriage as giving an adorned, auspicious bride endowed with family standing, character and qualities to a worthy man.',
'Prājāpatya marriage is the giving of the adorned bride under an agreement that the couple will perform dharma together.',
'Ārṣa marriage is defined through the traditional gift associated with a pair of cattle and the prescribed marriage setting.',
'Daiva marriage is the giving of the ornamented bride to an officiating priest within the sacrificial enclosure.',
'These first four marriages are praised as bringing dharma, desire and prosperity and as being free from bride-price.',
'A son born from a woman given in one of these four forms is said to purify ancestral generations on both the giver’s and receiver’s sides.',
'Gāndharva marriage is the voluntary union of woman and man in private arising from mutual affection.',
'Rākṣasa marriage is defined as forcible abduction of a crying woman after violence and breaking resistance.',
'Āsura marriage is described as taking the bride after payment of wealth or bride-price.',
'Paiśāca, condemned as the worst, is sexual approach to a sleeping, intoxicated or incapacitated woman in secret.',
'The text distinguishes the latter forms by varṇa and says that the violent Rākṣasa form is specifically associated with Kṣatriya prowess.',
'When a marriage is properly undertaken, the auspicious wedding procedure with sacred fire is prescribed for the first three varṇas.',
'A stated fine applies to giving a defective bride without disclosure and to related disputes over bride-price.',
'The chapter now lists grounds and issues connected with separation, hostility, women’s property, waiting periods and abandonment.',
'Because husband and wife are mutually related, dissolution is not to be undertaken merely from passing anger or displeasure.',
'Harming or oppressing one’s wife is described as hostility; maintenance, ornaments, bride-price and gains are included under strīdhana.',
'If a husband consumes or misuses that property contrary to his undertaking, he must restore it with the prescribed increase.',
'In genuine emergency the husband may use strīdhana; the text also prescribes an eight-year waiting period in relation to childlessness.',
'If no son is born despite serious effort, a man seeking offspring may, under the text’s rules, take another woman of good family lawfully.',
'The text treats obtaining offspring as a major household aim and requires the existing wife or wives to be materially satisfied before another marriage.',
'A traditional numerical scheme is then stated for the number of wives permitted to Śūdra, Vaiśya, Kṣatriya and Brahmin men, with a separate allowance for kings.',
'Failure by the husband to approach at the proper season and reciprocal failures within marriage are said to cause loss of the couple’s respective dharma.',
'Where seasonal opportunities coincide, the text prescribes an order based on marriage seniority and related household considerations.',
'The eight forms of marriage, beginning with Brāhma, are again said to function as saṃskāras connected with the varṇas.',
'The eight are enumerated: Brāhma, Daiva, Ārṣa, Prājāpatya, Gāndharva, Āsura, Rākṣasa and Paiśāca, the last being condemned as lowest.',
'The text discusses which marriage forms are regarded as suitable for the various varṇas and places special restrictions on Brahmin marriage transactions.',
'For a Kṣatriya the text disallows the specified acceptance arrangement; authorities differ in details, but marriage is ultimately described as a purifying saṃskāra for human beings.'
