<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 182: Sanskrit, close English translation, word-for-word glosses, and transliteration."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 182 — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/advaita/assets/css/site.css?v=20260915-2"><link rel="stylesheet" href="/advaita/assets/css/bhavishya-reader.css?v=20260915"></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 182</h1><p class="article-date">15 September 2026</p><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-181/">← Chapter 181</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-183/">Chapter 183 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-reader.js?v=20260915-4"></script><script>
const verses=[
{n:1,sa:`आदित्य उवाच ।\nउक्तं धर्मस्य रूपं तु साधिकारं सनातनम् ।\nअतः परं प्रवक्ष्यामि धर्ममाश्रमिणां खग ॥ १ ॥`,iast:`āditya uvāca |\nuktaṃ dharmasya rūpaṃ tu sādhikāraṃ sanātanam |\nataḥ paraṃ pravakṣyāmi dharmamāśramiṇāṃ khaga || 1 ||`,en:`Āditya said: “The eternal form of dharma, together with its sphere of eligibility, has been stated. Now I shall explain the dharma of those belonging to the āśramas, O bird.”`,wfw:`ādityaḥ uvāca — Āditya said; uktam — has been stated; dharmasya rūpam — the form/nature of dharma; tu — indeed; sa-adhikāram — together with eligibility/adhikāra; sanātanam — eternal; ataḥ param — from here onward; pravakṣyāmi — I shall explain; dharmam — dharma; āśramiṇām — of those in the āśramas; khaga — O bird.`},
{n:2,sa:`ब्रह्मचारी गृहस्थश्च वनस्थो भिक्षुरेव च ।\nचत्वार आश्रमाः प्रोक्ता एक एव चतुर्विधः ॥ २ ॥`,iast:`brahmacārī gṛhasthaśca vanastho bhikṣureva ca |\ncatvāra āśramāḥ proktā eka eva caturvidhaḥ || 2 ||`,en:`The brahmacārin, householder, forest-dweller, and mendicant are declared to be the four āśramas—one [life-order] in four forms.`,wfw:`brahmacārī — celibate student; gṛhasthaḥ — householder; ca — and; vanasthaḥ — forest-dweller; bhikṣuḥ — mendicant; eva ca — and indeed; catvāraḥ āśramāḥ — four āśramas; proktāḥ — declared; ekaḥ eva — one indeed; caturvidhaḥ — fourfold.`},
{n:3,sa:`गायत्रो ब्रह्मचारी तु प्राजापत्यो द्वितीयकः ।\nदेवव्रतस्तृतीयस्तु नैष्ठिकस्तु चतुर्थकः ॥ ३ ॥`,iast:`gāyatro brahmacārī tu prājāpatyo dvitīyakaḥ |\ndevavratastṛtīyastu naiṣṭhikastu caturthakaḥ || 3 ||`,en:`The Gāyatra is one kind of brahmacārin; the Prājāpatya is the second, the Devavrata the third, and the Naiṣṭhika the fourth.`,wfw:`gāyatraḥ — the Gāyatra type; brahmacārī — brahmacārin; tu — indeed; prājāpatyaḥ — Prājāpatya; dvitīyakaḥ — second; devavrataḥ — Devavrata; tṛtīyaḥ — third; naiṣṭhikaḥ — Naiṣṭhika; caturthakaḥ — fourth.`},
{n:4,sa:`चत्वार आश्रमाः प्रोक्ताः सवेदाः समधर्मकाः ।\nअतः परं प्रवक्ष्यामि संस्कारं धर्मसिद्धये ॥ ४ ॥`,iast:`catvāra āśramāḥ proktāḥ savedāḥ samadharmakāḥ |\nataḥ paraṃ pravakṣyāmi saṃskāraṃ dharmasiddhaye || 4 ||`,en:`The four āśramas have been declared, connected with the Veda and sharing dharma. I shall now explain the saṃskāras for the accomplishment of dharma.`,wfw:`catvāraḥ āśramāḥ — the four āśramas; proktāḥ — declared; sa-vedāḥ — together with/connected to the Veda; sama-dharmakāḥ — sharing the same dharma / equal in dharma; ataḥ param — henceforth; pravakṣyāmi — I shall explain; saṃskāram — saṃskāra; dharma-siddhaye — for accomplishment of dharma.`},
{n:5,sa:`गर्भाधानमृतौ कार्यं हृष्टयोस्तु समन्त्रकम् ।\nकार्यं पुंसवनं मातुस्तृतीये मासि संयुतैः ॥ ५ ॥`,iast:`garbhādhānamṛtau kāryaṃ hṛṣṭayostu samantrakam |\nkāryaṃ puṃsavanaṃ mātustṛtīye māsi saṃyutaiḥ || 5 ||`,en:`Garbhādhāna is to be performed at the proper season, with mantras, by the joyful couple. Puṃsavana for the mother is to be performed in the third month with the prescribed accompaniments.`,wfw:`garbhādhānam — the impregnation rite; ṛtau — in the proper season; kāryam — is to be performed; hṛṣṭayoḥ — of the two who are joyful; tu — indeed; sa-mantrakam — accompanied by mantras; kāryam — to be done; puṃsavanam — puṃsavana rite; mātuḥ — for/of the mother; tṛtīye māsi — in the third month; saṃyutaiḥ — with the prescribed accompaniments.`},
{n:6,sa:`सीमन्तः सप्तमे गर्भे षष्ठे वा सप्तमेऽपि वा ।\nपात्रसंस्कारका इष्टा गर्भाधानादयस्त्रयः ॥ ६ ॥`,iast:`sīmantaḥ saptame garbhe ṣaṣṭhe vā saptame'pi vā |\npātrasaṃskārakā iṣṭā garbhādhānādayastrayaḥ || 6 ||`,en:`The sīmanta rite is prescribed in the sixth or seventh [month] of pregnancy. The three beginning with garbhādhāna are regarded as saṃskāras preparing the “vessel” [the parents/embryonic context].`,wfw:`sīmantaḥ — sīmanta rite; saptame garbhe — in the seventh [month] of pregnancy; ṣaṣṭhe vā — or in the sixth; saptame api vā — or even the seventh; pātra-saṃskārakāḥ — saṃskāras preparing the vessel/recipient; iṣṭāḥ — regarded/approved; garbhādhāna-ādayaḥ — beginning with garbhādhāna; trayaḥ — three.`,note:`The first pāda redundantly mentions the seventh month twice as transmitted.`},
{n:7,sa:`जातकर्मादयः सर्वे संस्काराः पुरुषस्य तु ।\nजातस्य प्राशनं यत्र स्वर्णादीनां समन्त्रकम् ॥ ७ ॥`,iast:`jātakarmādayaḥ sarve saṃskārāḥ puruṣasya tu |\njātasya prāśanaṃ yatra svarṇādīnāṃ samantrakam || 7 ||`,en:`Jātakarma and the subsequent rites are saṃskāras of the person himself. At birth there is the mantra-accompanied administration of gold and the other prescribed substances.`,wfw:`jātakarma-ādayaḥ — jātakarma and those following; sarve saṃskārāḥ — all the saṃskāras; puruṣasya — of the person; tu — indeed; jātasya — of the newborn; prāśanam — administration for tasting/ingestion; yatra — wherein; svarṇa-ādīnām — of gold and the other [substances]; sa-mantrakam — accompanied by mantras.`},
{n:8,sa:`जातकर्मेति तत्प्रोक्तं गुह्यं नाम तदैव तु ।\nप्रकाशो नाम कर्तव्यं दिने त्वेकादशेऽर्थवत् ॥ ८ ॥`,iast:`jātakarmeti tatproktaṃ guhyaṃ nāma tadaiva tu |\nprakāśo nāma kartavyaṃ dine tvekādaśe'rthavat || 8 ||`,en:`That is called jātakarma. A private name is [given] then itself; a public, meaningful name is to be given on the eleventh day.`,wfw:`jātakarma iti — “jātakarma”; tat proktam — that is called; guhyam nāma — a secret/private name; tadā eva — then itself; tu — indeed; prakāśaḥ nāma — a public name; kartavyam — is to be made/given; dine ekādaśe — on the eleventh day; arthavat — meaningful/significant.`},
{n:9,sa:`धर्मशास्त्रादिसंयुक्तं षष्ठेऽन्नप्राशनं खग ।\nप्रथमेऽब्दे तृतीये वा चूडाकर्म विधीयते ॥ ९ ॥`,iast:`dharmaśāstrādisaṃyuktaṃ ṣaṣṭhe'nnaprāśanaṃ khaga |\nprathame'bde tṛtīye vā cūḍākarma vidhīyate || 9 ||`,en:`Annaprāśana, accompanied by the prescriptions of Dharmaśāstra and the like, is performed in the sixth [month], O bird; cūḍākarman is prescribed in the first or third year.`,wfw:`dharma-śāstra-ādi-saṃyuktam — accompanied by Dharmaśāstra and related prescriptions; ṣaṣṭhe — in the sixth [month]; anna-prāśanam — first feeding of solid food; khaga — O bird; prathame abde — in the first year; tṛtīye vā — or the third; cūḍā-karma — tonsure rite; vidhīyate — is prescribed.`},
{n:10,sa:`अष्टमे दशमे वापि ब्राह्मणस्योपनायनम् ।\nपुरुषस्य तथा चान्यजातीयानां विशेषतः ॥ १० ॥`,iast:`aṣṭame daśame vāpi brāhmaṇasyopanāyanam |\npuruṣasya tathā cānyajātīyānāṃ viśeṣataḥ || 10 ||`,en:`For a Brahmin, upanayana is [prescribed] in the eighth or even the tenth [year]; for men of other jātis the rule differs in particular.`,wfw:`aṣṭame — in the eighth [year]; daśame vā api — or even the tenth; brāhmaṇasya — of a Brahmin; upanāyanam — upanayana; puruṣasya — of the male/person; tathā ca — and likewise; anya-jātīyānām — of those belonging to other jātis; viśeṣataḥ — specifically/with distinction.`},
{n:11,sa:`एकादशे द्वादशे वा कार्य क्षत्रियवैश्ययोः ।\nवेदसंस्कारकं वच्मि मन्यन्ते त्वौपनायनम् ॥ ११ ॥`,iast:`ekādaśe dvādaśe vā kārya kṣatriyavaiśyayoḥ |\nvedasaṃskārakaṃ vacmi manyante tvaupanāyanam || 11 ||`,en:`For Kṣatriya and Vaiśya it is to be performed in the eleventh or twelfth [year]. I call upanayana the saṃskāra connected with the Veda; so it is regarded.`,wfw:`ekādaśe — in the eleventh; dvādaśe vā — or twelfth; kāryam — to be done; kṣatriya-vaiśyayoḥ — for the Kṣatriya and Vaiśya; veda-saṃskārakam — a Veda-related saṃskāra; vacmi — I say; manyante — they regard; tu — indeed; aupanāyanam — upanayana.`},
{n:12,sa:`पुरुषस्य तथा चान्य उभयोश्च ब्रवीम्यहम् ।\nसावित्रं वैदिकं चैव महानाम्नीमहाव्रतम् ॥ १२ ॥`,iast:`puruṣasya tathā cānya ubhayośca bravīmyaham |\nsāvitraṃ vaidikaṃ caiva mahānāmnīmahāvratam || 12 ||`,en:`I shall also state the further observances of the person and of both [categories]: the Sāvitra, the Vaidika, the Mahānāmnī, and the Mahāvrata.`,wfw:`puruṣasya — of the person; tathā ca — and likewise; anyaḥ — another/further [rite]; ubhayoḥ ca — and of both; bravīmi aham — I state; sāvitram — Sāvitra vow; vaidikam — Vaidika; ca eva — and indeed; mahānāmnī — Mahānāmnī; mahāvratam — Mahāvrata.`},
{n:13,sa:`तथौपनिषदं चाब्दं गोदानं च सुवर्णकम् ।\nव्रतानि ग्रहणार्थानि वेदस्येति मनोर्मतम् ॥ १३ ॥`,iast:`tathaupaniṣadaṃ cābdaṃ godānaṃ ca suvarṇakam |\nvratāni grahaṇārthāni vedasyeti manormatam || 13 ||`,en:`Likewise [there are] the Upaniṣadic, annual, godāna, and suvarṇaka observances. Manu holds that these vows are for the reception/mastery of the Veda.`,wfw:`tathā — likewise; aupaniṣadam — Upaniṣadic [vow/study]; ca — and; ābdam — annual; godānam — godāna; ca — and; suvarṇakam — suvarṇaka; vratāni — vows/observances; grahaṇa-arthāni — for the purpose of receiving/mastering; vedasya — the Veda; iti — thus; manoḥ matam — the opinion of Manu.`},
{n:14,sa:`वेदैकदेशपाठस्य उक्तं गृह्ये प्रपञ्चकम् ।\nउक्ता गुरोस्तु शुश्रूषा दृष्टादृष्टार्थसाधनम् ॥ १४ ॥`,iast:`vedaikadeśapāṭhasya uktaṃ gṛhye prapañcakam |\nuktā gurostu śuśrūṣā dṛṣṭādṛṣṭārthasādhanam || 14 ||`,en:`The detailed procedure for study of a portion of the Veda is taught in the Gṛhya tradition. Service to the guru is declared a means to both visible and unseen ends.`,wfw:`veda-eka-deśa-pāṭhasya — of reciting/studying a portion of the Veda; uktam — stated; gṛhye — in the Gṛhya [texts]; prapañcakam — detailed exposition; uktā — declared; guroḥ — of/to the guru; tu — indeed; śuśrūṣā — service/obedient attendance; dṛṣṭa-adṛṣṭa-artha-sādhanam — a means to visible and unseen ends.`},
{n:15,sa:`उभयोर्वा तथा चान्या यथान्यायं यथाश्रुतम् ।\nगुरोरप्येव तं विद्यात्तद्ध्यानं त्रिविधं स्मृतम् ॥ १५ ॥`,iast:`ubhayorvā tathā cānyā yathānyāyaṃ yathāśrutam |\ngurorapyeva taṃ vidyāttaddhyānaṃ trividhaṃ smṛtam || 15 ||`,en:`Other [forms of service] may pertain to both, according to proper rule and according to what has been heard. One should understand that attention to the guru as well; that contemplation is remembered as threefold.`,wfw:`ubhayoḥ vā — of both/or for both; tathā ca anyā — and likewise another; yathā-nyāyam — according to proper rule; yathā-śrutam — according to revelation/tradition heard; guroḥ api — of the guru also; eva — indeed; tam vidyāt — one should know that; tat-dhyānam — that contemplation/attention; tri-vidham — threefold; smṛtam — remembered.`},
{n:16,sa:`तोषः परस्परस्येति एतावान्धर्मसंग्रहः ।\nकृत्स्नो वेदोऽधिगंतव्यः स्वधर्ममनुतिष्ठता ॥ १६ ॥`,iast:`toṣaḥ parasparasyeti etāvāndharmasaṃgrahaḥ |\nkṛtsno vedo'dhigaṃtavyaḥ svadharmamanutiṣṭhatā || 16 ||`,en:`Mutual satisfaction—this much is the summary of dharma. One who follows his own dharma should master the entire Veda.`,wfw:`toṣaḥ — satisfaction/contentment; parasparasya — of one another/mutual; iti — thus; etāvān — so much; dharma-saṃgrahaḥ — summary of dharma; kṛtsnaḥ vedaḥ — the entire Veda; adhigantavyaḥ — to be mastered; sva-dharmam — one’s own dharma; anutiṣṭhatā — by one practising/following.`},
{n:17,sa:`ज्ञात्वा वेदं ब्रह्मचारी ग्रंथार्थान्यान्यथाविधि ।\nनैष्ठिकश्च विधानं तु यावत्क्लीबं विधीयते ।\nविद्यान्तेऽभीष्टदानं च अनुज्ञातो गृही भवेत् ॥ १७ ॥`,iast:`jñātvā vedaṃ brahmacārī graṃthārthānyānyathāvidhi |\nnaiṣṭhikaśca vidhānaṃ tu yāvatklībaṃ vidhīyate |\nvidyānte'bhīṣṭadānaṃ ca anujñāto gṛhī bhavet || 17 ||`,en:`Having learned the Veda and the meanings of the texts according to rule, the brahmacārin completes the prescribed course; the Naiṣṭhika follows his lifelong rule. At the end of study, after giving the desired fee/gift and receiving permission, one may become a householder.`,wfw:`jñātvā — having learned/known; vedam — the Veda; brahmacārī — the brahmacārin; grantha-arthān — meanings of the texts; yathāvidhi — according to rule; naiṣṭhikaḥ ca — and the Naiṣṭhika; vidhānam — prescribed rule; tu — indeed; yāvat-klībam — transmitted difficult expression; vidhīyate — is prescribed; vidyā-ante — at the end of study; abhīṣṭa-dānam — desired/appropriate gift; ca — and; anujñātaḥ — permitted; gṛhī bhavet — may become a householder.`,note:`yāvatklībam is textually difficult. The translation reflects the surrounding contrast between the ordinary student who graduates and the Naiṣṭhika who remains under lifelong discipline.`},
{n:18,sa:`निष्कासनं गुरुगृहाद्गृहस्थस्य यथाभवेत् ।\nनैष्ठिकश्च तथा स्नानं कुर्यात्सम्यग्यथाविधि ॥ १८ ॥`,iast:`niṣkāsanaṃ gurugṛhādgṛhasthasya yathābhavet |\nnaiṣṭhikaśca tathā snānaṃ kuryātsamyagyathāvidhi || 18 ||`,en:`Departure from the guru’s house is prescribed for the one who is to become a householder; the concluding bath is likewise to be performed properly according to rule, with the Naiṣṭhika governed by his own discipline.`,wfw:`niṣkāsanam — departure/going out; guru-gṛhāt — from the guru’s house; gṛhasthasya — of the householder/to-be householder; yathā bhavet — as it should occur; naiṣṭhikaḥ ca — and the Naiṣṭhika; tathā — likewise; snānam — bathing/concluding bath; kuryāt — should perform; samyak — properly; yathāvidhi — according to rule.`,note:`The relation of naiṣṭhikaḥ to snānam is awkward in the transmitted wording; the verse may preserve a compressed contrast between two courses of brahmacarya.`},
{n:19,sa:`उद्वहेद्वै ततो भार्यां सवर्णां लक्षणान्विताम् ।\nअविप्लुतब्रह्मचर्यश्चाधिकारी खगोत्तम ॥ १९ ॥`,iast:`udvahedvai tato bhāryāṃ savarṇāṃ lakṣaṇānvitām |\naviplutabrahmacaryaścādhikārī khagottama || 19 ||`,en:`Thereafter he should marry a wife of the same varṇa, endowed with the prescribed marks. One whose brahmacarya has remained unbroken is qualified [for this], O best of birds.`,wfw:`udvahet — should marry; vai — indeed; tataḥ — thereafter; bhāryām — a wife; savarṇām — of the same varṇa; lakṣaṇa-anvitām — endowed with marks/qualifications; avipluta-brahmacaryaḥ — whose brahmacarya has not been broken; ca — and; adhikārī — qualified/eligible; khaga-uttama — O best of birds.`},
{n:20,sa:`स्वतन्त्रमन्ये चेच्छन्ति ह्यधिकारं द्विजोत्तमाः ।\nसप्तमीं पञ्चमीं चैव कन्यकां पितृमातृतः ॥ २० ॥`,iast:`svatantramanye cecchanti hyadhikāraṃ dvijottamāḥ |\nsaptamīṃ pañcamīṃ caiva kanyakāṃ pitṛmātṛtaḥ || 20 ||`,en:`Other eminent twice-born authorities understand the eligibility independently; the girl is then specified with reference to the seventh paternal and fifth maternal degrees.`,wfw:`svatantram — independently/separately; anye — others; ca icchanti — also hold; hi — indeed; adhikāram — eligibility/rule; dvija-uttamāḥ — eminent twice-born authorities; saptamīm — seventh [degree]; pañcamīm — fifth [degree]; ca eva — and indeed; kanyakām — the girl; pitṛ-mātṛtaḥ — from the paternal and maternal sides.`,note:`The verse is elliptical; the standard dharmaśāstric context suggests prohibited degrees of kinship, but the governing verb is supplied by the following marriage discussion rather than stated here.`},
{n:21,sa:`उद्वहेत द्विजो भार्यामसमानार्षगोत्रजाम् ।\nसंख्याविधिविवाहेषु गोत्रार्थं विधिवर्जितम् ॥ २१ ॥`,iast:`udvaheta dvijo bhāryāmasamānārṣagotrajām |\nsaṃkhyāvidhivivāheṣu gotrārthaṃ vidhivarjitam || 21 ||`,en:`A twice-born man should marry a wife born in a different ṛṣi-gotra. The second half refers, in compressed language, to gotra restrictions within enumerated forms/rules of marriage.`,wfw:`udvaheta — should marry; dvijaḥ — a twice-born man; bhāryām — a wife; asamāna-ārṣa-gotra-jām — born in a different ṛṣi-gotra; saṃkhyā-vidhi-vivāheṣu — in marriages governed by enumerative rules; gotra-artham — with respect to gotra; vidhi-varjitam — excluded from/without the rule, as transmitted.`,note:`The second hemistich is syntactically difficult and has been translated conservatively.`},
{n:22,sa:`विकल्पेनैव मन्तव्यमृषीणां विविधा श्रुतिः ।\nअष्टौ विवाहा वर्णानां संस्काराख्या इति श्रुतिः ॥ २२ ॥`,iast:`vikalpenaiva mantavyamṛṣīṇāṃ vividhā śrutiḥ |\naṣṭau vivāhā varṇānāṃ saṃskārākhyā iti śrutiḥ || 22 ||`,en:`Because the traditions of the sages are diverse, [such matters] are to be understood as admitting alternatives. Revelation/tradition speaks of eight marriages of the varṇas, designated as saṃskāras.`,wfw:`vikalpena eva — as an alternative indeed; mantavyam — to be understood; ṛṣīṇām — of the sages; vividhā — diverse; śrutiḥ — transmitted teaching; aṣṭau — eight; vivāhāḥ — marriages; varṇānām — of the varṇas; saṃskāra-ākhyāḥ — called saṃskāras; iti śrutiḥ — thus is the tradition/revelation.`},
{n:23,sa:`यस्तु दोषवतीं कन्यामनाख्याय प्रयच्छति ।\nतस्य कुर्यान्नृपो दंडं स्वयं षण्णवतिं पणान् ॥ २३ ॥`,iast:`yastu doṣavatīṃ kanyāmanākhyāya prayacchati |\ntasya kuryānnṛpo daṃḍaṃ svayaṃ ṣaṇṇavatiṃ paṇān || 23 ||`,en:`If someone gives a girl in marriage while failing to disclose a defect, the king should impose upon him a fine of ninety-six paṇas.`,wfw:`yaḥ tu — whoever; doṣavatīm — having a defect; kanyām — girl; anākhyāya — without disclosing; prayacchati — gives; tasya — upon him; kuryāt — should impose; nṛpaḥ — the king; daṇḍam — fine/punishment; svayam — directly; ṣaṇṇavatim paṇān — ninety-six paṇas.`},
{n:24,sa:`पितुर्गृहे तु या कन्या रजः पश्यत्यसंस्कृता ।\nपतंति पितरस्तस्य कन्या च वृषली भवेत् ॥ २४ ॥`,iast:`piturgṛhe tu yā kanyā rajaḥ paśyatyasaṃskṛtā |\npataṃti pitarastasya kanyā ca vṛṣalī bhavet || 24 ||`,en:`A girl who sees menstruation in her father’s house while still uninitiated by marriage is said by this text to cause her ancestors to fall, and the girl is called vṛṣalī.`,wfw:`pituḥ gṛhe — in the father’s house; tu — indeed; yā kanyā — whichever girl; rajaḥ paśyati — sees menstruation; asaṃskṛtā — not ritually married/saṃskṛta; patanti — fall; pitaraḥ — the ancestors; tasya — of him; kanyā ca — and the girl; vṛṣalī bhavet — becomes/is called vṛṣalī.`},
{n:25,sa:`यस्तु तां वरयेत्कन्यां ब्राह्मणो ज्ञानदुर्बलः ।\nअश्राद्धेयमपाङ्क्तेयं तं विद्याद्वृषलीपतिम् ॥ २५ ॥`,iast:`yastu tāṃ varayetkanyāṃ brāhmaṇo jñānadurbalaḥ |\naśrāddheyamapāṅkteyaṃ taṃ vidyādvṛṣalīpatim || 25 ||`,en:`A Brahmin weak in understanding who chooses such a girl is to be known as the husband of a vṛṣalī; he is declared unfit for śrāddha and for the ritual dining row.`,wfw:`yaḥ tu — whoever; tām kanyām — that girl; varayet — chooses/marries; brāhmaṇaḥ — a Brahmin; jñāna-durbalaḥ — weak in understanding; aśrāddheyam — unfit to receive at śrāddha; apāṅkteyam — excluded from the ritual row; tam vidyāt — one should know him; vṛṣalī-patim — husband of a vṛṣalī.`},
{n:26,sa:`सर्वदोषान्हि विख्याप्य स्त्रिया वा पुरुषस्य वा ।\nउभयोरपि विख्याप्य ततः संबन्धमाचरेत् ॥ २६ ॥`,iast:`sarvadoṣānhi vikhyāpya striyā vā puruṣasya vā |\nubhayorapi vikhyāpya tataḥ saṃbandhamācaret || 26 ||`,en:`After openly declaring all defects of either the woman or the man—indeed of both—the marriage alliance should then be undertaken.`,wfw:`sarva-doṣān — all defects; hi — indeed; vikhyāpya — having disclosed; striyāḥ vā — of the woman or; puruṣasya vā — of the man; ubhayoḥ api — of both also; vikhyāpya — having disclosed; tataḥ — then; sambandham — alliance/relationship; ācaret — should undertake.`},
{n:27,sa:`गौरी कन्या प्रधाना वै मध्यमा कन्यका स्मृता ।\nरोहिणी तत्समा ज्ञेया अधमा तु रजस्वला ॥ २७ ॥`,iast:`gaurī kanyā pradhānā vai madhyamā kanyakā smṛtā |\nrohiṇī tatsamā jñeyā adhamā tu rajasvalā || 27 ||`,en:`The text ranks the Gaurī girl as foremost; another category is remembered as intermediate. Rohiṇī is to be known in relation to that middle category, while a menstruating girl is ranked lowest.`,wfw:`gaurī kanyā — a Gaurī girl; pradhānā — foremost; vai — indeed; madhyamā kanyakā — intermediate girl; smṛtā — remembered; rohiṇī — Rohiṇī; tat-samā — equal to that; jñeyā — to be known; adhamā — lowest; tu — however; rajasvalā — menstruating.`},
{n:28,sa:`अनूरुरुवाच ।\nगौरी तु का मता कन्या रोहिणी च जगत्पते ।\nरजस्वला नग्निका च देवकन्या च का भवेत् ॥ २८ ॥`,iast:`anūruruvāca |\ngaurī tu kā matā kanyā rohiṇī ca jagatpate |\nrajasvalā nagnikā ca devakanyā ca kā bhavet || 28 ||`,en:`Anūru said: “What girl is called Gaurī, and what is Rohiṇī, O lord of the world? What is meant by rajasvalā, nagnikā, and devakanyā?”`,wfw:`anūruḥ uvāca — Anūru said; gaurī — Gaurī; tu kā matā kanyā — what girl is regarded [so]; rohiṇī ca — and Rohiṇī; jagat-pate — O lord of the world; rajasvalā — menstruating girl; nagnikā — nagnikā; ca — and; deva-kanyā — devakanyā; ca kā bhavet — what might each be.`},
{n:29,sa:`भास्कर उवाच ।\nअसंप्राप्तरजा गौरी प्राप्ते रजसि रोहिणी ।\nअव्यञ्जनयुता कन्या कुचहीना च नग्निका ॥ २९ ॥`,iast:`bhāskara uvāca |\nasaṃprāptarajā gaurī prāpte rajasi rohiṇī |\navyañjanayutā kanyā kucahīnā ca nagnikā || 29 ||`,en:`Bhāskara said: “Gaurī is one who has not yet reached menstruation; when menstruation has been reached, she is Rohiṇī. A girl lacking the bodily signs and without developed breasts is called nagnikā.”`,wfw:`asaṃprāpta-rajaḥ — one whose menstruation has not arrived; gaurī — Gaurī; prāpte rajasi — when menstruation has arrived; rohiṇī — Rohiṇī; avyañjana-yutā — lacking/without secondary bodily signs; kanyā — girl; kuca-hīnā — without developed breasts; ca — and; nagnikā — nagnikā.`},
{n:30,sa:`सप्तवर्षा भवेद्गौरी दशवर्षा तु नग्निका ।\nद्वादशे तु भवेत्कन्या अत ऊर्ध्वं रजस्वला ॥ ३० ॥`,iast:`saptavarṣā bhavedgaurī daśavarṣā tu nagnikā |\ndvādaśe tu bhavetkanyā ata ūrdhvaṃ rajasvalā || 30 ||`,en:`According to this traditional age scheme, a seven-year-old is Gaurī, a ten-year-old nagnikā, and at twelve she is called kanyā; beyond that, rajasvalā.`,wfw:`sapta-varṣā — seven years old; bhavet gaurī — is Gaurī; daśa-varṣā — ten years old; tu — however; nagnikā — nagnikā; dvādaśe — at twelve; tu — then; bhavet kanyā — is a kanyā; ataḥ ūrdhvam — beyond that; rajasvalā — menstruating.`},
{n:31,sa:`व्यञ्जनेन समोपेतां सोमो भुङ्क्ते हि कन्यकाम् ।\nपयोधरेषु गंधर्वा रजस्यग्निः प्रकीर्तितः ॥ ३१ ॥`,iast:`vyañjanena samopetāṃ somo bhuṅkte hi kanyakām |\npayodhareṣu gaṃdharvā rajasyagniḥ prakīrtitaḥ || 31 ||`,en:`The text says that Soma “enjoys” the girl when the bodily signs appear; the Gandharvas are associated with the breasts, and Agni is proclaimed in menstruation.`,wfw:`vyañjanena — with the bodily sign/mark; samopetām — endowed; somaḥ — Soma; bhuṅkte — enjoys/possesses; hi — indeed; kanyakām — the girl; payodhareṣu — in the breasts; gandharvāḥ — the Gandharvas; rajasi — in menstruation; agniḥ — Agni; prakīrtitaḥ — is proclaimed.`},
{n:32,sa:`हिनस्ति व्यञ्जनैः पुत्रान्कुलं हन्यात्पयोधरैः ।\nगतिमिष्टां तथा लोकान्हन्यात्तु रजसा पितुः ॥ ३२ ॥`,iast:`hinasti vyañjanaiḥ putrānkulaṃ hanyātpayodharaiḥ |\ngatimiṣṭāṃ tathā lokānhanyāttu rajasā pituḥ || 32 ||`,en:`In the traditional warning of this passage, the bodily signs are said to harm sons, developed breasts to harm the lineage, and menstruation to harm the father’s desired destination and worlds.`,wfw:`hinasti — harms/destroys; vyañjanaiḥ — by the bodily signs; putrān — sons; kulam — the lineage; hanyāt — may harm; payodharaiḥ — by developed breasts; gatim iṣṭām — desired destination; tathā lokān — and the worlds; hanyāt — may destroy; tu — however; rajasā — by menstruation; pituḥ — of the father.`},
{n:33,sa:`तस्मादव्यञ्जनोपेतामरजस्कपयोधराम् ।\nनान्योपभुक्तां सोमाद्यैर्दद्याद्दुहितरं पिता ॥ ३३ ॥`,iast:`tasmādavyañjanopetāmarajaskapayodharām |\nnānyopabhuktāṃ somādyairdadyādduhitaraṃ pitā || 33 ||`,en:`Therefore, according to this passage’s traditional scheme, the father should give his daughter before the bodily signs, menstruation, and breast-development are present, and before she is said to have been “enjoyed” by Soma and the others.`,wfw:`tasmāt — therefore; avyañjana-upetām — not yet endowed with the bodily signs; arajaska — without menstruation; payodharām — [before] breast development (compressed compound); na anya-upabhuktām — not enjoyed by another; soma-ādyaiḥ — by Soma and the others; dadyāt — should give; duhitaram — daughter; pitā — father.`},
{n:34,sa:`अन्नं तस्य न भोक्तव्यं वृथा पाको हि स स्मृतः ।\nवृथा पाकस्य भुक्त्वान्नं प्रायश्चित्तं समाचरेत् ॥ ३४ ॥`,iast:`annaṃ tasya na bhoktavyaṃ vṛthā pāko hi sa smṛtaḥ |\nvṛthā pākasya bhuktvānnaṃ prāyaścittaṃ samācaret || 34 ||`,en:`Food from such a person is not to be eaten; his cooking is remembered as fruitless/ritually wasted. Having eaten such food, one should perform expiation.`,wfw:`annam tasya — his food; na bhoktavyam — is not to be eaten; vṛthā pākaḥ — fruitless/wasted cooking; hi — indeed; saḥ smṛtaḥ — it is remembered; vṛthā-pākasya — of one whose cooking is fruitless; bhuktvā annam — having eaten food; prāyaścittam — expiation; samācaret — should perform.`},
{n:35,sa:`प्राणायामं त्रिरभ्यस्य घृतं प्राश्य विशुद्ध्यति ।\nविवाहयेदेकगोत्रां समानप्रवरां खग ।\nकृत्वा तस्यां समुत्सर्गमतिकृच्छ्रो विशोधनम् ॥ ३५ ॥`,iast:`prāṇāyāmaṃ trirabhyasya ghṛtaṃ prāśya viśuddhyati |\nvivāhayedekagotrāṃ samānapravarāṃ khaga |\nkṛtvā tasyāṃ samutsargamatikṛcchro viśodhanam || 35 ||`,en:`After practising prāṇāyāma three times and drinking ghee, one is purified. If one marries a woman of the same gotra and pravara, O bird, the text prescribes an Atikṛcchra as the purificatory expiation after the offence.`,wfw:`prāṇāyāmam — breath-control; triḥ abhyasya — having practised three times; ghṛtam prāśya — having drunk ghee; viśuddhyati — is purified; vivāhayet — should marry / if one marries; eka-gotrām — of the same gotra; samāna-pravarām — of the same pravara; khaga — O bird; kṛtvā — having done; tasyām — with her/in that case; samutsargam — transmitted term, release/commission; ati-kṛcchraḥ — Atikṛcchra penance; viśodhanam — purification.`,note:`samutsarga is not entirely clear in this context; the expiatory force of atikṛcchra is secure.`},
{n:36,sa:`उद्वाहयेत्सगोत्रां च तनयां मातुलस्य च ।\nऋषिभिश्चैव तुल्यो यो द्विजश्चांद्रायणं चरेत् ॥ ३६ ॥`,iast:`udvāhayetsagotrāṃ ca tanayāṃ mātulasya ca |\nṛṣibhiścaiva tulyo yo dvijaścāṃdrāyaṇaṃ caret || 36 ||`,en:`The text next treats marriage with a same-gotra woman or with the daughter of the maternal uncle, and prescribes the Cāndrāyaṇa penance for the twice-born offender in the stated prohibited relationship.`,wfw:`udvāhayet — if one marries; sa-gotrām — a same-gotra woman; ca — and; tanayām — daughter; mātulasya — of the maternal uncle; ca — and; ṛṣibhiḥ — with respect to the ṛṣis; ca eva — also; tulyaḥ — same/equal; yaḥ dvijaḥ — whichever twice-born man; cāndrāyaṇam — Cāndrāyaṇa penance; caret — should perform.`,note:`The exact syntactic relation of ṛṣibhiś caiva tulyaḥ is compressed; the verse plainly prescribes Cāndrāyaṇa for a prohibited kin/gotra marriage.`},
{n:37,sa:`असपिण्डा तु या मातुरसगोत्रा च या पितुः ।\nसा प्रशस्ता द्विजातीनां दारकर्मणि मैथुने ॥ ३७ ॥`,iast:`asapiṇḍā tu yā māturasagotrā ca yā pituḥ |\nsā praśastā dvijātīnāṃ dārakarmaṇi maithune || 37 ||`,en:`For the twice-born, a woman who is not a sapiṇḍa of the mother and not of the father’s gotra is approved for marriage-duty and sexual union.`,wfw:`asapiṇḍā — not a sapiṇḍa; tu — indeed; yā — who; mātuḥ — of the mother; asagotrā — not of the same gotra; ca — and; yā — who; pituḥ — of the father; sā — she; praśastā — approved; dvijātīnām — for twice-born men; dāra-karmaṇi — in marital duty; maithune — in sexual union.`},
{n:38,sa:`अरुण उवाच ।\nदारकर्म किमुक्तं वै यदुक्तं भवता इदम् ।\nसा प्रशस्ता द्विजातीनां दारकर्मणि मैथुने ॥ ३८ ॥`,iast:`aruṇa uvāca |\ndārakarma kimuktaṃ vai yaduktaṃ bhavatā idam |\nsā praśastā dvijātīnāṃ dārakarmaṇi maithune || 38 ||`,en:`Aruṇa said: “What is meant by dārakarma in what you have just said—‘she is approved for the twice-born in dārakarma and sexual union’?”`,wfw:`aruṇaḥ uvāca — Aruṇa said; dāra-karma — marital duty; kim uktam — what is meant; vai — indeed; yat uktam — what was said; bhavatā — by you; idam — this; sā praśastā — she is approved; dvijātīnām — for the twice-born; dāra-karmaṇi — in marital duty; maithune — in sexual union.`},
{n:39,sa:`आदित्य उवाच ।\nअग्निहोत्रादि यत्कर्म वैदिकं विनतात्मज ।\nतदुक्तं दारकर्मेति द्वाभ्यां योगात्तु मैथुने ॥ ३९ ॥`,iast:`āditya uvāca |\nagnihotrādi yatkarma vaidikaṃ vinatātmaja |\ntaduktaṃ dārakarmeti dvābhyāṃ yogāttu maithune || 39 ||`,en:`Āditya said: “Vedic rites beginning with Agnihotra, O son of Vinatā, are called dārakarma because they are performed through the conjunction of the two [spouses]; maithuna is likewise their bodily union.”`,wfw:`agnihotra-ādi — beginning with Agnihotra; yat karma — whatever rite; vaidikam — Vedic; vinatā-ātmaja — O son of Vinatā; tat uktam — that is called; dāra-karma iti — marital duty; dvābhyām yogāt — from the conjunction of the two; tu — indeed; maithune — in sexual union.`},
{n:40,sa:`नोद्वहेत्कपिलां कन्यां नाधिकांगीं न रोगिणीम् ।\nनालोमिकां नातिलोमां न चाकूटां न पिङ्गलाम् ॥ ४० ॥`,iast:`nodvahetkapilāṃ kanyāṃ nādhikāṃgīṃ na rogiṇīm |\nnālomikāṃ nātilomāṃ na cākūṭāṃ na piṅgalām || 40 ||`,en:`According to the traditional marriage criteria of this passage, one should not marry a tawny girl, one with excessive limbs, one who is ill, hairless, excessively hairy, deformed, or tawny-eyed.`,wfw:`na udvahet — one should not marry; kapilām kanyām — a tawny/brownish girl; na adhikāṅgīm — not one with excessive/supernumerary limbs; na rogiṇīm — not diseased; na alomikām — not hairless; na atilomām — not excessively hairy; na ca akūṭām — not deformed/with defective form (term uncertain); na piṅgalām — not tawny/yellowish.`},
{n:41,sa:`ऋक्षवृक्षनदीनाम्नीं नान्यपर्वतनामिकाम् ।\nन यक्षाहिप्रेष्यनाम्नीं चातिभीषणनामिकाम् ॥ ४१ ॥`,iast:`ṛkṣavṛkṣanadīnāmnīṃ nānyaparvatanāmikām |\nna yakṣāhipreṣyanāmnīṃ cātibhīṣaṇanāmikām || 41 ||`,en:`One should also avoid, according to this naming convention, a girl named after a beast, tree, river, mountain, Yakṣa, serpent, servant, or something excessively terrifying.`,wfw:`ṛkṣa-vṛkṣa-nadī-nāmnīm — bearing the name of a beast, tree, or river; na — not; anya-parvata-nāmikām — one named after a mountain/another mountain; na yakṣa-ahi-preṣya-nāmnīm — not named after a Yakṣa, serpent, or servant; ca — and; ati-bhīṣaṇa-nāmikām — one with an excessively frightening name.`},
{n:42,sa:`यस्यास्तु न भवेद्भ्राता न विज्ञायेत वै पिता ।\nनोपगच्छेद्धि तां प्राज्ञः पुत्रिकाधर्मशंकया ॥ ४२ ॥`,iast:`yasyāstu na bhavedbhrātā na vijñāyeta vai pitā |\nnopagaccheddhi tāṃ prājñaḥ putrikādharmaśaṃkayā || 42 ||`,en:`A prudent man should not approach a woman who has no brother or whose father is not known, because of concern about the putrikā rule.`,wfw:`yasyāḥ tu — of whom; na bhavet bhrātā — there is no brother; na vijñāyeta — is not known; vai — indeed; pitā — father; na upagacchet — should not approach/marry; hi — indeed; tām — her; prājñaḥ — a prudent man; putrikā-dharma-śaṅkayā — from concern about the putrikā rule.`},
{n:43,sa:`हंसस्वरामेकवर्णां मधुपिंगललोचनाम् ।\nतादृशीं वरयेत्कन्यां गृहार्थी खगसत्तम ॥ ४३ ॥`,iast:`haṃsasvarāmekavarṇāṃ madhupiṃgalalocanām |\ntādṛśīṃ varayetkanyāṃ gṛhārthī khagasattama || 43 ||`,en:`A man seeking household life is advised here to choose a girl with a swan-like voice, even complexion, and honey-tawny eyes, O best of birds.`,wfw:`haṃsa-svarām — having a swan-like voice; eka-varṇām — of even/uniform complexion; madhu-piṅgala-locanām — having honey-tawny eyes; tādṛśīm — such a one; varayet — should choose; kanyām — a girl; gṛha-arthī — one seeking household life; khaga-sattama — O best of birds.`},
{n:44,sa:`दाराग्निहोत्रसंयोगं कुरुते योऽग्रजे स्थिते ।\nपरिवेत्ता स विज्ञेयः परिवित्तिस्तु पूर्वजः ॥ ४४ ॥`,iast:`dārāgnihotrasaṃyogaṃ kurute yo'graje sthite |\nparivettā sa vijñeyaḥ parivittistu pūrvajaḥ || 44 ||`,en:`A younger brother who enters marriage and establishes the household fire while his elder brother remains unmarried is called a parivettā; the elder brother is called parivitti.`,wfw:`dāra-agnihotra-saṃyogam — union with a wife and establishment of Agnihotra; kurute — undertakes; yaḥ — who; agraje sthite — while the elder brother remains [unmarried]; parivettā — parivettā; saḥ vijñeyaḥ — he is to be known; parivittiḥ — parivitti; tu — however; pūrvajaḥ — the elder-born.`},
{n:45,sa:`परिवित्तिः परिवेत्ता च यया स परिविद्यते ।\nसर्वे ते नरकं यांति दातृयाजकपंचमाः ॥ ४५ ॥`,iast:`parivittiḥ parivettā ca yayā sa parividyate |\nsarve te narakaṃ yāṃti dātṛyājakapaṃcamāḥ || 45 ||`,en:`The parivitti, the parivettā, the woman through whom the irregular marriage occurs, the giver, and the officiating priest—these five are said to go to hell.`,wfw:`parivittiḥ — the elder brother passed over; parivettā — the younger who marries first; ca — and; yayā — the woman by whom/through whom; saḥ parividyate — the irregular marriage is effected; sarve te — all those; narakam yānti — go to hell; dātṛ-yājaka-pañcamāḥ — with the giver and officiating priest making five.`},
{n:46,sa:`क्लीबे देशांतरस्थे वा पतिते व्रजिते तथा ।\nयोगशास्त्राभियुक्ते च न दोषः परिवेदने ॥ ४६ ॥`,iast:`klībe deśāṃtarasthe vā patite vrajite tathā |\nyogaśāstrābhiyukte ca na doṣaḥ parivedane || 46 ||`,en:`There is no fault in the younger brother marrying first if the elder is impotent, living abroad, fallen, has gone forth/renounced, or is wholly devoted to the discipline of yoga.`,wfw:`klībe — when [the elder is] impotent; deśa-antara-sthe vā — or residing in another country; patite — fallen; vrajite — gone forth/departed; tathā — likewise; yoga-śāstra-abhiyukte — devoted to yoga-śāstra; ca — and; na doṣaḥ — no fault; parivedane — in the younger marrying before the elder.`},
{n:47,sa:`खंजवामनकुब्जेषु गद्गदेषु जडेषु च ।\nजात्यंधे बधिरे मूके न दोषः परिवेदने ॥ ४७ ॥`,iast:`khaṃjavāmanakubjeṣu gadgadeṣu jaḍeṣu ca |\njātyaṃdhe badhire mūke na doṣaḥ parivedane || 47 ||`,en:`The text likewise exempts cases in which the elder is lame, dwarfish, hunchbacked, severely speech-impaired, intellectually disabled, congenitally blind, deaf, or mute.`,wfw:`khañja — lame; vāmana — dwarf; kubjeṣu — hunchbacked; gadgadeṣu — with stammering/impaired speech; jaḍeṣu — dull/intellectually impaired; ca — and; jātyandhe — congenitally blind; badhire — deaf; mūke — mute; na doṣaḥ — no fault; parivedane — in the younger marrying first.`},
{n:48,sa:`न श्राद्धं तु कनिष्ठस्य विकुलाय च कन्यका ।\nवरश्च कुलशीलाभ्यां न शुद्ध्येत कदाचन ।\nन मंत्राः कारणं तत्र न च कन्या वृता भवेत् ॥ ४८ ॥`,iast:`na śrāddhaṃ tu kaniṣṭhasya vikulāya ca kanyakā |\nvaraśca kulaśīlābhyāṃ na śuddhyeta kadācana |\nna maṃtrāḥ kāraṇaṃ tatra na ca kanyā vṛtā bhavet || 48 ||`,en:`The transmitted verse warns that defects of family and conduct are not cured merely by ritual form: neither mantras nor the bare fact that a girl has been formally chosen can by themselves make an unsuitable match pure.`,wfw:`na śrāddham — not [fit for] śrāddha, as transmitted; tu — indeed; kaniṣṭhasya — of the younger; vikulāya — for one of bad/unsuitable family; ca kanyakā — and the girl; varaḥ ca — and the groom; kula-śīlābhyām — by family and character; na śuddhyeta — is not purified; kadācana — ever; na mantrāḥ — not the mantras; kāraṇam — the cause/sufficient basis; tatra — there; na ca — nor; kanyā vṛtā — the girl having been chosen; bhavet — is enough/occurs.`,note:`The first hemistich is textually obscure; the translation is anchored in the clearer second and third lines, which deny that mantra or formal selection alone cures defects of family/character.`},
{n:49,sa:`उद्वाहिता तु या कन्या न च प्राप्ता तु मैथुनम् ।\nपुनरभ्येति भर्तारं यथा कन्या तथैव सा ॥ ४९ ॥`,iast:`udvāhitā tu yākanyā na ca prāptā tu maithunam |\npunarabhyeti bhartāraṃ yathā kanyā tathaiva sā || 49 ||`,en:`A girl who has been married but has not undergone sexual union and then returns to a husband is, for the stated purpose, still as a maiden.`,wfw:`udvāhitā — married; tu — indeed; yā kanyā — whichever girl; na ca prāptā — has not reached/undergone; tu — however; maithunam — sexual union; punaḥ abhyeti — again approaches/returns to; bhartāram — a husband; yathā kanyā — as a maiden; tathā eva sā — so indeed is she.`},
{n:50,sa:`समाक्षिप्य मतां कन्यां पिता त्वक्षतयोनिकाम् ।\nकुलशीलवते दद्यान्न स्याद्दोषः खगाधिप ॥ ५० ॥`,iast:`samākṣipya matāṃ kanyāṃ pitā tvakṣatayonikām |\nkulaśīlavate dadyānna syāddoṣaḥ khagādhipa || 50 ||`,en:`A father may take back/reassign a girl whose sexual organs remain uninjured and give her to a man of good family and character; no fault is said to arise, O lord of birds.`,wfw:`samākṣipya — having taken back/reclaimed; matām kanyām — the girl in question; pitā — father; tu — indeed; akṣata-yonikām — whose sexual organ is uninjured, i.e. unconsummated; kula-śīlavate — to one endowed with good family and character; dadyāt — should give; na syāt doṣaḥ — there would be no fault; khagādhipa — O lord of birds.`},
{n:51,sa:`अनूरुरुवाच ।\nएतेऽष्टौ प्रभवाः प्रोक्ता विवाहा ये जगत्पते ।\nलक्षणं ब्रूहि चैतेषां समासात्तिमिरापह ॥ ५१ ॥`,iast:`anūruruvāca |\nete'ṣṭau prabhavāḥ proktā vivāhā ye jagatpate |\nlakṣaṇaṃ brūhi caiteṣāṃ samāsāttimirāpaha || 51 ||`,en:`Anūru said: “These eight forms of marriage have been stated, O lord of the world. Tell me their defining characteristics briefly, O dispeller of darkness.”`,wfw:`anūruḥ uvāca — Anūru said; ete aṣṭau — these eight; prabhavāḥ — forms/origins; proktāḥ — declared; vivāhāḥ — marriages; ye — which; jagat-pate — O lord of the world; lakṣaṇam — characteristic; brūhi — tell; ca eteṣām — of these also; samāsāt — briefly; timira-apaha — O dispeller of darkness.`},
{n:52,sa:`आदित्य उवाच ।\nशुभां लक्षणसंपन्नां कुलशीलगुणान्विताम् ।\nअलंकृत्यार्हते दानं विवाहो ब्राह्म उच्यते ॥ ५२ ॥`,iast:`āditya uvāca |\nśubhāṃ lakṣaṇasaṃpannāṃ kulaśīlaguṇānvitām |\nalaṃkṛtyārhate dānaṃ vivāho brāhma ucyate || 52 ||`,en:`Āditya said: “Giving, after adorning her, an auspicious girl endowed with the prescribed marks, good family, character, and qualities to a worthy man is called Brāhma marriage.”`,wfw:`śubhām — auspicious; lakṣaṇa-sampannām — endowed with the prescribed marks; kula-śīla-guṇa-anvitām — endowed with family standing, character, and qualities; alaṃkṛtya — having adorned; arhate — to a worthy man; dānam — giving; vivāhaḥ brāhmaḥ — Brāhma marriage; ucyate — is called.`},
{n:53,sa:`सह धर्मक्रियाहेतोर्दानं समयबंधनात् ।\nअलंकृत्यैव कन्यायाः प्राजापत्यः स उच्यते ॥ ५३ ॥`,iast:`saha dharmakriyāhetordānaṃ samayabaṃdhanāt |\nalaṃkṛtyaiva kanyāyāḥ prājāpatyaḥ sa ucyate || 53 ||`,en:`Giving the adorned girl under an agreement that the couple will perform dharma together is called the Prājāpatya marriage.`,wfw:`saha — together; dharma-kriyā-hetoḥ — for the purpose of performing dharma; dānam — giving; samaya-bandhanāt — under/because of a binding agreement; alaṃkṛtya eva — having adorned indeed; kanyāyāḥ — the girl; prājāpatyaḥ — Prājāpatya; saḥ ucyate — that is called.`},
{n:54,sa:`प्रदानं यत्र कन्यायाः सहगोमिथुनेन तु ।\nसवर्णायाः सगोत्रायास्तमार्षमृषयो विदुः ॥ ५४ ॥`,iast:`pradānaṃ yatra kanyāyāḥ sahagomithunena tu |\nsavarṇāyāḥ sagotrāyāstamārṣamṛṣayo viduḥ || 54 ||`,en:`Where the girl is given together with a pair of cattle, the sages know that form as Ārṣa; the transmitted second line associates it with the bride’s varṇa/gotra in compressed wording.`,wfw:`pradānam — giving; yatra — where; kanyāyāḥ — of the girl; saha-go-mithunena — together with a pair of cattle; tu — indeed; savarṇāyāḥ — of the same varṇa; sagotrāyāḥ — same-gotra, as transmitted; tam — that; ārṣam — Ārṣa; ṛṣayaḥ — sages; viduḥ — know.`,note:`The wording sagotrāyāḥ is unusual beside standard exogamy rules and may reflect textual disturbance; it is retained as the transmitted reading.`},
{n:55,sa:`अंतर्वेद्यां समानीय कन्यां कनकमंडिताम् ।\nऋत्विजे चैव यद्दानं विवाहो दैवसंज्ञकः ॥ ५५ ॥`,iast:`aṃtarvedyāṃ samānīya kanyāṃ kanakamaṃḍitām |\nṛtvije caiva yaddānaṃ vivāho daivasaṃjñakaḥ || 55 ||`,en:`Bringing a gold-adorned girl within the sacrificial enclosure and giving her to an officiating priest is the marriage called Daiva.`,wfw:`antar-vedyām — within the sacrificial enclosure; samānīya — having brought; kanyām — girl; kanaka-maṇḍitām — adorned with gold; ṛtvije — to the officiating priest; ca eva — and indeed; yat dānam — that giving; vivāhaḥ — marriage; daiva-saṃjñakaḥ — called Daiva.`},
{n:56,sa:`एते विवाहाश्चत्वारो धर्मकामार्थदायकाः ।\nअशुल्का ब्रह्मणा प्रोक्तास्तारयंति कुलद्वयम् ॥ ५६ ॥`,iast:`ete vivāhāścatvāro dharmakāmārthadāyakāḥ |\naśulkā brahmaṇā proktāstārayaṃti kuladvayam || 56 ||`,en:`These four marriages are said to bestow dharma, desire, and prosperity. Brahmā declared them free from bride-price; they carry across both families.`,wfw:`ete vivāhāḥ catvāraḥ — these four marriages; dharma-kāma-artha-dāyakāḥ — givers of dharma, desire, and wealth; aśulkāḥ — without bride-price; brahmaṇā proktāḥ — declared by Brahmā; tārayanti — carry across/save; kula-dvayam — both families.`},
{n:57,sa:`चतुर्ष्वेतेषु दत्तायामुत्पन्नो यः सुतः स्त्रियाम् ।\nदातुः प्रतिग्रहीतुश्च पुनात्यासप्तमान्पितॄन् ॥ ५७ ॥`,iast:`caturṣveteṣu dattāyāmutpanno yaḥ sutaḥ striyām |\ndātuḥ pratigrahītuśca punātyāsaptamānpitṝn || 57 ||`,en:`A son born from a woman given in one of these four forms is said to purify the ancestors of both giver and receiver through seven generations.`,wfw:`caturṣu eteṣu — in these four; dattāyām — when [the woman] has been given; utpannaḥ — born; yaḥ sutaḥ — whichever son; striyām — from the woman; dātuḥ — of the giver; pratigrahītuḥ ca — and of the receiver; punāti — purifies; ā-saptamān pitṝn — ancestors up to the seventh [generation].`},
{n:58,sa:`विविक्ते स्वयमन्योऽन्यं स्त्रीपुंसोर्यः समागमः ।\nप्रीतिहेतुः स गांधर्वो विवाहः पंचमो मतः ॥ ५८ ॥`,iast:`vivikte svayamanyo'nyaṃ strīpuṃsoryaḥ samāgamaḥ |\nprītihetuḥ sa gāṃdharvo vivāhaḥ paṃcamo mataḥ || 58 ||`,en:`The private, mutual union of woman and man arising from affection is regarded as the fifth marriage, Gāndharva.`,wfw:`vivikte — in private; svayam — by themselves; anyaḥ anyam — mutually/one another; strī-puṃsoḥ — of woman and man; yaḥ samāgamaḥ — whatever union; prīti-hetuḥ — caused by affection; saḥ gāndharvaḥ — that is Gāndharva; vivāhaḥ — marriage; pañcamaḥ — fifth; mataḥ — regarded.`},
{n:59,sa:`हत्वा च्छित्त्वा च भित्त्वा च क्रोशंतीं रुदतीं गृहात् ।\nप्रसह्य कन्याहरणं राक्षसोद्वाह उच्यते ॥ ५९ ॥`,iast:`hatvā cchittvā ca bhittvā ca krośaṃtīṃ rudatīṃ gṛhāt |\nprasahya kanyāharaṇaṃ rākṣasodvāha ucyate || 59 ||`,en:`Forcibly abducting a crying and weeping girl from her house after killing, cutting, and breaking resistance is called Rākṣasa marriage.`,wfw:`hatvā — having killed; chittvā — having cut; ca — and; bhittvā — having broken; ca — and; krośantīm — crying out; rudatīm — weeping; gṛhāt — from the house; prasahya — by force; kanyā-haraṇam — abduction of the girl; rākṣasa-udvāhaḥ — Rākṣasa marriage; ucyate — is called.`},
{n:60,sa:`शुल्कं प्रदाय कन्याया हरणं व्यसनादपि ।\nप्रसाद हेतुरुक्तोयमासुरः सप्तमस्तथा ॥ ६० ॥`,iast:`śulkaṃ pradāya kanyāyā haraṇaṃ vyasanādapi |\nprasāda heturuktoyamāsuraḥ saptamastathā || 60 ||`,en:`Taking the girl after paying bride-price is described here as the Āsura form, counted as the seventh; the phrase prasāda-hetu is transmitted but its precise force is uncertain.`,wfw:`śulkam pradāya — having paid bride-price; kanyāyāḥ — for/of the girl; haraṇam — taking/acquisition; vyasanāt api — even through distress/circumstance; prasāda-hetuḥ — cause of favour/consent, transmitted phrase; uktaḥ ayam — this is said; āsuraḥ — Āsura; saptamaḥ — seventh; tathā — likewise.`,note:`The second hemistich is awkward; the identification of the form as Āsura and the role of bride-price are clear.`},
{n:61,sa:`सुप्तां मत्तां प्रमत्तां वा रहो यत्रोपगच्छति ।\nस पापिष्ठो विवाहानां पैशाचश्चाष्टमोऽधमः ॥ ६१ ॥`,iast:`suptāṃ mattāṃ pramattāṃ vā raho yatropagacchati |\nsa pāpiṣṭho vivāhānāṃ paiśācaścāṣṭamodhamaḥ || 61 ||`,en:`Where a man approaches in secret a woman who is asleep, intoxicated, or insensible, that most sinful form of the marriages is Paiśāca, the eighth and lowest.`,wfw:`suptām — sleeping; mattām — intoxicated; pramattām vā — or insensible/careless; rahaḥ — secretly; yatra — where; upagacchati — he approaches sexually; saḥ — that; pāpiṣṭhaḥ — most sinful; vivāhānām — among marriages; paiśācaḥ — Paiśāca; ca — and; aṣṭamaḥ — eighth; adhamaḥ — lowest.`},
{n:62,sa:`एतान्सशुल्कान्सामान्यान्विवाहांश्चतुरो विदुः ।\nकेवलं क्षत्रियस्यैव वीर्यं छित्त्वा हि राक्षसः ॥ ६२ ॥`,iast:`etānsaśulkānsāmānyānvivāhāṃścaturo viduḥ |\nkevalaṃ kṣatriyasyaiva vīryaṃ chittvā hi rākṣasaḥ || 62 ||`,en:`These latter four forms are treated as a separate/common group in the transmitted classification; the Rākṣasa form, involving force and martial prowess, is specifically associated with the Kṣatriya.`,wfw:`etān — these; sa-śulkān — involving payment/bride-price, as transmitted; sāmānyān — common/general; vivāhān — marriages; caturaḥ — four; viduḥ — they know; kevalam — exclusively; kṣatriyasya eva — of the Kṣatriya; vīryam — force/valour; chittvā — transmitted form, literally ‘having cut’; hi — indeed; rākṣasaḥ — Rākṣasa [marriage].`,note:`The wording of the second half is textually rough; the intended association of Rākṣasa marriage with Kṣatriya force is nevertheless clear.`},
{n:63,sa:`प्राप्ते पूर्वविवाहे तु विधिर्वैवाहिकः शिवः ।\nकर्तव्यस्तु त्रिभिर्वर्णैः समयेनाग्निसाक्षिकः ॥ ६३ ॥`,iast:`prāpte pūrvavivāhe tu vidhirvaivāhikaḥ śivaḥ |\nkartavyastu tribhirvarṇaiḥ samayenāgnisākṣikaḥ || 63 ||`,en:`When the proper marriage is undertaken, the auspicious wedding procedure, with fire as witness and according to the prescribed agreement, is to be performed by the three varṇas.`,wfw:`prāpte — when obtained/undertaken; pūrva-vivāhe — the prior/proper marriage; tu — then; vidhiḥ vaivāhikaḥ — marriage procedure; śivaḥ — auspicious; kartavyaḥ — to be performed; tribhiḥ varṇaiḥ — by the three varṇas; samayena — according to agreement/rule; agni-sākṣikaḥ — with fire as witness.`},
{n:64,sa:`दोषवत्याः प्रदाने तु दातुः षण्णवतिर्दमः ।\nस्यात्तु शुल्कप्रदाने च कन्यायाश्चापवर्जने ॥ ६४ ॥`,iast:`doṣavatyāḥ pradāne tu dātuḥ ṣaṇṇavatirdamaḥ |\nsyāttu śulkapradāne ca kanyāyāścāpavarjane || 64 ||`,en:`For giving a defective bride, the giver’s fine is ninety-six [paṇas]; the text also applies a penalty in matters of bride-price and wrongful withdrawal of the girl.`,wfw:`doṣavatyāḥ — of a defective [girl]; pradāne — in giving; tu — indeed; dātuḥ — of the giver; ṣaṇṇavatiḥ — ninety-six; damaḥ — fine; syāt — there should be; tu — also; śulka-pradāne — in payment of bride-price; ca — and; kanyāyāḥ — of the girl; apavarjane — in withdrawal/exclusion.`},
{n:65,sa:`मोक्षोपवर्तनं द्वेषः स्त्रीधनस्य निवर्तनम् ।\nआकांक्षा तीर्थसंरोधस्त्यागहेतुश्च वक्ष्यते ॥ ६५ ॥`,iast:`mokṣopavartanaṃ dveṣaḥ strīdhanasya nivartanam |\nākāṃkṣā tīrthasaṃrodhastyāgahetuśca vakṣyate || 65 ||`,en:`The chapter next names topics connected with separation/release, hostility, return or withholding of women’s property, expectation, obstruction of the proper marital season, and grounds for abandonment.`,wfw:`mokṣa-upavartanam — turning toward release/separation; dveṣaḥ — hostility; strī-dhanasya — of women’s property; nivartanam — return/withdrawal; ākāṅkṣā — expectation/waiting; tīrtha-saṃrodhaḥ — obstruction of the proper season/access; tyāga-hetuḥ — cause of abandonment; ca — and; vakṣyate — will be stated.`,note:`Several technical terms in this list are terse and gain meaning from the following verses rather than from syntax alone.`},
{n:66,sa:`परस्परस्य संबंधान्मोक्षः स्त्रीपुंसयोः स्मृतः ।\nन स्यादन्यतरः प्रीतो रोषात्सांप्रतिकादपि ॥ ६६ ॥`,iast:`parasparasya saṃbaṃdhānmokṣaḥ strīpuṃsayoḥ smṛtaḥ |\nna syādanyataraḥ prīto roṣātsāṃpratikādapi || 66 ||`,en:`Because woman and man are mutually bound by relationship, dissolution is treated as a serious matter; it should not arise merely because either party is displeased through a momentary anger.`,wfw:`parasparasya sambandhāt — because of mutual relationship; mokṣaḥ — release/dissolution; strī-puṃsayoḥ — of woman and man; smṛtaḥ — remembered; na syāt — should not be; anyataraḥ — either one; prītaḥ — pleased (with negation, not pleased); roṣāt — from anger; sāmpratikāt api — even from a present/momentary cause.`},
{n:67,sa:`बाधते चेत्पतिर्भार्यां स तु द्वेष इति स्मृतः ।\nवृत्तिराभरणं शुल्कं लाभश्च स्त्रीधनं भवेत् ॥ ६७ ॥`,iast:`bādhate cetpatirbhāryāṃ sa tu dveṣa iti smṛtaḥ |\nvṛttirābharaṇaṃ śulkaṃ lābhaśca strīdhanaṃ bhavet || 67 ||`,en:`If the husband oppresses his wife, that is remembered as hostility. Maintenance, ornaments, bride-price, and gains constitute strīdhana.`,wfw:`bādhate cet — if he oppresses/harms; patiḥ — husband; bhāryām — wife; saḥ tu — that indeed; dveṣaḥ — hostility; iti smṛtaḥ — is remembered; vṛttiḥ — maintenance/livelihood; ābharaṇam — ornament; śulkam — bride-price; lābhaḥ ca — and gain; strī-dhanam — women’s property; bhavet — is.`},
{n:68,sa:`भोक्तृस्तु स्वयमेवेदं प्रतिज्ञाहननं भवेत् ।\nवृथा मोक्षेण भोगेन स्त्रियै दद्यात्सवृद्धिकम् ॥ ६८ ॥`,iast:`bhoktṛstu svayamevedaṃ pratijñāhananaṃ bhavet |\nvṛthā mokṣeṇa bhogena striyai dadyātsavṛddhikam || 68 ||`,en:`If he himself consumes this property contrary to his undertaking, that constitutes a breach of promise; after improper use he should restore it to the woman with increase.`,wfw:`bhoktā tu — the one who consumes/uses; svayam eva — himself indeed; idam — this [property]; pratijñā-hananam — breach/destruction of a promise; bhavet — becomes; vṛthā — improperly/in vain; mokṣeṇa bhogena — by release/use (compressed phrase); striyai — to the woman; dadyāt — should give; sa-vṛddhikam — with increase/interest.`},
{n:69,sa:`आपत्तिसमये जाते स्त्रीधनं भोक्तुमर्हति ।\nआकांक्षेताष्टवर्षाणि भर्तापि प्रसवं स्त्रियाः ॥ ६९ ॥`,iast:`āpattisamaye jāte strīdhanaṃ bhoktumarhati |\nākāṃkṣetāṣṭavarṣāṇi bhartāpi prasavaṃ striyāḥ || 69 ||`,en:`When an emergency arises, the husband may use strīdhana. He should wait eight years for the wife to bear a child.`,wfw:`āpatti-samaye — at a time of emergency; jāte — when arisen; strī-dhanam — women’s property; bhoktum arhati — may consume/use; ākāṅkṣeta — should wait/expect; aṣṭa-varṣāṇi — eight years; bhartā api — the husband also; prasavam — childbirth; striyāḥ — of the woman.`},
{n:70,sa:`जायन्ते यदि नो पुत्रास्तस्यां यत्ने महत्यपि ।\nततो विंदेत पुत्रार्थी धर्मतः कुलजां स्त्रियम् ॥ ७० ॥`,iast:`jāyante yadi no putrāstasyāṃ yatne mahatyapi |\ntato viṃdeta putrārthī dharmataḥ kulajāṃ striyam || 70 ||`,en:`If no sons are born from her despite great effort, then a man desiring offspring may, according to dharma, take another woman of good family.`,wfw:`jāyante — are born; yadi — if; no putrāḥ — no sons; tasyām — from her; yatne mahati api — despite great effort; tataḥ — then; vindeta — may obtain/take; putra-arthī — one desiring a son; dharmataḥ — according to dharma; kula-jām striyam — a woman born in a good family.`},
{n:71,sa:`पुत्रलाभात्परं लोके नास्ति हि प्रसवार्थिनः ।\nएतां शुल्कस्य तां भुक्त्वा अन्यां लब्धुं यदीच्छति ।\nसमस्तास्तोषयित्वार्थैः सूर्योढां परमां वरेत् ॥ ७१ ॥`,iast:`putralābhātparaṃ loke nāsti hi prasavārthinaḥ |\netāṃ śulkasya tāṃ bhuktvā anyāṃ labdhuṃ yadīcchati |\nsamastāstoṣayitvārthaiḥ sūryoḍhāṃ paramāṃ varet || 71 ||`,en:`For one seeking offspring, the text says there is nothing higher in worldly household life than obtaining a son. If he wishes to take another wife after the existing marriage, he should first satisfy all the existing wives materially and then choose another according to the prescribed rule.`,wfw:`putra-lābhāt — than obtaining a son; param — higher; loke — in the world; na asti hi — there is not indeed; prasava-arthinaḥ — for one seeking offspring; etām ... bhuktvā — after having lived with/possessed this [wife], transmitted with śulkasya; anyām labdhum — to obtain another; yadi icchati — if he wishes; samastāḥ — all [wives]; toṣayitvā — having satisfied; arthaiḥ — with wealth/resources; ... varet — should choose [another].`,note:`The third pāda contains the difficult reading sūryoḍhāṃ (Wisdomlib: sūryoḍhām). The general rule—satisfying existing wives before taking another—is clear, but the final epithet has not been forced into a speculative translation.`},
{n:72,sa:`एका शूद्रस्य वैश्यस्य द्वे तिस्रः क्षत्रियस्य तु ।\nचतस्रो ब्राह्मणस्य स्युर्भार्या राज्ञो यथेष्टतः ॥ ७२ ॥`,iast:`ekā śūdrasya vaiśyasya dve tisraḥ kṣatriyasya tu |\ncatasro brāhmaṇasya syurbhāryā rājño yatheṣṭataḥ || 72 ||`,en:`The text gives the conventional numerical scheme: one wife for a Śūdra, two for a Vaiśya, three for a Kṣatriya, four for a Brahmin, and for a king according to his circumstances/desire.`,wfw:`ekā — one; śūdrasya — for a Śūdra; vaiśyasya dve — two for a Vaiśya; tisraḥ — three; kṣatriyasya — for a Kṣatriya; tu — indeed; catasraḥ — four; brāhmaṇasya — for a Brahmin; syuḥ bhāryāḥ — wives may be; rājñaḥ — for a king; yathā-iṣṭataḥ — as desired/as appropriate.`},
{n:73,sa:`अतीर्थगमनात्पुंसस्तीर्थे संगाहनात्स्त्रियाः ।\nउभयोर्धर्मलोपः स्यात्स्वेष्वेव तु विशेषतः ॥ ७३ ॥`,iast:`atīrthagamanātpuṃsastīrthe saṃgāhanātstriyāḥ |\nubhayordharmalopaḥ syātsveṣveva tu viśeṣataḥ || 73 ||`,en:`If the man fails to approach at the proper fertile season, or the woman obstructs/avoids union at that season, there is said to be a loss of the respective dharma of both.`,wfw:`a-tīrtha-gamanāt — from failing to approach at the proper season; puṃsaḥ — of the man; tīrthe — at the proper season; saṃgāhanāt — from entering/engaging, here in the reciprocal marital sense; striyāḥ — of the woman; ubhayoḥ — of both; dharma-lopaḥ — loss of dharma; syāt — occurs; sveṣu eva — in their own respective [duties]; tu viśeṣataḥ — specifically.`},
{n:74,sa:`यौगपद्ये तु तीर्थानां विवाहक्रमशो व्रजेत् ।\nतत्साम्यं जीवपुत्रा वा ग्रहणक्रमशोपि वा ॥ ७४ ॥`,iast:`yaugapadye tu tīrthānāṃ vivāhakramaśo vrajet |\ntatsāmyaṃ jīvaputrā vā grahaṇakramaśopi vā || 74 ||`,en:`When the fertile periods of multiple wives coincide, the husband should approach them according to the order of marriage; the second line adds further ordering criteria in a compressed and uncertain formulation.`,wfw:`yaugapadye — in simultaneity/coincidence; tu — indeed; tīrthānām — of the proper seasons; vivāha-kramaśaḥ — according to marriage order; vrajet — should approach; tat-sāmyam — equality with respect to that; jīva-putrāḥ vā — those with living sons, or; grahaṇa-kramaśaḥ api vā — or according to order of taking/marriage.`,note:`The second hemistich is elliptical; the priority of marriage order in the first half is clear.`},
{n:75,sa:`ब्राह्मादिभिर्विवाहैस्तु संस्कृतौ तौ खगाधिप ।\nअष्टौ विवाहा वर्णानां वैनतेय उशंति वै ॥ ७५ ॥`,iast:`brāhmādibhirvivāhaistu saṃskṛtau tau khagādhipa |\naṣṭau vivāhā varṇānāṃ vainateya uśaṃti vai || 75 ||`,en:`Through marriages beginning with the Brāhma form, the pair is ritually consecrated, O lord of birds. The authorities declare eight marriages in connection with the varṇas, O son of Vinatā.`,wfw:`brāhma-ādibhiḥ vivāhaiḥ — by marriages beginning with Brāhma; tu — indeed; saṃskṛtau — the two are ritually consecrated; tau — the pair; khagādhipa — O lord of birds; aṣṭau vivāhāḥ — eight marriages; varṇānām — of/for the varṇas; vainateya — O son of Vinatā; uśanti — authorities declare/teach; vai — indeed.`},
{n:76,sa:`ब्राह्मो दैवस्तथार्षश्च प्राजापत्यः खगाधिप ।\nगांधर्वश्चासुरो रक्षः पैशाचस्त्वष्टमोऽधमः ॥ ७६ ॥`,iast:`brāhmo daivastathārṣaśca prājāpatyaḥ khagādhipa |\ngāṃdharvaścāsuro rakṣaḥ paiśācastvaṣṭamo'dhamaḥ || 76 ||`,en:`They are Brāhma, Daiva, Ārṣa, Prājāpatya, Gāndharva, Āsura, Rākṣasa, and Paiśāca; the eighth is declared the lowest, O lord of birds.`,wfw:`brāhmaḥ — Brāhma; daivaḥ — Daiva; tathā ārṣaḥ — likewise Ārṣa; ca — and; prājāpatyaḥ — Prājāpatya; khagādhipa — O lord of birds; gāndharvaḥ — Gāndharva; ca — and; āsuraḥ — Āsura; rakṣaḥ — Rākṣasa; paiśācaḥ — Paiśāca; tu — indeed; aṣṭamaḥ — eighth; adhamaḥ — lowest.`},
{n:77,sa:`प्रशस्ताः क्षत्रियादीनां विप्रादीनां तु मानतः ।\nप्रतिग्रहादयो बद्धा विवाहा ब्राह्मणस्य तु ॥ ७७ ॥`,iast:`praśastāḥ kṣatriyādīnāṃ viprādīnāṃ tu mānataḥ |\npratigrahādayo baddhā vivāhā brāhmaṇasya tu || 77 ||`,en:`The passage then ranks particular marriage forms as approved for Kṣatriyas and the other varṇas according to status; for a Brahmin, marriage forms involving acceptance and related transactions are specially constrained.`,wfw:`praśastāḥ — approved/praised; kṣatriya-ādīnām — for Kṣatriyas and others; vipra-ādīnām — for Brahmins and others; tu — however; mānataḥ — according to rank/measure; pratigraha-ādayaḥ — acceptance and related acts; baddhāḥ — bound/restricted; vivāhāḥ — marriages; brāhmaṇasya — of a Brahmin; tu — indeed.`,note:`The precise distribution of the eight forms among varṇas is compressed and the syntax is not fully explicit.`},
{n:78,sa:`क्षत्रियस्यापि देया तु प्रतिग्रहविवर्जिता ।\nप्रवृत्तिं केचिदिच्छंति दानमित्यपरे स्त्रियाः ।\nपावनं पुरुषाणां तु विवाहं परिचक्षते ॥ ७८ ॥`,iast:`kṣatriyasyāpi deyā tu pratigrahavivarjitā |\npravṛttiṃ kecidicchaṃti dānamityapare striyāḥ |\npāvanaṃ puruṣāṇāṃ tu vivāhaṃ paricakṣate || 78 ||`,en:`For the Kṣatriya too the text speaks of giving [the bride] without the specified mode of acceptance. Some authorities understand the institution as a regulated undertaking, others as the giving of the woman; marriage itself is described as a purifying saṃskāra for human beings.`,wfw:`kṣatriyasya api — for a Kṣatriya also; deyā — she is to be given; tu — indeed; pratigraha-vivarjitā — excluding the specified acceptance; pravṛttim — undertaking/practice; kecit icchanti — some hold; dānam iti — as “giving”; apare — others; striyāḥ — of the woman; pāvanam — purifying; puruṣāṇām — of human beings/men; tu — indeed; vivāham — marriage; paricakṣate — they declare.`,note:`The first two lines are compressed and preserve competing technical descriptions of the legal act; the final statement that marriage is purificatory is clear.`}
];
renderBhavishyaChapter({chapter:182,subtitle:'Vivāha-vidhi-varṇanam — saṃskāras, upanayana, kinship rules, and the eight forms of marriage',colophon:'Bhaviṣya Purāṇa, Brāhmaparvan 1.182. Sanskrit cross-checked against Sanskrit Wikisource and Wisdomlib; close translation and lexical gloss newly prepared.'},verses);
