name: One-shot Bhagavatam remote audit

on:
  push:
    branches:
      - codex/bhagavatam-canto1-batch-001
    paths:
      - .github/workflows/bhagavatam-audit-remote.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit all-canto source coverage and next batch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'codex/bhagavatam-canto1-batch-001';
            const sourceOwner = 'vishvAsa';
            const sourceRepo = 'purANam_vaiShNavam';
            const pinned = '100560de6c9f68c2875097d40a2012a84c784179';
            const literalPath = 'assets/data/bhagavatam-sridhara-english-checkpoints.json';
            const checkpointPath = 'assets/data/bhagavatam-sridhara-checkpoints.json';
            const manifestPath = 'assets/data/bhagavatam-sridhara-reader-manifest.json';

            async function getText(o, r, path, ref) {
              const res = await github.rest.repos.getContent({owner:o, repo:r, path, ref});
              if (Array.isArray(res.data) || res.data.type !== 'file') throw new Error(`Not a file: ${o}/${r}/${path}@${ref}`);
              if (!res.data.content) {
                const blob = await github.rest.git.getBlob({owner:o, repo:r, file_sha:res.data.sha});
                return Buffer.from(blob.data.content, blob.data.encoding || 'base64').toString('utf8');
              }
              return Buffer.from(res.data.content, 'base64').toString('utf8');
            }
            async function ownJson(path) {
              return JSON.parse(await getText(owner, repo, path, branch));
            }
            function pad(n){ return String(n).padStart(2,'0'); }
            function key(c,ch,v){ return `${c}.${ch}.${v}`; }
            function expand(e){ const a=[]; for(let v=e.start; v<=e.end; v++) a.push(key(e.canto,e.chapter,v)); return a; }
            function rangeLabel(c,ch,s,e){ return `${c}.${ch}.${s}${e===s?'':'–'+e}`; }
            function compress(keys) {
              const by = new Map();
              for (const k of keys) {
                const [c,ch,v] = k.split('.').map(Number);
                const g = `${c}.${ch}`;
                if(!by.has(g)) by.set(g, []);
                by.get(g).push(v);
              }
              const out=[];
              const groups=[...by.entries()].sort((a,b)=>{
                const aa=a[0].split('.').map(Number), bb=b[0].split('.').map(Number);
                return aa[0]-bb[0] || aa[1]-bb[1];
              });
              for (const [g, vals0] of groups) {
                const vals=[...new Set(vals0)].sort((a,b)=>a-b);
                let s=vals[0], p=vals[0];
                for(let i=1;i<=vals.length;i++){
                  const v=vals[i];
                  if(v===p+1){p=v;continue;}
                  out.push(`${g}.${s}${p===s?'':'–'+p}`);
                  s=v;p=v;
                }
              }
              return out;
            }

            const manifest = await ownJson(manifestPath);
            const literal = await ownJson(literalPath);
            const checkpoints = await ownJson(checkpointPath);
            if (manifest.primary_sanskrit.commit !== pinned || manifest.english_source.mirror_commit !== pinned || literal.source_commit !== pinned) {
              throw new Error('Pinned commit mismatch in tracked project metadata.');
            }

            const literalCoverage = new Set();
            const literalRangeSeen = new Set();
            const duplicateRanges=[];
            const overlapPositions=[];
            const literalGrouped=[];
            const noSeparate=[];
            for (const e of literal.entries) {
              const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;
              if(literalRangeSeen.has(rk)) duplicateRanges.push(rk); else literalRangeSeen.add(rk);
              if(e.end>e.start) literalGrouped.push(rangeLabel(e.canto,e.chapter,e.start,e.end));
              if(String(e.text||'').includes('does not provide a separate explanatory block')) noSeparate.push(rangeLabel(e.canto,e.chapter,e.start,e.end));
              for(const v of expand(e)){
                if(literalCoverage.has(v)) overlapPositions.push(v);
                literalCoverage.add(v);
              }
            }

            const sourceCoverage = new Set();
            const sourceGrouped=[];
            const englishInternalGaps=[];
            const perCanto={};
            let sourceRecords=0;
            const sourceErrors=[];
            for (const [cantoStr, cfg] of Object.entries(manifest.cantos)) {
              const c=Number(cantoStr);
              const cStats={chapters:cfg.chapter_count,source_records:0,source_numbered_positions:0,covered_source_positions:0,missing_source_positions:0,missing_ranges:[],internal_source_gap_ranges:[]};
              const cantoPositions=new Set();
              const cantoGaps=[];
              for(let ch=1; ch<=cfg.chapter_count; ch++){
                const path=manifest.english_source.mirror_path_root+'/'+cfg.english_path_template.replace('{chapter2}',pad(ch)).replace('{chapter}',String(ch));
                let text;
                try { text=await getText(sourceOwner,sourceRepo,path,pinned); }
                catch(err){ sourceErrors.push(`${c}.${ch}: ${err.message}`); continue; }
                const re=/^##\s+Texts?\s+(\d+)(?:\s*[-–—]\s*(\d+))?\s*$/gmi;
                const matches=[...text.matchAll(re)];
                const chapterSet=new Set();
                let max=0;
                for(const m of matches){
                  const s=Number(m[1]), e=Number(m[2]||m[1]);
                  sourceRecords++; cStats.source_records++;
                  if(e>s) sourceGrouped.push(rangeLabel(c,ch,s,e));
                  max=Math.max(max,e);
                  for(let v=s;v<=e;v++){ chapterSet.add(v); cantoPositions.add(key(c,ch,v)); sourceCoverage.add(key(c,ch,v)); }
                }
                for(let v=1;v<=max;v++) if(!chapterSet.has(v)) cantoGaps.push(key(c,ch,v));
              }
              cStats.source_numbered_positions=cantoPositions.size;
              const miss=[];
              for(const k of cantoPositions){ if(literalCoverage.has(k)) cStats.covered_source_positions++; else miss.push(k); }
              cStats.missing_source_positions=miss.length;
              cStats.missing_ranges=compress(miss);
              cStats.internal_source_gap_ranges=compress(cantoGaps);
              englishInternalGaps.push(...cantoGaps);
              perCanto[cantoStr]=cStats;
            }
            const missing=[...sourceCoverage].filter(k=>!literalCoverage.has(k));
            const covered=[...sourceCoverage].filter(k=>literalCoverage.has(k));
            const extraLiteral=[...literalCoverage].filter(k=>!sourceCoverage.has(k));

            // Exact next 30 numbered source positions after the current frontier.
            const nextKeys=[];
            for(let v=11;v<=30;v++) nextKeys.push(key(3,27,v));
            for(let v=1;v<=10;v++) nextKeys.push(key(3,28,v));
            for(const k of nextKeys) if(!sourceCoverage.has(k)) throw new Error(`Expected next English source position missing: ${k}`);
            for(const k of nextKeys) if(literalCoverage.has(k)) throw new Error(`Expected next position is already covered: ${k}`);

            // Extract the exact Śrīdhara blocks for the next 30 numbered positions from the pinned shared Sanskrit file.
            const sanskritPath=manifest.primary_sanskrit.path_root+'/'+manifest.cantos['3'].sridhara_paths['27'];
            let stext=await getText(sourceOwner,sourceRepo,sanskritPath,pinned);
            stext=stext
              .replace(/(॥\s*[०-९]+\s*\.\s*[०-९]+)\s*।\s*\*{1,2}\s*([०-९]+)/g,'$1.$2')
              .replace(/(॥\s*[०-९]+\s*\.\s*[०-९]+)\s*\*{1,2}\s*।\s*\*{1,2}\s*([०-९]+)/g,'$1.$2')
              .replace(/(॥\s*[०-९]+\s*\.\s*[०-९]+\s*\.\s*[०-९]+(?:\s*[-–—]\s*[०-९]+)?)\s*\*{1,2}\s*॥/g,'$1 ॥')
              .replace(/॥\s*\*{1,2}([०-९]+\s*\.\s*[०-९]+\s*\.\s*[०-९]+(?:\s*[-–—]\s*[०-९]+)?)\*{1,2}\s*॥/g,'॥ $1 ॥');
            const dd={'०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9'};
            const num=x=>Number([...String(x)].map(ch=>dd[ch]??ch).join(''));
            const markerRe=/(?:^|\n)\s*(?:\[\^[^\]]+\]\s*)?\*{0,2}॥\s*\*{0,2}([०-९]+)\s*\.\s*([०-९]+)\s*\.\s*([०-९]+)(?:\s*[-–—]\s*([०-९]+))?\s*\*{0,2}॥\s*\*{0,2}/g;
            const labelRe=/\*{0,2}श्रीधर(?:-स्वामी|ः)?(?:\s*,[^*\n]+)?(?:\s*\([^*\n]+\))?\s*[:：-]\s*\*{0,2}/;
            const markers=[...stext.matchAll(markerRe)];
            const targetBlocks=[];
            for(let i=0;i<markers.length;i++){
              const m=markers[i]; const c=num(m[1]), ch=num(m[2]), s=num(m[3]), e=num(m[4]||m[3]);
              const target=(c===3&&ch===27&&e>=11&&s<=30)||(c===3&&ch===28&&e>=1&&s<=10);
              if(!target) continue;
              const segStart=m.index+m[0].length;
              const segEnd=i+1<markers.length?markers[i+1].index:stext.length;
              const seg=stext.slice(segStart,segEnd);
              const lm=seg.match(labelRe);
              if(!lm){ targetBlocks.push({range:rangeLabel(c,ch,s,e),status:'no-sridhara-label',sanskrit:''}); continue; }
              let commentary=seg.slice((lm.index||0)+lm[0].length).replace(/^\s*_{4,}\s*/,'');
              const stops=[commentary.search(/\n_{4,}/),commentary.search(/\n[-—]{12,}/),commentary.search(/(?:^|\n|॥)\s*\*{0,2}(?:श्रीधर(?:-स्वामी|ः)?|दिग्दर्शिनी|वंशीधर|वशिधर|श्रीनाथ|सनातन|जीव-?गोस्वामी|विश्वनाथ|बलदेव|मध्वाचार्य)/)].filter(x=>x>=0);
              if(stops.length) commentary=commentary.slice(0,Math.min(...stops));
              commentary=commentary.replace(/\[\^[^\]]+\]/g,'').replace(/\*\*/g,'').replace(/__+/g,'').replace(/^\s*>\s?/gm,'').trim();
              const no=/^न\s+(?:कतमेनापि\s+)?व्याख्यातम्/.test(commentary);
              targetBlocks.push({range:rangeLabel(c,ch,s,e),status:no?'no-separate-commentary':'commentary',sanskrit:commentary});
            }

            const summary={
              pinned_commit:pinned,
              checkpoint_records:checkpoints.checkpoints.length,
              literal_entries:literal.entries.length,
              literal_numbered_positions:literalCoverage.size,
              exact_duplicate_literal_ranges:duplicateRanges,
              overlapping_literal_positions:[...new Set(overlapPositions)],
              literal_grouped_ranges:literalGrouped,
              no_separate_commentary_markers:noSeparate,
              english_source_records:sourceRecords,
              english_source_numbered_positions:sourceCoverage.size,
              covered_english_source_positions:covered.length,
              missing_english_source_positions:missing.length,
              missing_english_source_ranges:compress(missing),
              english_internal_gap_positions:englishInternalGaps.length,
              english_internal_gap_ranges:compress(englishInternalGaps),
              literal_positions_without_english_record:extraLiteral.length,
              literal_positions_without_english_ranges:compress(extraLiteral),
              source_grouped_ranges:sourceGrouped,
              source_fetch_errors:sourceErrors,
              per_canto:perCanto,
              next_batch:{range:'ŚB 3.27.11–3.27.30 and 3.28.1–3.28.10',numbered_verses:30,sridhara_blocks:targetBlocks}
            };
            core.info('BHAGAVATAM_AUDIT_JSON_BEGIN');
            core.info(JSON.stringify(summary));
            core.info('BHAGAVATAM_AUDIT_JSON_END');
