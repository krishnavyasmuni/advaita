name: Stage Canto 10 JSON whitespace reduction on isolated branch
on:
  push:
    branches: [optimization/lossless-canto10-json-20260922]
    paths: [.github/workflows/stage-canto10-json-minification.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reject changed source and validate JSON semantics before and after
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          path=pathlib.Path('assets/data/bhagavatam-sridhara-wfw-canto10.json')
          raw=path.read_bytes()
          gitsha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
          assert gitsha=='6cb61923b3755373f2abf28c5a3e2b14b98a006a','Source changed since audit; abort'
          originalsha=hashlib.sha256(raw).hexdigest()
          # Reject duplicate object keys rather than silently losing them in the round-trip.
          def distinct(pairs):
            obj={}
            for k,v in pairs:
              if k in obj:raise ValueError('Duplicate JSON object key; do not minify')
              obj[k]=v
            return obj
          def invalid(x):raise ValueError('Non-JSON constant '+x)
          obj=json.loads(raw,object_pairs_hook=distinct,parse_constant=invalid)
          compact=json.dumps(obj,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode('utf-8')
          assert json.loads(compact,object_pairs_hook=distinct,parse_constant=invalid)==obj
          assert len(compact)<len(raw)
          assert len(compact)<5500000
          tracked=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          for pathbytes in tracked:
            if not pathbytes:continue
            other=pathbytes.decode('utf-8')
            if other==str(path) or other=='.github/workflows/stage-canto10-json-minification.yml':continue
            f=pathlib.Path(other)
            if f.stat().st_size>10000000:continue
            b=f.read_bytes()
            assert gitsha.encode() not in b,'Another file refers to original Git blob hash'
            assert originalsha.encode() not in b,'Another file refers to original SHA256'
          path.write_bytes(compact)
          assert json.loads(path.read_bytes(),object_pairs_hook=distinct,parse_constant=invalid)==obj
          print('Validated JSON value identity, unique keys and original-blob hash references; bytes',len(raw),'->',len(compact),'saving',len(raw)-len(compact))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/data/bhagavatam-sridhara-wfw-canto10.json
          git commit -m 'Minify Canto 10 JSON whitespace without changing values'
          git push origin HEAD:refs/heads/optimization/lossless-canto10-json-20260922