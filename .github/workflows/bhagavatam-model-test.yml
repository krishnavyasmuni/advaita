name: One-shot Bhagavatam model test
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/workflows/bhagavatam-model-test.yml]
permissions:
  contents: read
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prompt = `Translate this Śrīdhara Svāmī Sanskrit commentary into faithful, reasonably literal English. Preserve technical terms where useful, do not import the Bhāgavatam translation, do not add exposition. Return only the English rendering.\n\nमुक्त-लिङ्गं निरुपाधिकम् असति मिथ्या-भूतेऽहङ्कारे सद्-आभासं सद्-रूपेणाभासमानं ब्रह्म प्राप्नोति । शुद्ध-जीव-स्वरूपाद् विशेषम् आह---सतः कारणस्य प्रधानस्य बन्धुम् अधिष्ठानम् । असतः कार्यस्य चक्षुर् इव प्रकाशकम् । सर्वेषु कार्य-कारणेष्व् अनुस्यूतम् । अद्वयं परिपूर्णम् ॥११॥`;
            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'openai/gpt-4.1',
                temperature: 0.1,
                messages: [
                  {role:'system',content:'You produce conservative literal English translations of Sanskrit scholastic commentary. Do not invent content.'},
                  {role:'user',content:prompt}
                ]
              })
            });
            const body = await response.text();
            core.info(`MODEL_STATUS=${response.status}`);
            core.info(body);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}