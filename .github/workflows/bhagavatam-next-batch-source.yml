name: One-shot remaining Canto 3 English source audit
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/workflows/bhagavatam-next-batch-source.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pinned='100560de6c9f68c2875097d40a2012a84c784179';
            const out={};
            for(const chapter of [29,30,31,32,33]){
              const path=`bhAgavatam/gauDIyo_abhaya-charaNaH/03/${String(chapter).padStart(2,'0')}.md`;
              const r=await github.rest.repos.getContent({owner:'vishvAsa',repo:'purANam_vaiShNavam',path,ref:pinned});
              let text=r.data.content?Buffer.from(r.data.content,'base64').toString('utf8'):'';
              if(!text){const b=await github.rest.git.getBlob({owner:'vishvAsa',repo:'purANam_vaiShNavam',file_sha:r.data.sha});text=Buffer.from(b.data.content,b.data.encoding||'base64').toString('utf8');}
              const ranges=[...text.matchAll(/^##\s+Texts?\s+(\d+)(?:\s*[-–—]\s*(\d+))?\s*$/gmi)].map(m=>({start:Number(m[1]),end:Number(m[2]||m[1])}));
              out[chapter]=ranges;
            }
            core.info('ENGLISH_RANGES_BEGIN');core.info(JSON.stringify(out));core.info('ENGLISH_RANGES_END');