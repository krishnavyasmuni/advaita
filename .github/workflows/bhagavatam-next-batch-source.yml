name: One-shot completed Canto 3 coverage audit
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/workflows/bhagavatam-next-batch-source.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pinned='100560de6c9f68c2875097d40a2012a84c784179';
            const branch='codex/bhagavatam-canto1-batch-001';
            async function getText(owner,repo,path,ref){const r=await github.rest.repos.getContent({owner,repo,path,ref});let t=r.data.content?Buffer.from(r.data.content,'base64').toString('utf8'):'';if(!t){const b=await github.rest.git.getBlob({owner,repo,file_sha:r.data.sha});t=Buffer.from(b.data.content,b.data.encoding||'base64').toString('utf8');}return t;}
            const lit=JSON.parse(await getText(context.repo.owner,context.repo.repo,'assets/data/bhagavatam-sridhara-english-checkpoints.json',branch));
            const covered=new Set(),ranges=new Set();let duplicateRange=0,overlap=0;
            for(const e of lit.entries){const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;if(ranges.has(rk))duplicateRange++;ranges.add(rk);if(Number(e.canto)!==3)continue;for(let v=Number(e.start);v<=Number(e.end);v++){const k=`3.${Number(e.chapter)}.${v}`;if(covered.has(k))overlap++;covered.add(k);}}
            const source=new Set();
            for(let ch=1;ch<=33;ch++){
              const text=await getText('vishvAsa','purANam_vaiShNavam',`bhAgavatam/gauDIyo_abhaya-charaNaH/03/${String(ch).padStart(2,'0')}.md`,pinned);
              for(const m of text.matchAll(/^##\s+Texts?\s+(\d+)(?:\s*[-–—]\s*(\d+))?\s*$/gmi)){const s=Number(m[1]),e=Number(m[2]||m[1]);for(let v=s;v<=e;v++)source.add(`3.${ch}.${v}`);}
            }
            const missing=[...source].filter(x=>!covered.has(x));const extras=[...covered].filter(x=>!source.has(x));
            core.info(`CANTO3_SOURCE_POSITIONS=${source.size}`);core.info(`CANTO3_COVERED_SOURCE_POSITIONS=${source.size-missing.length}`);core.info(`CANTO3_MISSING_COUNT=${missing.length}`);core.info(`CANTO3_EXTRA_LITERAL_COUNT=${extras.length}`);core.info(`CANTO3_DUPLICATE_RANGES_GLOBAL=${duplicateRange}`);core.info(`CANTO3_OVERLAPPING_POSITIONS=${overlap}`);core.info(`CANTO3_MISSING=${JSON.stringify(missing)}`);core.info(`CANTO3_EXTRAS=${JSON.stringify(extras)}`);