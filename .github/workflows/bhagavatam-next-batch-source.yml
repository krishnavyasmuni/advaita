name: One-shot next Bhagavatam source extraction
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/workflows/bhagavatam-next-batch-source.yml]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pinned='100560de6c9f68c2875097d40a2012a84c784179';
            const r=await github.rest.repos.getContent({owner:'vishvAsa',repo:'purANam_vaiShNavam',path:'bhAgavatam/gauDIya-prastutiH/03/24_kapilAvatAraH.md',ref:pinned});
            let text=Buffer.from(r.data.content,'base64').toString('utf8');
            text=text.replace(/(॥\s*[०-९]+\s*\.\s*[०-९]+)\s*।\s*\*{1,2}\s*([०-९]+)/g,'$1.$2').replace(/(॥\s*[०-९]+\s*\.\s*[०-९]+)\s*\*{1,2}\s*।\s*\*{1,2}\s*([०-९]+)/g,'$1.$2').replace(/(॥\s*[०-९]+\s*\.\s*[०-९]+\s*\.\s*[०-९]+(?:\s*[-–—]\s*[०-९]+)?)\s*\*{1,2}\s*॥/g,'$1 ॥').replace(/॥\s*\*{1,2}([०-९]+\s*\.\s*[०-९]+\s*\.\s*[०-९]+(?:\s*[-–—]\s*[०-९]+)?)\*{1,2}\s*॥/g,'॥ $1 ॥');
            const d={'०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9'}, num=x=>Number([...String(x)].map(c=>d[c]??c).join(''));
            const mr=/(?:^|\n)\s*(?:\[\^[^\]]+\]\s*)?\*{0,2}॥\s*\*{0,2}([०-९]+)\s*\.\s*([०-९]+)\s*\.\s*([०-९]+)(?:\s*[-–—]\s*([०-९]+))?\s*\*{0,2}॥\s*\*{0,2}/g;
            const lr=/\*{0,2}श्रीधर(?:-स्वामी|ः)?(?:\s*,[^*\n]+)?(?:\s*\([^*\n]+\))?\s*[:：-]\s*\*{0,2}/;
            const ms=[...text.matchAll(mr)], out=[];
            for(let i=0;i<ms.length;i++){
              const m=ms[i],c=num(m[1]),ch=num(m[2]),s=num(m[3]),e=num(m[4]||m[3]);
              if(!((c===3&&ch===27&&e>=11&&s<=30)||(c===3&&ch===28&&e>=1&&s<=10)))continue;
              const seg=text.slice(m.index+m[0].length,i+1<ms.length?ms[i+1].index:text.length), lm=seg.match(lr);
              if(!lm){out.push({c,ch,s,e,status:'no-label',text:''});continue;}
              let x=seg.slice((lm.index||0)+lm[0].length).replace(/^\s*_{4,}\s*/,'');
              const stops=[x.search(/\n_{4,}/),x.search(/\n[-—]{12,}/),x.search(/(?:^|\n|॥)\s*\*{0,2}(?:श्रीधर(?:-स्वामी|ः)?|दिग्दर्शिनी|वंशीधर|वशिधर|श्रीनाथ|सनातन|जीव-?गोस्वामी|विश्वनाथ|बलदेव|मध्वाचार्य)/)].filter(v=>v>=0); if(stops.length)x=x.slice(0,Math.min(...stops));
              x=x.replace(/\[\^[^\]]+\]/g,'').replace(/\*\*/g,'').replace(/__+/g,'').replace(/^\s*>\s?/gm,'').trim();
              out.push({c,ch,s,e,status:/^न\s+(?:कतमेनापि\s+)?व्याख्यातम्/.test(x)?'no-separate':'commentary',text:x});
            }
            core.info('NEXT_SOURCE_BEGIN'); core.info(JSON.stringify(out)); core.info('NEXT_SOURCE_END');
