name: One-shot Canto 3 cleanup English audit
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/workflows/bhagavatam-next-batch-source.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pinned='100560de6c9f68c2875097d40a2012a84c784179';
            const targetStrings=['3.5.51','3.9.27','3.9.28','3.10.28','3.10.29','3.18.16','3.22.26','3.22.27','3.22.29','3.22.30','3.23.4','3.23.5','3.23.14','3.23.15','3.23.36','3.23.37','3.24.22','3.24.23','3.25.39','3.25.40'];
            const targets=new Set(targetStrings);
            const chapters=[5,9,10,18,22,23,24,25],out=[];
            for(const ch of chapters){
              const path=`bhAgavatam/gauDIyo_abhaya-charaNaH/03/${String(ch).padStart(2,'0')}.md`;
              const r=await github.rest.repos.getContent({owner:'vishvAsa',repo:'purANam_vaiShNavam',path,ref:pinned});
              let text=r.data.content?Buffer.from(r.data.content,'base64').toString('utf8'):'';
              if(!text){const b=await github.rest.git.getBlob({owner:'vishvAsa',repo:'purANam_vaiShNavam',file_sha:r.data.sha});text=Buffer.from(b.data.content,b.data.encoding||'base64').toString('utf8');}
              for(const m of text.matchAll(/^##\s+Texts?\s+(\d+)(?:\s*[-–—]\s*(\d+))?\s*$/gmi)){
                const s=Number(m[1]),e=Number(m[2]||m[1]);let hit=false;for(let v=s;v<=e;v++)if(targets.has(`3.${ch}.${v}`))hit=true;
                if(hit)out.push({chapter:ch,start:s,end:e});
              }
            }
            const cov=new Set();for(const r of out)for(let v=r.start;v<=r.end;v++)if(targets.has(`3.${r.chapter}.${v}`))cov.add(`3.${r.chapter}.${v}`);
            core.info(`TARGETS=${targetStrings.length}`);core.info(`SOURCE_RECORDS=${out.length}`);core.info(`UNMATCHED=${JSON.stringify(targetStrings.filter(x=>!cov.has(x)))}`);core.info(`RECORDS=${JSON.stringify(out)}`);