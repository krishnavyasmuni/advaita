name: Prepare lossless JSON compaction candidate

on:
  push:
    branches:
      - codex/compact-site-json-20260924

permissions:
  contents: write

jobs:
  compact:
    if: github.ref == 'refs/heads/codex/compact-site-json-20260924'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: codex/compact-site-json-20260924
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compact and compare parsed values
        run: python3 tools/compact_site_json_candidate.py
      - name: Remove one-time tooling and commit the candidate
        env:
          BRANCH_NAME: codex/compact-site-json-20260924
        run: |
          rm .github/workflows/compact-site-json-candidate.yml
          rm tools/compact_site_json_candidate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/data .github/workflows/compact-site-json-candidate.yml tools/compact_site_json_candidate.py
          if git diff --cached --quiet; then
            echo "No compacted JSON data was produced."
            exit 1
          fi
          git commit -m "Compact site JSON without changing parsed values"
          git push origin "HEAD:${BRANCH_NAME}"
