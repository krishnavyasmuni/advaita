name: One-shot Bhagavatam remote batch

on:
  push:
    branches:
      - codex/bhagavatam-canto1-batch-001
    paths:
      - .github/workflows/bhagavatam-batch-remote.yml

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply and verify ŚB 3.26.53–3.27.10
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'codex/bhagavatam-canto1-batch-001';
            const literalPath = 'assets/data/bhagavatam-sridhara-english-checkpoints.json';
            const checkpointPath = 'assets/data/bhagavatam-sridhara-checkpoints.json';
            const expectedLiteralSha = 'c38b58d958363dbfe886b4bee83e01418dba10c3';
            const expectedCheckpointSha = '934061adfc49eabb9ec6940759202c510c554743';
            const pinnedCommit = '100560de6c9f68c2875097d40a2012a84c784179';
            const noSeparate = 'Śrīdhara Svāmī does not provide a separate explanatory block for this verse in the pinned Sanskrit file.';

            async function readJson(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              if (Array.isArray(r.data) || r.data.type !== 'file') throw new Error(`Expected file at ${path}`);
              const text = Buffer.from(r.data.content, 'base64').toString('utf8');
              return {sha: r.data.sha, json: JSON.parse(text), text};
            }

            async function writeJson(path, sha, json, message) {
              const content = Buffer.from(JSON.stringify(json, null, 2) + '\n', 'utf8').toString('base64');
              return github.rest.repos.createOrUpdateFileContents({owner, repo, path, message, content, sha, branch});
            }

            function versesFor(entry) {
              const out = [];
              for (let v = entry.start; v <= entry.end; v++) out.push(`${entry.canto}.${entry.chapter}.${v}`);
              return out;
            }

            const additions = [
              {canto:3,chapter:26,start:53,end:53,text:'He describes in that [cosmic person] the division into the adhyātma and the rest, in nine verses beginning with “from the golden [egg].” “Having arisen” means having abandoned indifference; “having entered it” means having presided over it. He is both the Great [Being] and a deity. “Kha” means an opening.'},
              {canto:3,chapter:26,start:54,end:54,text:'Together with speech, Fire came to be—that is, entered. The two nostrils were opened. “Woven with prāṇa” means, being threaded with the vital breath, smell came to be in these two nostrils; this continuation is to be supplied.'},
              {canto:3,chapter:26,start:55,end:55,text:'After smell, Wind [entered]. The qualifier “woven with prāṇa” is to be understood for all the senses as well. In the two readings nyabhidyetām and anvabhidyetām the meaning is the same. Then the directions entered.'},
              {canto:3,chapter:26,start:56,end:56,text:'By the word “and so forth,” the hair of the head is included.'},
              {canto:3,chapter:26,start:57,end:57,text:noSeparate},
              {canto:3,chapter:26,start:58,end:58,text:'Svarāṭ is Indra. Hari is Viṣṇu.'},
              {canto:3,chapter:26,start:59,end:59,text:'“Ābhṛtam” means “came into being.”'},
              {canto:3,chapter:26,start:60,end:60,text:noSeparate},
              {canto:3,chapter:26,start:61,end:61,text:'For the intellect and the rest, the heart alone is the seat. The lord of speech is Brahmā. “Caitya” is the knower of the field.'},
              {canto:3,chapter:26,start:62,end:70,text:'To distinguish the knower of the field by [the methods of] presence and absence (anvaya and vyatireka), he states the re-entry of all [the deities and senses], in nine verses beginning with “these” (62–70).'},
              {canto:3,chapter:26,start:71,end:71,text:'Showing the individual body as an illustration for the body of the Virāṭ, he states the purpose of the exposition of Sāṅkhya in two verses beginning with “just as.”'},
              {canto:3,chapter:26,start:72,end:72,text:'First comes devotion to the Supreme Lord; then detachment from what is other [than Him]; then an intellect engaged in yoga, a one-pointed mind; then knowledge. By that [knowledge], having distinguished the inward self, the knower of the field, within this self—the aggregate of effects and causes—one should contemplate it.'},
              {canto:3,chapter:27,start:1,end:1,text:'In the twenty-seventh [chapter], thereafter, through the proper conjunction of many disciplines, the method of liberation is explained by discriminating Puruṣa from Prakṛti. To establish liberation through discriminative knowledge, he recalls the previously described saṃsāra that belongs to the pure Puruṣa only through failure to distinguish it from Prakṛti, in three verses beginning “though situated in Prakṛti.” Though situated in the body, he is not smeared—he is not tainted—by the guṇas, that is, by pleasure, pain, and the rest produced by them. From being without guṇas comes non-agency, and from that comes changelessness; therefore [he is not tainted].'},
              {canto:3,chapter:27,start:2,end:2,text:noSeparate},
              {canto:3,chapter:27,start:3,end:3,text:'Being without happiness or contentment. “Incidental” means produced by association with Prakṛti. In good, bad, and mixed births—among gods, animals, humans, and the rest—he reaches the path of saṃsāra.'},
              {canto:3,chapter:27,start:4,end:4,text:'An objection: if saṃsāra is unreal, what is the use of effort to bring about its cessation? To this he replies with “although the object…”'},
              {canto:3,chapter:27,start:5,end:5,text:'Because meditation on sense objects is the cause of the object, the mind must be restrained; thus he says “for this very reason.” “On the path of the asat” means on the road of the senses, the path of objects. “Intense” means firm; and [the mind is to be restrained] by intense detachment as well.'},
              {canto:3,chapter:27,start:6,end:6,text:'Describing the causes of intensity in devotion and detachment, he states in six verses the manner of liberation through knowledge. Practicing the mind by the yogic paths beginning with yama—making it one-pointed again and again—having realized the self, he attains the nondual Supreme Self threaded through all; this is the construction completed by the sixth [verse]. “True” means without deceit; “with feeling” means with love.'},
              {canto:3,chapter:27,start:7,end:7,text:'“Without attachment” means by abandoning association. “Powerful” means offered to the Lord.'},
              {canto:3,chapter:27,start:8,end:8,text:'“Taking shelter in seclusion” means living in solitude.'},
              {canto:3,chapter:27,start:9,end:9,text:'“False insistence” means [the notions] “I” and “mine.” By that knowledge through which the truth of both Prakṛti and Puruṣa has been seen.'},
              {canto:3,chapter:27,start:10,end:10,text:'One whose states of intellect beginning with waking have ceased. For that very reason, one for whom perception of the other has become distant. Having realized the pure self by the self delimited by ego. To illustrate how the very same thing can be instrument and object through limitation and non-limitation, he says: just as, by the eye—by the sun delimited by the eye—[one sees] the sun situated in the sky. In this way, the seer of the self sees the pure self.'}
            ];

            if (additions.length !== 22) throw new Error(`Expected 22 additions, got ${additions.length}`);
            const additionCoverage = new Set(additions.flatMap(versesFor));
            if (additionCoverage.size !== 30) throw new Error(`Expected 30 numbered verses, got ${additionCoverage.size}`);

            // Sequential update 1: literal-English file. Re-fetch immediately and require the audited SHA.
            const literalBefore = await readJson(literalPath);
            if (literalBefore.sha !== expectedLiteralSha) throw new Error(`Literal file moved: expected ${expectedLiteralSha}, got ${literalBefore.sha}`);
            if (literalBefore.json.source_commit !== pinnedCommit) throw new Error('Literal file source commit does not match pinned source.');

            const existingCoverage = new Set();
            const exactKeys = new Set();
            for (const e of literalBefore.json.entries) {
              const key = `${e.canto}.${e.chapter}.${e.start}-${e.end}`;
              if (exactKeys.has(key)) throw new Error(`Pre-existing exact duplicate entry: ${key}`);
              exactKeys.add(key);
              for (const v of versesFor(e)) existingCoverage.add(v);
            }
            for (const e of additions) {
              const key = `${e.canto}.${e.chapter}.${e.start}-${e.end}`;
              if (exactKeys.has(key)) throw new Error(`Duplicate new range: ${key}`);
              for (const v of versesFor(e)) if (existingCoverage.has(v)) throw new Error(`New verse overlaps existing literal coverage: ${v}`);
            }

            literalBefore.json.entries.push(...additions);
            literalBefore.json.generated_at = new Date().toISOString();
            await writeJson(literalPath, literalBefore.sha, literalBefore.json, 'Add literal Śrīdhara renderings for ŚB 3.26.53–3.27.10');

            // Sequential update 2: checkpoint file. Re-fetch only after update 1 and require its audited SHA.
            const checkpointBefore = await readJson(checkpointPath);
            if (checkpointBefore.sha !== expectedCheckpointSha) throw new Error(`Checkpoint file moved: expected ${expectedCheckpointSha}, got ${checkpointBefore.sha}`);
            if (checkpointBefore.json.source?.commit !== pinnedCommit) throw new Error('Checkpoint file source commit does not match pinned source.');

            const checkpointId = 'canto-3-chapter-26-verses-53-72-and-chapter-27-verses-1-10';
            if (checkpointBefore.json.checkpoints.some(c => c.id === checkpointId)) throw new Error(`Checkpoint already exists: ${checkpointId}`);
            checkpointBefore.json.checkpoints.push({
              id: checkpointId,
              range: 'ŚB 3.26.53–3.26.72 and 3.27.1–3.27.10',
              status: 'source-checked-and-remote-committed',
              english_source: 'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIyo_abhaya-charaNaH/03/26.md',
              english_sources: [
                'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIyo_abhaya-charaNaH/03/26.md',
                'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIyo_abhaya-charaNaH/03/27.md'
              ],
              sanskrit_primary_source: 'https://github.com/vishvAsa/purANam_vaiShNavNam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIya-prastutiH/03/24_kapilAvatAraH.md',
              independent_comparison_source: 'https://archive.org/details/Bhagavata_with_Sridhari_Tika_Ramtej_Pandey_1949_PanditPustakalay',
              records_checked: 30,
              numbered_verses: 30,
              literal_json_entries_added: 22,
              primary_source_commit: pinnedCommit,
              sanskrit_source_blocks: [
                '3.26.53','3.26.54','3.26.55','3.26.56','3.26.58','3.26.59','3.26.61','3.26.62–3.26.70','3.26.71','3.26.72',
                '3.27.1','3.27.3','3.27.4','3.27.5','3.27.6','3.27.7','3.27.8','3.27.9','3.27.10'
              ],
              unavailable_sanskrit_source_blocks: ['3.26.57','3.26.60','3.27.2'],
              source_note: 'The pinned English mirror supplies 20 one-verse records for 3.26.53–3.26.72 and 10 one-verse records for 3.27.1–3.27.10. The pinned Sanskrit source preserves 3.26.62–3.26.70 as one grouped Śrīdhara block, so the 30 numbered verses are represented by 22 literal-English JSON entries. The source provides no separate Śrīdhara explanatory block for 3.26.57, 3.26.60, or 3.27.2. At 3.27.9 the source heading names Śrīdhara Svāmī together with Viśvanātha Cakravartī; the text is retained because Śrīdhara is explicitly named, and the shared attribution is recorded rather than silently normalized.',
              findings: [
                'The literal English layer is translated only from the pinned Śrīdhara Sanskrit commentary and does not copy or rewrite the Bhagavatam translation.',
                'The grouped 3.26.62–3.26.70 Sanskrit source block remains one JSON entry rather than being synthetically split.',
                'The no-separate-commentary positions 3.26.57, 3.26.60, and 3.27.2 are explicitly marked instead of invented.',
                'The English and literal-English coverage matches all 30 numbered source positions in the batch when grouped ranges are expanded.',
                'No pre-existing literal entry overlaps any newly added numbered verse, and no exact duplicate literal range is introduced.'
              ],
              reference_url: 'https://vedabase.io/en/library/sb/3/26/advanced-view/'
            });
            checkpointBefore.json.last_updated = new Date().toISOString();
            await writeJson(checkpointPath, checkpointBefore.sha, checkpointBefore.json, 'Checkpoint ŚB 3.26.53–3.27.10 remote audit');

            // Remote verification after both commits.
            const literalAfter = await readJson(literalPath);
            const checkpointAfter = await readJson(checkpointPath);
            const keysAfter = literalAfter.json.entries.map(e => `${e.canto}.${e.chapter}.${e.start}-${e.end}`);
            if (new Set(keysAfter).size !== keysAfter.length) throw new Error('Exact duplicate literal ranges detected after write.');
            for (const e of additions) {
              const key = `${e.canto}.${e.chapter}.${e.start}-${e.end}`;
              if (keysAfter.filter(k => k === key).length !== 1) throw new Error(`Post-write range validation failed: ${key}`);
            }
            const postCoverage = new Set();
            for (const e of literalAfter.json.entries) {
              if (e.canto === 3 && ((e.chapter === 26 && e.end >= 53 && e.start <= 72) || (e.chapter === 27 && e.end >= 1 && e.start <= 10))) {
                for (const v of versesFor(e)) postCoverage.add(v);
              }
            }
            for (const v of additionCoverage) if (!postCoverage.has(v)) throw new Error(`Missing post-write coverage: ${v}`);
            if (checkpointAfter.json.checkpoints.filter(c => c.id === checkpointId).length !== 1) throw new Error('Checkpoint post-write validation failed.');
            core.info(`PASS: 22 JSON entries cover 30 numbered verses; literal SHA ${literalAfter.sha}; checkpoint SHA ${checkpointAfter.sha}`);
