name: One-shot Bhagavatam remote batch

on:
  push:
    branches:
      - codex/bhagavatam-canto1-batch-001
    paths:
      - .github/workflows/bhagavatam-batch-remote.yml

permissions:
  contents: write

jobs:
  apply-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkpoint and verify ŚB 3.26.53–3.27.10
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'codex/bhagavatam-canto1-batch-001';
            const literalPath = 'assets/data/bhagavatam-sridhara-english-checkpoints.json';
            const checkpointPath = 'assets/data/bhagavatam-sridhara-checkpoints.json';
            const expectedLiteralSha = '50beff887757ad92d57c5a60315dd2fe2eb1c90e';
            const expectedCheckpointSha = '934061adfc49eabb9ec6940759202c510c554743';
            const pinnedCommit = '100560de6c9f68c2875097d40a2012a84c784179';
            const checkpointId = 'canto-3-chapter-26-verses-53-72-and-chapter-27-verses-1-10';

            async function readJson(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              if (Array.isArray(r.data) || r.data.type !== 'file') throw new Error(`Expected file at ${path}`);
              return {sha: r.data.sha, json: JSON.parse(Buffer.from(r.data.content, 'base64').toString('utf8'))};
            }
            async function writeJson(path, sha, json, message) {
              const content = Buffer.from(JSON.stringify(json, null, 2) + '\n', 'utf8').toString('base64');
              return github.rest.repos.createOrUpdateFileContents({owner, repo, path, message, content, sha, branch});
            }
            function verseKeys(e) {
              const a = [];
              for (let v = e.start; v <= e.end; v++) a.push(`${e.canto}.${e.chapter}.${v}`);
              return a;
            }

            // Re-fetch and verify the already committed literal file before touching the checkpoint log.
            const literal = await readJson(literalPath);
            if (literal.sha !== expectedLiteralSha) throw new Error(`Literal file moved: expected ${expectedLiteralSha}, got ${literal.sha}`);
            if (literal.json.source_commit !== pinnedCommit) throw new Error('Literal source commit no longer matches the pinned source.');
            const targetEntries = literal.json.entries.filter(e => e.canto === 3 && ((e.chapter === 26 && e.start >= 53 && e.end <= 72) || (e.chapter === 27 && e.start >= 1 && e.end <= 10)));
            if (targetEntries.length !== 22) throw new Error(`Expected 22 target literal entries, got ${targetEntries.length}`);
            const targetCoverage = new Set(targetEntries.flatMap(verseKeys));
            if (targetCoverage.size !== 30) throw new Error(`Expected 30 covered numbered verses, got ${targetCoverage.size}`);
            const allKeys = literal.json.entries.map(e => `${e.canto}.${e.chapter}.${e.start}-${e.end}`);
            if (new Set(allKeys).size !== allKeys.length) throw new Error('Exact duplicate literal ranges detected.');

            // Re-fetch the checkpoint file immediately before its only update and require the audited SHA.
            const checkpoints = await readJson(checkpointPath);
            if (checkpoints.sha !== expectedCheckpointSha) throw new Error(`Checkpoint file moved: expected ${expectedCheckpointSha}, got ${checkpoints.sha}`);
            if (checkpoints.json.schema_version !== 2 || !Array.isArray(checkpoints.json.checkpoints)) throw new Error('Unexpected checkpoint schema.');
            if (checkpoints.json.checkpoints.some(c => c.id === checkpointId)) throw new Error(`Checkpoint already exists: ${checkpointId}`);

            checkpoints.json.checkpoints.push({
              id: checkpointId,
              range: 'ŚB 3.26.53–3.26.72 and 3.27.1–3.27.10',
              status: 'source-checked-and-remote-committed',
              english_source: 'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIyo_abhaya-charaNaH/03/26.md',
              english_sources: [
                'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIyo_abhaya-charaNaH/03/26.md',
                'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIyo_abhaya-charaNaH/03/27.md'
              ],
              sanskrit_primary_source: 'https://github.com/vishvAsa/purANam_vaiShNavam/blob/100560de6c9f68c2875097d40a2012a84c784179/bhAgavatam/gauDIya-prastutiH/03/24_kapilAvatAraH.md',
              independent_comparison_source: 'https://archive.org/details/Bhagavata_with_Sridhari_Tika_Ramtej_Pandey_1949_PanditPustakalay',
              records_checked: 30,
              numbered_verses: 30,
              literal_json_entries_added: 22,
              primary_source_commit: pinnedCommit,
              sanskrit_source_blocks: [
                '3.26.53','3.26.54','3.26.55','3.26.56','3.26.58','3.26.59','3.26.61','3.26.62–3.26.70','3.26.71','3.26.72',
                '3.27.1','3.27.3','3.27.4','3.27.5','3.27.6','3.27.7','3.27.8','3.27.9','3.27.10'
              ],
              unavailable_sanskrit_source_blocks: ['3.26.57','3.26.60','3.27.2'],
              source_note: 'The pinned English mirror supplies 20 one-verse records for 3.26.53–3.26.72 and 10 one-verse records for 3.27.1–3.27.10. The pinned Sanskrit source preserves 3.26.62–3.26.70 as one grouped Śrīdhara block, so the 30 numbered verses are represented by 22 literal-English JSON entries. The source provides no separate Śrīdhara explanatory block for 3.26.57, 3.26.60, or 3.27.2. At 3.27.9 the source heading names Śrīdhara Svāmī together with Viśvanātha Cakravartī; the text is retained because Śrīdhara is explicitly named, and the shared attribution is recorded rather than silently normalized.',
              findings: [
                'The literal English layer is translated only from the corresponding pinned Śrīdhara Sanskrit commentary and does not copy or rewrite the Bhagavatam translation.',
                'The grouped 3.26.62–3.26.70 Sanskrit source block remains one JSON entry rather than being synthetically split.',
                'The no-separate-commentary positions 3.26.57, 3.26.60, and 3.27.2 are explicitly marked instead of invented.',
                'The English and literal-English coverage matches all 30 numbered source positions in the batch when grouped ranges are expanded.',
                'No exact duplicate literal range is present after the batch.'
              ],
              reference_url: 'https://vedabase.io/en/library/sb/3/26/advanced-view/'
            });
            await writeJson(checkpointPath, checkpoints.sha, checkpoints.json, 'Checkpoint ŚB 3.26.53–3.27.10 remote audit');

            const literalAfter = await readJson(literalPath);
            const checkpointAfter = await readJson(checkpointPath);
            if (literalAfter.sha !== expectedLiteralSha) throw new Error('Literal file changed during checkpoint update.');
            if (checkpointAfter.json.checkpoints.filter(c => c.id === checkpointId).length !== 1) throw new Error('Checkpoint post-write validation failed.');
            JSON.stringify(literalAfter.json);
            JSON.stringify(checkpointAfter.json);
            core.info(`PASS: literal ${literalAfter.sha}; checkpoint ${checkpointAfter.sha}; 22 entries / 30 numbered verses.`);
