name: One-shot Bhagavatam remote batch 2
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/workflows/bhagavatam-batch-remote.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const branch='codex/bhagavatam-canto1-batch-001';
            const literalPath='assets/data/bhagavatam-sridhara-english-checkpoints.json';
            const checkpointPath='assets/data/bhagavatam-sridhara-checkpoints.json';
            const expectedLiteralSha='50beff887757ad92d57c5a60315dd2fe2eb1c90e';
            const expectedCheckpointSha='da0bada6c2dc9cd0273a673b70291691851c7b3e';
            const pinned='100560de6c9f68c2875097d40a2012a84c784179';
            const noSeparate='Śrīdhara Svāmī does not provide a separate explanatory block for this verse in the pinned Sanskrit file.';
            async function readJson(path){const r=await github.rest.repos.getContent({owner,repo,path,ref:branch});const text=Buffer.from(r.data.content,'base64').toString('utf8');return {sha:r.data.sha,json:JSON.parse(text)};}
            async function writeJson(path,sha,json,message){return github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,branch,message,content:Buffer.from(JSON.stringify(json,null,2)+'\n','utf8').toString('base64')});}
            const additions=[
              {canto:3,chapter:27,start:11,end:11,text:'He attains Brahman, free from the subtle mark and without limiting adjunct, when the ego—which is unreal and false—has ceased; Brahman is the appearance of Being, shining in the form of Being. He states its distinction from the nature of the pure jīva: it is the kinsman, that is, the substratum, of sat, the causal pradhāna; like an eye, it illumines asat, the effect; it is threaded through all effects and causes; it is nondual and complete.'},
              {canto:3,chapter:27,start:12,end:13,text:'With an illustration he states the apprehension of pure Brahman by means of the self limited by ego. When the reflection of the sun situated in water shines upon a wall inside a house, people standing in a corner of the house first perceive the image situated in the water by means of its own appearance situated on the wall, since the sun in the sky cannot directly produce a reflection inside the house. The word “tathā” has the sense of “and”; thus the meaning is “and just as.” And just as, by the sun situated in the water, the sun situated in the sky is apprehended. In the same way, by its own reflections limited by the body, senses, and mind made of the elements, the threefold, three-guṇa ego is apprehended as that in which appears the reflection of sat, Brahman. Without the reflection situated in ego, reflections of objects do not arise. And by this ego, possessing the reflection of sat, the Self—the seer of truth, whose nature is ultimate awareness—is apprehended.'},
              {canto:3,chapter:27,start:14,end:16,text:'Now, in three verses, he shows through experience the apprehension of the pure self as the witness of deep sleep. When the elements and the rest, having become as though nonexistent, are dissolved into the unmanifest by sleep, the one who then remains awake and free from ego is that self which one apprehends; the syntactic connection is completed by the third verse. An objection: if he is awake then, why is he not clearly manifest as in waking and dream? He replies: previously he appeared clearly as the seer, with distinction and conceptual determination. In deep sleep, however, when the object of ego—the elements and the rest—has dissolved, and the ego relating to that object is lost, he himself, though not lost, falsely considers himself as though lost. An illustration of one thing becoming as though lost when another is lost is a man who has lost his wealth: distressed and helpless, he becomes as though lost. Nor is it true that nothing is experienced in deep sleep, for one later recollects, “I slept happily; I knew nothing,” which establishes the self alone apart from particular cognition. If ego is present in that recollection, how is the sleeper said to be without ego? The self is the illuminator and support of the aggregate of substance consisting of effects and causes. Since ego too, as a qualification of that substance, is something seen, the self which sees it is distinct from it. This supplies the connection with “that self.”'},
              {canto:3,chapter:27,start:17,end:17,text:'Even when discrimination has arisen through devotion and detachment, how can there be liberation if Prakṛti and Puruṣa do not abandon one another? He asks this in four verses beginning with “the Puruṣa.” Since Prakṛti cannot obtain manifestation apart from Puruṣa, and Puruṣa cannot become manifest apart from Prakṛti, because of their mutual dependence and eternality Prakṛti never releases Puruṣa; this is the sense.'},
              {canto:3,chapter:27,start:18,end:18,text:'The example concerns merely the absence of separateness: apart from its substratum there is no existence or being. Since smell is sometimes seen to diminish, he gives another illustration with water. “Of the intellect” means of Prakṛti, and “of the other” means of Puruṣa.'},
              {canto:3,chapter:27,start:19,end:19,text:'What follows from this? He states it with “of the non-agent.” That whose substratum is the guṇas is so described. While the guṇas of Prakṛti remain, how can there be the kaivalya of Puruṣa?'},
              {canto:3,chapter:27,start:20,end:20,text:'For this very reason, even in one for whom fear of saṃsāra has almost ceased, its reappearance is sometimes observed; thus he says “sometimes.”'},
              {canto:3,chapter:27,start:21,end:23,text:'Mere association with Prakṛti is not the cause of bondage; rather, attachment to it through the notion of the guṇas is. When that attachment ceases, liberation is possible. Its occasional reappearance is due to deficiency in the discipline. With this intention he answers by teaching an intensification of the means in three verses. “Nimitta” means the fruit; that dharma for which the fruit is not the impelling motive is desireless dharma. “With a stainless self” means with a purified mind. “By what is heard” means by hearing the divine narratives, by which devotion is strengthened. “Being burned” means being overpowered; thus Prakṛti becomes concealed and disappears.'},
              {canto:3,chapter:27,start:24,end:24,text:'When this is so, there is no further reappearance; thus he says this. “Whose enjoyment has been enjoyed” means that her enjoyment is exhausted; “whose fault is constantly seen” means whose defect is always discerned. Therefore, being abandoned, she does not harm the Lord—the independent Puruṣa—who is established in his own greatness and has attained his own bliss.'},
              {canto:3,chapter:27,start:25,end:25,text:'What is a cause of misfortune in the state of nondiscrimination ceases to be so after discrimination; he states this with an illustration in two verses. “Deep sleep” here means dream, which bears and nourishes many misfortunes. Even if it appears through residual impression to one who has awakened, it no longer causes delusion.'},
              {canto:3,chapter:27,start:26,end:26,text:noSeparate},
              {canto:3,chapter:27,start:27,end:27,text:'He concludes in three verses beginning with “when thus.” “For many births” means during a time in which many births have passed.'},
              {canto:3,chapter:27,start:28,end:28,text:'“One whose object is awakened” means one who has understood the truth of the self. The “own station called kaivalya” is one’s own nature, distinct from body and the rest; taking shelter in Me, it is the supreme good, unsurpassed bliss.'},
              {canto:3,chapter:27,start:29,end:29,text:'“By his own vision” means by knowledge of the self; one whose doubts—that is, false cognitions—have been cut off. “At departure from the liṅga” means when the subtle body is destroyed.'},
              {canto:3,chapter:27,start:30,end:30,text:'At that point the perfections beginning with aṇimā become obstacles. When the mind of the perfected yogī does not become attached to those powers accumulated by yoga—powers having no cause other than yoga—then, O dear mother, his movement toward Me becomes ultimate, belonging to Me who have passed beyond all limit. In that state there is no laughter, that is, no proud triumph, of death. If he becomes attached, however, death can boast, “Even this perfected yogī has been brought under my control.”'},
              {canto:3,chapter:28,start:1,end:1,text:'In the twenty-eighth chapter, thereafter, by the eight-limbed yoga made beautiful by meditation, knowledge of one’s own nature, freed from all limiting designations, is taught. Having stated devotion briefly and explained Sāṅkhya at length, Hari in the form of Kapila now teaches the Vaiṣṇava eight-limbed yoga. “With seed” means with a support or object. “Joyful” qualifies the mind.'},
              {canto:3,chapter:28,start:2,end:7,text:'He states the yamas and niyamas in three verses, each extended by two syllables. “According to one’s capacity” qualifies performance of one’s own dharma. “Village dharma” means the dharma directed toward the three worldly goals; withdrawal from that is intended. Food should be measured and pure. “Measured” is explained by the well-known smṛti: one should fill two parts with food and one part with water, leaving the fourth part for the movement of air. One should resort to a secluded, solitary and undisturbed place. “Possession only to the extent of need” means accepting only as much as serves a purpose. He next states the limbs beginning with posture in three verses. Mastery of a proper posture produces steadiness. Dhāraṇā is the holding of the vital breath together with the mind in one place among the seats of prāṇa, such as the mūlādhāra. Samādhāna of the self means making the mind take the form of the self. “By other paths” means by other means such as vows and gifts.'},
              {canto:3,chapter:28,start:8,end:8,text:'He elaborates posture and the following limbs from “in a clean place” until the end. Having established a seat with kuśa grass, deerskin, and cloth placed one over another, one may sit comfortably in the svastika posture. The supplied construction is “one should practice the vital breath.” The wise call that position svastika in which the feet are placed between the thighs and shanks, with the tips of the feet situated between the knees.'},
              {canto:3,chapter:28,start:9,end:9,text:'The drawing of external air inward is pūraka; holding the air that has entered is kumbhaka; sending the held air outward is recaka. Or one may practice in the reverse order, recaka, kumbhaka, and pūraka. Alternatively, filling through iḍā and exhaling through piṅgalā, then filling through piṅgalā and exhaling through iḍā, is practice “in reverse.” The word “or” also has the sense of “and.” One should purify the breath so that, once made steady, it does not again become restless.'},
              {canto:3,chapter:28,start:10,end:10,text:'“Blown” means heated. Just as heated metal or gold casts off its impurity, so the mind becomes stainless; the purport is that thereafter it does not become restless.'}
            ];
            function cover(e){const a=[];for(let v=e.start;v<=e.end;v++)a.push(`${e.canto}.${e.chapter}.${v}`);return a;}
            const cov=new Set(additions.flatMap(cover)); if(cov.size!==30)throw new Error('Expected 30 numbered verses'); if(additions.length!==20)throw new Error('Expected 20 entries');
            const lit=await readJson(literalPath); if(lit.sha!==expectedLiteralSha)throw new Error(`Literal SHA moved: ${lit.sha}`); if(lit.json.source_commit!==pinned)throw new Error('Pinned literal source mismatch');
            const existing=new Set(),ranges=new Set(); for(const e of lit.json.entries){const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;if(ranges.has(rk))throw new Error(`Existing duplicate ${rk}`);ranges.add(rk);for(const k of cover(e))existing.add(k);}
            for(const e of additions){const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;if(ranges.has(rk))throw new Error(`Duplicate range ${rk}`);for(const k of cover(e))if(existing.has(k))throw new Error(`Overlap ${k}`);}
            lit.json.entries.push(...additions);lit.json.generated_at=new Date().toISOString();await writeJson(literalPath,lit.sha,lit.json,'Add literal Śrīdhara renderings for ŚB 3.27.11–3.28.10');
            const cp=await readJson(checkpointPath); if(cp.sha!==expectedCheckpointSha)throw new Error(`Checkpoint SHA moved: ${cp.sha}`);
            const id='canto-3-chapter-27-verses-11-30-and-chapter-28-verses-1-10';if(cp.json.checkpoints.some(x=>x.id===id))throw new Error('Checkpoint exists');
            cp.json.checkpoints.push({id,range:'ŚB 3.27.11–3.27.30 and 3.28.1–3.28.10',status:'source-checked-and-remote-committed',english_sources:['https://github.com/vishvAsa/purANam_vaiShNavam/blob/'+pinned+'/bhAgavatam/gauDIyo_abhaya-charaNaH/03/27.md','https://github.com/vishvAsa/purANam_vaiShNavam/blob/'+pinned+'/bhAgavatam/gauDIyo_abhaya-charaNaH/03/28.md'],sanskrit_primary_source:'https://github.com/vishvAsa/purANam_vaiShNavam/blob/'+pinned+'/bhAgavatam/gauDIya-prastutiH/03/24_kapilAvatAraH.md',records_checked:29,numbered_verses:30,literal_json_entries_added:20,primary_source_commit:pinned,sanskrit_source_blocks:['3.27.11','3.27.12–3.27.13','3.27.14–3.27.16','3.27.17','3.27.18','3.27.19','3.27.20','3.27.21–3.27.23','3.27.24','3.27.25','3.27.27','3.27.28','3.27.29','3.27.30','3.28.1','3.28.2–3.28.7','3.28.8','3.28.9','3.28.10'],unavailable_sanskrit_source_blocks:['3.27.26'],source_note:'The pinned English mirror has 29 source records covering these 30 numbered verses because 3.27.28–3.27.29 is one English source record. The pinned Śrīdhara source has grouped explanatory blocks spanning 3.27.12–13, 3.27.14–16, 3.27.21–23, and 3.28.2–7. The 3.27.26 source section has no separate Śrīdhara label and is represented explicitly rather than invented.',findings:['Original English literal renderings were prepared only from the pinned Śrīdhara Sanskrit commentary.','Grouped Śrīdhara explanatory blocks remain grouped rather than being synthetically split.','3.27.26 is explicitly marked as having no separate Śrīdhara commentary.','All 30 numbered positions are covered by exactly 20 literal-English entries after expansion, with no overlap with earlier entries.']});
            await writeJson(checkpointPath,cp.sha,cp.json,'Checkpoint ŚB 3.27.11–3.28.10 remote audit');
            const lit2=await readJson(literalPath),cp2=await readJson(checkpointPath);const keys=lit2.json.entries.map(e=>`${e.canto}.${e.chapter}.${e.start}-${e.end}`);if(new Set(keys).size!==keys.length)throw new Error('Duplicate literal ranges after write');for(const k of cov){let n=0;for(const e of lit2.json.entries)if(cover(e).includes(k))n++;if(n!==1)throw new Error(`Coverage count ${k}=${n}`);}if(cp2.json.checkpoints.filter(x=>x.id===id).length!==1)throw new Error('Checkpoint missing after write');core.info(`PASS literal=${lit2.sha} checkpoint=${cp2.sha} entries=${additions.length} numbered=${cov.size}`);