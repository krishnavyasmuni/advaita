name: Bhagavatam remote batch runner
on:
  push:
    branches: [codex/bhagavatam-canto1-batch-001]
    paths: [.github/bhagavatam-batch-payload.json]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const branch='codex/bhagavatam-canto1-batch-001';
            const payloadPath='.github/bhagavatam-batch-payload.json';
            const literalPath='assets/data/bhagavatam-sridhara-english-checkpoints.json';
            const checkpointPath='assets/data/bhagavatam-sridhara-checkpoints.json';
            const pinned='100560de6c9f68c2875097d40a2012a84c784179';
            async function readFile(path){const r=await github.rest.repos.getContent({owner,repo,path,ref:branch});if(Array.isArray(r.data)||r.data.type!=='file')throw new Error(`Expected file ${path}`);let text;if(r.data.content)text=Buffer.from(r.data.content,'base64').toString('utf8');else{const b=await github.rest.git.getBlob({owner,repo,file_sha:r.data.sha});text=Buffer.from(b.data.content,b.data.encoding||'base64').toString('utf8');}return {sha:r.data.sha,text};}
            async function readJson(path){const f=await readFile(path);return {sha:f.sha,json:JSON.parse(f.text)};}
            async function writeJson(path,sha,json,message){return github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,branch,message,content:Buffer.from(JSON.stringify(json,null,2)+'\n','utf8').toString('base64')});}
            function cover(e){const a=[];for(let v=Number(e.start);v<=Number(e.end);v++)a.push(`${Number(e.canto)}.${Number(e.chapter)}.${v}`);return a;}
            const payload=JSON.parse((await readFile(payloadPath)).text);
            if(payload.pinned_commit!==pinned)throw new Error('Payload pinned commit mismatch');
            if(!Array.isArray(payload.batches)||!payload.batches.length)throw new Error('No batches in payload');
            for(const batch of payload.batches){
              const additions=batch.additions;
              if(!Array.isArray(additions)||!additions.length)throw new Error(`No additions in ${batch.id}`);
              const newCoverage=new Set(additions.flatMap(cover));
              if(newCoverage.size!==Number(batch.numbered_verses))throw new Error(`${batch.id}: expected ${batch.numbered_verses} numbered verses, got ${newCoverage.size}`);
              const lit=await readJson(literalPath);
              if(lit.json.source_commit!==pinned)throw new Error(`${batch.id}: literal pinned source mismatch`);
              const occupied=new Set(), exact=new Set();
              for(const e of lit.json.entries){const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;if(exact.has(rk))throw new Error(`Pre-existing exact duplicate ${rk}`);exact.add(rk);for(const k of cover(e)){if(occupied.has(k))throw new Error(`Pre-existing overlap ${k}`);occupied.add(k);}}
              for(const e of additions){const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;if(exact.has(rk))throw new Error(`${batch.id}: duplicate range ${rk}`);for(const k of cover(e))if(occupied.has(k))throw new Error(`${batch.id}: overlap ${k}`);}
              lit.json.entries.push(...additions);lit.json.generated_at=new Date().toISOString();
              const litWrite=await writeJson(literalPath,lit.sha,lit.json,batch.literal_commit_message);
              const litAfter=await readJson(literalPath);
              const cp=await readJson(checkpointPath);
              if(cp.json.checkpoints.some(x=>x.id===batch.checkpoint.id))throw new Error(`${batch.id}: checkpoint already exists`);
              cp.json.checkpoints.push(batch.checkpoint);
              const cpWrite=await writeJson(checkpointPath,cp.sha,cp.json,batch.checkpoint_commit_message);
              const cpAfter=await readJson(checkpointPath);
              const seenRanges=new Set(),seenPositions=new Set();
              for(const e of litAfter.json.entries){const rk=`${e.canto}.${e.chapter}.${e.start}-${e.end}`;if(seenRanges.has(rk))throw new Error(`${batch.id}: duplicate range after write ${rk}`);seenRanges.add(rk);for(const k of cover(e)){if(seenPositions.has(k))throw new Error(`${batch.id}: overlapping literal position after write ${k}`);seenPositions.add(k);}}
              for(const k of newCoverage)if(!seenPositions.has(k))throw new Error(`${batch.id}: missing post-write position ${k}`);
              if(cpAfter.json.checkpoints.filter(x=>x.id===batch.checkpoint.id).length!==1)throw new Error(`${batch.id}: checkpoint verification failed`);
              core.info(`BATCH_PASS ${batch.id} numbered=${newCoverage.size} entries=${additions.length} literal_commit=${litWrite.data.commit.sha} checkpoint_commit=${cpWrite.data.commit.sha} literal_sha=${litAfter.sha} checkpoint_sha=${cpAfter.sha}`);
            }
            core.info(`ALL_BATCHES_PASS count=${payload.batches.length}`);