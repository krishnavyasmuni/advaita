name: Compare baseline and compact JSON in Chromium (corrected)
on:
  push:
    branches: [optimization/lossless-canto10-json-20260922]
    paths: [.github/workflows/verify-canto10-render-equivalence-v2.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install browser
        run: |
          python3 -m pip install --user --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python3 -m playwright install chromium; fi
      - name: Serve baseline and proposed version
        run: |
          git worktree add --detach /tmp/vd-audit-baseline 63075fa2bbce9c11c7d3095eaa75a404a64ab55b
          mkdir -p /tmp/vd-web-base /tmp/vd-web-new
          ln -s /tmp/vd-audit-baseline /tmp/vd-web-base/vivekadrishti
          ln -s "$PWD" /tmp/vd-web-new/vivekadrishti
          python3 -m http.server 8871 --bind 127.0.0.1 --directory /tmp/vd-web-base >/tmp/vd-base-http.log 2>&1 &
          python3 -m http.server 8872 --bind 127.0.0.1 --directory /tmp/vd-web-new >/tmp/vd-new-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8871/vivekadrishti/ >/dev/null
          curl -fsS http://127.0.0.1:8872/vivekadrishti/ >/dev/null
      - name: Compare JSON and mobile/desktop page content and screenshots
        run: |
          python3 - <<'PY'
          import hashlib,shutil
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:8871/vivekadrishti'
          new='http://127.0.0.1:8872/vivekadrishti'
          routes=['/','/articles/varna-vicara/','/articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/','/articles/srimad-bhagavatam-canto-10-sridhara-svami/','/articles/bhagavad-gita-chapter-1/','/articles/scripture/upanishads/adhyatma/','/articles/a-vaishnava-lens-on-vishnu-as-the-supreme-deity/']
          with sync_playwright() as p:
            exe=shutil.which('google-chrome') or shutil.which('chromium')
            browser=p.chromium.launch(headless=True,executable_path=exe) if exe else p.chromium.launch(headless=True)
            context=browser.new_context(locale='en-GB',reduced_motion='reduce',device_scale_factor=1)
            test=context.new_page()
            test.goto(base+'/',wait_until='domcontentloaded')
            old=test.evaluate('''async()=>JSON.stringify(await (await fetch('/vivekadrishti/assets/data/bhagavatam-sridhara-wfw-canto10.json')).json())''')
            test.goto(new+'/',wait_until='domcontentloaded')
            candidate=test.evaluate('''async()=>JSON.stringify(await (await fetch('/vivekadrishti/assets/data/bhagavatam-sridhara-wfw-canto10.json')).json())''')
            assert old==candidate,'Browser JSON.parse changed values'
            print('PASS: browser JSON.parse values identical',flush=True)
            test.close()
            def snap(host,route,width):
              pg=context.new_page()
              pg.set_viewport_size({'width':width,'height':900})
              errors=[];pg.on('pageerror',lambda err:errors.append(str(err)))
              response=pg.goto(host+route,wait_until='domcontentloaded',timeout=60000)
              pg.wait_for_timeout(1500)
              pg.evaluate('''async()=>{await document.fonts.ready}''')
              pg.add_style_tag(content='*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;scroll-behavior:auto!important}')
              pg.wait_for_timeout(200)
              data=pg.evaluate('''()=>({title:document.title,text:document.body.innerText,classes:document.body.className,headings:[...document.querySelectorAll('h1,h2,h3')].map(n=>n.textContent),nav:[...document.querySelectorAll('.site-nav a')].map(n=>n.getAttribute('href')),tables:document.querySelectorAll('table').length,scrollWidth:document.documentElement.scrollWidth})''')
              shot=hashlib.sha256(pg.screenshot(full_page=False,animations='disabled')).hexdigest()
              pg.close()
              return response.status if response else None,data,shot,errors
            for route in routes:
              for width in [390,1365]:
                a=snap(base,route,width);b=snap(new,route,width)
                assert a[0]==b[0]==200,(route,width,'HTTP mismatch',a[0],b[0])
                assert a[1]==b[1],(route,width,'DOM/text mismatch')
                assert a[2]==b[2],(route,width,'viewport screenshot mismatch',a[2],b[2])
                assert a[3]==b[3],(route,width,'page error mismatch')
                print('PASS',route,width,'text characters',len(a[1]['text']),'screenshot hash',a[2][:14],flush=True)
            context.close();browser.close()
          print('ALL FOURTEEN BASELINE/CANDIDATE MOBILE AND DESKTOP COMPARISONS PASS')
          PY