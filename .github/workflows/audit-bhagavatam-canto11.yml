name: Audit Bhagavatam Canto 11 source mapping
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-bhagavatam-canto11.yml'
      - 'scripts/audit_bhagavatam_canto11.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collate all 31 chapters against pinned Sanskrit and English mirrors
        run: python scripts/audit_bhagavatam_canto11.py
      - name: Store full verse mapping and flagged cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhagavatam-canto11-verse-audit
          path: audit/canto11/automated-*
          if-no-files-found: warn
      - name: Commit audit result (does not alter published verses)
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/canto11/automated-summary.md audit/canto11/automated-summary.json audit/canto11/automated-verse-map.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record exhaustive Canto 11 automated verse audit results'
            git push
          fi
