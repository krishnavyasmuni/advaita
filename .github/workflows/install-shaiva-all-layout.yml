name: Install Shaiva manuscript layout repair
on:
  push:
    paths:
      - .github/workflows/install-shaiva-all-layout.yml
      - assets/js/shaiva-repair-all.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate script and install after article renderer
        run: |
          node --check assets/js/shaiva-repair-all.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html')
          html=path.read_text(encoding='utf-8')
          assert 'id="source-document"' in html
          assert 'article-reader-paged.js' in html
          tag='<script src="/vivekadrishti/assets/js/shaiva-repair-all.js?v=20260920-all-layout-1"></script>'
          if tag not in html:
              pat=r'(<script\s+src="/vivekadrishti/assets/js/article-reader-paged\.js\?v=[^"]+"\s*></script>)'
              html, count=re.subn(pat,lambda m:m.group(1)+'\n'+tag,html,count=1)
              assert count==1, 'Could not find the renderer script to insert repair after it'
              path.write_text(html,encoding='utf-8')
          assert html.count(tag)==1
          print('Installed full-article Sanskrit-English reflow with preserved source text')
          PY
          if ! git diff --quiet -- articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html
            git commit -m 'Enable comprehensive manuscript layout repair'
            git push
          fi